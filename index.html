<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שעון נוכחות</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12293F">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="שעון נוכחות">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Heebo:wght@300;400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EAF3FB;
    --paper-alt: #DCEBF5;
    --ink: #12293F;
    --ink-soft: #24425C;
    --line: #B9D3E3;
    --brass: #5FBF8F;
    --brass-dark: #3D9A6C;
    --clock-bg: #0F2A45;
    --clock-digit: #8FE3B8;
    --danger: #A23E30;
    --muted: #5B7186;
    --white: #FFFFFF;
    --brass-text: #FFFFFF;
    --surface: #FFFFFF;
  }
  @font-face{ font-family:'Stam Ashkenaz'; src:url('fonts/StamAshkenazCLM.ttf') format('truetype'); font-display:block; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:'Heebo', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  .display{ font-family:'Fraunces', serif; }
  .mono{ font-family:'Heebo', sans-serif; font-variant-numeric:tabular-nums; font-weight:500; letter-spacing:.2px; }

  .wrap{ max-width:1000px; margin:0 auto; padding:28px 20px 60px; }

  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px; margin-bottom:28px;
  }
  header.topbar .brand{
    font-family:'Fraunces', serif; font-weight:700; font-size:26px; letter-spacing:.3px;
    display:flex; align-items:center; gap:10px;
  }
  header.topbar .brand .stamp{
    width:30px;height:30px;border-radius:50%;border:2px solid var(--brass);
    display:flex;align-items:center;justify-content:center;color:var(--brass-dark);
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;transform:rotate(-8deg);
  }
  .header-logo{ height:46px; width:auto; display:block; border-radius:8px; }
  .subtitle{ color:var(--muted); font-size:14px; margin-top:2px;}
  .btn{
    font-family:'Heebo',sans-serif; font-weight:500; font-size:14px;
    border:none; cursor:pointer; padding:10px 18px; border-radius:3px;
    background:var(--ink); color:var(--paper); transition:transform .08s ease, background .15s ease;
  }
  .btn:hover{ background:var(--ink-soft); }
  .btn:active{ transform:scale(.97); }
  .btn.brass{ background:var(--brass); color:var(--brass-text); }
  .btn.brass:hover{ background:var(--brass-dark); }
  .btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
  .btn.ghost:hover{ background:var(--ink); color:var(--paper); }
  .btn.danger{ background:transparent; color:var(--danger); border:1.5px solid var(--danger); padding:6px 12px; font-size:13px;}
  .btn.danger:hover{ background:var(--danger); color:var(--white); }
  .btn.small{ padding:6px 14px; font-size:13px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .card{
    background:var(--surface); border:none; border-radius:16px;
    padding:26px; margin-bottom:22px;
  }
  .card h2, .card h3{ font-family:'Fraunces',serif; margin-top:0; }

  /* Landing / login */
  .center-stage{
    min-height:70vh; display:flex; align-items:center; justify-content:center;
  }
  .login-card{
    background:var(--white); border:none; border-radius:8px;
    padding:40px 36px; width:100%; max-width:380px; text-align:center;
  }
  .login-card .login-logo{
    max-width:220px; width:100%; height:auto; display:block;
    margin:0 auto 20px; border-radius:10px;
  }
  .login-card h1{ font-family:'Fraunces',serif; font-size:24px; margin:0 0 6px; }
  .login-card p.hint{ color:var(--muted); font-size:14px; margin-bottom:24px; }
  .role-pick{ display:flex; flex-direction:column; gap:12px; }

  input, select{
    font-family:'Heebo',sans-serif; font-size:15px; padding:10px 12px;
    border:none; border-radius:8px; background:var(--paper-alt);
    color:var(--ink); width:100%;
  }
  input:focus, select:focus{ outline:2px solid var(--brass); outline-offset:1px; }

  /* מתג הפעלה מותאם אישית (במקום checkbox רגיל, שתמיד מגיע עם מסגרת מובנית של הדפדפן) */
  input[type="checkbox"].toggle{
    appearance:none; -webkit-appearance:none; margin:0; cursor:pointer; flex-shrink:0;
    width:44px; height:26px; border-radius:14px; background:var(--paper-alt);
    position:relative; transition:background .2s ease; outline-offset:2px;
  }
  input[type="checkbox"].toggle::before{
    content:''; position:absolute; top:3px; right:3px; width:20px; height:20px;
    border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3);
    transition:transform .2s ease;
  }
  input[type="checkbox"].toggle:checked{ background:var(--brass); }
  input[type="checkbox"].toggle:checked::before{ transform:translateX(-18px); }
  label{ display:block; font-size:13px; color:var(--muted); margin-bottom:5px; margin-top:14px; }
  .field:first-of-type label{ margin-top:0; }
  form .actions{ margin-top:22px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

  .error-msg{ color:var(--danger); font-size:13.5px; margin-top:10px; min-height:18px; }

  /* Dashboard layout */
  .tabs{ display:flex; gap:8px; margin-bottom:22px; border-bottom:1.5px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tabs .tab{ white-space:nowrap; flex:0 0 auto; }
  .tab{
    padding:10px 18px; cursor:pointer; font-size:14.5px; color:var(--muted);
    border-bottom:2.5px solid transparent; margin-bottom:-1.5px; font-weight:500;
  }
  .tab.active{ color:var(--ink); border-bottom-color:var(--brass); }

  /* ---------- פאנל ניהול: תפריט צד + ריבועי סיכום ---------- */
  body.admin-mode .wrap{ max-width:none; padding-left:32px; padding-right:32px; }
  @media (max-width:600px){ body.admin-mode .wrap{ padding-left:16px; padding-right:16px; } }
  .admin-layout{ display:grid; grid-template-columns:220px minmax(0,1fr); gap:24px; align-items:start; }
  .admin-nav{
    position:sticky; top:16px; background:var(--surface); border-radius:16px; padding:12px;
    display:flex; flex-direction:column; gap:4px; box-shadow:0 1px 3px rgba(18,41,63,.06);
    height:calc(100vh - 32px); overflow-y:auto;
  }
  .admin-nav-title{ font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.5px; padding:6px 12px 8px; }
  .admin-nav-item{
    display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border:none; border-radius:10px;
    background:transparent; color:var(--ink-soft); font:inherit; font-size:14.5px; font-weight:500; cursor:pointer; text-align:right;
    transition:background .15s, color .15s;
  }
  @media (hover:hover){ .admin-nav-item:hover{ background:var(--paper-alt); color:var(--ink); } }
  .admin-nav-item.active{ background:var(--brass); color:var(--brass-text); font-weight:700; }
  .admin-nav-item .ico{ width:22px; text-align:center; font-size:16px; flex:0 0 auto; }
  .admin-nav-item .lbl{ flex:1; }
  .admin-nav-item .badge{ min-width:20px; padding:1px 7px; border-radius:999px; background:var(--danger); color:#fff; font-size:12px; font-weight:700; text-align:center; }
  .admin-nav-item .badge:empty{ display:none; }
  .admin-nav-item.active .badge{ background:#fff; color:var(--danger); }
  .kpi-strip{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:14px; margin-bottom:22px; }
  .kpi{ background:var(--surface); border-radius:14px; padding:14px 16px; box-shadow:0 1px 3px rgba(18,41,63,.06); }
  .kpi .k-label{ font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .kpi .k-value{ font-size:24px; font-weight:800; margin-top:4px; color:var(--ink); }
  .kpi .k-sub{ font-size:12.5px; color:var(--muted); margin-top:2px; min-height:16px; }
  .kpi.loading .k-value{ color:var(--line); }
  .admin-main #tabContent > .card:first-child, .admin-main #tabContent > .top-actions:first-child{ margin-top:0; }

  /* ---------- מראה רשמי לפאנל הניהול ---------- */
  body.admin-mode{ background:#F3F6F9; }
  body.admin-mode .admin-nav{ border:1px solid #DCE3EA; box-shadow:none; border-radius:10px; }
  body.admin-mode .admin-nav-title{ text-transform:none; font-size:11.5px; letter-spacing:.6px; color:#6B7C8D; }
  body.admin-mode .admin-nav-item{ border-radius:6px; font-size:14px; color:#334E68; }
  body.admin-mode .admin-nav-item .ico{ display:inline-flex; align-items:center; justify-content:center; color:#6B7C8D; }
  body.admin-mode .admin-nav-item.active{ background:var(--ink); color:#fff; font-weight:600; }
  body.admin-mode .admin-nav-item.active .ico{ color:#fff; }
  body.admin-mode .kpi{ border:1px solid #DCE3EA; box-shadow:none; border-radius:10px; }
  body.admin-mode .kpi .k-label{ font-size:12.5px; color:#6B7C8D; font-weight:500; }
  body.admin-mode .kpi .k-label svg{ width:15px; height:15px; }
  body.admin-mode .kpi .k-value{ font-weight:700; font-size:22px; letter-spacing:-.2px; }
  body.admin-mode .card{ border:1px solid #DCE3EA; border-radius:10px; box-shadow:none; animation:none; }
  body.admin-mode .card h2, body.admin-mode .card h3{ font-family:'Heebo', sans-serif; font-weight:700; font-size:16px; color:var(--ink); }
  body.admin-mode .btn{ border-radius:6px; }
  @media (hover:hover){ body.admin-mode .admin-nav-item:hover:not(.active){ background:#EEF2F6; color:var(--ink); } }
  @media (max-width:860px){
    .admin-layout{ grid-template-columns:minmax(0,1fr); gap:14px; }
    .admin-nav{ position:static; height:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; padding:8px; gap:6px; scrollbar-width:none; }
    .admin-nav::-webkit-scrollbar{ display:none; }
    .admin-nav-title{ display:none; }
    .admin-nav-item{ width:auto; flex:0 0 auto; white-space:nowrap; padding:8px 12px; }
    .kpi-strip{ grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
    .kpi .k-value{ font-size:20px; }
  }

  table{ width:100%; border-collapse:collapse; font-size:14.5px; }
  th{ text-align:right; font-weight:500; color:var(--muted); font-size:12.5px; text-transform:uppercase; letter-spacing:.4px; padding:8px 10px; border-bottom:1.5px solid var(--ink); }
  td{ padding:11px 10px; border-bottom:1px solid var(--line); }
  tr.total-row td{ font-weight:700; border-top:2px solid var(--ink); border-bottom:none; }
  .table-scroll{ overflow-x:auto; }

  .readout{
    background:var(--clock-bg); border-radius:8px; padding:22px 26px;
    display:flex; gap:36px; flex-wrap:wrap; margin-bottom:24px;
  }
  .readout .digit-block{ text-align:center; }
  .readout .digit-block .num{
    font-family:'IBM Plex Mono',monospace; font-size:34px; color:var(--clock-digit);
    letter-spacing:1px; font-weight:600;
  }
  .readout .digit-block .lbl{ color:#9FC3DA; font-size:12px; margin-top:4px; letter-spacing:.5px; }

  .emp-row-form{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .emp-row-form .field{ flex:1; min-width:120px; }

  .pill{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:500; }
  .avatar{ width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid var(--brass); flex-shrink:0; }
  .avatar-placeholder{
    width:44px; height:44px; border-radius:50%; border:2px solid var(--brass);
    background:var(--paper-alt); color:var(--brass-dark); display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:17px; flex-shrink:0;
  }
  .avatar.small, .avatar-placeholder.small{ width:32px; height:32px; font-size:13px; }
  .avatar-row{ display:flex; align-items:center; gap:12px; }
  @keyframes hourglass-flip{
    0%, 35%{ transform:rotate(0deg); }
    50%, 85%{ transform:rotate(180deg); }
    100%{ transform:rotate(360deg); }
  }
  .hourglass-spin{
    display:inline-block;
    font-size:30px;
    animation: hourglass-flip 4s ease-in-out infinite;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.15));
  }
  @keyframes coin-spin{
    0%{ transform:rotateY(0deg); }
    100%{ transform:rotateY(360deg); }
  }
  .coin-spin{
    display:inline-block;
    font-size:30px;
    animation: coin-spin 1.4s linear infinite;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.15));
  }
  .timer-row{ display:flex; align-items:center; gap:16px; margin-bottom:14px; }
  .collapsible-header{ display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none; }
  .collapsible-header .chevron{ color:var(--brass-dark); font-size:14px; transition:transform .15s ease; }
  .pill.hourly{ background:#E4EEE6; color:#2F5233; }
  .pill.fixed{ background:#EFE3D0; color:var(--brass-dark); }
  .pill.status-pending{ background:#EFE3D0; color:#8A6D2F; }
  .pill.status-approved{ background:#E4EEE6; color:#2F5233; }
  .pill.status-rejected{ background:#F6DEDA; color:var(--danger); }
  @keyframes reqSheetUp{
    from{ transform:translateY(100%); }
    to{ transform:translateY(0); }
  }
  @keyframes reqBackdropFade{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  .req-filter-backdrop{ animation:reqBackdropFade .2s ease-out; }
  .req-filter-sheet{ animation:reqSheetUp .3s cubic-bezier(.2,.85,.3,1); }
  .req-filter-sheet > div:active{ background:var(--paper-alt); }

  /* ---------- animations: staggered list entrance ---------- */
  @keyframes staggerIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .stagger-item{ animation:staggerIn .35s ease-out both; }

  /* ---------- animations: gentle pulse for notification badges ---------- */
  @keyframes gentlePulse{
    0%, 100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(162,62,48,.55); }
    50%{ transform:scale(1.25); box-shadow:0 0 0 4px rgba(162,62,48,0); }
  }
  .pulse-dot{ animation:gentlePulse 1.6s ease-in-out infinite; }

  .list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 4px; border-bottom:1px solid var(--line);
  }
  .list-item.clickable{ cursor:pointer; }
  .list-item.clickable:hover{ background:var(--paper-alt); border-radius:6px; }
  .list-item:last-child{ border-bottom:none; }
  .list-item .name{ font-weight:600; }
  .list-item .meta{ color:var(--muted); font-size:13px; margin-top:2px; }

  .row-actions{ display:flex; gap:8px; }
  .info-acc > summary{ list-style:none; cursor:pointer; padding:16px 20px; font-weight:700; font-size:15.5px; display:flex; justify-content:space-between; align-items:center; }
  .info-acc > summary::-webkit-details-marker{ display:none; }
  .info-acc > summary::after{ content:'‹'; font-size:18px; color:var(--muted); transition:transform .2s; }
  .info-acc[open] > summary::after{ transform:rotate(-90deg); }
  .info-acc-body{ padding:0 20px 18px; }
  .emp-choice{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; margin:4px 0; border:none; border-radius:8px; background:var(--paper-alt); color:var(--ink); font:inherit; text-align:right; cursor:pointer; }
  .emp-choice:hover{ filter:brightness(.97); }
  @media (max-width:600px){
    .list-item{ flex-wrap:wrap; gap:10px; }
    .list-item .avatar-row{ min-width:0; flex:1 1 100%; }
    .list-item .avatar-row > div{ min-width:0; overflow-wrap:anywhere; }
    .list-item .row-actions{ flex-wrap:wrap; }
  }

  .empty-state{ text-align:center; padding:40px 20px; color:var(--muted); }

  .top-actions{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}

  select.month-picker, input.month-picker{ width:auto; }

  @media (max-width:600px){
    .wrap{ padding:18px 12px 40px; }
    .readout{ gap:20px; padding:18px; }
    .readout .digit-block .num{ font-size:26px; }
    .login-card{ padding:30px 22px; }
  }

  /* Custom confirm modal */
  .confirm-overlay{
    position:fixed; inset:0; background:rgba(20,32,25,.55);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; padding:20px;
  }
  .confirm-box{
    background:var(--surface); border:none; border-radius:8px;
    padding:30px 28px; max-width:360px; width:100%; text-align:center;
  }
  @keyframes blink-text{
    0%, 100%{ opacity:1; }
    50%{ opacity:.25; }
  }
  .confirm-box .confirm-msg{
    font-family:'Fraunces', serif; font-weight:600; font-size:19px;
    color:var(--danger); margin:0 0 26px;
    animation: blink-text 1s ease-in-out infinite;
  }
  .confirm-box .actions{ justify-content:center; margin-top:0; }
  .bills-wrap{ display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin-top:6px; }
  .bill-group{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .bill-group svg{ filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .bill-count{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); }

  /* Post-login welcome splash */
  .welcome-overlay{
    position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(10,20,30,.88);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    z-index:2000; padding:24px; overflow:hidden;
    animation: welcomeVeil .9s ease-out both;
  }
  /* כניסה מכובדת: התמונה מופיעה לאט מתוך הרקע הכהה, עם התבהרות והתקרבות עדינה מאוד – בלי תנועה חדה */
  .welcome-overlay .welcome-bg{
    position:absolute; top:0; right:0; bottom:0; left:0;
    width:100%; height:100%; object-fit:contain; z-index:-1;
    animation: welcomeImage 2.6s cubic-bezier(.22,.61,.36,1) .2s both;
  }
  @keyframes welcomeVeil{ from{ background:rgba(10,20,30,1); } to{ background:rgba(10,20,30,.88); } }
  @keyframes welcomeImage{
    from{ opacity:0; transform:scale(1.035); filter:brightness(.55); }
    to{ opacity:1; transform:scale(1); filter:brightness(1); }
  }
  .welcome-text{
    color:#E8C97A; font-family:'Fraunces', serif; font-weight:700; font-size:24px;
    margin-bottom:20px; text-align:center; max-width:90vw;
    text-shadow:0 2px 10px rgba(0,0,0,.7), 0 0 18px rgba(232,201,122,.35);
  }
  /* הפסוק: קשת בחלק העליון של המסך, נכנס מימין ומתבהר בעדינות */
  .welcome-arc{ position:absolute; top:2vh; left:50%; transform:translateX(-50%); width:min(96vw, 760px); height:auto; overflow:visible; pointer-events:none; visibility:hidden; }
  .welcome-arc-text{
    fill:#E8C97A; font-family:'Stam Ashkenaz', 'Heebo', serif; font-weight:400; font-size:27px; letter-spacing:0;
    paint-order:stroke; stroke:rgba(0,0,0,.55); stroke-width:3px;
    opacity:0; animation: arcFade 1.6s ease-out 1.4s both;
  }
  @keyframes arcFade{ from{ opacity:0; } to{ opacity:1; } }
  @media (prefers-reduced-motion: reduce){
    .welcome-overlay, .welcome-overlay .welcome-bg, .welcome-arc-text{ animation:none; opacity:1; }
  }
  .welcome-skip{
    position:absolute; bottom:14px; left:14px; color:rgba(255,255,255,.6);
    font-size:11px; cursor:pointer; text-decoration:underline;
    background:none; border:none; font-family:'Heebo', sans-serif;
  }

  /* ---------- New: entrance animations ---------- */
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .card{ animation: cardIn .5s cubic-bezier(.16,1,.3,1) both; }
  .card:nth-of-type(1){ animation-delay:.02s; }
  .card:nth-of-type(2){ animation-delay:.08s; }
  .card:nth-of-type(3){ animation-delay:.14s; }
  .card:nth-of-type(4){ animation-delay:.2s; }
  .card:nth-of-type(5){ animation-delay:.26s; }
  .card:nth-of-type(n+6){ animation-delay:.3s; }

  @keyframes listItemIn{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .list-item{ animation: listItemIn .35s ease both; }
  .list-item:nth-child(1){ animation-delay:.02s; }
  .list-item:nth-child(2){ animation-delay:.06s; }
  .list-item:nth-child(3){ animation-delay:.1s; }
  .list-item:nth-child(4){ animation-delay:.14s; }
  .list-item:nth-child(5){ animation-delay:.18s; }
  .list-item:nth-child(6){ animation-delay:.22s; }
  .list-item:nth-child(7){ animation-delay:.26s; }
  .list-item:nth-child(n+8){ animation-delay:.3s; }

  @keyframes pillPop{
    0%{ transform:scale(.6); opacity:0; }
    70%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); }
  }
  .pill{ animation: pillPop .35s cubic-bezier(.34,1.56,.64,1) both; }

  /* ---------- New: button feedback ---------- */
  .btn{ position:relative; overflow:hidden; }
  .btn .ripple{
    position:absolute; border-radius:50%; transform:scale(0);
    background:rgba(255,255,255,.55); pointer-events:none;
    animation: rippleAnim .55s ease-out forwards;
  }
  .btn.ghost .ripple, .btn.danger .ripple{ background:rgba(18,41,63,.25); }
  @keyframes rippleAnim{
    to{ transform:scale(2.6); opacity:0; }
  }

  @keyframes ctaPulse{
    0%, 100%{ box-shadow:0 0 0 0 rgba(95,191,143,.55); }
    50%{ box-shadow:0 0 0 9px rgba(95,191,143,0); }
  }
  #clockInForm button[type="submit"]{ animation: ctaPulse 2.2s ease-in-out infinite; }
  #clockInForm button[type="submit"]:hover{ animation-play-state:paused; }

  /* ---------- New: form error shake ---------- */
  @keyframes shakeX{
    10%,90%{ transform:translateX(-1px); }
    20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); }
    40%,60%{ transform:translateX(4px); }
  }
  .shake-field{ animation: shakeX .45s cubic-bezier(.36,.07,.19,.97) both; }
  .error-msg.shake-field{ animation: shakeX .45s cubic-bezier(.36,.07,.19,.97) both; }

  /* ---------- New: success toast ---------- */
  @keyframes toastIn{
    from{ transform:translate(-50%,-14px); opacity:0; }
    to{ transform:translate(-50%,0); opacity:1; }
  }
  @keyframes toastOut{
    from{ transform:translate(-50%,0); opacity:1; }
    to{ transform:translate(-50%,-14px); opacity:0; }
  }
  .toast{
    position:fixed; top:18px; left:50%; z-index:3000;
    background:var(--ink); color:var(--paper); font-family:'Heebo',sans-serif;
    font-size:14px; font-weight:500; padding:12px 20px; border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,.25); display:flex; align-items:center; gap:8px;
    animation: toastIn .35s cubic-bezier(.2,.85,.3,1) both;
  }
  .toast.out{ animation: toastOut .3s ease-in both; }
  .toast .toast-check{
    display:inline-block; width:18px; height:18px; border-radius:50%;
    background:var(--brass); color:#fff; font-size:12px; line-height:18px; text-align:center; flex-shrink:0;
  }

  /* ---------- New: end-of-day salute overlay ---------- */
  .salute-overlay{
    position:fixed; inset:0; z-index:4000; background:rgba(10,20,30,.55);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    animation:
      saluteBgFade .3s ease-out both,
      saluteBgFadeOut .8s ease-in 3.9s forwards;
  }
  @keyframes saluteBgFade{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes saluteBgFadeOut{ from{ opacity:1; } to{ opacity:0; } }

  .salute-sunset{
    position:absolute; inset:0; pointer-events:none; z-index:1;
    background: linear-gradient(to bottom, rgba(255,183,94,.55) 0%, rgba(255,111,97,.48) 45%, rgba(110,55,105,.42) 100%);
    opacity:0;
    animation: sunsetGlow 4.7s ease-in-out forwards;
  }
  @keyframes sunsetGlow{
    0%{ opacity:0; }
    35%{ opacity:0; }
    55%{ opacity:.9; }
    75%{ opacity:.9; }
    100%{ opacity:0; }
  }

  .salute-rays{
    position:absolute; top:50%; left:50%; width:140vmax; height:140vmax;
    transform:translate(-50%,-50%) rotate(0deg);
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.16) 0deg 6deg, transparent 6deg 18deg);
    border-radius:50%; pointer-events:none; z-index:2; mix-blend-mode:screen;
    opacity:0;
    animation: raysFadeSpin 4.7s ease-in-out forwards;
  }
  @keyframes raysFadeSpin{
    0%{ opacity:0; transform:translate(-50%,-50%) rotate(0deg); }
    30%{ opacity:.5; }
    70%{ opacity:.5; }
    100%{ opacity:0; transform:translate(-50%,-50%) rotate(-260deg); }
  }

  .salute-stars{ position:absolute; inset:0; pointer-events:none; z-index:2; opacity:0; animation: starsContainerFade 4.7s ease-in-out forwards; }
  @keyframes starsContainerFade{
    0%{ opacity:0; } 30%{ opacity:0; } 50%{ opacity:1; } 80%{ opacity:1; } 100%{ opacity:0; }
  }
  .salute-stars .star{
    position:absolute; color:#FFE8B8; font-size:clamp(10px,2.2vw,22px);
    text-shadow:0 0 6px rgba(255,220,150,.85);
    opacity:0; animation: starTwinkle 1.8s ease-in-out infinite;
  }
  @keyframes starTwinkle{
    0%,100%{ opacity:0; transform:scale(.4); }
    50%{ opacity:1; transform:scale(1); }
  }

  .salute-overlay .salute-emoji{
    position:relative; z-index:3;
    font-size:48px; line-height:1; opacity:0;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.35));
    animation:
      saluteAppear .3s ease-out forwards,
      saluteGrowSpin 2s ease-in-out .3s forwards,
      saluteShakeMax .4s ease-in-out 2.3s forwards,
      saluteWaveOut 2s ease-in-out 2.7s forwards;
  }
  @keyframes saluteAppear{
    from{ opacity:0; transform:scale(.6) rotate(0deg); }
    to{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  @keyframes saluteGrowSpin{
    from{ font-size:48px; transform:scale(1) rotate(0deg); }
    to{ font-size:min(95vw, 95vh); transform:scale(1) rotate(720deg); }
  }
  @keyframes saluteShakeMax{
    0%{ transform:scale(1) rotate(720deg); }
    20%{ transform:scale(1.02) rotate(715deg); }
    40%{ transform:scale(.98) rotate(726deg); }
    60%{ transform:scale(1.02) rotate(714deg); }
    80%{ transform:scale(.98) rotate(725deg); }
    100%{ transform:scale(1) rotate(720deg); }
  }
  @keyframes saluteWaveOut{
    0%{ font-size:min(95vw, 95vh); transform:scale(1) rotate(0deg); opacity:1; }
    10%{ transform:scale(1) rotate(-18deg); }
    20%{ transform:scale(1) rotate(16deg); }
    30%{ transform:scale(1) rotate(-16deg); }
    40%{ transform:scale(1) rotate(14deg); }
    50%{ font-size:min(70vw, 70vh); transform:scale(1) rotate(-12deg); }
    60%{ transform:scale(1) rotate(10deg); }
    72%{ font-size:35vmin; transform:scale(1) rotate(-8deg); opacity:1; }
    86%{ font-size:14vmin; transform:scale(1) rotate(6deg); opacity:.7; }
    100%{ font-size:1px; transform:scale(1) rotate(0deg); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .list-item, .pill, #clockInForm button[type="submit"], .toast, .toast.out{ animation:none !important; }
    .salute-overlay, .salute-overlay .salute-emoji, .salute-sunset, .salute-rays, .salute-stars, .salute-stars .star{ animation:none !important; }
  }

// ---------- New: generic button ripple ----------
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn');
  if(!btn) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
});

// ---------- New: auto-shake any field whose error-msg gets filled ----------
new MutationObserver((mutations) => {
  const seen = new Set();
  for(const m of mutations){
    const el = m.target.nodeType === 1 ? m.target : m.target.parentElement;
    if(!el) continue;
    const errEl = el.classList && el.classList.contains('error-msg') ? el : el.closest && el.closest('.error-msg');
    if(errEl && errEl.textContent.trim() && !seen.has(errEl)){
      seen.add(errEl);
      const field = errEl.previousElementSibling;
      [errEl, field].forEach(node => {
        if(!node) return;
        node.classList.remove('shake-field');
        void node.offsetWidth; // restart animation
        node.classList.add('shake-field');
      });
    }
  }
}).observe(app, { subtree:true, characterData:true, childList:true });

// לוקחים את השעה מהשרת של האתר (הכותרת Date בתשובה), ומחשבים כמה השעון של המכשיר טועה.
let clockOffsetMs = 0;
function trueNow(){ return new Date(Date.now() + clockOffsetMs); }
// מחזיר תאריך שהשעה "המקומית" שלו היא השעה בישראל עכשיו
function ilNow(){
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jerusalem', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(trueNow()).map(x => [x.type, x.value]));
  return new Date(Number(p.year), Number(p.month) - 1, Number(p.day), Number(p.hour) % 24, Number(p.minute), Number(p.second));
}
async function syncClock(){
  try{
    const t0 = Date.now();
    const r = await fetch(location.pathname + '?t=' + t0, { method: 'HEAD', cache: 'no-store' });
    const t1 = Date.now(), hd = r.headers.get('Date');
    if(!hd) return;
    const server = Date.parse(hd) + 500;   // הכותרת מעוגלת לשנייה
    const off = server - (t0 + t1) / 2;
    clockOffsetMs = Math.abs(off) > 3000 ? off : 0;
    state._clockOffMin = Math.abs(off) > 120000 ? Math.round(off / 60000) : 0;
    if(Math.abs(off) > 120000) console.warn('device clock is off by ' + Math.round(off / 60000) + ' minutes; using server time');
  }catch(e){}
}

// ---------- sound effects (synthesized, no external audio files) ----------
let audioCtx = null;
function getAudioCtx(){
  try{
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function playTone(ctx, freq, startTime, duration, type, gain){
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, startTime);
  g.gain.linearRampToValueAtTime(gain, startTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(g).connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}
function playChaChing(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const now = ctx.currentTime;
    playTone(ctx, 1568, now, 0.12, 'triangle', 0.25);
    playTone(ctx, 2093, now + 0.07, 0.2, 'triangle', 0.22);
    const bufferSize = Math.floor(ctx.sampleRate * 0.15);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufferSize; i++){ data[i] = (Math.random()*2 - 1) * (1 - i/bufferSize); }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 4000;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.09, now + 0.05);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    noise.connect(filter).connect(noiseGain).connect(ctx.destination);
    noise.start(now + 0.05);
  }catch(e){ /* ignore audio errors */ }
}
function playSuccessChime(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const now = ctx.currentTime;
    playTone(ctx, 880, now, 0.12, 'sine', 0.22);
    playTone(ctx, 1318.5, now + 0.09, 0.2, 'sine', 0.22);
  }catch(e){ /* ignore audio errors */ }
}
function speakHebrew(text){
  try{
    if(!('speechSynthesis' in window)) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'he-IL';
    utter.rate = 1;
    utter.pitch = 0.55; // notably deeper, to push toward a masculine-sounding tone
    const speakNow = () => {
      const voices = window.speechSynthesis.getVoices();
      const heVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('he'));
      let voice = heVoices.find(v => /(male|man|^m\b)/i.test(v.name) && !/female|woman/i.test(v.name));
      if(!voice) voice = heVoices.find(v => !/female|woman/i.test(v.name));
      if(!voice) voice = heVoices[0];
      if(voice) utter.voice = voice;
      window.speechSynthesis.speak(utter);
    };
    if(window.speechSynthesis.getVoices().length === 0){
      window.speechSynthesis.addEventListener('voiceschanged', speakNow, { once: true });
    }else{
      speakNow();
    }
  }catch(e){ /* ignore speech errors */ }
}

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout:' + label)), ms))
  ]);
}
// עוטף כל פעולת setDoc. חשוב: ל-Firestore יש התנהגות מוכרת ומתועדת - ה-Promise שהוא מחזיר
// "נפתר" (resolve) רק כשהשרת עצמו מאשר את הכתיבה, גם אם הנתון כבר נשמר מיידית במטמון המקומי.
// כלומר במצב לא-מקוון ה-Promise פשוט "תקוע" עד שהאינטרנט חוזר - למרות שהשמירה בפועל הצליחה.
// לכן: אם אין אינטרנט כרגע, לא מחכים לאישור השרת בכלל - משאירים את הכתיבה לרוץ ברקע (תסתנכרן
// לבד כשהחיבור יחזור) ומחזירים הצלחה מיד, כי אנחנו יודעים שהמטמון המקומי כבר עודכן.
async function saveDoc(promiseFn, label){
  if(!navigator.onLine){
    promiseFn().catch(e => console.error(label + ' (offline, will sync automatically later)', e));
    return true;
  }
  try{
    await withTimeout(promiseFn(), 30000, label);
    return true;
  }catch(e){ console.error(label + ' error', e); return (e && e.message) || 'שגיאה לא ידועה'; }
}

function hourChangesText(prev, next){
  const today = todayStr(), out = [];
  const months = new Set([...Object.keys(prev || {}), ...Object.keys(next || {})].filter(k => /^\d{4}-\d{2}$/.test(k)));
  const d = x => x ? x.split('-').reverse().slice(0, 2).join('/') : '';
  const t = x => x ? hhmm(x) : 'פתוח';
  months.forEach(m => {
    const a = new Map((prev[m] || []).map(e => [e.id, e])), b = new Map((next[m] || []).map(e => [e.id, e]));
    b.forEach((e, id) => {
      const o = a.get(id);
      if(!o){ if(!(e.date === today && !e.end)) out.push(`נוסף רישום ${d(e.date)} ${t(e.start)}–${t(e.end)}`); return; }
      const ch = [];
      if(o.date !== e.date) ch.push(`תאריך ${d(o.date)}→${d(e.date)}`);
      if(o.start !== e.start) ch.push(`כניסה ${t(o.start)}→${t(e.start)}`);
      if(o.end !== e.end && !(e.date === today && !o.end)) ch.push(`יציאה ${t(o.end)}→${t(e.end)}`);
      const live = e.date === today && (!o.end || !e.end);
      if(!live && JSON.stringify(o.breaks || []) !== JSON.stringify(e.breaks || [])) ch.push('שונו ההפסקות');
      if(ch.length) out.push(`שונה רישום ${d(e.date)}: ${ch.join(', ')}`);
    });
    a.forEach((o, id) => { if(!b.has(id)) out.push(`נמחק רישום ${d(o.date)} ${t(o.start)}–${t(o.end)}`); });
  });
  return out;
}

// ---------- תאריך עברי מלא לראש הדף ----------
function hebYearStr(y){
  let n = y % 1000;
  const parts = [];
  const vals = [[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
  for(const [v, ch] of vals){ while(n >= v){ if(n === 15 || n === 16){ parts.push('ט', n === 15 ? 'ו' : 'ז'); n = 0; break; } parts.push(ch); n -= v; } }
  const str = parts.join('');
  return str.length > 1 ? str.slice(0, -1) + '״' + str.slice(-1) : str + '׳';
}
function israelNowParts(date){
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' }).formatToParts(date || new Date()).map(x => [x.type, x.value]));
  return { y: Number(p.year), m: Number(p.month), d: Number(p.day), wd: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday) };
}

  try{
    const n = israelNowParts();
    const ds = n.y + '-' + String(n.m).padStart(2, '0') + '-' + String(n.d).padStart(2, '0');
    const hy = Number(new Intl.DateTimeFormat('en-u-ca-hebrew', { year: 'numeric' }).formatToParts(new Date(n.y, n.m - 1, n.d, 12)).find(x => x.type === 'year').value);
    const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
    return `יום ${days[n.wd]}, ${hebrewDateStr(ds)} ${hebYearStr(hy)}`;
  }catch(e){ return ''; }
}

// ---------- זמני שבת וחג לתל אביב ----------
// שקיעה וצאת הכוכבים לפי נוסחת NOAA. הדלקת נרות: 21 דקות לפני השקיעה; יציאה: צאת הכוכבים (השמש 8.5° מתחת לאופק).
const TLV_COORDS = { lat: 32.0853, lng: 34.7818 };
function sunEveningUTC(y, m, d, zenith){
  const rad = Math.PI / 180, lat = TLV_COORDS.lat, lng = TLV_COORDS.lng;
  const N = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 0)) / 86400000);
  const lngHour = lng / 15, t = N + ((18 - lngHour) / 24);
  const M = (0.9856 * t) - 3.289;
  let L = M + (1.916 * Math.sin(M * rad)) + (0.020 * Math.sin(2 * M * rad)) + 282.634; L = ((L % 360) + 360) % 360;
  let RA = Math.atan(0.91764 * Math.tan(L * rad)) / rad; RA = ((RA % 360) + 360) % 360;
  RA = (RA + (Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90)) / 15;
  const sinDec = 0.39782 * Math.sin(L * rad), cosDec = Math.cos(Math.asin(sinDec));
  const cosH = (Math.cos(zenith * rad) - (sinDec * Math.sin(lat * rad))) / (cosDec * Math.cos(lat * rad));
  const H = Math.acos(Math.max(-1, Math.min(1, cosH))) / rad / 15;
  let UT = (H + RA - (0.06571 * t) - 6.622) - lngHour; UT = ((UT % 24) + 24) % 24;
  return new Date(Date.UTC(y, m - 1, d) + UT * 3600000);
}
function candleLighting(y, m, d){ return new Date(sunEveningUTC(y, m, d, 90.833).getTime() - 21 * 60000); }
function tzeitHakochavim(y, m, d){ return sunEveningUTC(y, m, d, 98.5); }
const ISSUR_YOM_TOV = { 'Tishri-1': 'ראש השנה', 'Tishri-2': 'ראש השנה', 'Tishri-10': 'יום הכיפורים', 'Tishri-15': 'סוכות', 'Tishri-22': 'שמחת תורה', 'Nisan-15': 'פסח', 'Nisan-21': 'שביעי של פסח', 'Sivan-6': 'שבועות' };
let _hebDayFmt = null;
function issurDayName(y, m, d){
  const dt = new Date(y, m - 1, d, 12);
  try{
    if(!_hebDayFmt) _hebDayFmt = new Intl.DateTimeFormat('en-u-ca-hebrew', { day: 'numeric', month: 'long' });
    const pr = _hebDayFmt.formatToParts(dt);
    const key = pr.find(x => x.type === 'month').value + '-' + Number(pr.find(x => x.type === 'day').value);
    if(ISSUR_YOM_TOV[key]) return ISSUR_YOM_TOV[key];
  }catch(e){}
  return dt.getDay() === 6 ? 'שבת' : null;
}
function addDays(y, m, d, k){ const dt = new Date(y, m - 1, d + k, 12); return [dt.getFullYear(), dt.getMonth() + 1, dt.getDate()]; }
// האם עכשיו שבת או יום טוב (מהדלקת נרות ועד צאת הכוכבים), ומתי זה נגמר
function shabbatStatus(now){
  now = now || trueNow();
  const t = israelNowParts(now);
  const today = [t.y, t.m, t.d], tomorrow = addDays(t.y, t.m, t.d, 1);
  let start = null;
  if(issurDayName(...today) && now < tzeitHakochavim(...today)) start = today;
  else if(issurDayName(...tomorrow) && now >= candleLighting(...today)) start = tomorrow;
  if(!start) return { closed: false };
  let last = start;
  for(let i = 0; i < 4; i++){ const nx = addDays(...last, 1); if(issurDayName(...nx)) last = nx; else break; }
  const name = issurDayName(...start);
  return { closed: true, name, reopenAt: tzeitHakochavim(...last) };
}

// ---------- הישגים: רצף ימים שבהם היעד היומי הושג ----------
// ימי עבודה = ראשון עד חמישי, בלי שבת, חג או יום חופשה/מחלה. "שבוע מושלם" = כל ימי העבודה בשבוע (ראשון-חמישי) עמדו ביעד.
function goalAchievements(emp, goal, hoursData, daysOff){
  const offSet = new Set((daysOff || []).map(d => d.date));
  const dayAch = (ds) => {
    const [y, m] = ds.split('-');
    const list = (hoursData[y + '-' + m] || []).filter(e => e.date === ds);
    const h = list.reduce((sum, e) => sum + entryHoursSoFar(e), 0);
    return goal.type === 'pay' ? h * (emp.rate || 0) : h;
  };
  const isWorkday = (dt) => dt.getDay() <= 4 && !issurDayName(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()) && !specialDayLabel(dt.getFullYear(), dt.getMonth() + 1, dt.getDate())?.kind?.includes('holiday') && !offSet.has(ymd(dt));
  function ymd(dt){ return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }
  // רצף נוכחי: סופרים אחורה מהיום (היום נספר רק אם היעד כבר הושג)
  let streak = 0;
  const today = ilNow(); today.setHours(12, 0, 0, 0);
  for(let i = 0; i < 400; i++){
    const dt = new Date(today); dt.setDate(today.getDate() - i);
    if(!isWorkday(dt)) continue;
    const met = dayAch(ymd(dt)) >= goal.value;
    if(met) streak++;
    else if(i === 0) continue; // היום עוד לא נגמר
    else break;
  }
  // שבועות מושלמים: עוברים על השבועות שיש בהם נתונים
  const weeks = new Set();
  Object.values(hoursData).forEach(list => (list || []).forEach(e => {
    const [y, m, d] = e.date.split('-').map(Number); const dt = new Date(y, m - 1, d, 12);
    dt.setDate(dt.getDate() - dt.getDay()); weeks.add(ymd(dt));
  }));
  let perfectWeeks = 0;
  const thisSunday = new Date(today); thisSunday.setDate(today.getDate() - today.getDay());
  weeks.forEach(ws => {
    const [y, m, d] = ws.split('-').map(Number); const sun = new Date(y, m - 1, d, 12);
    if(sun >= thisSunday && today.getDay() < 4) return; // השבוע הנוכחי נספר רק כשהוא נגמר (מיום חמישי)
    let required = 0, ok = true;
    for(let k = 0; k <= 4; k++){
      const dt = new Date(sun); dt.setDate(sun.getDate() + k);
      if(!isWorkday(dt)) continue;
      required++;
      if(dayAch(ymd(dt)) < goal.value){ ok = false; break; }
    }
    if(ok && required > 0) perfectWeeks++;
  });
  return { streak, perfectWeeks };
}

// ---------- שעות "עד עכשיו" לרישום (גם ליום פתוח: עד השעה הנוכחית, בניכוי הפסקות) ----------
function entryHoursSoFar(entry){
  if(entry.end) return computeEntryHours(entry) || 0;
  const now = nowTimeStr();
  const gross = computeHoursFromRange(entry.start, now) || 0;
  const br = (entry.breaks || []).reduce((sum, b) => sum + (computeHoursFromRange(b.start, b.end || now) || 0), 0);
  return Math.max(0, gross - br);
}
// ---------- יעד יומי של העובד (נשמר בהגדרות, בשדה dailyGoal) ----------
function getDailyGoal(settings, emp){
  const g = settings && settings.dailyGoal;
  const fixed = emp && emp.payType === 'fixed';
  if(g && (g.type === 'pay' || g.type === 'hours') && Number(g.value) > 0){
    if(fixed && g.type === 'pay') return { type: 'hours', value: 8 };
    return { type: g.type, value: Number(g.value) };
  }
  return fixed ? { type: 'hours', value: 8 } : { type: 'pay', value: 200 };
}
function dailyGoalProgress(emp, goal, entries){
  const t = todayStr();
  const hours = entries.filter(e => e.date === t).reduce((sum, e) => sum + entryHoursSoFar(e), 0);
  const achieved = goal.type === 'pay' ? hours * (emp.rate || 0) : hours;
  const pct = Math.min(100, goal.value > 0 ? (achieved / goal.value) * 100 : 0);
  const fmt = (v) => goal.type === 'pay' ? fmtMoney(Math.round(v * 100) / 100) : fmtHours(Math.round(v * 100) / 100) + ' שעות';
  return { achieved, pct, done: achieved >= goal.value, fmt };
}
function dailyGoalInHours(goal, emp){
  if(goal.type === 'hours') return goal.value;
  return emp.rate > 0 ? goal.value / emp.rate : null;
}
function goalTextHtml(pr, goal){
  return pr.done ? `🎉 היעד הושג! ${pr.fmt(pr.achieved)} היום` : `הושגו ${pr.fmt(pr.achieved)} (${Math.floor(pr.pct)}%) · נשארו ${pr.fmt(goal.value - pr.achieved)}`;
}

// ---------- תאריך עברי ----------
function hebNumber(n){
  if(n === 15) return 'ט״ו';
  if(n === 16) return 'ט״ז';
  const ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
  const tens = ['', 'י', 'כ', 'ל'];
  const str = tens[Math.floor(n / 10)] + ones[n % 10];
  return str.length > 1 ? str.slice(0, -1) + '״' + str.slice(-1) : str + '׳';
}
let _hebDateFmt = null;
function hebrewDateStr(dateStr){
  try{
    if(!_hebDateFmt) _hebDateFmt = new Intl.DateTimeFormat('he-u-ca-hebrew', { day: 'numeric', month: 'long' });
    const [y, m, d] = String(dateStr).split('-').map(Number);
    const parts = _hebDateFmt.formatToParts(new Date(y, m - 1, d, 12));
    const day = Number(parts.find(p => p.type === 'day').value);
    const month = parts.find(p => p.type === 'month').value;
    return hebNumber(day) + ' ' + month;
  }catch(e){ return ''; }
}
// ---------- ימי חופשה ומחלה (נשמרים בהגדרות האישיות של העובד, בשדה daysOff) ----------
const DAY_OFF_TYPES = { vacation: { label: 'חופשה', icon: '🏖️' }, sick: { label: 'מחלה', icon: '🤒' } };

// ---------- personal color theme (per-employee background/text/accent color choices) ----------
function hexToRgb(hex){
  const clean = (hex || '').replace('#', '');
  if(!/^[0-9a-fA-F]{6}$/.test(clean)) return null;
  const num = parseInt(clean, 16);
  return { r: (num >> 16) & 0xFF, g: (num >> 8) & 0xFF, b: num & 0xFF };
}
function rgbToHex(r, g, b){
  return '#' + [r, g, b].map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join('');
}
function darkenHexColor(hex, amount){
  amount = amount == null ? 0.25 : amount;
  const rgb = hexToRgb(hex);
  if(!rgb) return hex;
  return rgbToHex(rgb.r * (1 - amount), rgb.g * (1 - amount), rgb.b * (1 - amount));
}
// Blends two colors together (weight 0 = pure a, weight 1 = pure b).
function mixHexColors(hexA, hexB, weight){
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  if(!a || !b) return hexA;
  return rgbToHex(
    a.r + (b.r - a.r) * weight,
    a.g + (b.g - a.g) * weight,
    a.b + (b.b - a.b) * weight
  );
}
// Perceived brightness (0 = black, 1 = white) — good enough to decide light-vs-dark, not full WCAG math.
function relativeBrightness(hex){
  const rgb = hexToRgb(hex);
  if(!rgb) return 1;
  return (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b) / 255;
}
function isLightColor(hex){ return relativeBrightness(hex) > 0.6; }
// Picks a readable text color for a given background — dark ink for light backgrounds, off-white for dark ones.
function getContrastTextColor(hex){ return isLightColor(hex) ? '#1A2733' : '#F5FAFF'; }

const DEFAULT_THEME_COLOR = '#5FBF8F'; // accent (buttons / highlights)
const DEFAULT_BG_COLOR = '#EAF3FB';    // page background
const DEFAULT_INK_COLOR = '#12293F';   // main text color
const DARK_MODE_BG_COLOR = '#000000';  // page background when "מצב כהה" is on — שחור אמיתי, לא גוון כחלחל

function applyEmployeeTheme(settings){
  settings = settings || {};
  const accent = settings.themeColor || DEFAULT_THEME_COLOR;
  const darkMode = !!settings.darkMode;
  // מצב כהה גובר על צבע רקע מותאם אישית כל עוד הוא מופעל, אבל עדיין מכבד צבע טקסט
  // מותאם אישית אם הוגדר (ואחרת מחשב ניגודיות אוטומטית, בדיוק כמו עם רקע מותאם רגיל).
  const bgCustomized = darkMode || !!settings.bgColor;
  const bg = darkMode ? DARK_MODE_BG_COLOR : (settings.bgColor || DEFAULT_BG_COLOR);
  // Only fall back to auto-contrast once the person has actually customized the background;
  // with an untouched background we keep the app's exact original ink tone.
  const text = settings.textColor || (bgCustomized ? getContrastTextColor(bg) : DEFAULT_INK_COLOR);
  const bgIsLight = isLightColor(bg);
  // Card/modal "surface" is lightened slightly relative to a dark background so cards visually
  // "lift" off the page (the standard dark-UI convention) — but defaults to plain white when the
  // background hasn't been customized, matching the original look.
  const surface = bgCustomized ? mixHexColors(bg, '#FFFFFF', bgIsLight ? 0.75 : 0.1) : '#FFFFFF';
  // גבול הכרטיסים (--line): כשהרקע מותאם אישית, מחשבים קו עדין שנגזר מהמשטח והטקסט —
  // כך שברקע כהה זה יהיה קו אפור-כהה בקושי נראה, לא הכחול הבהיר המקורי המיועד לרקע בהיר.
  const line = bgCustomized ? mixHexColors(surface, text, 0.14) : '#B9D3E3';
  const root = document.documentElement.style;
  root.setProperty('--brass', accent);
  root.setProperty('--brass-dark', darkenHexColor(accent));
  root.setProperty('--brass-text', getContrastTextColor(accent));
  root.setProperty('--paper', bg);
  root.setProperty('--paper-alt', mixHexColors(bg, bgIsLight ? '#000000' : '#FFFFFF', 0.08));
  root.setProperty('--ink', text);
  root.setProperty('--ink-soft', mixHexColors(text, bg, 0.35));
  root.setProperty('--surface', surface);
  root.setProperty('--line', line);
}
function resetTheme(){
  ['--brass', '--brass-dark', '--brass-text', '--paper', '--paper-alt', '--ink', '--ink-soft', '--surface', '--line'].forEach(v => {
    document.documentElement.style.removeProperty(v);
  });
}

function calcPay(emp, hoursTotal){
  if(emp.payType === 'fixed'){ return emp.rate; }
  return hoursTotal * emp.rate;
}
function computeHoursFromRange(start, end){
  if(!start || !end) return null;
  const sParts = start.split(':').map(Number);
  const eParts = end.split(':').map(Number);
  const sh = sParts[0], sm = sParts[1], ss = sParts[2] || 0;
  const eh = eParts[0], em = eParts[1], es = eParts[2] || 0;
  let startSec = sh*3600 + sm*60 + ss;
  let endSec = eh*3600 + em*60 + es;
  if(endSec < startSec) endSec += 24*3600; // crosses midnight
  const diffHours = (endSec - startSec) / 3600;
  return Math.round(diffHours * 1e6) / 1e6;
}
function nowTimeStr(){
  const d = ilNow();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
}
// Net worked hours for an entry, subtracting any completed breaks. Returns null if the entry is still open (no end time yet).
function computeEntryHours(entry){
  if(!entry.end) return null;
  const gross = computeHoursFromRange(entry.start, entry.end);
  if(gross === null) return null;
  const breaksHours = (entry.breaks || []).reduce((s,b) => {
    if(!b.end) return s;
    const h = computeHoursFromRange(b.start, b.end);
    return s + (h || 0);
  }, 0);
  return Math.max(0, Math.round((gross - breaksHours) * 1e6) / 1e6);
}
function findOpenEntryToday(entries){
  const t = todayStr();
  return entries.find(e => e.date === t && !e.end) || null;
}
// Builds a plain-text hours report for the "email my hours to the manager" feature.
function buildHoursEmailBody(emp, month, entries, totalHours, pay, includePay){
  const lines = [];
  lines.push(`חודש: ${monthLabel(month)}`);
  lines.push('');
  if(!entries.length){
    lines.push('(אין רישומי שעות בחודש זה)');
  } else {
    entries.forEach(e => {
      const h = computeEntryHours(e);
      const closedBreaks = (e.breaks || []).filter(b => b.end);
      const breaksTxt = closedBreaks.length
        ? ` | הפסקות: ${closedBreaks.map(b => hhmm(b.start) + '-' + hhmm(b.end)).join(', ')}`
        : '';
      lines.push(`${e.date} | ${hhmm(e.start)}–${e.end ? hhmm(e.end) : 'פתוח'} | ${h !== null ? fmtHours(h) + ' שעות' : '—'}${breaksTxt}`);
    });
  }
  lines.push('');
  lines.push(`סה"כ שעות: ${fmtHours(totalHours)}`);
  if(includePay){
    // Deliberately using the Hebrew letters ש"ח instead of the ₪ symbol: a number followed by plain
    // Hebrew text is the normal, always-safe RTL pattern. The ₪ symbol's Unicode bidi class is a
    // "European Terminator", which some mail clients render in an unpredictable position next to
    // a number inside an RTL paragraph — spelling it out in Hebrew avoids that class of bug entirely.
    const payStr = pay.toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    lines.push(`סה"כ לתשלום: ${payStr} ש"ח`);
  }
  return lines.join('\n');
}

// ---------- Excel import helpers ----------
function parseCellDate(value){
  if(value === null || value === undefined || value === '') return null;
  if(value instanceof Date){
    return value.getFullYear() + '-' + String(value.getMonth()+1).padStart(2,'0') + '-' + String(value.getDate()).padStart(2,'0');
  }
  if(typeof value === 'number'){
    try{
      const info = XLSX.SSF.parse_date_code(value);
      if(!info) return null;
      return info.y + '-' + String(info.m).padStart(2,'0') + '-' + String(info.d).padStart(2,'0');
    }catch(e){ return null; }
  }
  if(typeof value === 'string'){
    const s = value.trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(m) return m[1] + '-' + m[2].padStart(2,'0') + '-' + m[3].padStart(2,'0');
    m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m) return m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
    return null;
  }
  return null;
}
function parseCellTime(value){
  if(value === null || value === undefined || value === '') return null;
  if(value instanceof Date){
    return String(value.getHours()).padStart(2,'0') + ':' + String(value.getMinutes()).padStart(2,'0');
  }
  if(typeof value === 'number'){
    const totalMinutes = Math.round(value * 24 * 60);
    const h = Math.floor(totalMinutes / 60) % 24;
    const m = totalMinutes % 60;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  }
  if(typeof value === 'string'){
    const s = value.trim();
    const m = s.match(/^(\d{1,2}):(\d{2})/);
    if(m) return m[1].padStart(2,'0') + ':' + m[2];
    return null;
  }
  return null;
}
async function parseExcelFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: null });
  if(!rows || rows.length === 0) return { rows: [], error: 'הקובץ ריק' };

  let startRow = 0, dateCol = 0, startCol = 1, endCol = 2;
  const looksLikeData = parseCellDate(rows[0][0]) !== null;
  if(!looksLikeData){
    const header = rows[0].map(h => (h === null || h === undefined) ? '' : h.toString().trim().toLowerCase());
    const findCol = (keywords) => header.findIndex(h => keywords.some(k => h.includes(k)));
    const dc = findCol(['תאריך','date']);
    const sc = findCol(['משעה','התחלה','start']);
    const ec = findCol(['עד','סיום','end']);
    if(dc >= 0) dateCol = dc;
    if(sc >= 0) startCol = sc;
    if(ec >= 0) endCol = ec;
    startRow = 1;
  }

  const results = [];
  for(let i = startRow; i < rows.length; i++){
    const row = rows[i];
    if(!row || row.every(c => c === null || c === '')) continue;
    const date = parseCellDate(row[dateCol]);
    const start = parseCellTime(row[startCol]);
    const end = parseCellTime(row[endCol]);
    let error = null;
    let hours = null;
    if(!date) error = 'תאריך לא תקין';
    else if(!start || !end) error = 'שעה לא תקינה';
    else {
      hours = computeHoursFromRange(start, end);
      if(hours === null || hours <= 0) error = 'טווח שעות לא תקין';
    }
    results.push({ rowNum: i + 1, date, start, end, hours, error });
  }
  return { rows: results, error: null };
}

let authReady = false;
let liveTimerInterval = null;
function stopLiveTimer(){
  if(liveTimerInterval){ clearInterval(liveTimerInterval); liveTimerInterval = null; }
}
function startLiveTimer(sinceTimeStr){
  stopLiveTimer();
  const el = document.getElementById('liveTimer');
  if(!el) return;
  function update(){
    const target = document.getElementById('liveTimer');
    if(!target){ stopLiveTimer(); return; }
    const now = ilNow();
    const [h, m, s] = sinceTimeStr.split(':').map(Number);
    const since = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, s || 0);
    let diffMs = now - since;
    if(diffMs < 0) diffMs += 24 * 60 * 60 * 1000; // crossed midnight
    const totalSec = Math.floor(diffMs / 1000);
    const hh = Math.floor(totalSec / 3600);
    const mm = Math.floor((totalSec % 3600) / 60);
    const ss = totalSec % 60;
    target.textContent = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  }
  update();
  liveTimerInterval = setInterval(update, 1000);
}

// Live "earnings so far" ticker for the current open work session (hourly employees only).
// Naturally freezes during a break: elapsed-since-clockin and elapsed-since-break-start grow
// at the same rate, so their difference (net worked time) stays constant while on break.
let liveMoneyInterval = null;
function stopLiveMoneyTimer(){
  if(liveMoneyInterval){ clearInterval(liveMoneyInterval); liveMoneyInterval = null; }
}
function startLiveMoneyTimer(emp, openEntry, onBreak, lastBreak){
  stopLiveMoneyTimer();
  const el = document.getElementById('liveMoney');
  if(!el || emp.payType === 'fixed') return;
  function secOfDay(t){
    const [h, m, s] = t.split(':').map(Number);
    return h*3600 + m*60 + (s || 0);
  }
  const startSec = secOfDay(openEntry.start);
  const completedBreaksSec = (openEntry.breaks || []).reduce((sum, b) => {
    if(!b.end) return sum;
    let bs = secOfDay(b.start), be = secOfDay(b.end);
    if(be < bs) be += 24*3600;
    return sum + (be - bs);
  }, 0);
  function update(){
    const target = document.getElementById('liveMoney');
    if(!target){ stopLiveMoneyTimer(); return; }
    const now = ilNow();
    const nowSec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
    let totalElapsed = nowSec - startSec;
    if(totalElapsed < 0) totalElapsed += 24*3600;
    let ongoingBreakSec = 0;
    if(onBreak && lastBreak){
      let diff = nowSec - secOfDay(lastBreak.start);
      if(diff < 0) diff += 24*3600;
      ongoingBreakSec = diff;
    }
    const workSec = Math.max(0, totalElapsed - completedBreaksSec - ongoingBreakSec);
    const money = (workSec / 3600) * emp.rate;
    target.textContent = '₪' + money.toLocaleString('he-IL', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  update();
  liveMoneyInterval = setInterval(update, 1000);
}

// Watches the clock while the employee is on break / paused, so that if 20:00 arrives while the tab
// stays open, we re-render immediately and let the auto-close logic in renderEmployeeDashboard kick in
// (rather than waiting for the employee to manually refresh or click something).
let breakWatchdogInterval = null;
function stopBreakWatchdog(){
  if(breakWatchdogInterval){ clearInterval(breakWatchdogInterval); breakWatchdogInterval = null; }
}
function startBreakWatchdog(emp){
  stopBreakWatchdog();
  breakWatchdogInterval = setInterval(() => {
    if(ilNow().getHours() >= 20){
      stopBreakWatchdog();
      renderEmployeeDashboard(emp, null, true); // הבדיקה עצמה (כולל "התחילה לפני 20:00") נעשית בדשבורד
    }
  }, 15000);
}

// Keeps a time-input field (like "arrival time") showing the real current time live,
// so the user never has to refresh the page. Stops updating the moment the user touches it themselves.
let clockFieldIntervals = [];
function stopClockFieldTimers(){
  clockFieldIntervals.forEach(id => clearInterval(id));
  clockFieldIntervals = [];
}
function bindLiveTimeField(inputId){
  const el = document.getElementById(inputId);
  if(!el) return;
  let userEdited = false;
  const markEdited = () => { userEdited = true; };
  el.addEventListener('input', markEdited);
  el.addEventListener('focus', markEdited);
  el.addEventListener('blur', () => {
    // typing just HH:MM is fine — auto-complete the seconds so the value stays valid
    const v = el.value.trim();
    if(/^([01]\d|2[0-3]):[0-5]\d$/.test(v)){ el.value = v + ':00'; }
  });
  const id = setInterval(() => {
    if(userEdited){ clearInterval(id); return; }
    const stillThere = document.getElementById(inputId);
    if(!stillThere){ clearInterval(id); return; }
    stillThere.value = nowTimeStr();
  }, 1000);
  clockFieldIntervals.push(id);
}
function wireNowButton(buttonId, inputId){
  const btn = document.getElementById(buttonId);
  const input = document.getElementById(inputId);
  if(btn && input){
    btn.onclick = () => { input.value = nowTimeStr(); };
  }
}
// מטפל בלחיצה על קישור "אישור"/"דחייה" שהגיע במייל ההתראה למנהל - עובד בלי צורך בהתחברות
async function handleEmailRequestAction(reqId, action){
  const showResult = (title, message, isError) => {
    app.innerHTML = `
      <div class="center-stage">
        <div class="login-card">
          <h1 style="${isError ? 'color:var(--danger);' : ''}">${escapeHtml(title)}</h1>
          <p class="hint">${escapeHtml(message)}</p>
          <button type="button" class="btn brass" onclick="location.href = location.pathname">חזרה לאתר</button>
        </div>
      </div>
    `;
  };
  const res = await bridge('request-action', { reqId, action });
  if(res.error === 'network' || res.error === 'server'){
    showResult('שגיאת תקשורת', 'לא הצלחנו להתחבר לשרת. נסו שוב בעוד כמה רגעים.', true);
    return;
  }
  if(res.error === 'not-found'){
    showResult('הבקשה לא נמצאה', 'ייתכן שהיא כבר טופלה או נמחקה.', true);
    return;
  }
  if(res.error){
    showResult('שגיאה בשמירה', 'שגיאה: ' + res.error, true);
    return;
  }
  if(res.already){
    const STATUS_LABEL = { approved: 'אושרה', rejected: 'נדחתה' };
    showResult('הבקשה כבר טופלה', `הבקשה של ${res.empName} כבר ${STATUS_LABEL[res.status] || res.status} קודם לכן.`, false);
    return;
  }
  showResult(
    action === 'approve' ? '✅ הבקשה אושרה' : '❌ הבקשה נדחתה',
    `הבקשה של ${res.empName} ("${res.text}") ${action === 'approve' ? 'אושרה' : 'נדחתה'} בהצלחה. העובד יראה את הסטטוס העדכני באתר.`,
    false
  );
}

async function init(){
  await Promise.race([clockReady, new Promise(r => setTimeout(r, 2500))]);
  app.innerHTML = '<div class="empty-state">טוען...</div>';

  // טיפול בלחיצה על קישור "אישור"/"דחייה" ישירות מתוך מייל ההתראה, בלי צורך בהתחברות
  const urlParams = new URLSearchParams(window.location.search);
  const reqId = urlParams.get('req');
  const reqAction = urlParams.get('action');
  if(reqId && (reqAction === 'approve' || reqAction === 'reject')){
    await handleEmailRequestAction(reqId, reqAction);
    return;
  }

  // רשימת העובדים המלאה (כולל קודים אישיים) נטענת רק אחרי כניסת מנהל - לא לפני
  state.loading = false;

  // איזה חיבור הכרטיסייה הזו משתמשת בו: לפי מה שנבחר בה קודם (גם אחרי רענון), ואם זו כרטיסייה חדשה – לפי מי שמחובר
  let tabRole = null; try{ tabRole = sessionStorage.getItem('tabRole'); }catch(e){}
  try{ await Promise.race([Promise.all([authAdmin.authStateReady(), authEmp.authStateReady()]), new Promise(r => setTimeout(r, 4000))]); }catch(e){}
  const adminUser = authAdmin.currentUser, empUser = authEmp.currentUser;
  if(tabRole === 'employee' && empUser) useConn('employee');
  else if(tabRole === 'admin') useConn('admin');
  else if(empUser && !(adminUser && adminUser.email)) useConn('employee');
  else { db = dbAdmin; auth = authAdmin; }
  onAuthStateChanged(auth, async (user) => {
    if(authReady) return; // only handle the initial resolution; explicit sign-in/out render themselves
    authReady = true;
    const session = loadSession();
    // עובד שנכנס עם קוד אישי: מחובר ל-Firebase עם טוקן מהגשר (משתמש בלי אימייל)
    if(user && !user.email){
      if(session && session.role === 'employee' && session.empId === user.uid){
        const res = await bridge('emp-me', { idToken: await empIdToken() });
        if(res.emp){
          saveSession({ role: 'employee', empId: user.uid, emp: res.emp });
          state.employees = [res.emp];
          renderEmployeeDashboard(res.emp);
          return;
        }
        // בלי אינטרנט: ממשיכים עם הפרטים שנשמרו בכניסה האחרונה
        if(res.error === 'network' && session.emp){
          state.employees = [session.emp];
          renderEmployeeDashboard(session.emp);
          return;
        }
      }
      // העובד הוקפא/נמחק, או שהסשן לא תקין - חוזרים למסך הכניסה
      clearSession();
      try{ await signOut(auth); }catch(e){ console.error('sign-out error', e); }
      renderLanding();
      return;
    }
    if(user){
      useConn('admin');
      if(!(await ensureEmployeesLoaded())) return;
      state.isAdmin = true;
      state.adminEmail = user.email;
      renderAdminDashboard('dashboard');
      return;
    }
    if(tryTrustedDeviceAdminLogin()) return;
    renderLanding();
  });
}

// בודק אם המכשיר הזה סומן כ"מהימן" מכניסת מנהל קודמת, ואם כן ומצליח - נכנס ישירות לפאנל
// הניהול בלי צורך בסיסמה. משמש גם ב-init() (טעינת דף) וגם בלחיצה על "כניסת מנהל" עצמה,
// כדי שהכניסה האוטומטית תעבוד מיד בלי צורך ברענון ידני של הדף.
function tryTrustedDeviceAdminLogin(){
  if(navigator.onLine) return false; // כשיש אינטרנט, תמיד עוברים דרך האימות האמיתי של Firebase
  try{
    const trusted = JSON.parse(localStorage.getItem('trustedAdminDevice') || 'null');
    if(trusted && trusted.email){
      state.isAdmin = true;
      state.adminEmail = trusted.email;
      ensureEmployeesLoaded().then(ok => { if(ok) renderAdminDashboard('dashboard'); });
      return true;
    }
  }catch(e){}
  return false;
}

          </div>

        </form>
        `}
        ${emps.length === 0 ? '<div class="actions"><button class="btn ghost" id="backBtn2">חזרה</button></div>' : ''}
      </div>
    </div>
  `;
  const back = document.getElementById('backBtn') || document.getElementById('backBtn2');

      const submitBtn = e.target.querySelector('button[type="submit"]');
      errEl.textContent = '';

      submitBtn.textContent = 'בודק...';
      const done = (msg) => { submitBtn.disabled = false; submitBtn.textContent = 'כניסה'; if(msg) errEl.textContent = msg; };

      if(!login.token){

          'bad-pin': 'קוד אישי שגוי',
          'locked': 'יותר מדי ניסיונות שגויים. נסו שוב בעוד 15 דקות.',

      try{
        useConn('employee');
        await signInWithCustomToken(auth, login.token);
      }catch(err){
        console.error('employee sign-in error', err);
        return done('שגיאת התחברות: ' + ((err && err.code) || 'לא ידועה'));
      }
      const emp = login.emp;
      saveSession({ role: 'employee', empId: emp.id, emp });
      state.employees = [emp];
      if(emp.chatOnly){ renderEmployeeDashboard(emp); return; }
      const hoursData = await loadHours(emp.id);
      if(hoursData === null){
        renderEmployeeDashboard(emp, null, false);
        return;
      }
      const todayEntries = hoursData[currentMonthStr()] || [];
      const alreadyStarted = !!findOpenEntryToday(todayEntries);
      if(alreadyStarted){
        renderEmployeeDashboard(emp, null, hoursData);
      }else{
        showWelcomeSplash(emp, () => renderEmployeeDashboard(emp, null, hoursData));
      }
    };
  }
}

          <div class="field">
            <label>קוד האימות מהמייל</label>
            <input type="text" id="fpCode" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" />
          </div>
          <div class="field">
            <label>קוד אישי חדש (4 עד 6 ספרות)</label>
            <input type="text" id="fpNew" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" style="-webkit-text-security: disc; text-security: disc;" />
          </div>
          <div class="field">
            <label>שוב את הקוד החדש</label>
            <input type="text" id="fpNew2" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" style="-webkit-text-security: disc; text-security: disc;" />
          </div>
          <div class="error-msg" id="fpErr2"></div>
          <div class="actions">
            <button type="submit" class="btn brass">שמירת קוד חדש</button>
            <button type="button" class="btn ghost" id="fpBack2">חזרה</button>
          </div>
        </form>
      </div>
    </div>
  `;
  document.getElementById('fpBack').onclick = renderEmployeeLogin;
  document.getElementById('fpBack2').onclick = renderEmployeeLogin;
  let empId = '';
  document.getElementById('fpSendForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]'), errEl = document.getElementById('fpErr');
    empId = document.getElementById('fpEmp').value;
    errEl.textContent = ''; btn.disabled = true; btn.textContent = 'שולח...';
    const res = await bridge('emp-reset-request', { empId });
    btn.disabled = false; btn.textContent = 'שליחת קוד למייל';
    if(!res.ok){
      const ERR = {
        'no-email': 'לא רשום אימייל לעובד הזה. פנו למנהל כדי שיעדכן את האימייל או יאפס לכם את הקוד.',

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Display-only helper: shows HH:MM even though the stored value may include seconds (used for accurate calculation)
function hhmm(t){
  return t ? t.slice(0,5) : t;
}
// Cleans up a manually-typed time value: strips invisible RTL/LTR direction marks that
// mobile keyboards sometimes insert around digits in an RTL page, then validates the format.
// Returns a clean "HH:MM:SS" string, or null if the value isn't a valid time.
function sanitizeTimeInput(raw){
  if(!raw) return null;
  let v = raw.replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069\s]/g, '');
  if(/^([01]\d|2[0-3]):[0-5]\d$/.test(v)) v += ':00';
  if(!/^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$/.test(v)) return null;
  return v;
}

// opts: { yes: 'טקסט הכפתור', danger: true/false (אדום, למחיקות), info: true (הודעה בלבד, כפתור אחד) }
function showConfirmModal(message, opts){
  const o = Object.assign({ yes: 'מחיקה', danger: true }, opts || {});
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p class="confirm-msg" style="${o.danger ? '' : 'color:var(--ink); animation:none;'}">${escapeHtml(message)}</p>
        <div class="actions">
          <button type="button" class="btn ${o.danger ? 'danger' : 'brass'}" id="confirmYes" style="padding:10px 22px;">${escapeHtml(o.yes)}</button>
          ${o.info ? '' : '<button type="button" class="btn ghost" id="confirmNo">' + escapeHtml(o.no || 'ביטול') + '</button>'}
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const cleanup = (result) => { overlay.remove(); resolve(result); };
    overlay.querySelector('#confirmYes').onclick = () => cleanup(true);
    const no = overlay.querySelector('#confirmNo'); if(no) no.onclick = () => cleanup(false);
    overlay.onclick = (e) => { if(e.target === overlay) cleanup(false); };
  });
}

// מציג לעובד את הבקשות שלו למנהל (עם סטטוס) ומאפשר לשלוח בקשה חדשה
// שולח למנהל התראת מייל על בקשה חדשה, עם קישורי אישור/דחייה ישירים. לא חוסם ולא מציג
// שגיאה לעובד אם זה נכשל - זו רק "התראה נחמד שיהיה", הבקשה עצמה כבר נשמרה במסד הנתונים.
async function notifyManagerOfRequest(emp, reqId, text){
  try{
    const [managerEmail, emailjsConfig] = await Promise.all([loadManagerEmail(), loadEmailjsConfig()]);
    if(!managerEmail || !emailjsConfig || !emailjsConfig.publicKey || !emailjsConfig.templateId || !window.emailjs) return;
    const serviceId = emp.emailjsServiceId || (emailjsConfig.senders && emailjsConfig.senders[0] && emailjsConfig.senders[0].serviceId);
    if(!serviceId) return;
    const baseUrl = window.location.origin + window.location.pathname;
    const approveUrl = `${baseUrl}?req=${encodeURIComponent(reqId)}&action=approve`;
    const rejectUrl = `${baseUrl}?req=${encodeURIComponent(reqId)}&action=reject`;
    const html = `
      <div dir="rtl" align="right" style="font-family:Arial,Helvetica,sans-serif; color:#222; max-width:520px; margin:0 0 0 auto;">
        <p style="font-size:15px;">התקבלה בקשה חדשה מ-<strong>${escapeHtml(emp.name)}</strong>:</p>

// לוחצים והחזיקו לזמן קצר = מחיקה; לחיצה רגילה = פתיחה. עובד גם במגע וגם בעכבר.
function attachLongPress(el, onLongPress, onClick){
  let timer = null, firedLongPress = false;
  const start = () => {
    firedLongPress = false;
    timer = setTimeout(() => { firedLongPress = true; onLongPress(); }, 550);
  };
  const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
  const endTouch = (e) => {
    if(e && e.cancelable) e.preventDefault(); // מונע מהדפדפן ליצור לחיצת-עכבר מדומה כמה מילישניות אחר כך
    const wasLong = firedLongPress;
    cancel();
    if(!wasLong) onClick();
  };
  const endMouse = () => { const wasLong = firedLongPress; cancel(); if(!wasLong) onClick(); };
  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchend', endTouch);
  el.addEventListener('touchmove', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', endMouse);
  el.addEventListener('mouseleave', cancel);
}

// ---------- יום הולדת עברי ----------
function hebDayMonth(dateStr){
  try{
    const o = {}; new Intl.DateTimeFormat('en-u-ca-hebrew', { day: 'numeric', month: 'long', timeZone: 'UTC' }).formatToParts(new Date(dateStr + 'T12:00:00Z')).forEach(p => { o[p.type] = p.value; });
    return o.day + ' ' + o.month.replace('Adar II', 'Adar').replace('Adar I', 'Adar');
  }catch(e){ return ''; }
}
function isHebrewBirthday(birthDate){ return !!birthDate && hebDayMonth(birthDate) === hebDayMonth(todayStr()); }
function maybeBirthdayGreeting(emp){
  if(!isHebrewBirthday(emp.birthDate)) return;
  const key = 'bday_' + emp.id + '_' + todayStr();
  try{ if(localStorage.getItem(key)) return; localStorage.setItem(key, '1'); }catch(e){}
  showConfirmModal(`🎉 מזל טוב, ${emp.name}! יום הולדת שמח ושנה טובה ומבורכת.`, { yes: 'תודה', danger: false, info: true });
}

          <div class="actions" style="justify-content:flex-start; gap:10px;">

            <button type="button" class="btn danger" id="detailDeleteBtn">מחיקה</button>
          </div>
        </div>

      document.getElementById('reqBackBtn').onclick = () => { view = 'list'; render(); };
      document.getElementById('detailBackBtn').onclick = () => { view = 'list'; render(); };
      document.getElementById('detailDeleteBtn').onclick = () => deleteRequest(r.id);
      const playVoiceBtn = document.getElementById('playVoiceBtn');
      if(playVoiceBtn) playVoiceBtn.onclick = async () => {
        playVoiceBtn.disabled = true;

    if(view === 'compose'){
      app.innerHTML = `
        <div class="card">
          <h3 style="margin-top:0;">✏️ הודעה חדשה למנהל</h3>
          <p class="hint" style="margin-top:-6px; font-size:13px;">כתוב/י כל בקשה חופשית — יציאה מוקדמת, החלפת משמרת, הערה כללית וכו'. אפשר גם טקסט, גם הודעה קולית, או שניהם.</p>

            <div style="margin-top:16px; padding:14px; background:var(--paper-alt); border-radius:10px;">
              <label style="margin-top:0; display:block; font-weight:600; margin-bottom:8px;">🎤 הודעה קולית (לא חובה)</label>
              ${recordedAudioUrl ? `

                  <button type="button" class="btn ghost small" id="deleteRecordingBtn">מחיקת ההקלטה</button>

                  ${mediaRecorder && mediaRecorder.state === 'recording' ? `<span class="mono pulse-dot" style="color:var(--danger); font-weight:600;">${String(Math.floor(recordingSeconds/60)).padStart(2,'0')}:${String(recordingSeconds%60).padStart(2,'0')} / 02:00</span>` : `<span class="hint" style="font-size:12.5px;">עד 2 דקות</span>`}

            </div>

            <div class="error-msg" id="requestErr" style="margin-top:6px;"></div>
            <div class="actions" style="justify-content:flex-start; margin-top:12px; gap:10px;">

        if(mediaRecorder && mediaRecorder.state === 'recording'){
          mediaRecorder.stop();
          return;
        }
        try{
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const chunks = [];
          mediaRecorder = new MediaRecorder(stream, { audioBitsPerSecond: 24000 });
          mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) chunks.push(e.data); };
          mediaRecorder.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            clearInterval(recordingTimerId);
            recordingTimerId = null;
            recordedAudioBlob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            recordedAudioUrl = URL.createObjectURL(recordedAudioBlob);
            recordingSeconds = 0;
            render();
          };
          mediaRecorder.start();
          recordingSeconds = 0;
          render();
          recordingTimerId = setInterval(() => {
            recordingSeconds++;
            if(recordingSeconds >= MAX_RECORDING_SECONDS){ mediaRecorder.stop(); return; }
            const timeEl = document.querySelector('#recordBtn')?.nextElementSibling;
            if(timeEl) timeEl.textContent = `${String(Math.floor(recordingSeconds/60)).padStart(2,'0')}:${String(recordingSeconds%60).padStart(2,'0')} / 02:00`;

            reader.readAsDataURL(recordedAudioBlob);
          });
          voiceMessageId = uid();
          const voiceOk = await saveVoiceMessage(voiceMessageId, audioDataUrl);

        });
        const ok = await saveRequests(fresh);

      };

          </div>

          ${managerWhatsapp ? '<button type="button" class="btn ghost" id="whatsappSendBtn">💬 שליחה בוואטסאפ</button>' : ''}
          <button type="button" class="btn ghost" id="cancelSendBtn">ביטול</button>
        </div>
      </div>

    const includePay = () => overlay.querySelector('#includePaySend').checked;

    const mailtoSendBtn = overlay.querySelector('#mailtoSendBtn');

      const body = buildHoursEmailBody(emp, month, entries, totalHours, pay, includePay());
      const mailtoUrl = `mailto:${managerEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.location.href = mailtoUrl;
      cleanup();
    };

    const whatsappSendBtn = overlay.querySelector('#whatsappSendBtn');
    if(whatsappSendBtn) whatsappSendBtn.onclick = () => {
      const body = buildHoursEmailBody(emp, month, entries, totalHours, pay, includePay());
      const phone = normalizePhoneForWhatsapp(managerWhatsapp);
      const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(subject + '\n\n' + body)}`;
      window.open(waUrl, '_blank');
      cleanup();

    if(canAutoSend){
      const autoBtn = overlay.querySelector('#autoSendBtn');
      const errEl = overlay.querySelector('#sendHoursErr');
      autoBtn.onclick = async () => {
        const senderSelect = overlay.querySelector('#senderSelect');
        const serviceId = fixedServiceId || (senderSelect ? senderSelect.value : null);
        const htmlBody = buildHoursEmailHtml(emp, month, entries, totalHours, pay, includePay());
        errEl.textContent = '';
        autoBtn.disabled = true;
        const originalLabel = autoBtn.textContent;
        autoBtn.textContent = 'שולח...';

            subject,

        }

    }
