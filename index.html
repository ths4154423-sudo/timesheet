  `;

  document.getElementById('logoutBtn').onclick = () => { stopLiveTimer(); stopLiveMoneyTimer(); stopClockFieldTimers(); stopBreakWatchdog(); state.currentEmployee = null; clearSession(); signOut(auth).catch(e => console.error('sign-out error', e)); renderLanding(); };
  document.getElementById('settingsBtn').onclick = () => renderEmployeeSettings(emp);
  if(staleOpen.length && !editingEntry && state._staleNoticeShown !== emp.id + todayStr()){
    state._staleNoticeShown = emp.id + todayStr();
    showStaleOpenNotice(emp, staleOpen);
  }
  const editGoalBtn = document.getElementById('editGoalBtn');
  if(editGoalBtn) editGoalBtn.onclick = () => renderEmployeeGoal(emp);
  // עדכון חי של פס היעד כל 30 שניות, כל עוד הוא מוצג
  if(state._goalTimer) clearInterval(state._goalTimer);
  state._goalTimer = setInterval(() => {
    const bar = document.getElementById('goalBar'), txt = document.getElementById('goalText');
    if(!bar || !txt){ clearInterval(state._goalTimer); state._goalTimer = null; return; }
    const goal = getDailyGoal(empSettings, emp);
    const pr = dailyGoalProgress(emp, goal, entries);
    bar.style.width = pr.pct + '%';
    bar.style.background = pr.done ? '#10B981' : 'var(--brass)';
    txt.innerHTML = goalTextHtml(pr, goal);
  }, 30000);

  // במצב עריכה אזור הסיכום לא מוצג, ולכן הרכיבים האלה לא קיימים. בלי הבדיקה הזו נזרקה כאן שגיאה,
  // שעצרה את המשך הפונקציה - ולכן כפתור "עדכון שינויים" בעריכה לא עשה כלום.
  checkEmpTasks(emp);
  refreshChatBadge('emp');
  startChatNotifier('emp');
  const readoutHoursEl = document.getElementById('readoutHours');
  if(readoutHoursEl) readoutHoursEl.textContent = fmtHours(totalHours);
  const readoutPayEl = document.getElementById('readoutPay');
  if(readoutPayEl) readoutPayEl.textContent = fmtMoney(pay);
  // תחזית לסוף החודש: לפי ממוצע ליום עבודה, כפול ימי העבודה (א'-ה') שנשארו – רק בחודש הנוכחי, לעובד שעתי
  const fcEl = document.getElementById('payForecast');
  if(fcEl && emp.payType === 'hourly' && month === currentMonthStr()){
    const worked = new Set(entries.filter(e => e && e.date && (computeEntryHours(e) || 0) > 0).map(e => e.date));
    if(worked.size >= 3 && pay > 0){
      const n = ilNow(), today = todayStr();
      const offs = new Set((getDaysOff(empSettings) || []).map(d => d && d.date));
      const last = new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate();
      let left = 0;
      for(let d = n.getDate(); d <= last; d++){
        const dt = new Date(n.getFullYear(), n.getMonth(), d), ds = month + '-' + String(d).padStart(2, '0');
        if(dt.getDay() > 4 || offs.has(ds)) continue;
        if(ds === today && entries.some(e => e && e.date === today)) continue;   // היום כבר נספר
        left++;
      }
      const forecast = Math.round(pay + (pay / worked.size) * left);
      fcEl.innerHTML = 'בקצב הנוכחי: <b>≈ ' + fmtMoney(forecast) + '</b> בסוף החודש';
      fcEl.style.display = '';
    }
  }
  const emailHoursBtn = document.getElementById('emailHoursBtn');
  if(emailHoursBtn){
    emailHoursBtn.onclick = async () => {
      const originalLabel = emailHoursBtn.textContent;
      emailHoursBtn.disabled = true;
      emailHoursBtn.textContent = 'מכין...';
      const [managerEmail, managerWhatsapp, emailjsConfig] = await Promise.all([loadManagerEmail(), loadManagerWhatsapp(), loadEmailjsConfig()]);
      emailHoursBtn.disabled = false;
      emailHoursBtn.textContent = originalLabel;
      if(!managerEmail && !managerWhatsapp){
        alert('לא הוגדרה כתובת אימייל או מספר וואטסאפ לקבלת דוחות שעות. יש לבקש מהמנהל להגדיר אותם במסך "הגדרות" שלו.');
        return;
      }
      await showSendHoursModal({ emp, month, entries, totalHours, pay, managerEmail, managerWhatsapp, emailjsConfig });
    };
  }
  const empMonthPicker = document.getElementById('empMonthPicker');
  if(empMonthPicker){
    empMonthPicker.onchange = (e) => {
      state._empMonth = e.target.value;
      renderEmployeeDashboard(emp, null, true);
    };
  }

  if(!editingEntry && openEntry){
    startLiveTimer(onBreak ? lastBreak.start : openEntry.start);
    startLiveMoneyTimer(emp, openEntry, onBreak, lastBreak);
    if(onBreak) startBreakWatchdog(emp);
  }

  // ---- clock-in ----
  const clockInForm = document.getElementById('clockInForm');
  bindLiveTimeField('clockInTime');
  if(clockInForm){
    clockInForm.onsubmit = async (e) => {
      e.preventDefault();
      const startTime = sanitizeTimeInput(document.getElementById('clockInTime').value);
      const errEl = document.getElementById('clockInErr');
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if(!startTime){ errEl.textContent = 'פורמט השעה לא תקין — השתמשו בכפתור "עכשיו" או הזינו בפורמט שעה:דקה'; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = 'שומר...';
      const fresh = await loadHours(emp.id);
      if(fresh === null){ errEl.textContent = 'שגיאה בטעינת הנתונים מהשרת — לא בוצע שינוי. נסה שוב.'; submitBtn.disabled=false; submitBtn.textContent='🟢 התחלת יום עבודה'; return; }
      const tm = currentMonthStr();
      if(!fresh[tm]) fresh[tm] = [];
      if(findOpenEntryToday(fresh[tm])){ errEl.textContent = 'כבר קיים יום עבודה פתוח להיום'; submitBtn.disabled=false; submitBtn.textContent='🟢 התחלת יום עבודה'; return; }
      // כבר עבד היום ויצא? פותחים מחדש את אותו יום, והזמן שבחוץ נרשם כהפסקה (שורה אחת ליום)
      const doneToday = fresh[tm].filter(x => x.date === todayStr() && x.end).sort((a, b) => String(a.end).localeCompare(String(b.end)));
      const lastDone = doneToday[doneToday.length - 1];
      if(lastDone){
        if(startTime <= lastDone.end){ errEl.textContent = 'שעת הכניסה צריכה להיות אחרי שעת היציאה הקודמת (' + hhmm(lastDone.end) + ').'; submitBtn.disabled=false; submitBtn.textContent='🟢 התחלת יום עבודה'; return; }
        if(!lastDone.breaks) lastDone.breaks = [];
        lastDone.breaks.push({ id: uid(), start: lastDone.end, end: startTime, type: 'pause' });
        lastDone.end = null;
      } else {
        fresh[tm].push({ id: uid(), date: todayStr(), start: startTime, end: null, breaks: [] });
      }
      const ok = await saveHours(emp.id, fresh);
      if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; submitBtn.disabled=false; submitBtn.textContent='🟢 התחלת יום עבודה'; return; }
      if(!(empSettings.muteOpeningAnnouncement ?? false)){
        playSuccessChime();
        speakHebrew(`${emp.name}, בוקר טוב, שיהיה בעזרת השם יום מוצלח`);
      }
      showToast('יום העבודה התחיל בהצלחה');
      if(month !== tm) state._empMonth = tm;
      renderEmployeeDashboard(emp, null, fresh);
      showDirataPopup();
    };
  }

  // ---- start break ----
  const startBreakBtn = document.getElementById('startBreakBtn');
  if(startBreakBtn){
    startBreakBtn.onclick = async () => {
      startBreakBtn.disabled = true;
      startBreakBtn.textContent = 'שומר...';
      const fresh = await loadHours(emp.id);
      if(fresh === null){ alert('שגיאה בטעינת הנתונים מהשרת — לא בוצע שינוי. נסה שוב.'); startBreakBtn.disabled=false; startBreakBtn.textContent='☕ התחלת הפסקה'; return; }
      const tm = currentMonthStr();
      const list = fresh[tm] || [];
      const entry = list.find(x => x.id === openEntry.id);
      if(entry){
        if(!entry.breaks) entry.breaks = [];
        entry.breaks.push({ id: uid(), start: nowTimeStr(), end: null });
      }
      const ok = await saveHours(emp.id, fresh);
      if(ok !== true){ alert('שגיאה בשמירה: ' + ok); startBreakBtn.disabled=false; startBreakBtn.textContent='☕ התחלת הפסקה'; return; }
      renderEmployeeDashboard(emp, null, fresh);
    };
  }

  // ---- end break / resume paused day ----
  const fixBreakEndBtn = document.getElementById('fixBreakEndBtn');
  if(fixBreakEndBtn && openEntry) fixBreakEndBtn.onclick = () => {
    state._editBreaksKey = null; // טוען מחדש את ההפסקות של היום לעריכה
    state._editingBreakId = '__open__';
    renderEmployeeDashboard(emp, openEntry.id, true);
    setTimeout(() => { const el = document.querySelector('[data-break-end]:placeholder-shown, [data-break-end][value=""]'); if(el){ el.focus(); try{ el.scrollIntoView({ block: 'center' }); }catch(_){} } }, 300);
  };
  const endBreakBtn = document.getElementById('endBreakBtn');
  if(endBreakBtn){
    const isPause = onBreak && lastBreak && lastBreak.type === 'pause';
    const restoreLabel = isPause ? '🔁 המשך יום עבודה' : '▶️ סיום הפסקה';
    endBreakBtn.onclick = async () => {
      endBreakBtn.disabled = true;
      endBreakBtn.textContent = 'שומר...';
      const fresh = await loadHours(emp.id);
      if(fresh === null){ alert('שגיאה בטעינת הנתונים מהשרת — לא בוצע שינוי. נסה שוב.'); endBreakBtn.disabled=false; endBreakBtn.textContent=restoreLabel; return; }
      const tm = currentMonthStr();
      const list = fresh[tm] || [];
      const entry = list.find(x => x.id === openEntry.id);
      if(entry && entry.breaks && entry.breaks.length){
        entry.breaks[entry.breaks.length - 1].end = nowTimeStr();
      }
      const ok = await saveHours(emp.id, fresh);
      if(ok !== true){ alert('שגיאה בשמירה: ' + ok); endBreakBtn.disabled=false; endBreakBtn.textContent=restoreLabel; return; }
      renderEmployeeDashboard(emp, null, fresh);
    };
  }

  // ---- pause the work day for now (functions just like a break, but flagged so the button reads "resume") ----
  const pauseDayBtn = document.getElementById('pauseDayBtn');
  if(pauseDayBtn){
    pauseDayBtn.onclick = async () => {
      pauseDayBtn.disabled = true;
      pauseDayBtn.textContent = 'שומר...';
      const fresh = await loadHours(emp.id);
      if(fresh === null){ alert('שגיאה בטעינת הנתונים מהשרת — לא בוצע שינוי. נסה שוב.'); pauseDayBtn.disabled=false; pauseDayBtn.textContent='⏸️ סיום יום עבודה בינתיים'; return; }
      const tm = currentMonthStr();
      const list = fresh[tm] || [];
      const entry = list.find(x => x.id === openEntry.id);
      if(entry){
        if(!entry.breaks) entry.breaks = [];
        entry.breaks.push({ id: uid(), start: nowTimeStr(), end: null, type: 'pause' });
      }
      const ok = await saveHours(emp.id, fresh);
      if(ok !== true){ alert('שגיאה בשמירה: ' + ok); pauseDayBtn.disabled=false; pauseDayBtn.textContent='⏸️ סיום יום עבודה בינתיים'; return; }
      renderEmployeeDashboard(emp, null, fresh);
    };
  }

  // ---- clock-out ----
  const clockOutForm = document.getElementById('clockOutForm');
  bindLiveTimeField('clockOutTime');
  if(clockOutForm){
    clockOutForm.onsubmit = async (e) => {
      e.preventDefault();
      const endTime = sanitizeTimeInput(document.getElementById('clockOutTime').value);
      const errEl = document.getElementById('clockOutErr');
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if(!endTime){ errEl.textContent = 'פורמט השעה לא תקין — השתמשו בכפתור "עכשיו" או הזינו בפורמט שעה:דקה'; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = 'שומר...';
      const fresh = await loadHours(emp.id);
      if(fresh === null){ errEl.textContent = 'שגיאה בטעינת הנתונים מהשרת — לא בוצע שינוי. נסה שוב.'; submitBtn.disabled=false; submitBtn.textContent='🔴 סיום יום עבודה'; return; }
      const tm = currentMonthStr();
      const list = fresh[tm] || [];
      const entry = list.find(x => x.id === openEntry.id);
      if(!entry){ errEl.textContent = 'הרישום לא נמצא, נסו לרענן'; submitBtn.disabled=false; submitBtn.textContent='🔴 סיום יום עבודה'; return; }
      const h = computeHoursFromRange(entry.start, endTime);
      if(h === null || h <= 0){ errEl.textContent = 'שעת הסיום חייבת להיות אחרי שעת ההתחלה'; submitBtn.disabled=false; submitBtn.textContent='🔴 סיום יום עבודה'; return; }
      // auto-close a dangling open break at clock-out time, just in case
      if(entry.breaks && entry.breaks.length && !entry.breaks[entry.breaks.length-1].end){
        entry.breaks[entry.breaks.length-1].end = endTime;
      }
      entry.end = endTime;
      const ok = await saveHours(emp.id, fresh);
      if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; submitBtn.disabled=false; submitBtn.textContent='🔴 סיום יום עבודה'; return; }
      if(!(empSettings.muteClosingAnnouncement ?? false)){
        playSuccessChime();
        speakHebrew(`${emp.name}, מעריכים אוֹתְךָ על העבודה, ערב טוב`);
      }
      showToast('יום העבודה הסתיים בהצלחה');
      if(!(empSettings.muteSalute ?? false)) showSaluteSplash();
      renderEmployeeDashboard(emp, null, fresh);
    };
  }

  // ---- excel import ----
  const excelFileInput = document.getElementById('excelFileInput');
  const excelErr = document.getElementById('excelErr');
  const excelPreviewArea = document.getElementById('excelPreviewArea');
  if(excelFileInput){
    excelFileInput.onchange = async () => {
      const file = excelFileInput.files[0];
      excelErr.textContent = '';
      excelPreviewArea.innerHTML = '';
      if(!file) return;
      excelPreviewArea.innerHTML = '<p class="hint">קורא את הקובץ...</p>';
      let parsed;
      try{
        parsed = await parseExcelFile(file);
      }catch(err){
        console.error('excel parse error', err);
        excelPreviewArea.innerHTML = '';
        excelErr.textContent = 'לא ניתן לקרוא את הקובץ — ודאו שזהו קובץ אקסל תקין (.xlsx)';
        return;
      }
      if(parsed.error){
        excelPreviewArea.innerHTML = '';
        excelErr.textContent = parsed.error;
        return;
      }
      const validRows = parsed.rows.filter(r => !r.error);
      const invalidRows = parsed.rows.filter(r => r.error);
      if(parsed.rows.length === 0){
        excelPreviewArea.innerHTML = '<p class="hint">לא נמצאו שורות נתונים בקובץ.</p>';
        return;
      }
      excelPreviewArea.innerHTML = `
        <p class="hint" style="margin-top:14px;">
          נמצאו <b style="color:#2F5233;">${validRows.length} רישומים תקינים</b>
          ${invalidRows.length ? ` ו-<b style="color:var(--danger);">${invalidRows.length} שורות עם שגיאה</b>` : ''}.
        </p>
        <div class="table-scroll" style="max-height:260px; overflow-y:auto;">
          <table>
            <thead><tr><th>שורה</th><th>תאריך</th><th>משעה</th><th>עד שעה</th><th>סה"כ שעות</th></tr></thead>
            <tbody>
              ${parsed.rows.map(r => `
                <tr style="${r.error ? 'color:var(--danger);' : ''}">
                  <td>${r.rowNum}</td>
                  <td class="mono">${r.date || '—'}</td>
                  <td class="mono">${r.start || '—'}</td>
                  <td class="mono">${r.end || '—'}</td>
                  <td class="mono">${r.error ? r.error : fmtHours(r.hours)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        <div class="actions" style="justify-content:flex-start; margin-top:14px;">
          <button type="button" class="btn brass" id="confirmExcelImport" ${validRows.length === 0 ? 'disabled' : ''}>ייבוא ${validRows.length} רישומים</button>
        </div>
      `;
      const confirmBtn = document.getElementById('confirmExcelImport');
      if(confirmBtn){
        confirmBtn.onclick = async () => {
          confirmBtn.disabled = true;
          confirmBtn.textContent = 'מייבא...';
          const fresh = await loadHours(emp.id);
          if(fresh === null){
            confirmBtn.disabled = false;
            confirmBtn.textContent = 'ייבוא ' + validRows.length + ' רישומים';
            excelErr.textContent = 'שגיאה בטעינת הנתונים מהשרת — לא בוצע ייבוא. נסה שוב.';
            return;
          }
          for(const r of validRows){
            const m = r.date.slice(0,7);
            if(!fresh[m]) fresh[m] = [];
            fresh[m].push({ id: uid(), date: r.date, start: r.start, end: r.end, breaks: [] });
          }
          const ok = await saveHours(emp.id, fresh);
          if(ok !== true){
            confirmBtn.disabled = false;
            confirmBtn.textContent = 'ייבוא ' + validRows.length + ' רישומים';
            excelErr.textContent = 'שגיאה בשמירה: ' + ok;
            return;
          }
          const lastMonth = validRows[validRows.length - 1].date.slice(0,7);
          state._empMonth = lastMonth;
          renderEmployeeDashboard(emp, null, fresh);
        };
      }
    };
  }


  const entriesToggleHeader = document.getElementById('entriesToggleHeader');
  if(entriesToggleHeader){
    entriesToggleHeader.onclick = () => { state._entriesPage = true; renderEmployeeDashboard(emp, null, true); window.scrollTo(0, 0); };
  }
  const excelToggleHeader = document.getElementById('excelToggleHeader');
  if(excelToggleHeader){
    excelToggleHeader.onclick = () => { state._excelOpen = !state._excelOpen; renderEmployeeDashboard(emp, null, true); };
  }
  const manualToggleHeader = document.getElementById('manualToggleHeader');
  if(manualToggleHeader && !editingEntry){
    manualToggleHeader.onclick = () => {
      state._manualOpen = !state._manualOpen;
      if(state._manualOpen){ state._editBreaks = []; state._editBreaksKey = 'new'; state._formDraft = null; state._editingBreakId = null; }
      renderEmployeeDashboard(emp, null, true);
    };
  }

  const dateInput = document.getElementById('hoursDate');
  const startInput = document.getElementById('hoursStart');
  const endInput = document.getElementById('hoursEnd');
  if(dateInput && startInput && endInput){
    const preview = document.getElementById('computedHoursPreview');
    function updatePreview(){
      // סה"כ אחרי ניכוי ההפסקות (כמו מה שבאמת נשמר)
      const gross = computeHoursFromRange(startInput.value, endInput.value);
      if(gross === null){ preview.textContent = ''; return; }
      const br = (state._editBreaks || []).reduce((sum, b) => sum + (b.end ? (computeHoursFromRange(hhmm(b.start), hhmm(b.end)) || 0) : 0), 0);
      const net = Math.max(0, Math.round((gross - br) * 100) / 100);
      preview.textContent = 'סה"כ: ' + fmtHours(net) + ' שעות' + (br > 0 ? ' (אחרי ניכוי הפסקות)' : '');
    }
    function saveDraft(){
      state._formDraft = { date: dateInput.value, start: startInput.value, end: endInput.value };
    }
    startInput.oninput = () => { updatePreview(); saveDraft(); };
    endInput.oninput = () => { updatePreview(); saveDraft(); };
    dateInput.oninput = saveDraft;
    updatePreview();
    dateInput.onchange = () => { saveDraft(); startInput.focus(); if(startInput.showPicker){ try{ startInput.showPicker(); }catch(e){} } };

    const cancelBtn = document.getElementById('cancelEditHours');
    if(cancelBtn) cancelBtn.onclick = () => {
      state._editBreaks = []; state._editBreaksKey = 'new'; state._formDraft = null; state._editingBreakId = null;
      renderEmployeeDashboard(emp, null, true);
    };

    const breakStartInput = document.getElementById('breakStart');
    const breakEndInput = document.getElementById('breakEnd');
    const addBreakBtn = document.getElementById('addBreakBtn');
    const breakErrEl = document.getElementById('addBreakErr');
    if(addBreakBtn){
      addBreakBtn.onclick = () => {
        saveDraft();
        const bStart = breakStartInput.value;
        const bEnd = breakEndInput.value;
        breakErrEl.textContent = '';
        const bHours = computeHoursFromRange(bStart, bEnd);
        if(!bStart || !bEnd || bHours === null || bHours <= 0){ breakErrEl.textContent = 'יש להזין שעת התחלה ושעת סיום תקינות להפסקה'; return; }
        if(!state._editBreaks) state._editBreaks = [];
        state._editBreaks.push({ id: uid(), start: bStart, end: bEnd });
        renderEmployeeDashboard(emp, editingEntry ? editingEntry.id : null, true);
      };
    }
    // עריכת שעות של הפסקה קיימת (גם הפסקה שנשארה פתוחה)
    const onBreakEdit = (id, field, value) => {
      const b = (state._editBreaks || []).find(x => x.id === id);
      if(!b) return;
      b[field] = value ? value : (field === 'end' ? null : b[field]);
      const cell = document.querySelector(`[data-break-total="${id}"]`);
      const h = b.end ? computeHoursFromRange(b.start, b.end) : null;
      if(cell) cell.textContent = h !== null && h > 0 ? fmtHours(Math.round(h * 100) / 100) + ' שעות' : '—';
      const pv = document.getElementById('hoursStart'); if(pv) pv.dispatchEvent(new Event('input')); // מרענן את הסה"כ של היום
    };
    document.querySelectorAll('[data-edit-break]').forEach(btn => { btn.onclick = () => { saveDraft(); state._editingBreakId = btn.dataset.editBreak; renderEmployeeDashboard(emp, editingEntry ? editingEntry.id : null, true); }; });
    document.querySelectorAll('[data-done-break]').forEach(btn => { btn.onclick = () => {
      const b = (state._editBreaks || []).find(x => x.id === btn.dataset.doneBreak);
      const errB = document.getElementById('addBreakErr');
      if(b && b.end){ const h = computeHoursFromRange(hhmm(b.start), hhmm(b.end)); if(h === null || h <= 0){ if(errB) errB.textContent = 'שעת סיום ההפסקה צריכה להיות אחרי שעת ההתחלה'; return; } }
      if(errB) errB.textContent = '';
      saveDraft(); state._editingBreakId = null; renderEmployeeDashboard(emp, editingEntry ? editingEntry.id : null, true);
    }; });
    document.querySelectorAll('[data-break-start]').forEach(inp => { inp.oninput = () => onBreakEdit(inp.dataset.breakStart, 'start', inp.value); });
    document.querySelectorAll('[data-break-end]').forEach(inp => { inp.oninput = () => onBreakEdit(inp.dataset.breakEnd, 'end', inp.value); });
    document.querySelectorAll('[data-del-break]').forEach(btn => {
      btn.onclick = () => {
        saveDraft();
        state._editBreaks = (state._editBreaks || []).filter(b => b.id !== btn.dataset.delBreak);
        renderEmployeeDashboard(emp, editingEntry ? editingEntry.id : null, true);
      };
    });

    document.getElementById('addHoursForm').onsubmit = async (e) => {
      e.preventDefault();
      const date = document.getElementById('hoursDate').value;
      const start = startInput.value;
      const end = endInput.value;
      const errEl = document.getElementById('addHoursErr');
      const fail = (msg) => { errEl.style.color = ''; errEl.textContent = msg; try{ errEl.scrollIntoView({ block:'center', behavior:'smooth' }); }catch(_){} };
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const hoursVal = computeHoursFromRange(start, end);
      if(!date || !start){ fail('יש להזין תאריך ושעת התחלה תקינים'); return; }
      if(end){
        if(hoursVal === null || hoursVal <= 0){ fail('שעת הסיום שהוזנה אינה תקינה'); return; }
        if(hoursVal > 24){ fail('טווח השעות ארוך מ-24 שעות, בדקו את השעות שהוזנו'); return; }
      } else if(!editingOpenEntry){
        fail('יש להזין תאריך, שעת התחלה ושעת סיום תקינים'); return;
      }
      const entryMonth = date.slice(0,7);
      const breaksToSave = (state._editBreaks || []).map(b => ({...b}));
      for(const b of breaksToSave){
        const bs = hhmm(b.start), be = b.end ? hhmm(b.end) : null;
        if(!bs){ fail('לאחת ההפסקות חסרה שעת התחלה'); return; }
        if(be){
          const bh = computeHoursFromRange(bs, be);
          if(bh === null || bh <= 0 || bh >= 12){ fail(`ההפסקה ${bs}–${be} אינה תקינה: שעת הסיום צריכה להיות אחרי שעת ההתחלה`); return; }
        } else if(end){ fail(`להפסקה שהתחילה ב-${bs} חסרה שעת סיום. יום שנסגר לא יכול להכיל הפסקה פתוחה.`); return; }
      }
      const openBreaks = breaksToSave.filter(b => !b.end);
      if(openBreaks.length > 1){ fail('יכולה להיות רק הפסקה פתוחה אחת. הזינו שעת סיום להפסקות הקודמות.'); return; }
      errEl.style.color = '';
      errEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'שומר...';
      const fresh = await loadHours(emp.id);
      if(fresh === null){
        submitBtn.disabled = false;
        submitBtn.textContent = editingEntry ? 'עדכון שינויים' : 'הוספה';
        errEl.textContent = 'שגיאה בטעינת הנתונים מהשרת — לא בוצע שינוי. נסה שוב.';
        return;
      }

      if(editingEntry){
        // remove the old entry from whichever month it was in (it may change if the date changed)
        const oldMonth = editingEntry.date.slice(0,7);
        if(fresh[oldMonth]) fresh[oldMonth] = fresh[oldMonth].filter(x => x.id !== editingEntry.id);
        if(!fresh[entryMonth]) fresh[entryMonth] = [];
        fresh[entryMonth].push({ id: editingEntry.id, date, start, end: end || null, breaks: breaksToSave });
      } else {
        if(!fresh[entryMonth]) fresh[entryMonth] = [];
        fresh[entryMonth].push({ id: uid(), date, start, end, breaks: breaksToSave });
      }

      const ok = await saveHours(emp.id, fresh);
      submitBtn.disabled = false;
      submitBtn.textContent = editingEntry ? 'עדכון שינויים' : 'הוספה';
      if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
      if(entryMonth !== month){ state._empMonth = entryMonth; }
      state._editBreaks = []; state._editBreaksKey = 'new'; state._formDraft = null; state._editingBreakId = null;
      renderEmployeeDashboard(emp, null, fresh);
    };
  }
  bindEntryRowButtons(emp, entries, month);
}


// כפתורי השורות בטבלת הרישומים (הצגה / עריכה / מחיקה) - משמש גם בדשבורד וגם בדף רישומי החודש
function bindEntryRowButtons(emp, entries, month){
  document.querySelectorAll('[data-view-entry]').forEach(btn => {
    btn.onclick = () => {
      const entry = entries.find(e => e.id === btn.dataset.viewEntry);
      if(entry) showDaySummaryModal(entry, emp);
    };
  });
  // חודש נעול: עובד לא נכנס בכלל לעריכה או מחיקה, אלא מקבל הודעה
  const lockedNotice = async () => {
    if(state.isAdmin) return false;
    const entryMonth = month;
    if(!(await loadLocks()).includes(entryMonth)) return false;
    showConfirmModal('החודש הזה נעול לעריכה ⚠️', { yes: 'הבנתי', danger: false, info: true });
    return true;
  };
  document.querySelectorAll('[data-edit-entry]').forEach(btn => {
    btn.onclick = async () => { if(await lockedNotice()) return; renderEmployeeDashboard(emp, btn.dataset.editEntry, true); };
  });
  document.querySelectorAll('[data-del-entry]').forEach(btn => {
    btn.onclick = async () => {
      if(await lockedNotice()) return;
      const confirmed = await showConfirmModal('האם אתה בטוח שברצונך למחוק?');
      if(!confirmed) return;
      const fresh = await loadHours(emp.id);
      if(fresh === null){ alert('שגיאה בטעינת הנתונים מהשרת — המחיקה בוטלה. נסה שוב.'); return; }
      fresh[month] = (fresh[month] || []).filter(e => e.id !== btn.dataset.delEntry);
      const ok = await saveHours(emp.id, fresh);
      if(ok !== true){ alert('שגיאה בשמירה: ' + ok); return; }
      renderEmployeeDashboard(emp, null, fresh);
    };
  });
}

// צבעי עמודות לפי הסכום שהורווח באותו יום
const PAY_COLOR_BANDS = [
  { max: 100, color: '#9CA3AF', label: 'עד 100 ₪' },
  { max: 150, color: '#60A5FA', label: '100–150 ₪' },
  { max: 200, color: '#F59E0B', label: '150–200 ₪' },
  { max: Infinity, color: '#10B981', label: 'מעל 200 ₪' }
];
function payBandColor(amount){
  return (PAY_COLOR_BANDS.find(b => amount <= b.max) || PAY_COLOR_BANDS[PAY_COLOR_BANDS.length - 1]).color;
}

// ימים מיוחדים בגרף היומי: שישי, שבת, חגים וערבי חג (לפי הלוח העברי, כמנהג ארץ ישראל)
const HEB_SPECIAL_DAYS = {
  'Elul-29': 'ערב ראש השנה',
  'Tishri-1': 'ראש השנה', 'Tishri-2': 'ראש השנה',
  'Tishri-9': 'ערב יום הכיפורים', 'Tishri-10': 'יום הכיפורים',
  'Tishri-14': 'ערב סוכות', 'Tishri-15': 'סוכות',
  'Tishri-16': 'חול המועד', 'Tishri-17': 'חול המועד', 'Tishri-18': 'חול המועד', 'Tishri-19': 'חול המועד', 'Tishri-20': 'חול המועד',
  'Tishri-21': 'הושענא רבה', 'Tishri-22': 'שמחת תורה',
  'Adar-14': 'פורים', 'Adar II-14': 'פורים', 'Adar-15': 'שושן פורים', 'Adar II-15': 'שושן פורים',
  'Nisan-14': 'ערב פסח', 'Nisan-15': 'פסח',
  'Nisan-16': 'חול המועד', 'Nisan-17': 'חול המועד', 'Nisan-18': 'חול המועד', 'Nisan-19': 'חול המועד',
  'Nisan-20': 'ערב שביעי של פסח', 'Nisan-21': 'שביעי של פסח',
  'Sivan-5': 'ערב שבועות', 'Sivan-6': 'שבועות',
  'Av-9': 'תשעה באב'
};
let _hebFmt = null;
function specialDayLabel(yy, mm, dd){
  const dt = new Date(yy, mm - 1, dd, 12);
  const wd = dt.getDay();
  let holiday = null;
  try{
    if(!_hebFmt) _hebFmt = new Intl.DateTimeFormat('en-u-ca-hebrew', { day: 'numeric', month: 'long' });
    const parts = _hebFmt.formatToParts(dt);
    const hd = Number(parts.find(p => p.type === 'day').value);
    const hm = parts.find(p => p.type === 'month').value;
    holiday = HEB_SPECIAL_DAYS[hm + '-' + hd] || null;
    if(hm === 'Av' && hd === 9 && wd === 6) holiday = null;          // תשעה באב שחל בשבת נדחה...
    if(hm === 'Av' && hd === 10 && wd === 0) holiday = 'תשעה באב';    // ...ליום ראשון
  }catch(e){}
  if(holiday) return { text: holiday, kind: 'holiday' };
  if(wd === 6) return { text: 'שבת', kind: 'weekend' };
  if(wd === 5) return { text: 'שישי', kind: 'weekend' };
  return null;
}
const SPECIAL_DAY_STYLE = {
  weekend: { band: 'rgba(100,116,139,.14)', text: '#475569' },
  holiday: { band: 'rgba(139,92,246,.17)', text: '#6D28D9' },
  vacation: { band: 'rgba(20,184,166,.17)', text: '#0F766E' },
  sick: { band: 'rgba(244,114,182,.18)', text: '#BE185D' }
};
// פלאגין של Chart.js: צובע ברקע את כל הטור של יום מיוחד, וכותב את שם היום לאורך כל הטור, מלמעלה למטה.
// הרשימה מועברת דרך closure ולא דרך options, כי Chart.js מעבד מערכים ב-options בצורה שמשבשת אותם.
function makeSpecialDaysPlugin(days){
  return {
    id: 'specialDays',
    beforeDatasetsDraw(chart){
      const { ctx, chartArea, scales: { x } } = chart;
      const n = chart.data.labels.length; if(!n) return;
      const colW = (chartArea.right - chartArea.left) / n;
      const colH = chartArea.bottom - chartArea.top;
      days.forEach((d, i) => {
        if(!d) return;
        const st = SPECIAL_DAY_STYLE[d.kind]; if(!st) return;
        const cx = x.getPixelForValue(i);
        ctx.save();
        ctx.fillStyle = st.band;
        ctx.fillRect(cx - colW / 2, chartArea.top, colW, colH);
        // הטקסט: המילה כולה מסובבת לאורך הטור, כך שגם האותיות עצמן עומדות על הצד ונקראות מלמעלה למטה
        let fontSize = Math.max(10, Math.min(14, colW * 0.62));
        const fontFamily = "'Heebo', 'Segoe UI', Arial, sans-serif";
        ctx.font = '600 ' + fontSize + 'px ' + fontFamily;
        let w = ctx.measureText(d.text).width;
        const maxLen = colH * 0.9;
        if(w > maxLen){ fontSize = Math.max(8, fontSize * maxLen / w); ctx.font = '600 ' + fontSize + 'px ' + fontFamily; w = ctx.measureText(d.text).width; }
        ctx.translate(cx, chartArea.top + colH / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillStyle = st.text;
        ctx.globalAlpha = 0.85;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.direction = 'rtl';
        if('letterSpacing' in ctx) ctx.letterSpacing = '1px';
        ctx.fillText(d.text, 0, 0);
        ctx.restore();
      });
    }
  };
}

// פלאגין: קו מקווקו של היעד היומי לרוחב הגרף
function makeGoalLinePlugin(goalHours){
  return {
    id: 'goalLine',
    afterDatasetsDraw(chart){
      if(!goalHours) return;
      const { ctx, chartArea, scales: { y } } = chart;
      const py = y.getPixelForValue(goalHours);
      if(py < chartArea.top || py > chartArea.bottom) return;
      ctx.save();
      ctx.strokeStyle = '#DC2626'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
      ctx.beginPath(); ctx.moveTo(chartArea.left, py); ctx.lineTo(chartArea.right, py); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#DC2626'; ctx.font = "600 11px 'Heebo', Arial, sans-serif";
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText('🎯 יעד', chartArea.left + 4, py - 3);
      ctx.restore();
    }
  };
}

// גרף עמודות: סה"כ שעות לכל יום בחודש. צבע העמודה לפי הסכום היומי (בשכר שעתי).
function renderDailyHoursChart(entries, yy, mm, daysInMonth, rate, monthDaysOff, goalHours){
  const canvas = document.getElementById('dailyHoursChart');
  if(!canvas || typeof Chart === 'undefined') return;
  if(state._dailyChart){ try{ state._dailyChart.destroy(); }catch(e){} }
  const perDay = new Array(daysInMonth).fill(0);
  entries.forEach(e => {
    const h = computeEntryHours(e);
    const d = Number(String(e.date).slice(8, 10));
    if(h !== null && d >= 1 && d <= daysInMonth) perDay[d - 1] += h;
  });
  const labels = perDay.map((_, i) => String(i + 1));
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--brass').trim() || '#5FBF8F';
  const colors = perDay.map(h => rate != null ? payBandColor(h * rate) : accent);
  const monthKey = yy + '-' + String(mm).padStart(2, '0');
  // יום שישי שעבדו בו מוצג כיום רגיל (בלי רקע ובלי כיתוב)
  const offByDay = {};
  (monthDaysOff || []).forEach(d => { offByDay[Number(d.date.slice(8, 10))] = d; });
  const specialDays = perDay.map((h, i) => {
    const off = offByDay[i + 1];
    if(off) return { text: DAY_OFF_TYPES[off.type].label, kind: off.type };
    const sd = specialDayLabel(yy, mm, i + 1);
    if(sd && sd.text === 'שישי' && h > 0) return null;
    return sd;
  });
  const type = getChartType('daily');
  const values = perDay.map(v => Math.round(v * 100) / 100);
  const dataset = type === 'line'
    // גרף קו: מחבר רק ימים שעבדו בהם, כל נקודה בצבע לפי הסכום היומי
    ? { label: 'שעות', data: values.map(v => v > 0 ? v : null), spanGaps: true, borderColor: accent, borderWidth: 2.5, tension: 0.3, cubicInterpolationMode: 'monotone',
        fill: true, backgroundColor: hexToRgba(accent, 0.12), pointBackgroundColor: colors, pointBorderColor: '#fff', pointBorderWidth: 1.5, pointRadius: 5, pointHoverRadius: 7 }
    : { label: 'שעות', data: values, backgroundColor: colors, borderRadius: 4 };
  state._dailyChart = new Chart(canvas, {
    type,
    plugins: [makeSpecialDaysPlugin(specialDays), makeGoalLinePlugin(goalHours)],
    data: { labels, datasets: [dataset] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          title: (items) => items[0].label + ' ב' + monthLabel(monthKey) + (specialDays[items[0].dataIndex] ? ' · ' + specialDays[items[0].dataIndex].text : ''),
          label: (item) => {
            const lines = [fmtHours(item.raw) + ' שעות'];
            if(rate != null) lines.push(fmtMoney(item.raw * rate));
            return lines;
          }
        } }
      },
      scales: { y: { beginAtZero: true, suggestedMax: goalHours ? Math.ceil(goalHours * 1.15) : undefined, title: { display: true, text: 'שעות' } }, x: { grid: { display: false }, title: { display: true, text: 'יום בחודש' } } }
    }
  });
}

// סוג הגרף שנבחר, נשמר במכשיר. יומי: bar / line. חודשי: pie / bar / line.
const CHART_TYPES = { daily: { allowed: ['bar', 'line'], def: 'bar' }, monthly: { allowed: ['pie', 'bar', 'line'], def: 'pie' } };
function getChartType(kind){
  const cfg = CHART_TYPES[kind];
  try{ const v = localStorage.getItem(kind + 'ChartType'); return cfg.allowed.includes(v) ? v : cfg.def; }catch(e){ return cfg.def; }
}
function setChartType(kind, type){
  try{ localStorage.setItem(kind + 'ChartType', type); }catch(e){}
}
function hexToRgba(color, alpha){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(color).trim());
  if(!m) return 'rgba(95,191,143,' + alpha + ')';
  const n = parseInt(m[1], 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
}
function chartTypeBtn(kind, type, label, current){
  return `<button type="button" class="btn ${current === type ? 'brass' : 'ghost'} small" data-chart-kind="${kind}" data-chart-type="${type}">${label}</button>`;
}
// פלאגין: כותב על כל פרוסה בעוגה את שם החודש והסכום, בלי צורך במעבר עכבר
function makePieLabelsPlugin(names, amounts){
  return {
    id: 'pieLabels',
    afterDatasetsDraw(chart){
      const meta = chart.getDatasetMeta(0); if(!meta || !meta.data) return;
      const { ctx } = chart;
      meta.data.forEach((arc, i) => {
        const angle = arc.endAngle - arc.startAngle;
        if(angle < 0.28) return; // פרוסה קטנה מדי - השם מופיע במקרא שמתחת
        const pos = arc.tooltipPosition();
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(0,0,0,.45)';
        ctx.shadowBlur = 3;
        ctx.font = '600 12px Heebo, Arial, sans-serif';
        ctx.fillText(names[i], pos.x, pos.y - 8);
        ctx.font = '700 13px Heebo, Arial, sans-serif';
        ctx.fillText(amounts[i], pos.x, pos.y + 9);
        ctx.restore();
      });
    }
  };
}
const MONTH_SLICE_COLORS = ['#60A5FA','#F59E0B','#10B981','#F472B6','#A78BFA','#F87171','#34D399','#FBBF24','#38BDF8','#FB923C','#818CF8','#4ADE80'];

// גרף 12 החודשים האחרונים (עד החודש הנוכחי), לפי סכום בשקלים. לא תלוי בחודש שנבחר בדף.
function renderMonthlyChart(emp, hoursData){
  const canvas = document.getElementById('monthlyChart');
  if(!canvas || typeof Chart === 'undefined') return;
  if(state._monthlyChart){ try{ state._monthlyChart.destroy(); }catch(e){} }
  const now = ilNow();
  const keys = [];
  for(let i = 11; i >= 0; i--){
    const dt = new Date(now.getFullYear(), now.getMonth() - i, 1);
    keys.push(dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0'));
  }
  const hours = keys.map(k => (hoursData[k] || []).reduce((sum, e) => { const h = computeEntryHours(e); return sum + (h !== null ? h : 0); }, 0));
  const pays = hours.map(h => h > 0 ? Math.round(calcPay(emp, h) * 100) / 100 : 0);
  const type = getChartType('monthly');
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--brass').trim() || '#5FBF8F';

  if(type === 'pie'){
    // בעוגה מציגים רק חודשים שיש בהם סכום (לפרוסה של 0 אין גודל)
    const idx = keys.map((_, i) => i).filter(i => pays[i] > 0);
    state._monthlyChart = new Chart(canvas, {
      type: 'pie',
      plugins: [makePieLabelsPlugin(idx.map(i => monthLabel(keys[i]).split(' ')[0]), idx.map(i => fmtMoney(pays[i])))],
      data: {
        labels: idx.map(i => monthLabel(keys[i])),
        datasets: [{ data: idx.map(i => pays[i]), backgroundColor: idx.map(i => MONTH_SLICE_COLORS[i % MONTH_SLICE_COLORS.length]), borderWidth: 2 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: { callbacks: { label: (item) => ' ' + fmtMoney(item.raw) } }
        }
      }
    });
    return;
  }

  const labels = keys.map(k => { const [y, m] = k.split('-'); return m + '/' + y.slice(2); });
  const dataset = type === 'line'
    ? { label: '₪', data: pays, borderColor: accent, borderWidth: 2.5, tension: 0.3, cubicInterpolationMode: 'monotone', fill: true, backgroundColor: hexToRgba(accent, 0.12),
        pointBackgroundColor: accent, pointBorderColor: '#fff', pointBorderWidth: 1.5, pointRadius: 5, pointHoverRadius: 7 }
    : { label: '₪', data: pays, backgroundColor: accent, borderRadius: 4 };
  state._monthlyChart = new Chart(canvas, {
    type,
    data: { labels, datasets: [dataset] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          title: (items) => monthLabel(keys[items[0].dataIndex]),
          label: (item) => fmtMoney(item.raw)
        } }
      },
      scales: { y: { beginAtZero: true }, x: { grid: { display: false } } }
    }
  });
}

          <span style="flex:1;"><span style="display:block; font-weight:600;">צינתוק תזכורת</span><span class="hint" style="display:block; margin-top:2px; font-size:13px;">שעות הצינתוק לכניסה וליציאה, ימים והשתקה</span></span>
          <span style="opacity:.55; font-size:20px; line-height:24px;">‹</span>

  async function persistSetting(key, value){
    const errEl = document.getElementById('settingsErr');
    const savedMsg = document.getElementById('settingsSavedMsg');
    savedMsg.style.display = 'none';
    errEl.textContent = '';
    const updated = { ...settings, [key]: value };
    const ok = await saveSettings(emp.id, updated);
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return false; }
    state._settingsCache = { empId: emp.id, settings: updated };
    settings[key] = value;
    savedMsg.style.display = 'block';
    showToast('ההגדרה נשמרה');
    setTimeout(() => { const m = document.getElementById('settingsSavedMsg'); if(m) m.style.display = 'none'; }, 2000);
    return true;
  }

  function syncAutoTextPreview(liveBg){
    const textDef = defs.find(d => d.type === 'auto-color');
    if(!textDef) return;
    const autoCheckbox = document.getElementById('auto_' + textDef.key);
    const textField = document.getElementById('setting_' + textDef.key);
    if(autoCheckbox && autoCheckbox.checked && textField){
      textField.value = getContrastTextColor(liveBg || settings.bgColor || DEFAULT_BG_COLOR);
    }
  }

  defs.forEach(def => {
    const field = document.getElementById('setting_' + def.key);
    if(!field) return;

    if(def.type === 'color'){
      field.oninput = () => {
        applyEmployeeTheme({ ...settings, [def.key]: field.value });
        if(def.key === 'bgColor') syncAutoTextPreview(field.value);
      };
      field.onchange = async () => {
        field.disabled = true;
        const ok = await persistSetting(def.key, field.value);
        field.disabled = false;
        if(!ok){ field.value = settings[def.key] ?? def.default; applyEmployeeTheme(settings); return; }
        if(def.key === 'bgColor') syncAutoTextPreview();
      };
      const resetBtn = document.getElementById('reset_' + def.key);
      if(resetBtn){
        resetBtn.onclick = async () => {
          field.value = def.default;
          applyEmployeeTheme({ ...settings, [def.key]: def.default });
          if(def.key === 'bgColor') syncAutoTextPreview(def.default);
          resetBtn.disabled = true;
          await persistSetting(def.key, def.default);
          resetBtn.disabled = false;
        };
      }
    } else if(def.type === 'auto-color'){
      const autoCheckbox = document.getElementById('auto_' + def.key);
      field.oninput = () => {
        if(autoCheckbox.checked) return;
        applyEmployeeTheme({ ...settings, [def.key]: field.value });
      };
      field.onchange = async () => {
        if(autoCheckbox.checked) return;
        field.disabled = true;
        const ok = await persistSetting(def.key, field.value);
        field.disabled = false;
        if(!ok){ field.value = settings[def.key] || getContrastTextColor(settings.bgColor || DEFAULT_BG_COLOR); applyEmployeeTheme(settings); }
      };
      autoCheckbox.onchange = async () => {
        autoCheckbox.disabled = true;
        field.disabled = true;
        if(autoCheckbox.checked){
          const ok = await persistSetting(def.key, null);
          autoCheckbox.disabled = false;
          if(!ok){ autoCheckbox.checked = false; field.disabled = false; return; }
          field.value = getContrastTextColor(settings.bgColor || DEFAULT_BG_COLOR);
          applyEmployeeTheme(settings);
        } else {
          const ok = await persistSetting(def.key, field.value);
          autoCheckbox.disabled = false;
          field.disabled = false;
          if(!ok){ autoCheckbox.checked = true; field.disabled = true; return; }
          applyEmployeeTheme(settings);
        }
      };
    } else {
      field.onchange = async () => {
        field.disabled = true;
        const ok = await persistSetting(def.key, field.checked);
        field.disabled = false;
        if(!ok) field.checked = !field.checked;
      };
    }
  });
}

// ---------- משימות יומיות: המנהל מוסיף, העובד מסמן שסיים (tasks/<מזהה עובד>) ----------
async function loadTasks(empId){
  try{
    const snap = await withTimeout(getDoc(doc(db, 'tasks', empId)), 20000, 'loadTasks');
    return snap.exists() ? (snap.data().items || []) : [];
  }catch(e){ console.error('loadTasks error', e); return null; }
}
async function saveTasks(empId, items){
  return saveDoc(() => setDoc(doc(db, 'tasks', empId), { items }), 'saveTasks');
}
function dowOf(ds){ const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d).getDay(); }
function tasksForDate(items, ds){
  return (items || []).filter(t => t && (
    t.nodate ? (!t.done || String(t.doneAt || '').slice(0, 10) === ds)
    : t.repeat ? (ds >= (t.from || '') && dowOf(ds) <= 4)
    : t.date === ds));
}
function taskDone(t, ds){ return t.repeat ? (t.doneDates || []).includes(ds) : !!t.done; }
function setTaskDone(t, ds, v){
  if(t.repeat){
    const set = new Set(t.doneDates || []); v ? set.add(ds) : set.delete(ds);
    t.doneDates = [...set].sort().slice(-60);   // שומרים רק את החודשיים האחרונים
  } else { t.done = v; t.doneAt = v ? todayStr() + 'T' + nowTimeStr() : null; }
}

// כשהעובד נכנס: מעדכנים את המספר על כפתור "משימות", ופעם אחת ביום קופצת הודעה אם יש משימות פתוחות להיום
// תזכורת על משימה בשעה שהמנהל קבע – כל עוד האתר פתוח אצל העובד (בנוסף לצינתוק מהקו)
function startTaskReminderTimer(emp){
  if(state._taskRemTimer) clearInterval(state._taskRemTimer);
  const tick = async () => {
    if(!state.currentEmployee || state.currentEmployee.id !== emp.id){ clearInterval(state._taskRemTimer); return; }
    const now = nowTimeStr().slice(0, 5), today = todayStr();
    const items = await loadTasks(emp.id); if(!items) return;
    tasksForDate(items, today).filter(t => t.remindAt && !taskDone(t, today) && t.remindAt <= now).forEach(t => {
      const k = 'taskRem:' + t.id + ':' + today; let seen = false; try{ seen = localStorage.getItem(k) === '1'; }catch(e){}
      if(seen) return; try{ localStorage.setItem(k, '1'); }catch(e){}

}
async function checkEmpTasks(emp){

  const today = todayStr();
  const open = tasksForDate(items, today).filter(t => !taskDone(t, today)).length;
  const answers = unseenCount(items, 'emp');

  if(badge) badge.textContent = (open + answers) ? String(open + answers) : '';
  if(answers){
    const k2 = 'tasksAns:' + emp.id + ':' + answers;

    if(!sh){ try{ sessionStorage.setItem(k2, '1'); }catch(e){}
      if(await showConfirmModal('יש לך תשובה חדשה מהמנהל על משימה', { yes: 'הצגה', no: 'אחר כך', danger: false })){ renderEmployeeTasks(emp); return; } }

// סיכום חודשי של המשימות לכל עובד: כמה קיבל, כמה ביצע
function taskMonthStats(items, ym){
  const today = todayStr(), [y, m] = ym.split('-').map(Number), last = new Date(y, m, 0).getDate();
  let total = 0, done = 0;
  (items || []).forEach(t => {
    if(!t) return;
    if(t.repeat){
      for(let d = 1; d <= last; d++){
        const ds = ym + '-' + String(d).padStart(2, '0');
        if(ds < (t.from || '') || ds > today || dowOf(ds) > 4) continue;
        total++; if((t.doneDates || []).includes(ds)) done++;
      }
    } else if(t.nodate){ if(String(t.created || '').slice(0, 7) === ym || (t.done && String(t.doneAt || '').slice(0, 7) === ym)){ total++; if(t.done) done++; } }
    else if(String(t.date || '').slice(0, 7) === ym && t.date <= today){ total++; if(t.done) done++; }
  });
  return { total, done };
}

    const d = at.slice(0, 10), tm = at.length > 15 ? at.slice(11, 16) : '';
    // הקלטות מהקו נשמרות בשעון UTC (ISO עם Z) – ממירים לשעון ישראל
    if(/Z$/.test(at)){ try{ const x = new Date(at); return x.toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem', hour: '2-digit', minute: '2-digit', day: x.toISOString().slice(0,10) === todayStr() ? undefined : '2-digit', month: x.toISOString().slice(0,10) === todayStr() ? undefined : '2-digit' }); }catch(e){ return ''; } }
    return (d === todayStr() ? '' : d.split('-').reverse().slice(0, 2).join('/') + ' ') + tm;
  };
  const mine = r => r.from === viewer;
  const unseen = reps.filter(r => r.from !== viewer && !r[viewer === 'emp' ? 'seenEmp' : 'seenMgr']).length;
  const open = !!(state._openThreads && state._openThreads.has(t.id));

    <div class="wa-thread"><button type="button" class="wa-toggle${unseen ? ' unread' : ''}" data-thread-toggle="${t.id}">💬 ${reps.length === 1 ? 'הודעה אחת' : reps.length + ' הודעות'}${unseen ? ` · ${unseen} ${unseen === 1 ? 'חדשה' : 'חדשות'}` : ''} ‹</button></div>`;
  return `
    <div class="wa-thread" data-reps-for="${t.id}">
      ${reps.length ? `<button type="button" class="wa-toggle open" data-thread-toggle="${t.id}">💬 ${reps.length === 1 ? 'הודעה אחת' : reps.length + ' הודעות'} · סגירה ⌄</button>` : ''}
      ${reps.length ? `<div class="wa-chat">
        ${reps.map(r => `
          <div class="wa-row ${mine(r) ? 'out' : 'in'}">
            <div class="wa-bubble">
              ${mine(r) ? '' : `<div class="wa-name">${r.from === 'mgr' ? 'המנהל' : 'העובד'}</div>`}
              ${r.fileId ? (/^image\//.test(r.fileType || '') ? `<img class="wa-img" data-file-img="${r.fileId}" alt="${escapeHtml(r.fileName || 'תמונה')}" />` : `<button type="button" class="wa-file" data-file-open="${r.fileId}" data-file-name="${escapeHtml(r.fileName || 'קובץ')}">📄 ${escapeHtml(r.fileName || 'קובץ')}</button>`) : ''}
              ${r.text ? `<div class="wa-text">${linkify(r.text)}</div>` : ''}
              ${(r.voice || r.audioId) ? `<button type="button" class="wa-voice" data-play="${t.id}" data-pemp="${empId}" data-reply="${r.id}"${r.audioId ? ` data-audio="${r.audioId}"` : ''}>▶ הודעה קולית</button>` : ''}
              <span class="wa-time">${when(r)}${mine(r) ? ` <span class="wa-ticks${r[viewer === 'emp' ? 'seenMgr' : 'seenEmp'] ? ' seen' : ''}">✓✓</span>` : ''}</span>
            </div>
          </div>`).join('')}
        <div class="wa-row in wa-typing" data-typing-for="${t.id}" hidden><div class="wa-bubble"><span class="wa-dots"><i></i><i></i><i></i></span> <span class="wa-typing-txt"></span></div></div>
      </div>` : `<div class="wa-row in wa-typing solo" data-typing-for="${t.id}" hidden><div class="wa-bubble"><span class="wa-dots"><i></i><i></i><i></i></span> <span class="wa-typing-txt"></span></div></div>`}
      ${reps.length || open ? '' : `<button type="button" class="task-reply-open" data-thread-toggle="${t.id}">💬 ${viewer === 'emp' ? 'תגובה למנהל' : 'תשובה לעובד'}</button>`}
      <div class="wa-compose" data-reply-box="${t.id}"${reps.length || open ? '' : ' hidden'}>
        <textarea rows="1" maxlength="500" placeholder="הקלד הודעה"></textarea>

        <button type="button" class="wa-btn send" data-reply-send="${t.id}" title="שליחה" aria-label="שליחה">➤</button>
        <button type="button" class="wa-btn mic" data-reply-rec="${t.id}" title="הקלטה" aria-label="הקלטה">🎙</button>

// מקטין תמונה לפני העלאה (עד 1280 פיקסלים, JPEG), כדי שתיכנס במסמך אחד
function shrinkImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 2048, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = 0.88, out = c.toDataURL('image/jpeg', q);
      while(out.length > 900000 && q > 0.45){ q -= 0.08; out = c.toDataURL('image/jpeg', q); }
      // אם עדיין גדולה מדי – מקטינים את הרזולוציה בהדרגה (עדיף חדה וקטנה יותר מאשר מטושטשת)
      let w = c.width, h = c.height;
      while(out.length > 900000 && w > 900){ w = Math.round(w * 0.8); h = Math.round(h * 0.8); const c2 = document.createElement('canvas'); c2.width = w; c2.height = h; c2.getContext('2d').drawImage(c, 0, 0, w, h); out = c2.toDataURL('image/jpeg', 0.8); }
      resolve(out);
    };
    img.onerror = reject; img.src = url;
  });
}

// תמונה בגדול באותו חלון (כמו בוואטסאפ); סוגרים בלחיצה, ב-✕ או ב-Esc
// תצוגת תמונה בגדול, עם זום: גלגלת עכבר, צביטה בטלפון, לחיצה כפולה, גרירה, וכפתורי + / −
function openLightbox(src, name, gallery){
  const ov = document.createElement('div');
  ov.className = 'wa-lightbox';
  ov.innerHTML = `<div class="wa-lb-bar"><button type="button" class="wa-lb-btn" data-lb-close aria-label="סגירה">✕</button><span class="wa-lb-name"></span>
      <button type="button" class="wa-lb-btn" data-z="out" aria-label="הקטנה">−</button><span class="wa-lb-pct">100%</span><button type="button" class="wa-lb-btn" data-z="in" aria-label="הגדלה">+</button>
      <a class="wa-lb-btn" download aria-label="הורדה">⬇</a></div>
    <div class="wa-lb-stage"><img alt="" draggable="false" /></div>
    ${gallery && gallery.ids.length > 1 ? '<button type="button" class="wa-lb-nav prev" aria-label="הקודמת">‹</button><button type="button" class="wa-lb-nav next" aria-label="הבאה">›</button><div class="wa-lb-count" dir="ltr"></div>' : ''}`;
  const img = ov.querySelector('img'), stage = ov.querySelector('.wa-lb-stage'), pct = ov.querySelector('.wa-lb-pct');
  img.src = src;
  ov.querySelector('.wa-lb-name').textContent = name || '';
  const a = ov.querySelector('a'); a.href = src; a.download = name || 'image.jpg';
  let z = 1, x = 0, y = 0, drag = null;
  // גבולות הגרירה: קצה התמונה המוגדלת לא נכנס פנימה מקצה המסך (כמו בוואטסאפ), וכשהיא קטנה מהמסך היא נשארת במרכז
  const clamp = () => {
    const sw = stage.clientWidth, sh = stage.clientHeight, nw = img.naturalWidth || sw, nh = img.naturalHeight || sh;
    const fit = Math.min(img.clientWidth / nw, img.clientHeight / nh);
    const pw = nw * fit * z, ph = nh * fit * z;
    const mx = Math.max(0, (pw - sw) / 2), my = Math.max(0, (ph - sh) / 2);
    x = Math.min(mx, Math.max(-mx, x)); y = Math.min(my, Math.max(-my, y));
  };
  const apply = () => { z = Math.min(8, Math.max(1, z)); if(z === 1){ x = 0; y = 0; } else clamp(); img.style.transform = `translate(${x}px, ${y}px) scale(${z})`; img.style.cursor = z > 1 ? (drag ? 'grabbing' : 'grab') : 'zoom-in'; pct.textContent = Math.round(z * 100) + '%'; };
  const zoomAt = (nz, cx, cy) => { const r = stage.getBoundingClientRect(); const ox = cx - r.left - r.width / 2, oy = cy - r.top - r.height / 2; const k = Math.min(8, Math.max(1, nz)) / z; x = ox - (ox - x) * k; y = oy - (oy - y) * k; z = Math.min(8, Math.max(1, nz)); apply(); };
  const center = () => { const r = stage.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  ov.querySelector('[data-z=in]').onclick = e => { e.stopPropagation(); zoomAt(z * 1.5, ...center()); };
  ov.querySelector('[data-z=out]').onclick = e => { e.stopPropagation(); zoomAt(z / 1.5, ...center()); };
  stage.addEventListener('wheel', e => { e.preventDefault(); zoomAt(z * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY); }, { passive: false });
  img.addEventListener('dblclick', e => { e.stopPropagation(); zoomAt(z > 1 ? 1 : 2.5, e.clientX, e.clientY); });
  // גרירה בעכבר
  let moved = false;
  img.addEventListener('mousedown', e => { if(z <= 1) return; e.preventDefault(); drag = { sx: e.clientX - x, sy: e.clientY - y }; moved = false; img.style.cursor = 'grabbing'; });
  const onMove = e => { if(!drag) return; moved = true; img.style.transition = 'none'; x = e.clientX - drag.sx; y = e.clientY - drag.sy; apply(); drag.sx = e.clientX - x; drag.sy = e.clientY - y; };
  const onUp = () => { if(drag){ drag = null; img.style.transition = ''; apply(); } };
  window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
  // מגע: צביטה לזום, אצבע אחת להזזה, הקשה כפולה
  let pinch = null, pan = null, lastTap = 0;
  stage.addEventListener('touchstart', e => {
    if(e.touches.length === 2){ const [t1, t2] = e.touches; pinch = { d: Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY), z, cx: (t1.clientX + t2.clientX) / 2, cy: (t1.clientY + t2.clientY) / 2 }; pan = null; }
    else if(e.touches.length === 1){
      const t = e.touches[0], now = Date.now();
      if(now - lastTap < 300){ zoomAt(z > 1 ? 1 : 2.5, t.clientX, t.clientY); lastTap = 0; return; }
      lastTap = now; if(z > 1) pan = { sx: t.clientX - x, sy: t.clientY - y };
    }
  }, { passive: true });
  stage.addEventListener('touchmove', e => {
    if(pinch && e.touches.length === 2){ e.preventDefault(); const [t1, t2] = e.touches; const d = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY); zoomAt(pinch.z * d / pinch.d, pinch.cx, pinch.cy); }
    else if(pan && e.touches.length === 1){ e.preventDefault(); const t = e.touches[0]; x = t.clientX - pan.sx; y = t.clientY - pan.sy; apply(); pan.sx = t.clientX - x; pan.sy = t.clientY - y; }
  }, { passive: false });
  stage.addEventListener('touchend', e => { if(e.touches.length < 2) pinch = null; if(!e.touches.length) pan = null; });
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  const onKey = e => { if(e.key === 'Escape') close(); if(e.key === '+' || e.key === '=') zoomAt(z * 1.5, ...center()); if(e.key === '-') zoomAt(z / 1.5, ...center()); };
  ov.onclick = e => { if(e.target.closest('[data-lb-close]') || ((e.target === ov || e.target === stage) && z === 1)) close(); else if(e.target === img && z === 1 && !moved) zoomAt(2.5, e.clientX, e.clientY); };
  document.addEventListener('keydown', onKey);
  document.body.appendChild(ov);
  apply();
  if(gallery && gallery.ids.length > 1){
    let idx = gallery.idx || 0;
    const cnt = ov.querySelector('.wa-lb-count');
    const go = async d => {
      idx = (idx + d + gallery.ids.length) % gallery.ids.length;
      cnt.textContent = (idx + 1) + ' / ' + gallery.ids.length;
      const f = await loadTaskFile(gallery.ids[idx]); if(!f) return;
      img.src = f.data; ov.querySelector('.wa-lb-name').textContent = f.name || ''; a.href = f.data; a.download = f.name || 'image.jpg'; z = 1; apply();
    };
    cnt.textContent = (idx + 1) + ' / ' + gallery.ids.length;
    // ימינה = הבאה בעברית (כמו בוואטסאפ בעברית): החץ השמאלי מקדם
    ov.querySelector('.wa-lb-nav.next').onclick = e => { e.stopPropagation(); go(1); };
    ov.querySelector('.wa-lb-nav.prev').onclick = e => { e.stopPropagation(); go(-1); };
    document.addEventListener('keydown', function nav(e){ if(!document.body.contains(ov)){ document.removeEventListener('keydown', nav); return; } if(e.key === 'ArrowLeft') go(1); if(e.key === 'ArrowRight') go(-1); });
    let sx = null; stage.addEventListener('touchstart', e => { if(e.touches.length === 1 && z === 1) sx = e.touches[0].clientX; }, { passive: true });
    stage.addEventListener('touchend', e => { if(sx === null) return; const dx = (e.changedTouches[0] || {}).clientX - sx; sx = null; if(Math.abs(dx) > 50) go(dx > 0 ? 1 : -1); });
  }
}

// Word ו-Excel בתוך האתר, בלי הורדה. הספריות נטענות רק כשצריך, והקובץ לא נשלח לשום שירות חיצוני
const loadedScripts = {};
function loadScript(src){
  if(!loadedScripts[src]) loadedScripts[src] = new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => { delete loadedScripts[src]; rej(new Error('load')); }; document.head.appendChild(el); });
  return loadedScripts[src];
}
function dataUrlToBuffer(d){ const bin = atob(String(d).split(',')[1] || ''), arr = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return arr.buffer; }
async function openOfficeFile(f, name, kind){
  const ov = document.createElement('div'); ov.className = 'wa-lightbox';
  ov.innerHTML = `<div class="wa-lb-bar"><button type="button" class="wa-lb-btn" data-lb-close aria-label="סגירה">✕</button><span class="wa-lb-name"></span>
      <button type="button" class="wa-lb-btn" data-z="out" aria-label="הקטנה">−</button><span class="wa-lb-pct">100%</span><button type="button" class="wa-lb-btn" data-z="in" aria-label="הגדלה">+</button>
      <a class="wa-lb-btn" download aria-label="הורדה">⬇</a></div>
    <div class="wa-doc-wrap"><div class="wa-doc-tabs" hidden></div><div class="wa-doc-page"><div class="wa-doc-inner"><div class="empty-state">פותח את הקובץ...</div></div></div></div>`;
  ov.querySelector('.wa-lb-name').textContent = name || '';
  const a = ov.querySelector('a'); a.href = f.data; a.download = name || 'file';
  const inner = ov.querySelector('.wa-doc-inner'), pct = ov.querySelector('.wa-lb-pct');
  let z = 1; const apply = () => { z = Math.min(3, Math.max(0.5, z)); inner.style.zoom = z; pct.textContent = Math.round(z * 100) + '%'; };
  ov.querySelector('[data-z=in]').onclick = () => { z *= 1.2; apply(); };
  ov.querySelector('[data-z=out]').onclick = () => { z /= 1.2; apply(); };
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key === 'Escape') close(); };
  ov.onclick = e => { if(e.target === ov || e.target.closest('[data-lb-close]')) close(); };
  document.addEventListener('keydown', onKey);
  document.body.appendChild(ov);
  try{
    const buf = dataUrlToBuffer(f.data);
    if(kind === 'docx'){
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
      const r = await window.mammoth.convertToHtml({ arrayBuffer: buf });
      inner.innerHTML = r.value || '<p class="hint">המסמך ריק.</p>';
      inner.dir = /[֐-׿]/.test(inner.textContent) ? 'rtl' : 'auto';
    } else {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      const wb = window.XLSX.read(buf, { type: 'array' });
      const tabs = ov.querySelector('.wa-doc-tabs');
      const show = sn => {
        inner.innerHTML = window.XLSX.utils.sheet_to_html(wb.Sheets[sn], { header: '', footer: '' });
        tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.sheet === sn));
      };
      if(wb.SheetNames.length > 1){ tabs.hidden = false; tabs.innerHTML = wb.SheetNames.map(n => `<button type="button" data-sheet="${escapeHtml(n)}">${escapeHtml(n)}</button>`).join(''); tabs.querySelectorAll('button').forEach(b => b.onclick = () => show(b.dataset.sheet)); }
      ov.querySelector('.wa-doc-page').classList.add('sheet');
      show(wb.SheetNames[0]);
    }
  }catch(e){
    console.error('office preview', e);
    inner.innerHTML = '<p class="hint" style="text-align:center;">לא הצלחנו להציג את הקובץ בתוך האתר. אפשר להוריד אותו בכפתור ⬇ למעלה.</p>';
  }
}
// פתיחת קובץ שנשלח בצ'אט: תמונה – בתצוגה עם זום; PDF – בתוך האתר עם הזום של הדפדפן; טקסט – בתצוגה; אחר – הורדה
function openChatFile(f, name){
  const type = (String(f.data).match(/^data:([^;,]+)/) || [])[1] || '';
  if(/^image\//.test(type)) return openLightbox(f.data, name);
  const ext = (String(name || '').match(/\.([a-z0-9]+)$/i) || [])[1] || '';
  if(/wordprocessingml/.test(type) || /^docx$/i.test(ext)) return openOfficeFile(f, name, 'docx');
  if(/spreadsheetml|ms-excel|text\/csv/.test(type) || /^(xlsx|xls|csv|ods)$/i.test(ext)) return openOfficeFile(f, name, 'sheet');
  if(/^(video|audio)\//.test(type)){
    let url = f.data;
    try{ const b64 = f.data.split(',')[1], bin = atob(b64), arr = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); url = URL.createObjectURL(new Blob([arr], { type })); }catch(e){}
    const ov = document.createElement('div'); ov.className = 'wa-lightbox';
    const tag = /^video/.test(type) ? 'video' : 'audio';
    ov.innerHTML = `<div class="wa-lb-bar"><button type="button" class="wa-lb-btn" data-lb-close aria-label="סגירה">✕</button><span class="wa-lb-name"></span><a class="wa-lb-btn" download aria-label="הורדה">⬇</a></div>
      <div class="wa-lb-stage"><${tag} controls autoplay playsinline class="wa-lb-media"></${tag}></div>`;
    ov.querySelector('.wa-lb-name').textContent = name || '';
    ov.querySelector('.wa-lb-media').src = url;
    const a = ov.querySelector('a'); a.href = url; a.download = name || 'file';
    const close = () => { const m = ov.querySelector('.wa-lb-media'); if(m) m.pause(); ov.remove(); document.removeEventListener('keydown', onKey); if(url.startsWith('blob:')) setTimeout(() => URL.revokeObjectURL(url), 1000); };
    const onKey = e => { if(e.key === 'Escape') close(); };
    ov.onclick = e => { if(e.target === ov || e.target.classList.contains('wa-lb-stage') || e.target.closest('[data-lb-close]')) close(); };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    return;
  }
  if(type === 'application/pdf' || /^text\//.test(type)){
    let url = f.data;
    try{ const b64 = f.data.split(',')[1], bin = atob(b64), arr = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); url = URL.createObjectURL(new Blob([arr], { type: type + (/^text\//.test(type) ? ';charset=utf-8' : '') })); }catch(e){}
    const ov = document.createElement('div'); ov.className = 'wa-lightbox';
    ov.innerHTML = `<div class="wa-lb-bar"><button type="button" class="wa-lb-btn" data-lb-close aria-label="סגירה">✕</button><span class="wa-lb-name"></span><a class="wa-lb-btn" download aria-label="הורדה">⬇</a></div>
      <iframe class="wa-lb-doc" title="תצוגת קובץ"></iframe>`;
    ov.querySelector('.wa-lb-name').textContent = name || '';
    ov.querySelector('iframe').src = url;
    const a = ov.querySelector('a'); a.href = url; a.download = name || 'file';
    const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); if(url.startsWith('blob:')) setTimeout(() => URL.revokeObjectURL(url), 1000); };
    const onKey = e => { if(e.key === 'Escape') close(); };
    ov.onclick = e => { if(e.target === ov || e.target.closest('[data-lb-close]')) close(); };
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    return;
  }
  const a = document.createElement('a'); a.href = f.data; a.download = name || 'file'; document.body.appendChild(a); a.click(); a.remove();
}

// "מקליד... / מקליט הודעה..." – נשמר בשדה typing במסמך המשימות של העובד, והצד השני מאזין לשינויים
let lastTypingSent = 0, lastTypingKey = '';
function signalTyping(empId, taskId, who, kind){
  const key = taskId + ':' + kind, now = Date.now();
  if(kind && key === lastTypingKey && now - lastTypingSent < 2500) return;
  lastTypingKey = kind ? key : ''; lastTypingSent = now;
  const typing = kind ? { taskId, who, kind, at: trueNow().getTime() } : null;
  setDoc(doc(db, 'tasks', empId), { typing }, { merge: true }).catch(() => {});
}
// מאזין למסמך המשימות כל עוד הדף פתוח: מציג "מקליד", ומרענן כשמגיעה הודעה חדשה (בלי למחוק טיוטה)
function watchTaskThreads(empId, viewer, rerender){
  if(state._threadWatch){ try{ state._threadWatch.unsub(); }catch(e){} clearInterval(state._threadWatch.timer); state._threadWatch = null; }
  const countReps = items => (items || []).reduce((n, t) => n + ((t && t.replies) || []).length, 0);
  let known = null, typing = null, seenSig = null;
  // סימני "נקרא" של הצד השני – כשהם משתנים, הווי הכפול הופך לכחול בלי רענון
  const seenOf = items => (items || []).map(t => ((t && t.replies) || []).map(r => (r.seenMgr ? 'm' : '') + (r.seenEmp ? 'e' : '')).join(',')).join('|');
  const paint = () => {
    if(!document.querySelector('.wa-thread')){ stop(); return; }
    document.querySelectorAll('[data-typing-for]').forEach(el => {
      const on = typing && typing.who !== viewer && typing.taskId === el.dataset.typingFor && trueNow().getTime() - (typing.at || 0) < 7000;
      el.hidden = !on;
      if(on){ el.querySelector('.wa-typing-txt').textContent = (typing.who === 'mgr' ? 'המנהל ' : 'העובד ') + (typing.kind === 'recording' ? 'מקליט הודעה...' : 'מקליד...');
        const chat = el.closest('.wa-chat'); if(chat) chat.scrollTop = chat.scrollHeight; }
    });
    document.querySelectorAll('[data-thread-toggle].wa-toggle:not(.open)').forEach(b => {
      const on = typing && typing.who !== viewer && typing.taskId === b.dataset.threadToggle && trueNow().getTime() - (typing.at || 0) < 7000;
      b.classList.toggle('typing', !!on);
    });
  };
  const stop = () => { if(state._threadWatch){ try{ state._threadWatch.unsub(); }catch(e){} clearInterval(state._threadWatch.timer); state._threadWatch = null; } };
  let unsub = () => {};
  try{
    unsub = onSnapshot(doc(db, 'tasks', empId), snap => {
      const d = snap.exists() ? snap.data() : {};
      typing = d.typing || null;
      const n = countReps(d.items), sg = seenOf(d.items);
      const seenChanged = seenSig !== null && sg !== seenSig; seenSig = sg;
      if(known !== null && n > known && (state._pendingSelf || 0) >= n - known){ state._pendingSelf -= (n - known); known = n; if(seenChanged) keepDraftsAndRerender(rerender); else paint(); return; }
      if((known !== null && n !== known) || seenChanged){ known = n; keepDraftsAndRerender(rerender); return; }
      known = n; paint();
    }, () => {});
  }catch(e){}
  state._threadWatch = { unsub, timer: setInterval(paint, 1500) };
}
async function keepDraftsAndRerender(rerender){
  const drafts = {}; let focused = null;
  document.querySelectorAll('[data-reply-box]').forEach(b => { const ta = b.querySelector('textarea'); if(ta && ta.value) drafts[b.dataset.replyBox] = ta.value; if(ta && document.activeElement === ta) focused = b.dataset.replyBox; });
  if(document.querySelector('.wa-btn.mic.rec')) return;   // לא מרעננים באמצע הקלטה
  const y = window.scrollY;
  await rerender();
  window.scrollTo(0, y);
  Object.entries(drafts).forEach(([id, v]) => { const ta = document.querySelector(`[data-reply-box="${id}"] textarea`); if(ta) ta.value = v; });
  if(focused){ const ta = document.querySelector(`[data-reply-box="${focused}"] textarea`); if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
}
// מחבר את כפתורי התגובה. after() – מה לעשות אחרי שליחה (רינדור מחדש)
function bindTaskReplies(root, empId, from, after){
  const recState = {};
  // שרשור ארוך נגלל בתוך המסגרת שלו, ומתחיל מההודעה האחרונה – כמו בוואטסאפ
  root.querySelectorAll('.wa-chat').forEach(c => { c.scrollTop = c.scrollHeight; });
  if(!state._openThreads) state._openThreads = new Set();
  root.querySelectorAll('[data-thread-toggle]').forEach(b => b.onclick = ev => {
    ev.preventDefault();
    const id = b.dataset.threadToggle;
    state._openThreads.has(id) ? state._openThreads.delete(id) : state._openThreads.add(id);
    after();
  });
  root.querySelectorAll('[data-file-img]').forEach(async img => {
    const f = await loadTaskFile(img.dataset.fileImg);
    if(f){ img.src = f.data; img.onclick = () => openLightbox(f.data, f.name); } else img.alt = 'לא הצלחנו לטעון את התמונה';
  });
  root.querySelectorAll('[data-file-open]').forEach(b => b.onclick = async ev => {
    ev.preventDefault();
    const f = await loadTaskFile(b.dataset.fileOpen);
    if(!f){ showToast('לא הצלחנו לטעון את הקובץ'); return; }
    openChatFile(f, b.dataset.fileName);
  });
  root.querySelectorAll('[data-reply-file]').forEach(inp => inp.onchange = async () => {
    const id = inp.dataset.replyFile, st = root.querySelector(`[data-reply-status="${id}"]`);
    const file = inp.files && inp.files[0]; inp.value = '';
    if(!file) return;
    st.textContent = 'מעלה...';
    let data;
    try{ data = /^image\//.test(file.type) ? await shrinkImage(file) : await new Promise((r, j) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = j; fr.readAsDataURL(file); }); }

    const ok = await saveDoc(() => setDoc(doc(db, 'voiceMessages', fileId), { file: data, name: file.name, type: file.type || '', createdAt: new Date().toISOString() }), 'saveTaskFile');
    if(ok !== true){ st.textContent = 'שגיאה בהעלאה'; return; }

  root.querySelectorAll('[data-reply-open]').forEach(b => b.onclick = ev => {
    ev.preventDefault();

  });
  // שליחה כמו בוואטסאפ: הבועה מופיעה מיד בשיחה והשדה מתרוקן, והשמירה נעשית ברקע (בלי לטעון את הדף מחדש)
  const send = async (taskId, reply, btn) => {
    signalTyping(empId, taskId, from, null);
    const r = Object.assign({ id: uid(), from, at: todayStr() + 'T' + nowTimeStr() }, reply);
    const chat = root.querySelector(`[data-reps-for="${taskId}"] .wa-chat`);
    let bubble = null;
    if(chat){
      const tmp = document.createElement('div');
      tmp.innerHTML = taskRepliesHtml({ id: taskId, replies: [r] }, empId, from).trim();
      bubble = tmp.querySelector('.wa-row.out');
      if(bubble){
        bubble.classList.add('pending');
        const typingRow = chat.querySelector('.wa-typing');
        chat.insertBefore(bubble, typingRow || null);
        chat.scrollTop = chat.scrollHeight;
        const ta = root.querySelector(`[data-reply-box="${taskId}"] textarea`); if(ta){ ta.value = ''; ta.style.height = ''; ta.focus(); }
        const st = root.querySelector(`[data-reply-status="${taskId}"]`); if(st) st.textContent = '';
      }
    }
    if(btn && !bubble) btn.disabled = true;
    state._pendingSelf = (state._pendingSelf || 0) + 1;
    const fresh = await loadTasks(empId);
    const t = fresh && fresh.find(x => x.id === taskId);
    if(!t){ state._pendingSelf--; showToast('המשימה כבר לא קיימת'); after(); return; }
    if(!Array.isArray(t.replies)) t.replies = [];
    t.replies.push(r);
    const ok = await saveTasks(empId, fresh);
    if(ok !== true){ state._pendingSelf--; showToast('ההודעה לא נשלחה'); if(bubble) bubble.classList.add('failed'); if(btn) btn.disabled = false; return; }
    if(bubble){ bubble.classList.remove('pending'); return; }

  };
  root.querySelectorAll('.wa-compose textarea').forEach(ta => {
    const tid = ta.parentElement.dataset.replyBox;
    ta.addEventListener('paste', async e => {

      if(!f) return; e.preventDefault();
      const file = f.name && f.name !== 'image.png' ? f : new File([f], 'צילום מסך.png', { type: f.type || 'image/png' });

  });

    const cur = recState[id];
    if(cur && cur.rec.state === 'recording'){ cur.rec.stop(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = [], rec = new MediaRecorder(stream, { audioBitsPerSecond: 24000 });
      recState[id] = { rec };
      let secs = 0; const timer = setInterval(() => { secs++; st.textContent = 'מקליט... ' + secs + ' שניות'; if(secs >= 120) rec.stop(); }, 1000);
      rec.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };

        const audioId = uid() + uid();

    }catch(e){ st.textContent = 'אין גישה למיקרופון. יש לאשר הרשאה בדפדפן.'; }
  });
}

async function markRepliesSeen(empId, viewer){

function unseenCount(items, viewer){

async function playTaskAudio(btn){

  const label = btn.textContent; btn.disabled = true; btn.textContent = 'טוען...';

  if(!res || !res.audio){ btn.textContent = label; showToast(res && res.error === 'unavailable' ? 'אי אפשר להשמיע את ההקלטה באתר כרגע. אפשר לשמוע אותה בקו' : 'לא הצלחנו לטעון את ההקלטה'); return; }

}

function chatPickMembers(list, selected, askName, title){
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'confirm-overlay';
    ov.innerHTML = `<div class="confirm-box wa-pick">
      <h3 style="margin:0 0 10px;">${escapeHtml(title || 'קבוצה חדשה')}</h3>

    document.body.appendChild(ov);
    const done = v => { ov.remove(); resolve(v); };
    ov.querySelector('#wpNo').onclick = () => done(null);
    ov.onclick = e => { if(e.target === ov) done(null); };
    ov.querySelector('#wpOk').onclick = () => {
      const ids = [...ov.querySelectorAll('.wa-pick-list input:checked:not(:disabled)')].map(x => x.value);

      done({ name, ids });
    };
  });
}
