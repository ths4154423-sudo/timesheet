  // כמה קבצים ביחד (עד 10) נשלחים בהודעה אחת, כמו אלבום בוואטסאפ. טקסט שבשדה נשלח ככיתוב
  ['chatFile', 'chatGallery', 'chatCamInput'].forEach(fid => { document.getElementById(fid).onchange = e => { const picked = [...(e.target.files || [])]; e.target.value = ''; addPending(picked); }; });
  // מהדק: תפריט קטן – גלריה (תמונות וסרטונים) או קובץ מהתיקייה
  // מהדק: קובץ מהתיקייה (כל סוג)
  document.getElementById('chatAttachBtn').onclick = () => document.getElementById('chatFile').click();
  // מצלמה: תפריט קטן – צילום עכשיו או בחירה מהגלריה
  document.getElementById('chatCamBtn').onclick = ev => {
    ev.stopPropagation();
    document.querySelectorAll('.att-menu').forEach(x => x.remove());
    const btn = ev.currentTarget, m = document.createElement('div'); m.className = 'att-menu';
    m.innerHTML = `<button type="button" data-att="camera"><span class="att-ic" style="background:#D3396D;">📷</span>צילום</button><button type="button" data-att="gallery"><span class="att-ic" style="background:#BF59CF;">🖼️</span>גלריה</button>`;
    document.body.appendChild(m);
    const r0 = btn.getBoundingClientRect();
    m.style.left = Math.max(8, Math.min(window.innerWidth - m.offsetWidth - 8, r0.left + r0.width / 2 - m.offsetWidth / 2)) + 'px';
    m.style.top = (r0.top - m.offsetHeight - 10) + 'px';
    const close = e => { if(!m.contains(e.target)){ m.remove(); document.removeEventListener('click', close, true); } };
    setTimeout(() => document.addEventListener('click', close, true), 0);
    m.querySelectorAll('[data-att]').forEach(b => b.onclick = () => { m.remove(); if(b.dataset.att === 'gallery') document.getElementById('chatGallery').click(); else openCamera(); });
  };
  // מצלמה: בטלפון נפתחת מצלמת המכשיר; במחשב – חלון צילום מהמצלמה
  const isTouch = /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent);
  const openCamera = async () => {
    if(isTouch) return document.getElementById('chatCamInput').click();
    let stream; try{ stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 } }, audio: false }); }catch(e){ return showToast('אין גישה למצלמה'); }
    const ov = document.createElement('div'); ov.className = 'wa-lightbox';
    ov.innerHTML = `<div class="wa-lb-bar"><button type="button" class="wa-lb-btn" data-lb-close aria-label="סגירה">✕</button><span class="wa-lb-name">מצלמה</span></div>
      <div class="wa-lb-stage"><video autoplay playsinline muted class="wa-lb-media" style="transform:scaleX(-1);"></video></div>
      <button type="button" class="cam-shot" aria-label="צילום"></button>`;
    document.body.appendChild(ov);
    const v = ov.querySelector('video'); v.srcObject = stream;
    const close = () => { stream.getTracks().forEach(t => t.stop()); ov.remove(); };
    ov.querySelector('[data-lb-close]').onclick = close;
    ov.querySelector('.cam-shot').onclick = () => {
      const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
      const g = c.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(v, 0, 0);
      c.toBlob(bl => { if(bl) addPending([new File([bl], 'צילום ' + nowTimeStr().slice(0, 5).replace(':', '-') + '.jpg', { type: 'image/jpeg' })]); close(); }, 'image/jpeg', .9);
    };
  };
  // גרירת קבצים לתוך השיחה
  body.addEventListener('dragover', e => { if(e.dataTransfer && [...e.dataTransfer.types].includes('Files')){ e.preventDefault(); body.classList.add('wa-drop'); } });
  body.addEventListener('dragleave', () => body.classList.remove('wa-drop'));
  body.addEventListener('drop', e => { e.preventDefault(); body.classList.remove('wa-drop'); const fs = [...((e.dataTransfer && e.dataTransfer.files) || [])]; if(fs.length) addPending(fs); });
  // הדבקה (Ctrl+V, או בחירה מהיסטוריית הלוח ב-Win+V): תמונה או קובץ שבלוח נשלחים מיד, והטקסט שבשדה הופך לכיתוב
  input.addEventListener('paste', async e => {
    const files = [...((e.clipboardData && e.clipboardData.items) || [])].filter(it => it.kind === 'file').map(it => it.getAsFile()).filter(Boolean);
    if(!files.length) return;
    e.preventDefault();
    const named = files.map((f, i) => f.name && f.name !== 'image.png' ? f : new File([f], 'צילום מסך ' + nowTimeStr().slice(0, 5).replace(':', '-') + (files.length > 1 ? '-' + (i + 1) : '') + '.png', { type: f.type || 'image/png' }));
    addPending(named);
  });
  const sendFiles = async picked0 => {
    const picked = (picked0 || []).slice(0, 10); if(!picked.length) return;
    const files = [];
    for(let i = 0; i < picked.length; i++){
      const file = picked[i];
      stEl.textContent = picked.length > 1 ? `מעלה ${i + 1} מתוך ${picked.length}...` : 'מעלה...';
      let data; try{ data = /^image\//.test(file.type) ? await shrinkImage(file) : await new Promise((r, j) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = j; fr.readAsDataURL(file); }); }catch(err){ showToast('לא הצלחנו לקרוא את ' + file.name); continue; }
      if(data.length > 950000){ showToast(file.name + ' גדול מדי (עד כ-700KB)'); continue; }
      const fileId = uid() + uid();
      const ok = await saveDoc(() => setDoc(doc(db, 'voiceMessages', fileId), { file: data, name: file.name, type: file.type || '', createdAt: new Date().toISOString() }), 'chatFile');
      if(ok !== true){ showToast('שגיאה בהעלאת ' + file.name); continue; }
      files.push({ fileId, fileName: file.name, fileType: /^image\//.test(file.type) ? 'image/jpeg' : (file.type || '') });
    }
    stEl.textContent = '';
    if(!files.length) return;
    const caption = input.value.trim(); if(caption){ input.value = ''; input.style.height = ''; setDraft(me, id, ''); }
    if(files.length === 1) send({ ...files[0], ...(caption ? { text: caption } : {}) });
    else send({ files, ...(caption ? { text: caption } : {}) });
  };
  const mic = document.getElementById('chatMic'); let rec = null;
  mic.onclick = async () => {
    if(rec && rec.state === 'recording'){ rec.stop(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true }), chunks = [];
      rec = new MediaRecorder(stream, { audioBitsPerSecond: 24000 });
      let secs = 0; const tm = setInterval(() => { secs++; stEl.textContent = 'מקליט... ' + secs + ' שניות · לחצו ⏹ לשליחה'; sigTyping('recording'); if(secs >= 120) rec.stop(); }, 1000);
      rec.ondataavailable = ev => { if(ev.data.size) chunks.push(ev.data); };
      rec.onstop = async () => {
        clearInterval(tm); stream.getTracks().forEach(t => t.stop()); mic.innerHTML = WAI.mic; mic.classList.remove('rec'); stEl.textContent = 'שומר...';
        const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
        const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
        const audioId = uid() + uid();
        const ok = await saveVoiceMessage(audioId, dataUrl);
        stEl.textContent = ok === true ? '' : 'שגיאה בשמירת ההקלטה'; if(ok === true) send({ audioId });
      };
      rec.start(); mic.innerHTML = WAI.stop; mic.classList.add('rec'); sigTyping('recording');
    }catch(err){ stEl.textContent = 'אין גישה למיקרופון. יש לאשר הרשאה בדפדפן.'; }
  };
  // ---- סקר: הצבעה (לחיצה שנייה מבטלת). בסקר של בחירה אחת – ההצבעה עוברת לאפשרות החדשה
  body.addEventListener('click', e => {
    const w = e.target.closest && e.target.closest('[data-poll-who]');
    if(w){ const m = (cur.msgs || []).find(x => x.id === w.dataset.pollWho); if(m) pollVoters(m); return; }
    const b = e.target.closest && e.target.closest('[data-vote]'); if(!b) return;
    const [mid, k] = b.dataset.vote.split(':'), idx = +k;
    const apply = t => { const v = { ...((t.poll || {}).votes || {}) }; let mine = (v[me] || []).slice();
      if(mine.includes(idx)) mine = mine.filter(x => x !== idx); else mine = t.poll.multi ? [...mine, idx] : [idx];
      if(mine.length) v[me] = mine; else delete v[me]; t.poll = { ...t.poll, votes: v }; };
    const loc = (cur.msgs || []).find(x => x.id === mid); if(!loc || !loc.poll) return;
    apply(loc); paint.sig = null; paint();
    saveMsgs(msgs => { const t = msgs.find(y => y.id === mid); if(!t || !t.poll) return false; apply(t); }, 'chatVote');
  });
  const pollVoters = m => {
    const v = m.poll.votes || {};
    const html = m.poll.opts.map((o, i) => { const who = Object.keys(v).filter(x => (v[x] || []).includes(i)); return `<div class="msginfo-row"><b>${escapeHtml(o)} · ${who.length}</b><span>${who.map(x => escapeHtml(x === me ? 'אתה' : (state._chatNames[x] || ''))).join(', ') || '—'}</span></div>`; }).join('');
    const ov = document.createElement('div'); ov.className = 'confirm-overlay';
    ov.innerHTML = `<div class="confirm-box msginfo"><h3 style="margin:0 0 10px;">📊 ${escapeHtml(m.poll.q)}</h3>${html}<div class="actions"><button type="button" class="btn brass">סגירה</button></div></div>`;
    document.body.appendChild(ov); ov.querySelector('button').onclick = () => ov.remove(); ov.onclick = e => { if(e.target === ov) ov.remove(); };
  };
  // ---- כפתור ＋: סקר או הודעה מתוזמנת
  document.getElementById('chatMoreBtn').onclick = ev => {
    ev.stopPropagation();
    document.querySelectorAll('.att-menu').forEach(x => x.remove());
    const btn = ev.currentTarget, mm = document.createElement('div'); mm.className = 'att-menu';
    mm.innerHTML = `<button type="button" data-more="poll"><span class="att-ic" style="background:#FFB300;">📊</span>סקר</button><button type="button" data-more="sched"><span class="att-ic" style="background:#0795DC;">⏰</span>הודעה מתוזמנת</button>`;
    document.body.appendChild(mm);
    const r0 = btn.getBoundingClientRect();
    mm.style.left = Math.max(8, Math.min(window.innerWidth - mm.offsetWidth - 8, r0.left + r0.width / 2 - mm.offsetWidth / 2)) + 'px';
    mm.style.top = (r0.top - mm.offsetHeight - 10) + 'px';
    const close = e => { if(!mm.contains(e.target)){ mm.remove(); document.removeEventListener('click', close, true); } };
    setTimeout(() => document.addEventListener('click', close, true), 0);
    mm.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { mm.remove(); b.dataset.more === 'poll' ? newPoll() : newSched(); });
  };
  const newPoll = () => {
    const ov = document.createElement('div'); ov.className = 'confirm-overlay';
    ov.innerHTML = `<div class="confirm-box" style="max-width:400px; width:94vw;">
      <h3 style="margin:0 0 10px;">📊 סקר חדש</h3>
      <label>שאלה</label><input type="text" id="plQ" maxlength="200" placeholder="למשל: מי מגיע ביום שישי?" />
      <label style="margin-top:10px;">אפשרויות</label><div id="plOpts"></div>
      <button type="button" class="btn ghost small" id="plAdd" style="margin:6px 0;">＋ אפשרות</button>
      <label style="display:flex; align-items:center; gap:8px; margin-top:6px; font-weight:400;"><input type="checkbox" id="plMulti" style="width:auto;" /> אפשר לבחור יותר מתשובה אחת</label>
      <div class="error-msg" id="plErr"></div>
      <div class="actions"><button type="button" class="btn brass" id="plSend">שליחה</button><button type="button" class="btn ghost" id="plX">ביטול</button></div></div>`;
    document.body.appendChild(ov);
    const box = ov.querySelector('#plOpts');
    const addOpt = () => { if(box.children.length >= 10) return; const i = document.createElement('input'); i.type = 'text'; i.maxLength = 80; i.placeholder = 'אפשרות ' + (box.children.length + 1); i.style.marginBottom = '6px'; box.appendChild(i); };
    addOpt(); addOpt();
    ov.querySelector('#plAdd').onclick = () => { addOpt(); box.lastChild.focus(); };
    ov.querySelector('#plX').onclick = () => ov.remove();
    ov.querySelector('#plSend').onclick = () => {
      const q = ov.querySelector('#plQ').value.trim(), opts = [...box.querySelectorAll('input')].map(x => x.value.trim()).filter(Boolean);
      if(!q) return ov.querySelector('#plErr').textContent = 'כותבים שאלה';
      if(opts.length < 2) return ov.querySelector('#plErr').textContent = 'צריך לפחות שתי אפשרויות';
      ov.remove(); send({ poll: { q, opts, multi: ov.querySelector('#plMulti').checked, votes: {} } });
    };
    setTimeout(() => ov.querySelector('#plQ').focus(), 50);
  };
  const newSched = () => {
    const later = new Date(ilNow().getTime() + 3600000), p2 = x => String(x).padStart(2, '0');
    const ov = document.createElement('div'); ov.className = 'confirm-overlay';
    ov.innerHTML = `<div class="confirm-box" style="max-width:400px; width:94vw;">
      <h3 style="margin:0 0 10px;">⏰ הודעה מתוזמנת</h3>
      <label>ההודעה</label><textarea id="scT" rows="3" maxlength="1000" style="width:100%; box-sizing:border-box; font:inherit; padding:8px 10px; border-radius:10px; border:1px solid #CFD8DC; resize:vertical;"></textarea>
      <div style="display:flex; gap:8px; margin-top:8px;"><div style="flex:1;"><label>תאריך</label><input type="date" id="scD" value="${later.getFullYear()}-${p2(later.getMonth() + 1)}-${p2(later.getDate())}" min="${todayStr()}" /></div>
      <div style="flex:1;"><label>שעה</label><input type="time" id="scH" value="${p2(later.getHours())}:${p2(later.getMinutes())}" /></div></div>
      <p class="hint" style="font-size:12.5px;">ההודעה תישלח לבד בשעה שנבחרה, גם אם האתר סגור.</p>
      <div class="error-msg" id="scErr"></div>
      <div class="actions"><button type="button" class="btn brass" id="scOk">תזמון</button><button type="button" class="btn ghost" id="scX">ביטול</button></div></div>`;
    document.body.appendChild(ov);
    const ta = ov.querySelector('#scT'); ta.value = input.value.trim();
    ov.querySelector('#scX').onclick = () => ov.remove();
    ov.querySelector('#scOk').onclick = async e => {
      const text = ta.value.trim(), d = ov.querySelector('#scD').value, h = ov.querySelector('#scH').value, err = ov.querySelector('#scErr');
      if(!text) return err.textContent = 'כותבים הודעה';
      if(!d || !h) return err.textContent = 'בוחרים תאריך ושעה';
      const sendAt = d + 'T' + h;
      if(sendAt <= todayStr() + 'T' + nowTimeStr().slice(0, 5)) return err.textContent = 'השעה כבר עברה';
      e.currentTarget.disabled = true;
      const fresh = await loadChat(id) || { msgs: [] };
      const sched = [...(fresh.sched || []), { id: uid() + uid(), from: me, sendAt, text }];
      const ok = await saveDoc(() => setDoc(doc(db, 'chats', id), custom ? { sched } : { sched, members }, { merge: true }), 'chatSched');
      if(ok !== true){ e.currentTarget.disabled = false; return err.textContent = 'שגיאה בשמירה'; }
      ov.remove();
      if(ta.value.trim() === input.value.trim()){ input.value = ''; input.style.height = ''; setDraft(me, id, ''); }
      showToast('ההודעה תישלח ב-' + d.split('-').reverse().slice(0, 2).join('/') + ' ' + h);
    };
    setTimeout(() => ta.focus(), 50);
  };
  const schedBar = document.getElementById('chatSchedBar');
  const paintSched = list => {
    const mine = list.filter(x => x && x.from === me);
    schedBar.hidden = !mine.length;
    schedBar.textContent = '⏰ ' + (mine.length === 1 ? 'הודעה מתוזמנת אחת' : mine.length + ' הודעות מתוזמנות') + ' · לחצו לצפייה';
    schedBar.onclick = () => {
      const ov = document.createElement('div'); ov.className = 'confirm-overlay';
      const fmtS = x => x.sendAt.slice(0, 10).split('-').reverse().slice(0, 2).join('/') + ' ' + x.sendAt.slice(11, 16);
      ov.innerHTML = `<div class="confirm-box msginfo"><h3 style="margin:0 0 10px;">⏰ הודעות מתוזמנות</h3>${mine.sort((a, b) => a.sendAt.localeCompare(b.sendAt)).map(x => `<div class="msginfo-row"><b>${fmtS(x)}</b><span style="white-space:pre-wrap;">${escapeHtml(x.text)}</span><button type="button" class="btn ghost small" data-sc-del="${x.id}" style="margin-top:4px;">ביטול השליחה</button></div>`).join('')}
        <div class="actions"><button type="button" class="btn brass" id="scClose">סגירה</button></div></div>`;
      document.body.appendChild(ov);
      ov.querySelector('#scClose').onclick = () => ov.remove();
      ov.querySelectorAll('[data-sc-del]').forEach(b => b.onclick = async () => {
        const fresh = await loadChat(id); if(!fresh) return;
        const ok = await saveDoc(() => setDoc(doc(db, 'chats', id), { sched: (fresh.sched || []).filter(x => x.id !== b.dataset.scDel) }, { merge: true }), 'chatSchedDel');
        if(ok === true){ b.closest('.msginfo-row').remove(); showToast('השליחה בוטלה'); if(!ov.querySelector('[data-sc-del]')) ov.remove(); }
      });
    };
  };
  // ---- השתקת השיחה
  document.getElementById('chatMuteBtn').onclick = ev => {
    ev.stopPropagation();
    document.querySelectorAll('.att-menu').forEach(x => x.remove());
    const btn = ev.currentTarget, mm = document.createElement('div'); mm.className = 'att-menu';
    mm.innerHTML = chatMuted(id) ? `<button type="button" data-mu="0">🔔&nbsp; ביטול ההשתקה</button>` : `<button type="button" data-mu="8">🔕&nbsp; ל-8 שעות</button><button type="button" data-mu="168">🔕&nbsp; לשבוע</button><button type="button" data-mu="-1">🔕&nbsp; תמיד</button>`;
    document.body.appendChild(mm);
    const r0 = btn.getBoundingClientRect();
    mm.style.left = Math.max(8, Math.min(window.innerWidth - mm.offsetWidth - 8, r0.left)) + 'px'; mm.style.top = (r0.bottom + 6) + 'px';
    const close = e => { if(!mm.contains(e.target)){ mm.remove(); document.removeEventListener('click', close, true); } };
    setTimeout(() => document.addEventListener('click', close, true), 0);
    mm.querySelectorAll('[data-mu]').forEach(b => b.onclick = async () => {
      mm.remove();
      const h = +b.dataset.mu;
      const until = h === 0 ? null : h < 0 ? 'forever' : (() => { const d = new Date(ilNow().getTime() + h * 3600000), p2 = x => String(x).padStart(2, '0'); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()); })();
      await setMsgSoundPref(role, { chatMutes: { ...(state._chatMutes || {}), [id]: until } });
      btn.textContent = chatMuted(id) ? '🔕' : '🔔';
      showToast(until ? 'השיחה הושתקה' : 'ההשתקה בוטלה');
    });
  };
  let unsub = () => {};
  try{
    unsub = onSnapshot(doc(db, 'chats', id), snap => {
      if(!document.getElementById('chatBody')){ unsub(); return; }
      const d = snap.exists() ? snap.data() : { msgs: [] };
      typing = d.typing || null;
      if(custom && Array.isArray(d.members)) members = d.members;
      const sig = JSON.stringify([(d.cleared || {})[me] || '', (d.msgs || []).map(m => [m.id, (m.seenBy || []).length, !!m.deleted, m.reactions || null, m.edited ? m.text : 0, m.poll ? m.poll.votes || {} : 0])]);
      if(sig !== paint.sig){ paint.sig = sig; cur = d; paint(); markSeen(); } else { cur = { ...cur, pinned: d.pinned }; paintTyping(); }
      paintPin(); paintSched(d.sched || []); deliverDueSched(id, d);
    }, () => {});
  }catch(e){ cur = (await loadChat(id)) || { msgs: [] }; paint(); markSeen(); }
  const tick = setInterval(() => { if(!document.getElementById('chatBody')){ clearInterval(tick); return; } paintTyping(); }, 1500);
  state._chatWatch = () => { unsub(); clearInterval(tick); };
  input.focus();
}

// משתתף "צ'אט בלבד": נכנס לאתר עם שם וקוד אישי, ורואה רק את הצ'אט. לא מחובר לקו, לשעות או לשכר
function renderChatOnlyForm(id){
  const content = document.getElementById('tabContent');
  const e = id ? state.employees.find(x => x.id === id) : null;
  content.innerHTML = `
    <div style="margin-bottom:12px;"><button type="button" class="btn ghost small" id="coBack">‹ חזרה</button></div>
    <div class="card">
      <h3 style="margin-top:0;">${e ? 'עריכת משתתף צ׳אט' : 'משתתף חדש לצ׳אט בלבד'}</h3>
      <p class="hint" style="font-size:13.5px; margin-top:-4px;">נכנס לאתר ב"כניסת עובד" עם השם והקוד האישי, ורואה רק את הצ׳אט. הוא לא מחובר לקו הטלפוני, לא רושם שעות ולא מופיע בסיכומים.</p>
      <form id="coForm">
        <div class="field"><label>שם</label><input type="text" id="coName" maxlength="40" value="${e ? escapeHtml(e.name) : ''}" required /></div>
        <div class="field"><label>קוד אישי (4–6 ספרות)</label><input type="text" id="coPin" inputmode="numeric" maxlength="6" value="${e ? escapeHtml(e.pin || '') : ''}" required /></div>
        <div class="field"><label>אימייל (לא חובה, לשחזור קוד שנשכח)</label><input type="email" id="coEmail" value="${e ? escapeHtml(e.email || '') : ''}" /></div>
        <div class="error-msg" id="coErr"></div>
        <div class="actions" style="justify-content:flex-start; gap:10px;">
          <button type="submit" class="btn brass">${e ? 'שמירה' : 'הוספה'}</button>
          ${e ? '<button type="button" class="btn danger" id="coDel">הסרה מהצ׳אט</button>' : ''}
        </div>

function ringStart(incoming){

function wirePeer(pc, callRef, myField, otherField){
  const sent = [];
  pc.onicecandidate = e => { if(!e.candidate) return; sent.push(e.candidate.toJSON()); setDoc(callRef, { [myField]: sent.slice() }, { merge: true }).catch(() => {}); };
  pc.ontrack = e => {
    const v = document.getElementById('callRemoteVid');
    if(v){ v.srcObject = e.streams[0]; v.play().catch(() => {}); document.getElementById('callOverlay').classList.add('has-video'); }
    else { const a = document.getElementById('callAudio'); if(a){ a.srcObject = e.streams[0]; a.play().catch(() => {}); } }
  };
  pc.onconnectionstatechange = () => {
    if(!activeCall) return;
    if(pc.connectionState === 'connected' && !activeCall.startedAt){
      activeCall.startedAt = Date.now(); ringStop();
      activeCall.timer = setInterval(() => { const el = document.getElementById('callStatus'); if(el && activeCall) el.textContent = fmtDur(Math.round((Date.now() - activeCall.startedAt) / 1000)); }, 1000);

  };

}

async function endCall(newStatus){

function startCallListener(role){

function incomingCall(role, id, d){

    const pc = new RTCPeerConnection(RTC_CFG);

// קישורים בהודעות: אתרים (http, https, www), אימייל, מספרי טלפון (חיוג), וואטסאפ וכל קישור אחר – הופכים ללחיצים
function linkify(text){
  const src = String(text || '');
  // גם כתובת בלי http ובלי www, כמו dirata.co.il או GOOGLE.COM/abc (באותיות גדולות או קטנות)
  const re = /((?:https?:\/\/|www\.)[^\s<]+[^\s<.,;:!?)\]'"״׳])|([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})|((?:[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?\.)+(?:co\.il|org\.il|net\.il|ac\.il|gov\.il|muni\.il|k12\.il|co\.uk|com|net|org|il|info|io|app|me|biz|edu|gov|co|us|uk|de|fr|eu|online|site|store|shop|tech|dev|ai|tv|ly)(?![A-Za-z0-9-])(?:\/[^\s<]*[^\s<.,;:!?)\]'"״׳])?)|((?:\+972[-\s]?|0)(?:[2-9]\d?)[-\s]?\d{3}[-\s]?\d{4}|\*\d{3,5})/gi;
  let out = '', last = 0, m;
  while((m = re.exec(src))){
    out += escapeHtml(src.slice(last, m.index));
    const t = m[0];
    if(m[1]){ const href = /^www\./i.test(t) ? 'https://' + t : t; out += `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" class="wa-link">${escapeHtml(t)}</a>`; }
    else if(m[2]) out += `<a href="mailto:${escapeHtml(t)}" class="wa-link">${escapeHtml(t)}</a>`;
    else if(m[3]) out += `<a href="https://${escapeHtml(t.replace(/^[^/]+/, h => h.toLowerCase()))}" target="_blank" rel="noopener noreferrer" class="wa-link">${escapeHtml(t)}</a>`;
    else out += `<a href="tel:${escapeHtml(t.replace(/[-\s]/g, ''))}" class="wa-link">${escapeHtml(t)}</a>`;
    last = m.index + t.length;
  }
  return out + escapeHtml(src.slice(last));
}

function chatMuted(id){ const v = (state._chatMutes || {})[id]; return v === 'forever' || (!!v && v > todayStr() + 'T' + nowTimeStr().slice(0, 5)); }
// הודעה מתוזמנת שהגיע זמנה עוברת להודעות. כל משתתף מחובר יכול לעשות את זה (וגם הגשר כל דקה) – בלי כפילויות
async function deliverDueSched(id, d){
  const now = todayStr() + 'T' + nowTimeStr().slice(0, 5);
  if(!(d.sched || []).some(x => x && x.sendAt <= now)) return;
  state._schedBusy = state._schedBusy || {}; if(state._schedBusy[id]) return; state._schedBusy[id] = true;
  try{
    const fresh = await loadChat(id); if(!fresh) return;
    const due = (fresh.sched || []).filter(x => x && x.sendAt <= now); if(!due.length) return;
    const have = new Set((fresh.msgs || []).map(m => m.id));
    const add = due.filter(x => !have.has(x.id)).map(x => ({ id: x.id, from: x.from, at: x.sendAt + ':00', seenBy: [], text: x.text, scheduled: true }));
    const msgs = [...(fresh.msgs || []), ...add].slice(-CHAT_MAX);
    const ok = await saveDoc(() => setDoc(doc(db, 'chats', id), { msgs, sched: (fresh.sched || []).filter(x => !due.includes(x)) }, { merge: true }), 'chatSchedDeliver');
    const me = state.currentEmployee ? state.currentEmployee.id : 'mgr';
    if(ok === true) add.filter(m => m.from === me).forEach(m => pushNotify({ kind: 'chat', chatId: id, msgId: m.id }));
  }finally{ state._schedBusy[id] = false; }
}

async function chatPhoto(id){
  state._chatPhotos = state._chatPhotos || {};
  const c = state._chatPhotos[id];
  if(c && Date.now() - c.t < 60000) return c.p;
  let p = null;
  try{ const sn = await getDoc(doc(db, 'statuses', id)); p = (sn.exists() && sn.data().photo) || null; }catch(e){}
  if(!p){ const e = (state.employees || []).find(x => x.id === id); p = (e && e.photo) || null; }
  state._chatPhotos[id] = { p, t: Date.now() };
  return p;
}
function fillAvatars(root){
  (root || document).querySelectorAll('[data-av]').forEach(async el => {
    const p = await chatPhoto(el.dataset.av);
    if(p){ el.innerHTML = '<img alt="" />'; el.firstChild.src = p; el.classList.add('has-photo'); }
  });
}
function shrinkAvatar(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const S = 320, k = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = S;
      c.getContext('2d').drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, S, S); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85)); };
    img.onerror = rej; img.src = url;
  });
}

// statuses/<בעלים>: items[{id, type, text, bg, fileId, at}] · statusViews/<צופה>: seen{statusId: זמן}
const ST_TTL = 24 * 3600 * 1000;
const ST_COLORS = ['#008069', '#5157AE', '#C2185B', '#E65100', '#00838F', '#6A1B9A', '#2E7D32', '#37474F'];
function stLive(items){ const now = trueNow().getTime(); return (items || []).filter(x => x && now - Date.parse(String(x.at).replace(' ', 'T')) < ST_TTL); }
function stNowIso(){ return trueNow().toISOString(); }
async function loadStatuses(ids){
  const out = {};
  await Promise.all(ids.map(async id => { try{ const sn = await getDoc(doc(db, 'statuses', id)); out[id] = stLive(sn.exists() ? sn.data().items : []); }catch(e){ out[id] = []; } }));
  return out;
}
async function loadMyStatusSeen(me){ try{ const sn = await getDoc(doc(db, 'statusViews', me)); return (sn.exists() && sn.data().seen) || {}; }catch(e){ return {}; } }
async function renderStatusStrip(role){
  const strip = document.getElementById('statusStrip'); if(!strip) return;
  const me = chatMe(role);
  const people = [me, ...Object.keys(state._chatNames || {}).filter(x => x !== me)];
  const [all, seen] = await Promise.all([loadStatuses(people), loadMyStatusSeen(me)]);
  if(!document.body.contains(strip)) return;
  state._stAll = all; state._stSeen = seen;
  const mine = all[me] || [];
  const others = people.filter(x => x !== me && (all[x] || []).length)
    .sort((a, b) => { const ua = all[a].some(z => !seen[z.id]), ub = all[b].some(z => !seen[z.id]); return ua === ub ? String(all[b].slice(-1)[0].at).localeCompare(String(all[a].slice(-1)[0].at)) : ua ? -1 : 1; });
  const circle = (id, label, isMe) => {
    const items = all[id] || [], last = items[items.length - 1];

    const inner = last ? (last.type === 'image' ? `<img data-st-thumb="${last.fileId}" alt="" />` : `<span class="st-txt" style="background:${last.bg}">${escapeHtml((last.text || '').slice(0, 14))}</span>`) : `<span class="st-init">${escapeHtml((label || '?').charAt(0))}</span>`;
    return `<button type="button" class="st-item" data-st-open="${id}"><span class="st-ring${unseen ? ' unseen' : items.length ? ' seen' : ''}">${inner}${isMe ? '<span class="st-plus">＋</span>' : ''}</span><span class="st-name">${escapeHtml(isMe ? 'הסטטוס שלי' : label)}</span></button>`;
  };
  strip.innerHTML = circle(me, 'אני', true) + others.map(id => circle(id, state._chatNames[id] || '', false)).join('');
  strip.querySelectorAll('[data-st-thumb]').forEach(async img => { const f = await loadTaskFile(img.dataset.stThumb); if(f) img.src = f.data; });
  strip.querySelectorAll('[data-st-open]').forEach(b => b.onclick = e => {

function openStatusViewer(role, owner, items){
  if(!items.length) return;
  const me = chatMe(role), mineOwn = owner === me;
  let idx = mineOwn ? 0 : Math.max(0, items.findIndex(z => !(state._stSeen || {})[z.id]));
  const ov = document.createElement('div'); ov.className = 'st-view';
  ov.innerHTML = `<div class="st-bars">${items.map(() => '<span><i></i></span>').join('')}</div>
    <div class="st-head"><span class="st-hname">${escapeHtml(mineOwn ? 'הסטטוס שלי' : (state._chatNames[owner] || ''))}</span><span class="st-htime"></span>
      ${mineOwn ? '<button type="button" class="st-del" title="מחיקה">🗑</button>' : ''}<button type="button" class="st-close" aria-label="סגירה">✕</button></div>
    <div class="st-body"></div>
    <div class="st-tap prev"></div><div class="st-tap next"></div>
    ${mineOwn ? '<button type="button" class="st-views"></button>' : ''}`;
  document.body.appendChild(ov);
  const body = ov.querySelector('.st-body'), bars = ov.querySelectorAll('.st-bars i');
  let timer = null, t0 = 0, paused = false, DUR = 5000;
  const fmt = at => { const d = new Date(at); return d.toLocaleTimeString('he-IL', { timeZone: 'Asia/Jerusalem', hour: '2-digit', minute: '2-digit' }); };
  const markSeen = async it => {
    if(mineOwn || (state._stSeen || {})[it.id]) return;
    state._stSeen = { ...(state._stSeen || {}), [it.id]: stNowIso() };
    setDoc(doc(db, 'statusViews', me), { seen: { [it.id]: state._stSeen[it.id] } }, { merge: true }).catch(() => {});
  };
  const show = async () => {
    clearInterval(timer);
    const it = items[idx]; if(!it){ return close(); }
    bars.forEach((b, k) => { b.style.width = k < idx ? '100%' : '0%'; });
    ov.querySelector('.st-htime').textContent = fmt(it.at);
    if(it.type === 'image'){ body.innerHTML = `<img alt="" />${it.text ? `<div class="st-cap"></div>` : ''}`; if(it.text) body.querySelector('.st-cap').textContent = it.text; const f = await loadTaskFile(it.fileId); if(f) body.querySelector('img').src = f.data; body.style.background = '#000'; }
    else { body.innerHTML = '<div class="st-bigtxt"></div>'; body.querySelector('.st-bigtxt').textContent = it.text; body.style.background = it.bg; }
    markSeen(it);
    if(mineOwn) updateViews(it);
    t0 = Date.now();
    timer = setInterval(() => { if(paused){ t0 += 100; return; } const p = Math.min(1, (Date.now() - t0) / DUR); bars[idx].style.width = (p * 100) + '%'; if(p >= 1){ idx++; show(); } }, 100);
  };
  const updateViews = async it => {
    const vb = ov.querySelector('.st-views'); if(!vb) return;
    const viewers = [];
    await Promise.all(Object.keys(state._chatNames || {}).filter(x => x !== me).map(async x => { try{ const sn = await getDoc(doc(db, 'statusViews', x)); const at = sn.exists() && (sn.data().seen || {})[it.id]; if(at) viewers.push({ x, at }); }catch(e){} }));
    vb.textContent = '👁 ' + viewers.length + ' צפיות';
    vb.onclick = () => { paused = true; showConfirmModal(viewers.length ? viewers.sort((a, b) => String(b.at).localeCompare(String(a.at))).map(v => (state._chatNames[v.x] || '') + ' · ' + fmt(v.at)).join('\n') : 'עוד אף אחד לא צפה', { yes: 'סגירה', info: true, danger: false }).then(() => { paused = false; }); };
  };
  const close = () => { clearInterval(timer); ov.remove(); document.removeEventListener('keydown', onKey); renderStatusStrip(role); };
  const onKey = e => { if(e.key === 'Escape') close(); if(e.key === 'ArrowLeft'){ idx++; show(); } if(e.key === 'ArrowRight'){ idx = Math.max(0, idx - 1); show(); } };
  document.addEventListener('keydown', onKey);
  ov.querySelector('.st-close').onclick = close;
  ov.querySelector('.st-tap.next').onclick = () => { idx++; show(); };
  ov.querySelector('.st-tap.prev').onclick = () => { idx = Math.max(0, idx - 1); show(); };
  ['pointerdown'].forEach(ev => body.addEventListener(ev, () => { paused = true; }));
  ['pointerup', 'pointerleave'].forEach(ev => body.addEventListener(ev, () => { paused = false; }));
  const del = ov.querySelector('.st-del');
  if(del) del.onclick = async () => {
    paused = true;
    if(!(await showConfirmModal('למחוק את הסטטוס הזה?', { yes: 'מחיקה', danger: true }))){ paused = false; return; }
    const it = items[idx]; items.splice(idx, 1);
    await saveDoc(() => setDoc(doc(db, 'statuses', me), { items: items.slice() }, { merge: true }), 'statusDel');
    if(!items.length) return close();
    ov.querySelector('.st-bars').innerHTML = items.map(() => '<span><i></i></span>').join('');
    idx = Math.min(idx, items.length - 1); paused = false; show();
  };
  show();
}

// ---------- מראה: המצלמה הקדמית במסך מלא (שום דבר לא נשמר ולא נשלח) ----------
async function openMirror(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showToast('המכשיר הזה לא תומך במצלמה'); return; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false }); }
  catch(e){ showToast(e && e.name === 'NotAllowedError' ? 'צריך לאשר גישה למצלמה כדי להשתמש במראה' : 'לא נמצאה מצלמה'); return; }
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed; inset:0; z-index:9999; background:#000; display:flex; align-items:center; justify-content:center;';
  ov.innerHTML = '<video autoplay playsinline muted style="width:100%; height:100%; object-fit:cover; transform:scaleX(-1);"></video>' +
    '<button type="button" style="position:absolute; top:16px; left:16px; padding:10px 18px; border:none; border-radius:999px; background:rgba(255,255,255,.9); font:inherit; font-size:15px; cursor:pointer;">סגירה ✕</button>';
  ov.querySelector('video').srcObject = stream;
  const close = () => { stream.getTracks().forEach(t => t.stop()); ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if(e.key === 'Escape') close(); };
  ov.querySelector('button').onclick = close;
  document.addEventListener('keydown', onKey);
  document.body.appendChild(ov);
}
document.addEventListener('click', async e => {
  if(!e.target.closest) return;
  if(e.target.closest('#mirrorBtn')) openMirror();
  const pb = e.target.closest('[data-play]');
  if(pb){ e.preventDefault(); playTaskAudio(pb); }
  if(e.target.closest('#tasksBtn') && state.currentEmployee) renderEmployeeTasks(state.currentEmployee);
  if(e.target.closest('#chatBtn') && state.currentEmployee) renderChatHome('emp');
  if(e.target.closest('#hideMirrorBtn')){
    const emp = state.currentEmployee; if(!emp) return;
    const ok = await showConfirmModal('להסתיר את כפתור המראה? אפשר להחזיר אותו בהגדרות ← עיצוב ותצוגה.', { yes: 'הסתרה' });
    if(!ok) return;
    const st = await getEmpSettings(emp.id);
    st.hideMirror = true;
    const r = await saveSettings(emp.id, st); if(r !== true){ st.hideMirror = false; showToast('שגיאה בשמירה'); return; }
    const g = document.querySelector('.mirror-grp'); if(g) g.remove();
    showToast('כפתור המראה הוסתר');
  }
});
</script>
</body>
</html>
