<style>
  :root{
    --paper: #EAF3FB;
    --paper-alt: #DCEBF5;
    --ink: #12293F;
    --ink-soft: #24425C;
    --line: #B9D3E3;
    --brass: #5FBF8F;
    --brass-dark: #3D9A6C;
    --clock-bg: #0F2A45;
    --clock-digit: #8FE3B8;
    --danger: #A23E30;
    --muted: #5B7186;
    --white: #FFFFFF;
    --brass-text: #FFFFFF;
    --surface: #FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Heebo', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  .display{ font-family:'Fraunces', serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  .wrap{ max-width:1000px; margin:0 auto; padding:28px 20px 60px; }

  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px; margin-bottom:28px;
  }
  header.topbar .brand{
    font-family:'Fraunces', serif; font-weight:700; font-size:26px; letter-spacing:.3px;
    display:flex; align-items:center; gap:10px;
  }
  header.topbar .brand .stamp{
    width:30px;height:30px;border-radius:50%;border:2px solid var(--brass);
    display:flex;align-items:center;justify-content:center;color:var(--brass-dark);
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;transform:rotate(-8deg);
  }
  .header-logo{ height:46px; width:auto; display:block; border-radius:8px; }
  .subtitle{ color:var(--muted); font-size:14px; margin-top:2px;}
  .btn{
    font-family:'Heebo',sans-serif; font-weight:500; font-size:14px;
    border:none; cursor:pointer; padding:10px 18px; border-radius:3px;
    background:var(--ink); color:var(--paper); transition:transform .08s ease, background .15s ease;
  }
  .btn:hover{ background:var(--ink-soft); }
  .btn:active{ transform:scale(.97); }
  .btn.brass{ background:var(--brass); color:var(--brass-text); }
  .btn.brass:hover{ background:var(--brass-dark); }
  .btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
  .btn.ghost:hover{ background:var(--ink); color:var(--paper); }
  .btn.danger{ background:transparent; color:var(--danger); border:1.5px solid var(--danger); padding:6px 12px; font-size:13px;}
  .btn.danger:hover{ background:var(--danger); color:var(--white); }
  .btn.small{ padding:6px 14px; font-size:13px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:26px; margin-bottom:22px;
  }
  .card h2, .card h3{ font-family:'Fraunces',serif; margin-top:0; }

  /* Landing / login */
  .center-stage{
    min-height:70vh; display:flex; align-items:center; justify-content:center;
  }
  .login-card{
    background:var(--white); border:1px solid var(--line); border-radius:8px;
    padding:40px 36px; width:100%; max-width:380px; text-align:center;
    box-shadow: 0 2px 0 var(--line);
  }
  .login-card .login-logo{
    max-width:220px; width:100%; height:auto; display:block;
    margin:0 auto 20px; border-radius:10px;
  }
  .login-card h1{ font-family:'Fraunces',serif; font-size:24px; margin:0 0 6px; }
  .login-card p.hint{ color:var(--muted); font-size:14px; margin-bottom:24px; }
  .role-pick{ display:flex; flex-direction:column; gap:12px; }

  input, select{
    font-family:'Heebo',sans-serif; font-size:15px; padding:10px 12px;
    border:1.5px solid var(--line); border-radius:4px; background:var(--paper);
    color:var(--ink); width:100%;
  }
  input:focus, select:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); }
  label{ display:block; font-size:13px; color:var(--muted); margin-bottom:5px; margin-top:14px; }
  .field:first-of-type label{ margin-top:0; }
  form .actions{ margin-top:22px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

  .error-msg{ color:var(--danger); font-size:13.5px; margin-top:10px; min-height:18px; }

  /* Dashboard layout */
  .tabs{ display:flex; gap:8px; margin-bottom:22px; border-bottom:1.5px solid var(--line); }
  .tab{
    padding:10px 18px; cursor:pointer; font-size:14.5px; color:var(--muted);
    border-bottom:2.5px solid transparent; margin-bottom:-1.5px; font-weight:500;
  }
  .tab.active{ color:var(--ink); border-bottom-color:var(--brass); }

  table{ width:100%; border-collapse:collapse; font-size:14.5px; }
  th{ text-align:right; font-weight:500; color:var(--muted); font-size:12.5px; text-transform:uppercase; letter-spacing:.4px; padding:8px 10px; border-bottom:1.5px solid var(--ink); }
  td{ padding:11px 10px; border-bottom:1px solid var(--line); }
  tr.total-row td{ font-weight:700; border-top:2px solid var(--ink); border-bottom:none; }
  .table-scroll{ overflow-x:auto; }

  .readout{
    background:var(--clock-bg); border-radius:8px; padding:22px 26px;
    display:flex; gap:36px; flex-wrap:wrap; margin-bottom:24px;
  }
  .readout .digit-block{ text-align:center; }
  .readout .digit-block .num{
    font-family:'IBM Plex Mono',monospace; font-size:34px; color:var(--clock-digit);
    letter-spacing:1px; font-weight:600;
  }
  .readout .digit-block .lbl{ color:#9FC3DA; font-size:12px; margin-top:4px; letter-spacing:.5px; }

  .emp-row-form{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .emp-row-form .field{ flex:1; min-width:120px; }

  .pill{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:500; }
  .avatar{ width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid var(--brass); flex-shrink:0; }
  .avatar-placeholder{
    width:44px; height:44px; border-radius:50%; border:2px solid var(--brass);
    background:var(--paper-alt); color:var(--brass-dark); display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:17px; flex-shrink:0;
  }
  .avatar.small, .avatar-placeholder.small{ width:32px; height:32px; font-size:13px; }
  .avatar-row{ display:flex; align-items:center; gap:12px; }
  @keyframes hourglass-flip{
    0%, 35%{ transform:rotate(0deg); }
    50%, 85%{ transform:rotate(180deg); }
    100%{ transform:rotate(360deg); }
  }
  .hourglass-spin{
    display:inline-block;
    font-size:30px;
    animation: hourglass-flip 4s ease-in-out infinite;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.15));
  }
  @keyframes coin-spin{
    0%{ transform:rotateY(0deg); }
    100%{ transform:rotateY(360deg); }
  }
  .coin-spin{
    display:inline-block;
    font-size:30px;
    animation: coin-spin 1.4s linear infinite;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.15));
  }
  .timer-row{ display:flex; align-items:center; gap:16px; margin-bottom:14px; }
  .collapsible-header{ display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none; }
  .collapsible-header .chevron{ color:var(--brass-dark); font-size:14px; transition:transform .15s ease; }
  .pill.hourly{ background:#E4EEE6; color:#2F5233; }
  .pill.fixed{ background:#EFE3D0; color:var(--brass-dark); }
  .pill.status-pending{ background:#EFE3D0; color:#8A6D2F; }
  .pill.status-approved{ background:#E4EEE6; color:#2F5233; }
  .pill.status-rejected{ background:#F6DEDA; color:var(--danger); }
  @keyframes reqSheetUp{
    from{ transform:translateY(100%); }
    to{ transform:translateY(0); }
  }
  @keyframes reqBackdropFade{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  .req-filter-backdrop{ animation:reqBackdropFade .2s ease-out; }
  .req-filter-sheet{ animation:reqSheetUp .3s cubic-bezier(.2,.85,.3,1); }
  .req-filter-sheet > div:active{ background:var(--paper-alt); }

  .list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 4px; border-bottom:1px solid var(--line);
  }
  .list-item.clickable{ cursor:pointer; }
  .list-item.clickable:hover{ background:var(--paper-alt); border-radius:6px; }
  .list-item:last-child{ border-bottom:none; }
  .list-item .name{ font-weight:600; }
  .list-item .meta{ color:var(--muted); font-size:13px; margin-top:2px; }

  .row-actions{ display:flex; gap:8px; }

  .empty-state{ text-align:center; padding:40px 20px; color:var(--muted); }

  .top-actions{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}

  select.month-picker, input.month-picker{ width:auto; }

  @media (max-width:600px){
    .wrap{ padding:18px 12px 40px; }
    .readout{ gap:20px; padding:18px; }
    .readout .digit-block .num{ font-size:26px; }
    .login-card{ padding:30px 22px; }
  }

  /* Custom confirm modal */
  .confirm-overlay{
    position:fixed; inset:0; background:rgba(20,32,25,.55);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; padding:20px;
  }
  .confirm-box{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:30px 28px; max-width:360px; width:100%; text-align:center;
    box-shadow:0 4px 0 var(--line);
  }
  @keyframes blink-text{
    0%, 100%{ opacity:1; }
    50%{ opacity:.25; }
  }
  .confirm-box .confirm-msg{
    font-family:'Fraunces', serif; font-weight:600; font-size:19px;
    color:var(--danger); margin:0 0 26px;
    animation: blink-text 1s ease-in-out infinite;
  }
  .confirm-box .actions{ justify-content:center; margin-top:0; }
  .bills-wrap{ display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin-top:6px; }
  .bill-group{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .bill-group svg{ filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .bill-count{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); }

  /* Post-login welcome splash */
  .welcome-overlay{
    position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(10,20,30,.82);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    z-index:2000; padding:24px; overflow:hidden;
  }
  .welcome-overlay .welcome-bg{
    position:absolute; top:0; right:0; bottom:0; left:0;
    width:100%; height:100%; object-fit:contain; z-index:-1;
  }
  .welcome-text{
    color:#E8C97A; font-family:'Fraunces', serif; font-weight:700; font-size:24px;
    margin-bottom:20px; text-align:center; max-width:90vw;
    text-shadow:0 2px 10px rgba(0,0,0,.7), 0 0 18px rgba(232,201,122,.35);
  }
  .welcome-text span{ display:inline-block; animation: letter-dance 1s ease-in-out infinite; }
  @keyframes letter-dance{
    0%, 100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-10px) rotate(-5deg); }
  }
  .welcome-skip{
    position:absolute; bottom:14px; left:14px; color:rgba(255,255,255,.6);
    font-size:11px; cursor:pointer; text-decoration:underline;
    background:none; border:none; font-family:'Heebo', sans-serif;
  }

  /* ---------- New: entrance animations ---------- */
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .card{ animation: cardIn .5s cubic-bezier(.16,1,.3,1) both; }
  .card:nth-of-type(1){ animation-delay:.02s; }
  .card:nth-of-type(2){ animation-delay:.08s; }
  .card:nth-of-type(3){ animation-delay:.14s; }
  .card:nth-of-type(4){ animation-delay:.2s; }
  .card:nth-of-type(5){ animation-delay:.26s; }
  .card:nth-of-type(n+6){ animation-delay:.3s; }

  @keyframes listItemIn{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .list-item{ animation: listItemIn .35s ease both; }
  .list-item:nth-child(1){ animation-delay:.02s; }
  .list-item:nth-child(2){ animation-delay:.06s; }
  .list-item:nth-child(3){ animation-delay:.1s; }
  .list-item:nth-child(4){ animation-delay:.14s; }
  .list-item:nth-child(5){ animation-delay:.18s; }
  .list-item:nth-child(6){ animation-delay:.22s; }
  .list-item:nth-child(7){ animation-delay:.26s; }
  .list-item:nth-child(n+8){ animation-delay:.3s; }

  @keyframes pillPop{
    0%{ transform:scale(.6); opacity:0; }
    70%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); }
  }
  .pill{ animation: pillPop .35s cubic-bezier(.34,1.56,.64,1) both; }

  /* ---------- New: button feedback ---------- */
  .btn{ position:relative; overflow:hidden; }
  .btn .ripple{
    position:absolute; border-radius:50%; transform:scale(0);
    background:rgba(255,255,255,.55); pointer-events:none;
    animation: rippleAnim .55s ease-out forwards;
  }
  .btn.ghost .ripple, .btn.danger .ripple{ background:rgba(18,41,63,.25); }
  @keyframes rippleAnim{
    to{ transform:scale(2.6); opacity:0; }
  }

  @keyframes ctaPulse{
    0%, 100%{ box-shadow:0 0 0 0 rgba(95,191,143,.55); }
    50%{ box-shadow:0 0 0 9px rgba(95,191,143,0); }
  }
  #clockInForm button[type="submit"]{ animation: ctaPulse 2.2s ease-in-out infinite; }
  #clockInForm button[type="submit"]:hover{ animation-play-state:paused; }

  /* ---------- New: form error shake ---------- */
  @keyframes shakeX{
    10%,90%{ transform:translateX(-1px); }
    20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); }
    40%,60%{ transform:translateX(4px); }
  }
  .shake-field{ animation: shakeX .45s cubic-bezier(.36,.07,.19,.97) both; }
  .error-msg.shake-field{ animation: shakeX .45s cubic-bezier(.36,.07,.19,.97) both; }

  /* ---------- New: success toast ---------- */
  @keyframes toastIn{
    from{ transform:translate(-50%,-14px); opacity:0; }
    to{ transform:translate(-50%,0); opacity:1; }
  }
  @keyframes toastOut{
    from{ transform:translate(-50%,0); opacity:1; }
    to{ transform:translate(-50%,-14px); opacity:0; }
  }
  .toast{
    position:fixed; top:18px; left:50%; z-index:3000;
    background:var(--ink); color:var(--paper); font-family:'Heebo',sans-serif;
    font-size:14px; font-weight:500; padding:12px 20px; border-radius:8px;
    box-shadow:0 6px 18px rgba(0,0,0,.25); display:flex; align-items:center; gap:8px;
    animation: toastIn .35s cubic-bezier(.2,.85,.3,1) both;
  }
  .toast.out{ animation: toastOut .3s ease-in both; }
  .toast .toast-check{
    display:inline-block; width:18px; height:18px; border-radius:50%;
    background:var(--brass); color:#fff; font-size:12px; line-height:18px; text-align:center; flex-shrink:0;
  }

  /* ---------- New: end-of-day salute overlay ---------- */
  .salute-overlay{
    position:fixed; inset:0; z-index:4000; background:rgba(10,20,30,.55);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    animation:
      saluteBgFade .3s ease-out both,
      saluteBgFadeOut .7s ease-in 2.95s forwards;
  }
  @keyframes saluteBgFade{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes saluteBgFadeOut{ from{ opacity:1; } to{ opacity:0; } }
  .salute-overlay .salute-emoji{
    font-size:48px; line-height:1; opacity:0;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.35));
    animation:
      saluteAppear .35s ease-out both,
      saluteGrow 2.6s ease-in-out .35s both,
      saluteFadeOut .7s ease-in 2.95s both;
  }
  @keyframes saluteAppear{
    from{ opacity:0; transform:scale(.6); }
    to{ opacity:1; transform:scale(1); }
  }
  @keyframes saluteGrow{
    from{ font-size:48px; }
    to{ font-size:min(95vw, 95vh); }
  }
  @keyframes saluteFadeOut{
    from{ opacity:1; }
    to{ opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .list-item, .pill, #clockInForm button[type="submit"], .toast, .toast.out{ animation:none !important; }
    .salute-overlay, .salute-overlay .salute-emoji{ animation:none !important; }
  }
</style>

// ---------- New: generic button ripple ----------
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn');
  if(!btn) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
});

// ---------- New: auto-shake any field whose error-msg gets filled ----------
new MutationObserver((mutations) => {
  const seen = new Set();
  for(const m of mutations){
    const el = m.target.nodeType === 1 ? m.target : m.target.parentElement;
    if(!el) continue;
    const errEl = el.classList && el.classList.contains('error-msg') ? el : el.closest && el.closest('.error-msg');
    if(errEl && errEl.textContent.trim() && !seen.has(errEl)){
      seen.add(errEl);
      const field = errEl.previousElementSibling;
      [errEl, field].forEach(node => {
        if(!node) return;
        node.classList.remove('shake-field');
        void node.offsetWidth; // restart animation
        node.classList.add('shake-field');
      });
    }
  }
}).observe(app, { subtree:true, characterData:true, childList:true });

// ---------- New: end-of-day salute splash ----------
function showSaluteSplash(){
  const overlay = document.createElement('div');
  overlay.className = 'salute-overlay';
  overlay.innerHTML = `<div class="salute-emoji">🫡</div>`;
  overlay.addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);
  setTimeout(() => overlay.remove(), 3700);
}
function showToast(message){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="toast-check">✓</span><span>${escapeHtml(message)}</span>`;
  document.body.appendChild(t);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 320);
  }, 2400);
}

const monthNames = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

function currentMonthStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(ym){
  const [y,m] = ym.split('-');
  return monthNames[parseInt(m,10)-1] + ' ' + y;
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtMoney(n){
  return '₪' + n.toLocaleString('he-IL', {minimumFractionDigits:0, maximumFractionDigits:2});
}
function fmtHours(n){
  return n.toLocaleString('he-IL', {minimumFractionDigits:0, maximumFractionDigits:2});
}

// ---------- sound effects (synthesized, no external audio files) ----------
let audioCtx = null;
function getAudioCtx(){
  try{
    if(!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function playTone(ctx, freq, startTime, duration, type, gain){
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, startTime);
  g.gain.linearRampToValueAtTime(gain, startTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(g).connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}
function playChaChing(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const now = ctx.currentTime;
    playTone(ctx, 1568, now, 0.12, 'triangle', 0.25);
    playTone(ctx, 2093, now + 0.07, 0.2, 'triangle', 0.22);
    const bufferSize = Math.floor(ctx.sampleRate * 0.15);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i = 0; i < bufferSize; i++){ data[i] = (Math.random()*2 - 1) * (1 - i/bufferSize); }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 4000;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.09, now + 0.05);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    noise.connect(filter).connect(noiseGain).connect(ctx.destination);
    noise.start(now + 0.05);
  }catch(e){ /* ignore audio errors */ }
}
function playSuccessChime(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const now = ctx.currentTime;
    playTone(ctx, 880, now, 0.12, 'sine', 0.22);
    playTone(ctx, 1318.5, now + 0.09, 0.2, 'sine', 0.22);
  }catch(e){ /* ignore audio errors */ }
}
function speakHebrew(text){
  try{
    if(!('speechSynthesis' in window)) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'he-IL';
    utter.rate = 1;
    utter.pitch = 0.55; // notably deeper, to push toward a masculine-sounding tone
    const speakNow = () => {
      const voices = window.speechSynthesis.getVoices();
      const heVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('he'));
      let voice = heVoices.find(v => /(male|man|^m\b)/i.test(v.name) && !/female|woman/i.test(v.name));
      if(!voice) voice = heVoices.find(v => !/female|woman/i.test(v.name));
      if(!voice) voice = heVoices[0];
      if(voice) utter.voice = voice;
      window.speechSynthesis.speak(utter);
    };
    if(window.speechSynthesis.getVoices().length === 0){
      window.speechSynthesis.addEventListener('voiceschanged', speakNow, { once: true });
    }else{
      speakNow();
    }
  }catch(e){ /* ignore speech errors */ }
}

// ---------- personal color theme (per-employee background/text/accent color choices) ----------
function hexToRgb(hex){
  const clean = (hex || '').replace('#', '');
  if(!/^[0-9a-fA-F]{6}$/.test(clean)) return null;
  const num = parseInt(clean, 16);
  return { r: (num >> 16) & 0xFF, g: (num >> 8) & 0xFF, b: num & 0xFF };
}
function rgbToHex(r, g, b){
  return '#' + [r, g, b].map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join('');
}
function darkenHexColor(hex, amount){
  amount = amount == null ? 0.25 : amount;
  const rgb = hexToRgb(hex);
  if(!rgb) return hex;
  return rgbToHex(rgb.r * (1 - amount), rgb.g * (1 - amount), rgb.b * (1 - amount));
}
// Blends two colors together (weight 0 = pure a, weight 1 = pure b).
function mixHexColors(hexA, hexB, weight){
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  if(!a || !b) return hexA;
  return rgbToHex(
    a.r + (b.r - a.r) * weight,
    a.g + (b.g - a.g) * weight,
    a.b + (b.b - a.b) * weight
  );
}
// Perceived brightness (0 = black, 1 = white) — good enough to decide light-vs-dark, not full WCAG math.
function relativeBrightness(hex){
  const rgb = hexToRgb(hex);
  if(!rgb) return 1;
  return (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b) / 255;
}
function isLightColor(hex){ return relativeBrightness(hex) > 0.6; }
// Picks a readable text color for a given background — dark ink for light backgrounds, off-white for dark ones.
function getContrastTextColor(hex){ return isLightColor(hex) ? '#1A2733' : '#F5FAFF'; }

const DEFAULT_THEME_COLOR = '#5FBF8F'; // accent (buttons / highlights)
const DEFAULT_BG_COLOR = '#EAF3FB';    // page background
const DEFAULT_INK_COLOR = '#12293F';   // main text color

function applyEmployeeTheme(settings){
  settings = settings || {};
  const accent = settings.themeColor || DEFAULT_THEME_COLOR;
  const bgCustomized = !!settings.bgColor;
  const bg = settings.bgColor || DEFAULT_BG_COLOR;
  // Only fall back to auto-contrast once the person has actually customized the background;
  // with an untouched background we keep the app's exact original ink tone.
  const text = settings.textColor || (bgCustomized ? getContrastTextColor(bg) : DEFAULT_INK_COLOR);
  const bgIsLight = isLightColor(bg);
  // Card/modal "surface" stays in the same light-or-dark family as the background (so the auto-picked
  // text color, chosen to contrast with the background, also reads fine on top of these panels) —
  // but defaults to plain white when the background hasn't been customized, matching the original look.
  const surface = bgCustomized ? mixHexColors(bg, bgIsLight ? '#FFFFFF' : '#000000', bgIsLight ? 0.75 : 0.15) : '#FFFFFF';
  const root = document.documentElement.style;
  root.setProperty('--brass', accent);
  root.setProperty('--brass-dark', darkenHexColor(accent));
  root.setProperty('--brass-text', getContrastTextColor(accent));
  root.setProperty('--paper', bg);
  root.setProperty('--paper-alt', mixHexColors(bg, bgIsLight ? '#000000' : '#FFFFFF', 0.08));
  root.setProperty('--ink', text);
  root.setProperty('--ink-soft', mixHexColors(text, bg, 0.35));
  root.setProperty('--surface', surface);
}
function resetTheme(){
  ['--brass', '--brass-dark', '--brass-text', '--paper', '--paper-alt', '--ink', '--ink-soft', '--surface'].forEach(v => {
    document.documentElement.style.removeProperty(v);
  });
}

function calcPay(emp, hoursTotal){
  if(emp.payType === 'fixed'){ return emp.rate; }
  return hoursTotal * emp.rate;
}
function computeHoursFromRange(start, end){
  if(!start || !end) return null;
  const sParts = start.split(':').map(Number);
  const eParts = end.split(':').map(Number);
  const sh = sParts[0], sm = sParts[1], ss = sParts[2] || 0;
  const eh = eParts[0], em = eParts[1], es = eParts[2] || 0;
  let startSec = sh*3600 + sm*60 + ss;
  let endSec = eh*3600 + em*60 + es;
  if(endSec < startSec) endSec += 24*3600; // crosses midnight
  const diffHours = (endSec - startSec) / 3600;
  return Math.round(diffHours * 1e6) / 1e6;
}
function nowTimeStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
}
// Net worked hours for an entry, subtracting any completed breaks. Returns null if the entry is still open (no end time yet).
function computeEntryHours(entry){
  if(!entry.end) return null;
  const gross = computeHoursFromRange(entry.start, entry.end);
  if(gross === null) return null;
  const breaksHours = (entry.breaks || []).reduce((s,b) => {
    if(!b.end) return s;
    const h = computeHoursFromRange(b.start, b.end);
    return s + (h || 0);
  }, 0);
  return Math.max(0, Math.round((gross - breaksHours) * 1e6) / 1e6);
}
function findOpenEntryToday(entries){
  const t = todayStr();
  return entries.find(e => e.date === t && !e.end) || null;
}
// Builds a plain-text hours report for the "email my hours to the manager" feature.
function buildHoursEmailBody(emp, month, entries, totalHours, pay, includePay){
  const lines = [];
  lines.push(`חודש: ${monthLabel(month)}`);
  lines.push('');
  if(!entries.length){
    lines.push('(אין רישומי שעות בחודש זה)');
  } else {
    entries.forEach(e => {
      const h = computeEntryHours(e);
      const closedBreaks = (e.breaks || []).filter(b => b.end);
      const breaksTxt = closedBreaks.length
        ? ` | הפסקות: ${closedBreaks.map(b => hhmm(b.start) + '-' + hhmm(b.end)).join(', ')}`
        : '';
      lines.push(`${e.date} | ${hhmm(e.start)}–${e.end ? hhmm(e.end) : 'פתוח'} | ${h !== null ? fmtHours(h) + ' שעות' : '—'}${breaksTxt}`);
    });
  }
  lines.push('');
  lines.push(`סה"כ שעות: ${fmtHours(totalHours)}`);
  if(includePay){
    // Deliberately using the Hebrew letters ש"ח instead of the ₪ symbol: a number followed by plain
    // Hebrew text is the normal, always-safe RTL pattern. The ₪ symbol's Unicode bidi class is a
    // "European Terminator", which some mail clients render in an unpredictable position next to
    // a number inside an RTL paragraph — spelling it out in Hebrew avoids that class of bug entirely.
    const payStr = pay.toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    lines.push(`סה"כ לתשלום: ${payStr} ש"ח`);
  }
  return lines.join('\n');
}
// Same report, but as a clean styled HTML table — used only for the automatic EmailJS send
// (the mailto draft still uses the plain-text version above, since mail apps show that as-typed).
function buildHoursEmailHtml(emp, month, entries, totalHours, pay, includePay){
  const payStr = pay.toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const rowsHtml = entries.length ? entries.map(e => {
    const h = computeEntryHours(e);
    const closedBreaks = (e.breaks || []).filter(b => b.end);
    // <bdi> isolates each "start–end" pair as its own left-to-right unit — without it, the RTL
    // table cell can visually flip which time comes first (exactly like the ₪ sign issue earlier).
    const breaksTxt = closedBreaks.length
      ? closedBreaks.map(b => `<bdi>${escapeHtml(hhmm(b.start))}–${escapeHtml(hhmm(b.end))}</bdi>`).join(', ')
      : '—';
    return `
      <tr>
        <td dir="ltr" style="padding:9px 10px; border:1px solid #ddd; text-align:right;">${escapeHtml(e.date)}</td>
        <td dir="ltr" style="padding:9px 10px; border:1px solid #ddd; text-align:right;">${escapeHtml(hhmm(e.start))}</td>
        <td dir="ltr" style="padding:9px 10px; border:1px solid #ddd; text-align:right;">${e.end ? escapeHtml(hhmm(e.end)) : 'פתוח'}</td>
        <td dir="ltr" style="padding:9px 10px; border:1px solid #ddd; text-align:right; font-weight:600;">${h !== null ? escapeHtml(fmtHours(h)) : '—'}</td>
        <td style="padding:9px 10px; border:1px solid #ddd; color:#666;">${breaksTxt}</td>
      </tr>`;
  }).join('') : `
      <tr><td colspan="5" style="padding:14px; text-align:center; color:#666; border:1px solid #ddd;">אין רישומי שעות בחודש זה</td></tr>`;

  return `
    <div dir="rtl" align="right" style="font-family:Arial,Helvetica,sans-serif; color:#222; max-width:600px; margin:0 0 0 auto;">
      <p style="margin:0 0 14px 0; font-size:15px;">חודש: <strong>${escapeHtml(monthLabel(month))}</strong></p>
      <table style="width:100%; border-collapse:collapse; font-size:14px; text-align:right;">
        <thead>
          <tr style="background:#f2f2f2;">
            <th style="padding:9px 10px; border:1px solid #ddd; text-align:right;">תאריך</th>
            <th style="padding:9px 10px; border:1px solid #ddd; text-align:right;">משעה</th>
            <th style="padding:9px 10px; border:1px solid #ddd; text-align:right;">עד שעה</th>
            <th style="padding:9px 10px; border:1px solid #ddd; text-align:right;">שעות</th>
            <th style="padding:9px 10px; border:1px solid #ddd; text-align:right;">הפסקות</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <table style="width:100%; border-collapse:collapse; font-size:15px; margin-top:14px;">
        <tr>
          <td style="padding:8px 10px; text-align:right;">סה"כ שעות</td>
          <td style="padding:8px 10px; text-align:right; font-weight:700;">${escapeHtml(fmtHours(totalHours))}</td>
        </tr>
        ${includePay ? `
        <tr>
          <td style="padding:8px 10px; text-align:right;">סה"כ לתשלום</td>
          <td style="padding:8px 10px; text-align:right; font-weight:700;">${escapeHtml(payStr)} ש"ח</td>
        </tr>
        ` : ''}
      </table>
    </div>`;
}

// ---------- Excel import helpers ----------
function parseCellDate(value){
  if(value === null || value === undefined || value === '') return null;
  if(value instanceof Date){
    return value.getFullYear() + '-' + String(value.getMonth()+1).padStart(2,'0') + '-' + String(value.getDate()).padStart(2,'0');
  }
  if(typeof value === 'number'){
    try{
      const info = XLSX.SSF.parse_date_code(value);
      if(!info) return null;
      return info.y + '-' + String(info.m).padStart(2,'0') + '-' + String(info.d).padStart(2,'0');
    }catch(e){ return null; }
  }
  if(typeof value === 'string'){
    const s = value.trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(m) return m[1] + '-' + m[2].padStart(2,'0') + '-' + m[3].padStart(2,'0');
    m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m) return m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
    return null;
  }
  return null;
}
function parseCellTime(value){
  if(value === null || value === undefined || value === '') return null;
  if(value instanceof Date){
    return String(value.getHours()).padStart(2,'0') + ':' + String(value.getMinutes()).padStart(2,'0');
  }
  if(typeof value === 'number'){
    const totalMinutes = Math.round(value * 24 * 60);
    const h = Math.floor(totalMinutes / 60) % 24;
    const m = totalMinutes % 60;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  }
  if(typeof value === 'string'){
    const s = value.trim();
    const m = s.match(/^(\d{1,2}):(\d{2})/);
    if(m) return m[1].padStart(2,'0') + ':' + m[2];
    return null;
  }
  return null;
}
async function parseExcelFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: null });
  if(!rows || rows.length === 0) return { rows: [], error: 'הקובץ ריק' };

  let startRow = 0, dateCol = 0, startCol = 1, endCol = 2;
  const looksLikeData = parseCellDate(rows[0][0]) !== null;
  if(!looksLikeData){
    const header = rows[0].map(h => (h === null || h === undefined) ? '' : h.toString().trim().toLowerCase());
    const findCol = (keywords) => header.findIndex(h => keywords.some(k => h.includes(k)));
    const dc = findCol(['תאריך','date']);
    const sc = findCol(['משעה','התחלה','start']);
    const ec = findCol(['עד','סיום','end']);
    if(dc >= 0) dateCol = dc;
    if(sc >= 0) startCol = sc;
    if(ec >= 0) endCol = ec;
    startRow = 1;
  }

  const results = [];
  for(let i = startRow; i < rows.length; i++){
    const row = rows[i];
    if(!row || row.every(c => c === null || c === '')) continue;
    const date = parseCellDate(row[dateCol]);
    const start = parseCellTime(row[startCol]);
    const end = parseCellTime(row[endCol]);
    let error = null;
    let hours = null;
    if(!date) error = 'תאריך לא תקין';
    else if(!start || !end) error = 'שעה לא תקינה';
    else {
      hours = computeHoursFromRange(start, end);
      if(hours === null || hours <= 0) error = 'טווח שעות לא תקין';
    }
    results.push({ rowNum: i + 1, date, start, end, hours, error });
  }
  return { rows: results, error: null };
}

let authReady = false;
let liveTimerInterval = null;
function stopLiveTimer(){
  if(liveTimerInterval){ clearInterval(liveTimerInterval); liveTimerInterval = null; }
}
function startLiveTimer(sinceTimeStr){
  stopLiveTimer();
  const el = document.getElementById('liveTimer');
  if(!el) return;
  function update(){
    const target = document.getElementById('liveTimer');
    if(!target){ stopLiveTimer(); return; }
    const now = new Date();
    const [h, m, s] = sinceTimeStr.split(':').map(Number);
    const since = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, s || 0);
    let diffMs = now - since;
    if(diffMs < 0) diffMs += 24 * 60 * 60 * 1000; // crossed midnight
    const totalSec = Math.floor(diffMs / 1000);
    const hh = Math.floor(totalSec / 3600);
    const mm = Math.floor((totalSec % 3600) / 60);
    const ss = totalSec % 60;
    target.textContent = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
  }
  update();
  liveTimerInterval = setInterval(update, 1000);
}

// Live "earnings so far" ticker for the current open work session (hourly employees only).
// Naturally freezes during a break: elapsed-since-clockin and elapsed-since-break-start grow
// at the same rate, so their difference (net worked time) stays constant while on break.
let liveMoneyInterval = null;
function stopLiveMoneyTimer(){
  if(liveMoneyInterval){ clearInterval(liveMoneyInterval); liveMoneyInterval = null; }
}
function startLiveMoneyTimer(emp, openEntry, onBreak, lastBreak){
  stopLiveMoneyTimer();
  const el = document.getElementById('liveMoney');
  if(!el || emp.payType === 'fixed') return;
  function secOfDay(t){
    const [h, m, s] = t.split(':').map(Number);
    return h*3600 + m*60 + (s || 0);
  }
  const startSec = secOfDay(openEntry.start);
  const completedBreaksSec = (openEntry.breaks || []).reduce((sum, b) => {
    if(!b.end) return sum;
    let bs = secOfDay(b.start), be = secOfDay(b.end);
    if(be < bs) be += 24*3600;
    return sum + (be - bs);
  }, 0);
  function update(){
    const target = document.getElementById('liveMoney');
    if(!target){ stopLiveMoneyTimer(); return; }
    const now = new Date();
    const nowSec = now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds();
    let totalElapsed = nowSec - startSec;
    if(totalElapsed < 0) totalElapsed += 24*3600;
    let ongoingBreakSec = 0;
    if(onBreak && lastBreak){
      let diff = nowSec - secOfDay(lastBreak.start);
      if(diff < 0) diff += 24*3600;
      ongoingBreakSec = diff;
    }
    const workSec = Math.max(0, totalElapsed - completedBreaksSec - ongoingBreakSec);
    const money = (workSec / 3600) * emp.rate;
    target.textContent = '₪' + money.toLocaleString('he-IL', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  update();
  liveMoneyInterval = setInterval(update, 1000);
}

// Watches the clock while the employee is on break / paused, so that if 20:00 arrives while the tab
// stays open, we re-render immediately and let the auto-close logic in renderEmployeeDashboard kick in
// (rather than waiting for the employee to manually refresh or click something).
let breakWatchdogInterval = null;
function stopBreakWatchdog(){
  if(breakWatchdogInterval){ clearInterval(breakWatchdogInterval); breakWatchdogInterval = null; }
}
function startBreakWatchdog(emp){
  stopBreakWatchdog();
  breakWatchdogInterval = setInterval(() => {
    if(new Date().getHours() >= 20){
      stopBreakWatchdog();
      renderEmployeeDashboard(emp, null, true);
    }
  }, 15000);
}

// Keeps a time-input field (like "arrival time") showing the real current time live,
// so the user never has to refresh the page. Stops updating the moment the user touches it themselves.
let clockFieldIntervals = [];
function stopClockFieldTimers(){
  clockFieldIntervals.forEach(id => clearInterval(id));
  clockFieldIntervals = [];
}
function bindLiveTimeField(inputId){
  const el = document.getElementById(inputId);
  if(!el) return;
  let userEdited = false;
  const markEdited = () => { userEdited = true; };
  el.addEventListener('input', markEdited);
  el.addEventListener('focus', markEdited);
  el.addEventListener('blur', () => {
    // typing just HH:MM is fine — auto-complete the seconds so the value stays valid
    const v = el.value.trim();
    if(/^([01]\d|2[0-3]):[0-5]\d$/.test(v)){ el.value = v + ':00'; }
  });
  const id = setInterval(() => {
    if(userEdited){ clearInterval(id); return; }
    const stillThere = document.getElementById(inputId);
    if(!stillThere){ clearInterval(id); return; }
    stillThere.value = nowTimeStr();
  }, 1000);
  clockFieldIntervals.push(id);
}
function wireNowButton(buttonId, inputId){
  const btn = document.getElementById(buttonId);
  const input = document.getElementById(inputId);
  if(btn && input){
    btn.onclick = () => { input.value = nowTimeStr(); };
  }
}
// מטפל בלחיצה על קישור "אישור"/"דחייה" שהגיע במייל ההתראה למנהל - עובד בלי צורך בהתחברות
async function handleEmailRequestAction(reqId, action){
  const showResult = (title, message, isError) => {
    app.innerHTML = `
      <div class="center-stage">
        <div class="login-card">
          <h1 style="${isError ? 'color:var(--danger);' : ''}">${escapeHtml(title)}</h1>
          <p class="hint">${escapeHtml(message)}</p>
          <button type="button" class="btn brass" onclick="location.href = location.pathname">חזרה לאתר</button>
        </div>
      </div>
    `;
  };
  const list = await loadRequests();
  if(list === null){
    showResult('שגיאת תקשורת', 'לא הצלחנו להתחבר לשרת. נסו שוב בעוד כמה רגעים.', true);
    return;
  }
  const req = list.find(r => r.id === reqId);
  if(!req){
    showResult('הבקשה לא נמצאה', 'ייתכן שהיא כבר טופלה או נמחקה.', true);
    return;
  }
  if(req.status !== 'pending'){
    const STATUS_LABEL = { approved: 'אושרה', rejected: 'נדחתה' };
    showResult('הבקשה כבר טופלה', `הבקשה של ${req.empName} כבר ${STATUS_LABEL[req.status] || req.status} קודם לכן.`, false);
    return;
  }
  req.status = action === 'approve' ? 'approved' : 'rejected';
  req.respondedAt = new Date().toISOString();
  req.seenByEmployee = false;
  const ok = await saveRequests(list);
  if(ok !== true){
    showResult('שגיאה בשמירה', 'שגיאה: ' + ok, true);
    return;
  }
  showResult(
    action === 'approve' ? '✅ הבקשה אושרה' : '❌ הבקשה נדחתה',
    `הבקשה של ${req.empName} ("${req.text}") ${action === 'approve' ? 'אושרה' : 'נדחתה'} בהצלחה. העובד יראה את הסטטוס העדכני באתר.`,
    false
  );
}

async function init(){
  app.innerHTML = '<div class="empty-state">טוען...</div>';

  // טיפול בלחיצה על קישור "אישור"/"דחייה" ישירות מתוך מייל ההתראה, בלי צורך בהתחברות
  const urlParams = new URLSearchParams(window.location.search);
  const reqId = urlParams.get('req');
  const reqAction = urlParams.get('action');
  if(reqId && (reqAction === 'approve' || reqAction === 'reject')){
    await handleEmailRequestAction(reqId, reqAction);
    return;
  }

  const loadedEmployees = await loadEmployees();
  if(loadedEmployees === null){
    app.innerHTML = `
      <div class="center-stage">
        <div class="login-card">
          <h1>שגיאת התחברות לשרת</h1>
          <p class="hint">לא הצלחנו לטעון את רשימת העובדים מהשרת (בעיית תקשורת זמנית). כדי להימנע מאובדן מידע, האתר לא ממשיך עד שהטעינה תצליח.</p>
          <button type="button" class="btn brass" onclick="location.reload()">ניסיון נוסף</button>
        </div>
      </div>
    `;
    return;
  }
  state.employees = loadedEmployees;
  state.loading = false;

  onAuthStateChanged(auth, (user) => {
    if(authReady) return; // only handle the initial resolution; explicit sign-in/out render themselves
    authReady = true;
    if(user){
      state.isAdmin = true;
      state.adminEmail = user.email;
      renderAdminDashboard('summary');
      return;
    }
    const session = loadSession();
    if(session && session.role === 'employee'){
      const emp = state.employees.find(x => x.id === session.empId);
      if(emp){ renderEmployeeDashboard(emp); return; }
      clearSession();
    }
    renderLanding();
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Display-only helper: shows HH:MM even though the stored value may include seconds (used for accurate calculation)
function hhmm(t){
  return t ? t.slice(0,5) : t;
}
// Cleans up a manually-typed time value: strips invisible RTL/LTR direction marks that
// mobile keyboards sometimes insert around digits in an RTL page, then validates the format.
// Returns a clean "HH:MM:SS" string, or null if the value isn't a valid time.
function sanitizeTimeInput(raw){
  if(!raw) return null;
  let v = raw.replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069\s]/g, '');
  if(/^([01]\d|2[0-3]):[0-5]\d$/.test(v)) v += ':00';
  if(!/^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$/.test(v)) return null;
  return v;
}

    overlay.onclick = (e) => { if(e.target === overlay) cleanup(false); };
  });
}

// Lets the employee pick how to send their hours report: automatically via a manager-configured

// מציג לעובד את הבקשות שלו למנהל (עם סטטוס) ומאפשר לשלוח בקשה חדשה
// שולח למנהל התראת מייל על בקשה חדשה, עם קישורי אישור/דחייה ישירים. לא חוסם ולא מציג
// שגיאה לעובד אם זה נכשל - זו רק "התראה נחמד שיהיה", הבקשה עצמה כבר נשמרה במסד הנתונים.
async function notifyManagerOfRequest(emp, reqId, text){
  try{
    const [managerEmail, emailjsConfig] = await Promise.all([loadManagerEmail(), loadEmailjsConfig()]);
    if(!managerEmail || !emailjsConfig || !emailjsConfig.publicKey || !emailjsConfig.templateId || !window.emailjs) return;
    const serviceId = emp.emailjsServiceId || (emailjsConfig.senders && emailjsConfig.senders[0] && emailjsConfig.senders[0].serviceId);
    if(!serviceId) return;
    const baseUrl = window.location.origin + window.location.pathname;
    const approveUrl = `${baseUrl}?req=${encodeURIComponent(reqId)}&action=approve`;
    const rejectUrl = `${baseUrl}?req=${encodeURIComponent(reqId)}&action=reject`;
    const html = `
      <div dir="rtl" align="right" style="font-family:Arial,Helvetica,sans-serif; color:#222; max-width:520px; margin:0 0 0 auto;">
        <p style="font-size:15px;">התקבלה בקשה חדשה מ-<strong>${escapeHtml(emp.name)}</strong>:</p>
        <p style="font-size:15px; background:#f2f2f2; padding:12px; border-radius:6px; white-space:pre-wrap;">${escapeHtml(text)}</p>
        <div style="margin-top:18px;">
          <a href="${approveUrl}" style="display:inline-block; padding:10px 22px; background:#3D9A6C; color:#fff; text-decoration:none; border-radius:5px; font-weight:bold; margin-inline-end:10px;">✅ אישור</a>
          <a href="${rejectUrl}" style="display:inline-block; padding:10px 22px; background:#A23E30; color:#fff; text-decoration:none; border-radius:5px; font-weight:bold;">❌ דחייה</a>
        </div>
        <p style="font-size:12px; color:#888; margin-top:16px;">לחיצה על אחד הכפתורים תעדכן את הבקשה מיידית, בלי צורך להתחבר לאתר.</p>
      </div>`;
    await window.emailjs.send(serviceId, emailjsConfig.templateId, {
      to_email: managerEmail,
      subject: `בקשה חדשה מ-${emp.name}`,
      message: html,
      employee_name: emp.name
    }, { publicKey: emailjsConfig.publicKey });
  }catch(e){ console.error('notifyManagerOfRequest error', e); }
}

// לוחצים והחזיקו לזמן קצר = מחיקה; לחיצה רגילה = פתיחה. עובד גם במגע וגם בעכבר.
function attachLongPress(el, onLongPress, onClick){
  let timer = null, firedLongPress = false;
  const start = () => {
    firedLongPress = false;
    timer = setTimeout(() => { firedLongPress = true; onLongPress(); }, 550);
  };
  const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
  const endTouch = (e) => {
    if(e && e.cancelable) e.preventDefault(); // מונע מהדפדפן ליצור לחיצת-עכבר מדומה כמה מילישניות אחר כך
    const wasLong = firedLongPress;
    cancel();
    if(!wasLong) onClick();
  };
  const endMouse = () => { const wasLong = firedLongPress; cancel(); if(!wasLong) onClick(); };
  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchend', endTouch);
  el.addEventListener('touchmove', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', endMouse);
  el.addEventListener('mouseleave', cancel);
}

    return;
  }

  // סימון בקשות שנענו כ"נצפו" עבור העובד הזה (מסיר את הנקודה האדומה בדשבורד בפעם הבאה)
  let changed = false;
  list.forEach(r => {
    if(r.empId === emp.id && r.status !== 'pending' && r.seenByEmployee === false){
      r.seenByEmployee = true;
      changed = true;
    }
  });
  if(changed) saveRequests(list); // ברקע, לא חוסם את התצוגה

  const STATUS_LABEL = { pending: 'ממתינה', approved: 'אושרה', rejected: 'נדחתה' };
  const STATUS_ICON = { pending: '⏳', approved: '✅', rejected: '❌' };
  const CATEGORY_OPTIONS = [
    { key: 'all', label: 'הכל' },
    { key: 'pending', label: 'ממתין' },
    { key: 'approved', label: 'אושר' },
    { key: 'rejected', label: 'נדחה' }
  ];
  const CATEGORY_COLOR = { all: 'var(--ink)', pending: '#B08A2E', approved: '#2F5233', rejected: 'var(--danger)' };

  let view = 'list'; // 'list' | 'detail' | 'compose'
  let filterStatus = 'all';
  let menuOpen = false;
  let selectedId = null;
  let myRequests = [];

  function refreshMyRequests(){
    myRequests = list.filter(r => r.empId === emp.id).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  }
  refreshMyRequests();

  async function deleteRequest(id){
    const confirmed = await showConfirmModal('למחוק את ההודעה הזו לצמיתות?');
    if(!confirmed) return;
    const fresh = await loadRequests();
    if(fresh === null){ alert('שגיאה בטעינת הנתונים מהשרת. נסו שוב.'); return; }
    const updated = fresh.filter(r => r.id !== id);
    const ok = await saveRequests(updated);
    if(ok !== true){ alert('שגיאה בשמירה: ' + ok); return; }
    list = updated;
    refreshMyRequests();
    if(view === 'detail' && selectedId === id) view = 'list';
    render();
  }

  function render(){
    // ---------- כותרת העמוד ----------
    setHeader('בקשה למנהל', '<button class="btn ghost small" id="reqBackBtn">חזרה</button>');

    // ---------- מסך פרטי הודעה (במסך מלא) ----------
    if(view === 'detail'){
      const r = myRequests.find(x => x.id === selectedId);
      if(!r){ view = 'list'; render(); return; }
      app.innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <span class="pill status-${r.status}">${STATUS_ICON[r.status] || ''} ${STATUS_LABEL[r.status] || r.status}</span>
            <span class="hint" style="font-size:12.5px;">${r.createdAt ? new Date(r.createdAt).toLocaleString('he-IL') : ''}</span>
          </div>
          <p style="font-size:16px; white-space:pre-wrap; line-height:1.6; margin:0 0 18px;">${escapeHtml(r.text || '')}</p>
          ${r.adminNote ? `
            <div style="background:var(--paper-alt); border-radius:8px; padding:12px 14px; margin-bottom:14px;">
              <div class="hint" style="font-size:12px; margin-bottom:4px;">💬 תגובת המנהל${r.respondedAt ? ' · ' + new Date(r.respondedAt).toLocaleString('he-IL') : ''}</div>
              <div style="font-size:14.5px; white-space:pre-wrap;">${escapeHtml(r.adminNote)}</div>
            </div>
          ` : ''}
          <div class="actions" style="justify-content:flex-start; gap:10px;">
            <button type="button" class="btn ghost" id="detailBackBtn">חזרה לרשימה</button>
            <button type="button" class="btn danger" id="detailDeleteBtn">מחיקה</button>
          </div>
        </div>
      `;
      document.getElementById('reqBackBtn').onclick = () => { view = 'list'; render(); };
      document.getElementById('detailBackBtn').onclick = () => { view = 'list'; render(); };
      document.getElementById('detailDeleteBtn').onclick = () => deleteRequest(r.id);
      return;
    }

    // ---------- מסך כתיבת הודעה חדשה (במסך מלא) ----------
    if(view === 'compose'){
      app.innerHTML = `
        <div class="card">
          <h3 style="margin-top:0;">✏️ הודעה חדשה למנהל</h3>
          <p class="hint" style="margin-top:-6px; font-size:13px;">כתוב/י כל בקשה חופשית — יציאה מוקדמת, החלפת משמרת, הערה כללית וכו'.</p>
          <form id="newRequestForm">
            <textarea id="requestText" rows="5" style="width:100%; font-family:'Heebo',sans-serif; font-size:15px; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink); resize:vertical;" placeholder="לדוגמה: אני צריך לצאת מוקדם ביום שלישי הבא"></textarea>
            <div class="error-msg" id="requestErr" style="margin-top:6px;"></div>
            <div class="actions" style="justify-content:flex-start; margin-top:12px; gap:10px;">
              <button type="submit" class="btn brass" style="border-radius:10px;">שליחה</button>
              <button type="button" class="btn ghost" id="composeCancelBtn">ביטול</button>
            </div>
          </form>
        </div>
      `;
      document.getElementById('reqBackBtn').onclick = () => { view = 'list'; render(); };
      document.getElementById('composeCancelBtn').onclick = () => { view = 'list'; render(); };
      document.getElementById('newRequestForm').onsubmit = async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('requestErr');
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const text = document.getElementById('requestText').value.trim();
        if(!text){ errEl.textContent = 'יש לכתוב תוכן להודעה'; return; }
        errEl.textContent = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'שולח...';
        const fresh = await loadRequests();
        if(fresh === null){ errEl.textContent = 'שגיאה בטעינת הנתונים מהשרת. נסו שוב.'; submitBtn.disabled=false; submitBtn.textContent='שליחה'; return; }
        const newReqId = uid();
        fresh.push({
          id: newReqId, empId: emp.id, empName: emp.name, text,
          status: 'pending', createdAt: new Date().toISOString(), adminNote: '', seenByEmployee: true
        });
        const ok = await saveRequests(fresh);
        if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; submitBtn.disabled=false; submitBtn.textContent='שליחה'; return; }
        notifyManagerOfRequest(emp, newReqId, text); // ברקע, לא חוסם ולא מציג שגיאה אם נכשל
        list = fresh;
        refreshMyRequests();
        view = 'list';
        render();
      };
      return;
    }

    // ---------- מסך הרשימה הראשי (רשימה אנכית, כמו תיבת דואר) ----------
    const filtered = filterStatus === 'all' ? myRequests : myRequests.filter(r => r.status === filterStatus);
    app.innerHTML = `
      <div style="display:flex; justify-content:flex-start; margin-bottom:14px;">
        <button type="button" id="reqFilterBtn" style="background:var(--surface); border:1px solid var(--line); border-radius:8px; width:40px; height:40px; font-size:19px; line-height:1; cursor:pointer; color:var(--ink);">☰</button>
      </div>
      ${filterStatus !== 'all' ? `<p class="hint" style="font-size:12.5px; margin-top:-6px;">מסונן לפי: ${escapeHtml(CATEGORY_OPTIONS.find(c => c.key === filterStatus).label)}</p>` : ''}
      <div class="card" style="padding:6px 26px;">
        ${filtered.length ? filtered.map(r => `
          <div class="list-item clickable" data-row="${r.id}" style="user-select:none; -webkit-user-select:none;">
            <div class="avatar-row">
              <span class="pill status-${r.status}" style="flex-shrink:0;">${STATUS_ICON[r.status] || ''}</span>
              <div style="min-width:0;">
                <div style="font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60vw;">${escapeHtml(r.text || '')}</div>
                <div class="meta">${r.createdAt ? new Date(r.createdAt).toLocaleString('he-IL') : ''}</div>
              </div>
            </div>
          </div>
        `).join('') : `<div class="empty-state">אין הודעות להצגה.</div>`}
      </div>
      <button type="button" id="newMsgFab" style="position:fixed; bottom:22px; left:20px; background:var(--brass); color:var(--brass-text); border:none; border-radius:24px; padding:13px 20px; font-weight:600; font-size:14px; box-shadow:0 4px 16px rgba(0,0,0,.28); cursor:pointer; z-index:60;">✏️ הודעה חדשה</button>
      ${menuOpen ? `
        <div id="reqSheetBackdrop" class="req-filter-backdrop" style="position:fixed; inset:0; background:rgba(10,20,30,.5); z-index:150;"></div>
        <div class="req-filter-sheet" style="position:fixed; bottom:0; right:0; left:0; background:var(--surface); border-radius:20px 20px 0 0; z-index:151; padding:10px 20px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -6px 24px rgba(0,0,0,.25);">
          <div style="width:40px; height:4px; background:var(--line); border-radius:3px; margin:6px auto 16px;"></div>
          <div style="font-weight:700; font-size:15px; margin-bottom:10px;">סינון לפי סטטוס</div>
          ${CATEGORY_OPTIONS.map(c => `
            <div data-filter="${c.key}" style="display:flex; align-items:center; gap:12px; padding:15px 6px; cursor:pointer; font-size:17px; font-weight:${filterStatus === c.key ? '700' : '500'}; color:${CATEGORY_COLOR[c.key]}; border-bottom:1px solid var(--line);">
              <span style="width:12px; height:12px; border-radius:50%; background:${CATEGORY_COLOR[c.key]}; flex-shrink:0;"></span>${escapeHtml(c.label)}
              ${filterStatus === c.key ? '<span style="margin-inline-start:auto; font-size:16px;">✓</span>' : ''}
            </div>
          `).join('')}
          <button type="button" id="reqSheetCancel" class="btn ghost" style="width:100%; margin-top:16px; border-radius:12px;">ביטול</button>
        </div>
      ` : ''}
    `;

    document.getElementById('reqBackBtn').onclick = () => renderEmployeeDashboard(emp, null, true);
    const filterBtn = document.getElementById('reqFilterBtn');
    if(filterBtn) filterBtn.onclick = () => { menuOpen = true; render(); };
    document.querySelectorAll('[data-filter]').forEach(el => {
      el.onclick = () => { filterStatus = el.dataset.filter; menuOpen = false; render(); };
    });
    const backdrop = document.getElementById('reqSheetBackdrop');
    if(backdrop) backdrop.onclick = () => { menuOpen = false; render(); };
    const sheetCancel = document.getElementById('reqSheetCancel');
    if(sheetCancel) sheetCancel.onclick = () => { menuOpen = false; render(); };
    document.getElementById('newMsgFab').onclick = () => { view = 'compose'; render(); };
    document.querySelectorAll('[data-row]').forEach(row => {
      attachLongPress(
        row,
        () => deleteRequest(row.dataset.row),
        () => { selectedId = row.dataset.row; view = 'detail'; render(); }
      );
    });
  }
  render();
}

function showSendHoursModal(ctx){
  return new Promise(resolve => {
    const { emp, month, entries, totalHours, pay, managerEmail, emailjsConfig } = ctx;
    const senders = (emailjsConfig && emailjsConfig.senders) || [];
    const hasBaseConfig = !!(emailjsConfig && emailjsConfig.publicKey && emailjsConfig.templateId && window.emailjs);
    // If this employee has their own dedicated Service ID (set by the manager in "עריכת עובד"),
    // skip the "which account?" dropdown entirely and just send from their account directly.
    const fixedServiceId = emp.emailjsServiceId || null;
    const canAutoSend = hasBaseConfig && (fixedServiceId || senders.length > 0);
    const subject = `דוח שעות עבודה – ${emp.name} – ${monthLabel(month)}`;

    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box" style="max-width:400px;">
        <h3 style="margin-top:0;">שליחת דוח שעות</h3>
        <p class="hint" style="font-size:13.5px; margin-top:-6px;">${monthLabel(month)} · ${escapeHtml(emp.name)}</p>
        <label style="display:flex; align-items:center; gap:8px; margin-top:14px; cursor:pointer; text-align:right;">
          <input type="checkbox" id="includePaySend" checked style="width:17px; height:17px;" />
          לכלול גם את הסכום הכולל לתשלום (לא רק שעות)
        </label>
        ${canAutoSend ? `
          ${(!fixedServiceId && senders.length) ? `
          <div class="field" style="margin-top:14px; text-align:right;">
            <label>שליחה מחשבון</label>
            <select id="senderSelect" style="width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:4px; background:var(--paper); color:var(--ink); font-family:'Heebo',sans-serif; font-size:15px;">
              ${senders.map(s => `<option value="${escapeHtml(s.serviceId)}">${escapeHtml(s.label)}</option>`).join('')}
            </select>
          </div>
          ` : ''}
          <div class="actions" style="justify-content:center; margin-top:16px;">
            <button type="button" class="btn brass" id="autoSendBtn" style="padding:10px 22px;">🚀 שליחה אוטומטית${fixedServiceId ? ' מהמייל שלי' : ''}</button>
          </div>
          <p class="hint" style="font-size:12.5px; margin-top:14px; margin-bottom:0;">או לחלופין:</p>
        ` : ''}
        <div class="error-msg" id="sendHoursErr" style="margin-top:10px;"></div>
        <div class="actions" style="justify-content:center; flex-wrap:wrap; margin-top:${canAutoSend ? '4px' : '14px'};">
          <button type="button" class="btn ghost" id="mailtoSendBtn">📧 פתיחת טיוטת מייל</button>
          <button type="button" class="btn ghost" id="cancelSendBtn">ביטול</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const cleanup = () => { overlay.remove(); resolve(); };
    overlay.onclick = (e) => { if(e.target === overlay) cleanup(); };
    overlay.querySelector('#cancelSendBtn').onclick = cleanup;
    const includePay = () => overlay.querySelector('#includePaySend').checked;

    overlay.querySelector('#mailtoSendBtn').onclick = () => {
      const body = buildHoursEmailBody(emp, month, entries, totalHours, pay, includePay());
      const mailtoUrl = `mailto:${managerEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.location.href = mailtoUrl;
      cleanup();
    };

    if(canAutoSend){
      const autoBtn = overlay.querySelector('#autoSendBtn');
      const errEl = overlay.querySelector('#sendHoursErr');
      autoBtn.onclick = async () => {
        const senderSelect = overlay.querySelector('#senderSelect');
        const serviceId = fixedServiceId || (senderSelect ? senderSelect.value : null);
        const htmlBody = buildHoursEmailHtml(emp, month, entries, totalHours, pay, includePay());
        errEl.textContent = '';
        autoBtn.disabled = true;
        const originalLabel = autoBtn.textContent;
        autoBtn.textContent = 'שולח...';
        try{
          await window.emailjs.send(serviceId, emailjsConfig.templateId, {
            to_email: managerEmail,
            subject,
            message: htmlBody,
            employee_name: emp.name
          }, { publicKey: emailjsConfig.publicKey });
          autoBtn.textContent = '✓ נשלח בהצלחה';
          setTimeout(cleanup, 1200);
        }catch(err){
          console.error('emailjs send error', err);
          errEl.textContent = 'שליחה נכשלה: ' + ((err && err.text) || (err && err.message) || 'שגיאה לא ידועה');
          autoBtn.disabled = false;
          autoBtn.textContent = originalLabel;
        }
      };
    }
  });
}

// Breaks an amount (in ₪) down into real Israeli bill/coin denominations.
// Works in whole agorot internally to avoid floating point rounding issues.
function billBreakdown(amountShekels){
  let cents = Math.round(amountShekels * 100);
  const denoms = [
    { cents: 20000, value:'200', bill: true,  color: '#8B3F6B', colorLight: '#B25E8C' },
    { cents: 10000, value:'100', bill: true,  color: '#C97A2B', colorLight: '#E4A05A' },
    { cents: 5000,  value:'50',  bill: true,  color: '#4C8C6B', colorLight: '#74B790' },
    { cents: 2000,  value:'20',  bill: true,  color: '#3B6EA5', colorLight: '#5F92C9' },
    { cents: 1000,  value:'10',  bill: false, gold: true },
    { cents: 500,   value:'5',   bill: false, gold: false },
    { cents: 200,   value:'2',   bill: false, gold: false },
    { cents: 100,   value:'1',   bill: false, gold: true },
    { cents: 50,    value:'½',   bill: false, gold: false },
    { cents: 10,    value:'0.1', bill: false, gold: true },
  ];
  const result = [];
  for(const d of denoms){
    const count = Math.floor(cents / d.cents);
    if(count > 0){
      result.push({ ...d, count });
      cents -= count * d.cents;
    }
  }
  return result;
}
// Draws a stylized (not photographic) bill/coin — real colors and layout cues, no copyrighted artwork
function billSvg(value, color, colorLight){
  const uid = 'bg' + value;
  return `<svg viewBox="0 0 160 84" width="140" height="74" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${uid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${colorLight}"/>
        <stop offset="100%" stop-color="${color}"/>
      </linearGradient>
    </defs>
    <rect x="1" y="1" width="158" height="82" rx="9" fill="url(#${uid})" stroke="rgba(255,255,255,.55)" stroke-width="1"/>
    <rect x="6" y="6" width="148" height="72" rx="6" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="38" cy="42" r="19" fill="rgba(255,255,255,.16)"/>
    <circle cx="38" cy="34" r="8" fill="rgba(255,255,255,.32)"/>
    <path d="M25 55 q13 -13 26 0 z" fill="rgba(255,255,255,.32)"/>
    <text x="150" y="19" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700" fill="#fff">${value}</text>
    <text x="10" y="78" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700" fill="#fff">${value}</text>
    <text x="98" y="49" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="700" fill="#fff">₪${value}</text>
    <text x="98" y="64" text-anchor="middle" font-family="Heebo, sans-serif" font-size="8" fill="rgba(255,255,255,.85)">בנק ישראל</text>
  </svg>`;
}
function coinSvg(label, gold){
  const base = gold ? '#D8B24A' : '#C7CDD2';
  const dark = gold ? '#8a6d1d' : '#7d868c';
  const uid = 'coin' + label.replace(/[^a-zA-Z0-9]/g,'');
  return `<svg viewBox="0 0 80 80" width="54" height="54" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="${uid}" cx="35%" cy="32%" r="75%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".6"/>
        <stop offset="55%" stop-color="${base}"/>
        <stop offset="100%" stop-color="${dark}"/>
      </radialGradient>
    </defs>
    <circle cx="40" cy="40" r="37" fill="url(#${uid})" stroke="${dark}" stroke-width="2"/>
    <circle cx="40" cy="40" r="29" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="40" y="47" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="700" fill="${dark}">${label}</text>
  </svg>`;
}
function billsHtml(amountShekels){
  const parts = billBreakdown(amountShekels);
  if(parts.length === 0) return `<p class="hint">₪0</p>`;
  return `<div class="bills-wrap">` + parts.map(p => {
    const shape = p.bill ? billSvg(p.value, p.color, p.colorLight) : coinSvg(p.value, p.gold);
    return `<div class="bill-group">${shape}${p.count > 1 ? `<div class="bill-count">×${p.count}</div>` : ''}</div>`;
  }).join('') + `</div>`;
}

function avatarHtml(emp, size){
  const sizeClass = size === 'small' ? ' small' : '';
  if(emp.photo){
    return `<img class="avatar${sizeClass}" src="${emp.photo}" alt="${escapeHtml(emp.name)}" />`;
  }
  const initial = (emp.name || '?').trim().charAt(0).toUpperCase();
  return `<div class="avatar-placeholder${sizeClass}">${escapeHtml(initial)}</div>`;
}

function resizeImageFile(file, maxSize, quality){
  maxSize = maxSize || 160;
  quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('לא ניתן לקרוא את קובץ התמונה'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('לא ניתן לקרוא את קובץ התמונה'));
    reader.readAsDataURL(file);
  });
}

async function renderAdminRequests(){
  const content = document.getElementById('tabContent');
  content.innerHTML = `<div class="empty-state">טוען נתונים...</div>`;
  const list = await loadRequests();
  if(list === null){
    content.innerHTML = `<div class="empty-state" style="color:var(--danger);">שגיאה בטעינת הבקשות מהשרת. נסו לרענן.</div>`;
    return;
  }
  const sorted = list.slice().sort((a, b) => {
    // ממתינות קודם, ואז מהחדשה לישנה
    if((a.status === 'pending') !== (b.status === 'pending')) return a.status === 'pending' ? -1 : 1;
    return (b.createdAt || '').localeCompare(a.createdAt || '');
  });

  const STATUS_LABEL = { pending: '⏳ ממתינה', approved: '✅ אושרה', rejected: '❌ נדחתה' };
  const STATUS_COLOR = { pending: 'var(--muted)', approved: '#2F5233', rejected: 'var(--danger)' };

  content.innerHTML = sorted.length ? `
    <div class="card">
      <h3>בקשות מעובדים</h3>
      ${sorted.map(r => `
        <div style="border-top:1px solid var(--line); padding:14px 0;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;">
            <div>
              <b>${escapeHtml(r.empName || '')}</b>
              <span class="hint" style="font-size:12px; margin-inline-start:8px;">${r.createdAt ? new Date(r.createdAt).toLocaleString('he-IL') : ''}</span>
            </div>
            <span style="font-weight:600; color:${STATUS_COLOR[r.status] || 'var(--muted)'};">${STATUS_LABEL[r.status] || r.status}</span>
          </div>
          <p style="margin:8px 0; white-space:pre-wrap;">${escapeHtml(r.text || '')}</p>
          ${r.status === 'pending' ? `
            <div class="field" style="margin-top:8px;"><label>הערה לעובד (לא חובה)</label><input type="text" data-note="${r.id}" placeholder="למשל: אושר, תודה!" /></div>
            <div class="actions" style="justify-content:flex-start; gap:8px; margin-top:8px;">
              <button type="button" class="btn brass small" data-approve="${r.id}">אישור</button>
              <button type="button" class="btn danger" data-reject="${r.id}">דחייה</button>
              <button type="button" class="btn ghost small" data-delete-req="${r.id}">מחיקה</button>
            </div>
          ` : `
            ${r.adminNote ? `<p class="hint" style="font-size:13px;">הערת מנהל: ${escapeHtml(r.adminNote)}</p>` : ''}
            <div class="actions" style="justify-content:flex-start; margin-top:6px;">
              <button type="button" class="btn ghost small" data-delete-req="${r.id}">מחיקה</button>
            </div>
          `}
        </div>
      `).join('')}
    </div>
  ` : `<div class="empty-state">אין בקשות כרגע.</div>`;

  async function respond(id, status){
    const noteInput = document.querySelector(`[data-note="${id}"]`);
    const note = noteInput ? noteInput.value.trim() : '';
    const fresh = await loadRequests();
    if(fresh === null){ alert('שגיאה בטעינת הנתונים מהשרת. נסו שוב.'); return; }
    const req = fresh.find(r => r.id === id);
    if(!req) return;
    req.status = status;
    req.adminNote = note;
    req.respondedAt = new Date().toISOString();
    req.seenByEmployee = false;
    const ok = await saveRequests(fresh);
    if(ok !== true){ alert('שגיאה בשמירה: ' + ok); return; }
    renderAdminRequests();
  }
  async function removeRequest(id){
    const confirmed = await showConfirmModal('למחוק את הבקשה הזו לצמיתות?');
    if(!confirmed) return;
    const fresh = await loadRequests();
    if(fresh === null){ alert('שגיאה בטעינת הנתונים מהשרת. נסו שוב.'); return; }
    const updated = fresh.filter(r => r.id !== id);
    const ok = await saveRequests(updated);
    if(ok !== true){ alert('שגיאה בשמירה: ' + ok); return; }
    renderAdminRequests();
  }
  content.querySelectorAll('[data-delete-req]').forEach(btn => { btn.onclick = () => removeRequest(btn.dataset.deleteReq); });
  content.querySelectorAll('[data-approve]').forEach(btn => { btn.onclick = () => respond(btn.dataset.approve, 'approved'); });
  content.querySelectorAll('[data-reject]').forEach(btn => { btn.onclick = () => respond(btn.dataset.reject, 'rejected'); });
}

// מצייר את גרפי העמודות של סיכום המנהל (שעות ותשלום לכל עובד). שומר את מופעי הגרפים
// ב-state כדי שאפשר יהיה להשמיד אותם לפני ציור מחדש (אחרת Chart.js זורק שגיאה על אותו canvas).
function renderAdminCharts(rows){
  if(state._charts){
    if(state._charts.hours) state._charts.hours.destroy();
    if(state._charts.pay) state._charts.pay.destroy();
  }
  state._charts = {};
  const labels = rows.map(r => r.emp.name);
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--brass').trim() || '#5FBF8F';

  const hoursCtx = document.getElementById('hoursChart');
  if(hoursCtx){
    state._charts.hours = new Chart(hoursCtx, {
      type: 'bar',
      data: { labels, datasets: [{ label: 'שעות', data: rows.map(r => Math.round(r.totalHours * 100) / 100), backgroundColor: accent, borderRadius: 6 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
      }
    });
  }
  const payCtx = document.getElementById('payChart');
  if(payCtx){
    state._charts.pay = new Chart(payCtx, {
      type: 'bar',
      data: { labels, datasets: [{ label: 'תשלום (₪)', data: rows.map(r => Math.round(r.pay * 100) / 100), backgroundColor: '#8A6D2F', borderRadius: 6 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
      }
    });
  }
}

            <select id="editPayType">
              <option value="hourly" ${emp.payType==='hourly'?'selected':''}>שכר שעתי</option>
              <option value="fixed" ${emp.payType==='fixed'?'selected':''}>שכר חודשי קבוע</option>
            </select>
          </div>
          <div class="field">
            <label id="editRateLabel">${emp.payType==='hourly' ? 'תעריף לשעה (₪)' : 'שכר חודשי (₪)'}</label>
            <input type="number" id="editRate" min="0" step="0.5" value="${emp.rate}" required />
          </div>
        </div>
        <div class="emp-row-form" style="margin-top:14px;">
          <div class="field">
            <label>Service ID אישי לשליחה אוטומטית (לא חובה)</label>
            <input type="text" id="editEmailjsServiceId" value="${escapeHtml(emp.emailjsServiceId || '')}" dir="ltr" style="text-align:left;" placeholder="service_xxxxxxx" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" />
          </div>
        </div>
        <p class="hint" style="font-size:12.5px; margin-top:8px;">
          אם ממלאים כאן Service ID (אחרי חיבור חשבון המייל האישי של העובד ב-EmailJS), הדוחות שלו יישלחו אוטומטית מהחשבון הזה בלי שהוא יצטרך לבחור. משאירים ריק כדי שהעובד ימשיך לבחור מרשימת החשבונות המשותפת שבהגדרות.
        </p>
        <div class="error-msg" id="editEmpErr"></div>
        <div class="actions" style="justify-content:flex-start;">
          <button type="submit" class="btn brass">שמירת שינויים</button>
          <button type="button" class="btn ghost" id="cancelEdit">ביטול</button>
        </div>
      </form>
    </div>
  `;
  document.getElementById('avatarClickTarget').onclick = () => document.getElementById('editPhoto').click();
  document.getElementById('changePhotoBtn').onclick = () => document.getElementById('editPhoto').click();
  let stagedPhotoDataUrl = null;
  document.getElementById('editPhoto').onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      stagedPhotoDataUrl = reader.result;
      document.getElementById('avatarPreviewWrap').innerHTML = `<img src="${reader.result}" class="avatar" alt="" />`;
      removePhotoFlag = false;
      document.getElementById('removePhotoBtn').style.display = '';
    };
    reader.readAsDataURL(file);
  };
  document.getElementById('editPayType').onchange = (e) => {
    document.getElementById('editRateLabel').textContent = e.target.value === 'hourly' ? 'תעריף לשעה (₪)' : 'שכר חודשי (₪)';
  };
  document.getElementById('cancelEdit').onclick = () => renderAdminDashboard('employees');
  let removePhotoFlag = false;
  const removePhotoBtn = document.getElementById('removePhotoBtn');
  removePhotoBtn.onclick = () => {
    removePhotoFlag = true;
    stagedPhotoDataUrl = null;
    document.getElementById('editPhoto').value = '';
    document.getElementById('avatarPreviewWrap').innerHTML = avatarHtml({ ...emp, photo: null });
    removePhotoBtn.style.display = 'none';
  };
  document.getElementById('editEmpForm').onsubmit = async (e) => {
    e.preventDefault();
    const username = document.getElementById('editUsername').value.trim();
    const errEl = document.getElementById('editEmpErr');
    if(state.employees.some(x => x.username === username && x.id !== emp.id)){
      errEl.textContent = 'שם המשתמש כבר קיים';
      return;
    }
    const submitBtn = e.target.querySelector('button[type="submit"]');
    errEl.style.color = '';
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'שומר...';
    const photoFile = document.getElementById('editPhoto').files[0];
    let photo = emp.photo || null;
    if(removePhotoFlag) photo = null;
    if(photoFile){
      try{ photo = await resizeImageFile(photoFile); }
      catch(err){ errEl.textContent = 'שגיאה בקריאת התמונה'; submitBtn.disabled=false; submitBtn.textContent='שמירת שינויים'; return; }
    }
    const updatedEmp = {
      ...emp,
      name: document.getElementById('editName').value.trim(),
      username,
      pin: document.getElementById('editPin').value.trim(),
      phone: document.getElementById('editPhone').value.trim(),
      email: document.getElementById('editEmail').value.trim(),
      address: document.getElementById('editAddress').value.trim(),
      photo,
      payType: document.getElementById('editPayType').value,
      rate: Number(document.getElementById('editRate').value),
      emailjsServiceId: document.getElementById('editEmailjsServiceId').value.trim() || null,
    };
    const updatedList = state.employees.map(x => x.id === emp.id ? updatedEmp : x);
    const ok = await saveEmployees(updatedList);
    submitBtn.disabled = false;
    submitBtn.textContent = 'שמירת שינויים';
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
    state.employees = updatedList;
    renderAdminDashboard('employees');
  };
}

const ADMIN_SETTINGS_TABS = [
  { key: 'password', label: 'סיסמה' },
  { key: 'email', label: 'כתובת אימייל' },
  { key: 'autosend', label: 'שליחה אוטומטית' },
  { key: 'announcement', label: 'הודעה לעובדים' },
  { key: 'security', label: 'אבטחה' }
];

async function renderAdminSettings(){
  const content = document.getElementById('tabContent');
  content.innerHTML = `<div class="empty-state">טוען...</div>`;
  const activeTab = state._adminSettingsTab || 'password';
  const announcement = activeTab === 'announcement' ? await loadAnnouncement() : null;
  const managerEmail = activeTab === 'email' ? await loadManagerEmail() : null;

  if(activeTab === 'autosend' && !state._emailjsDraft){
    state._emailjsDraft = {
      publicKey: emailjsConfig.publicKey || '',
      templateId: emailjsConfig.templateId || '',
      senders: (emailjsConfig.senders || []).map(s => ({ ...s }))

  }
  const draft = state._emailjsDraft;

  const sectionsHtml = {
    password: () => `
      <div class="card">
        <h3>שינוי סיסמת מנהל</h3>

        <form id="changePassForm">
          <div class="field"><label>סיסמה נוכחית</label><input type="password" id="curPass" autocomplete="current-password" required /></div>

          <div class="error-msg" id="passErr"></div>

            <button type="submit" class="btn brass">עדכון סיסמה</button>
          </div>
