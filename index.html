      <div class="card">
        <h3>שחזור סיסמה</h3>
        <p class="hint" style="font-size:13.5px; margin-top:-6px;">
          אם תשכחו את הסיסמה, לחצו "שכחת סיסמה?" במסך הכניסה — יישלח מייל אמיתי לכתובת
          <b>${escapeHtml(state.adminEmail || '')}</b> עם קישור לקביעת סיסמה חדשה. אין צורך בהגדרה נוספת.
        </p>
      </div>
    `,
    email: () => `
      <div class="card">
        <h3>כתובת אימייל לקבלת דוחות שעות</h3>
        <p class="hint" style="font-size:13.5px; margin-top:-6px; margin-bottom:14px;">
          כשעובד שולח דוח שעות, זו הכתובת שתופיע כנמען. אפשר להשאיר ריק כדי לבטל את האפשרות אצל העובדים.
        </p>
        ${state._emailEditMode ? `
          <form id="managerEmailForm">
            <div class="field"><label>כתובת אימייל</label><input type="email" id="managerEmailInput" value="${escapeHtml(managerEmail)}" placeholder="${escapeHtml(state.adminEmail || 'name@example.com')}" /></div>
            <div class="error-msg" id="managerEmailErr"></div>
            <div class="actions" style="justify-content:flex-start; gap:10px;">
              <button type="submit" class="btn brass">שמירה</button>
              <button type="button" class="btn ghost" id="cancelEmailEdit">ביטול</button>
            </div>
          </form>
        ` : `
          <p style="font-size:15.5px; margin:6px 0 16px;">${managerEmail ? `<span class="mono" dir="ltr" style="display:inline-block;">${escapeHtml(managerEmail)}</span>` : '<span class="hint">לא הוגדרה כתובת</span>'}</p>
          <div class="actions" style="justify-content:flex-start;">
            <button type="button" class="btn ghost" id="startEmailEdit">עריכה</button>
          </div>
        `}
      </div>
    `,
    autosend: () => `
      <div class="card">
        <h3>שליחה אוטומטית של דוחות שעות (EmailJS)</h3>
        <p class="hint" style="font-size:13.5px; margin-top:-6px; margin-bottom:14px;">
          זו אפשרות מתקדמת: העובדים ישלחו את דוח השעות ישירות מהאתר, בלי לפתוח אפליקציית מייל, ויוכלו לבחור מבין חשבונות השליחה שתגדירו כאן.
          דורש חשבון חינמי ב-<b>emailjs.com</b>. הגדרה חד-פעמית: 1) בחשבון ה-EmailJS, תחת "Email Services", חברו חשבון מייל אחד לכל "שולח" שתרצו שיופיע לעובדים, ורשמו לכל אחד את ה-Service ID שלו.
          2) תחת "Email Templates" צרו תבנית אחת (משותפת לכולם) עם המשתנים <code>{{to_email}}</code>, <code>{{subject}}</code>, <code>{{{message}}}</code> ו-<code>{{employee_name}}</code> בגוף התבנית, ורשמו את ה-Template ID.
          3) תחת "Account" &gt; "API Keys" מצאו את ה-Public Key. אם משאירים את הרשימה של חשבונות שולחים ריקה, העובדים ימשיכו לראות רק את אפשרות פתיחת טיוטת המייל הרגילה.
        </p>
        ${state._autosendEditMode ? `
          <form id="emailjsConfigForm">
            <div class="field"><label>Public Key</label><input type="text" id="emailjsPublicKey" value="${escapeHtml(draft.publicKey)}" dir="ltr" style="text-align:left;" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" /></div>
            <div class="field"><label>Template ID</label><input type="text" id="emailjsTemplateId" value="${escapeHtml(draft.templateId)}" dir="ltr" style="text-align:left;" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" /></div>
            <label style="margin-top:18px;">חשבונות שולחים</label>
            ${draft.senders.length ? draft.senders.map(s => `
              <div class="emp-row-form" style="margin-top:8px; align-items:flex-end;">
                <div class="field" style="margin-top:0;"><label>שם לתצוגה</label><input type="text" data-sender-label="${s.id}" value="${escapeHtml(s.label || '')}" placeholder="למשל: משרד ראשי" /></div>
                <div class="field" style="margin-top:0;"><label>Service ID</label><input type="text" data-sender-service="${s.id}" value="${escapeHtml(s.serviceId || '')}" dir="ltr" style="text-align:left;" placeholder="service_xxxxxxx" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" /></div>
                <div class="field" style="flex:0 0 auto; margin-top:0;"><button type="button" class="btn danger" data-remove-sender="${s.id}">הסרה</button></div>
              </div>
            `).join('') : '<p class="hint" style="margin-top:6px;">עדיין לא נוספו חשבונות שולחים — העובדים יראו רק את אפשרות פתיחת טיוטת המייל הרגילה.</p>'}
            <div class="actions" style="justify-content:flex-start; margin-top:12px;">
              <button type="button" class="btn ghost small" id="addSenderBtn">+ הוספת חשבון שולח</button>
            </div>
            <div class="error-msg" id="emailjsErr" style="margin-top:12px;"></div>
            <div class="actions" style="justify-content:flex-start; gap:10px;">
              <button type="submit" class="btn brass">שמירה</button>
              <button type="button" class="btn ghost" id="cancelAutosendEdit">ביטול</button>
            </div>
          </form>
        ` : `
          <div style="font-size:14.5px; display:flex; flex-direction:column; gap:8px;">
            <div><b>Public Key:</b> ${emailjsConfig.publicKey ? `<span class="mono" dir="ltr" style="display:inline-block;">${escapeHtml(emailjsConfig.publicKey)}</span>` : '<span class="hint">לא הוגדר</span>'}</div>
            <div><b>Template ID:</b> ${emailjsConfig.templateId ? `<span class="mono" dir="ltr" style="display:inline-block;">${escapeHtml(emailjsConfig.templateId)}</span>` : '<span class="hint">לא הוגדר</span>'}</div>
            <div>
              <b>חשבונות שולחים:</b>
              ${(emailjsConfig.senders && emailjsConfig.senders.length) ? `
                <ul style="margin:6px 0 0; padding-inline-start:20px;">
                  ${emailjsConfig.senders.map(s => `<li>${escapeHtml(s.label || '(ללא שם)')} — <span class="mono" dir="ltr" style="display:inline-block;">${escapeHtml(s.serviceId || '')}</span></li>`).join('')}
                </ul>
              ` : ' <span class="hint">לא הוגדרו</span>'}
            </div>
          </div>
          <div class="actions" style="justify-content:flex-start; margin-top:16px;">
            <button type="button" class="btn ghost" id="startAutosendEdit">עריכה</button>
          </div>
        `}
      </div>
    `,
    announcement: () => `
      <div class="card">
        <h3>הודעה לעובדים</h3>
        <p class="hint" style="font-size:13.5px; margin-top:-6px; margin-bottom:14px;">
          תמונה וכיתוב שיוצגו לכל עובד בראש הדף שלו כשהוא נכנס למערכת. אפשר למלא רק תמונה, רק כיתוב, או את שניהם.
        </p>
        ${announcement.image ? `<img src="${announcement.image}" style="max-width:100%; max-height:220px; border-radius:6px; margin-bottom:12px; display:block;" />` : ''}
        <form id="announcementForm">
          <div class="field"><label>${announcement.image ? 'החלפת תמונה' : 'העלאת תמונה'} (לא חובה)</label><input type="file" id="announcementImage" accept="image/*" /></div>
          ${announcement.image ? '<div class="actions" style="justify-content:flex-start; margin-top:8px;"><button type="button" class="btn danger" id="removeAnnouncementImg">הסרת תמונה</button></div>' : ''}
          <div class="field" style="margin-top:14px;"><label>כיתוב</label><textarea id="announcementCaption" rows="3" style="width:100%; font-family:'Heebo',sans-serif; font-size:15px; padding:10px 12px; border:1.5px solid var(--line); border-radius:4px; background:var(--paper); color:var(--ink);">${escapeHtml(announcement.caption || '')}</textarea></div>
          <div class="error-msg" id="announcementErr"></div>
          <div class="actions" style="justify-content:flex-start;">
            <button type="submit" class="btn brass">שמירת הודעה</button>
          </div>
        </form>
      </div>
    `,
    security: () => `
      <div class="card">
        <h3>הערת אבטחה</h3>
        <p class="hint" style="font-size:13.5px;">
          פרטי העובדים והשעות שמורים במסד נתונים אמיתי (Firebase Firestore), הפועל כרגע ב"מצב בדיקה" (test mode) –
          כלומר אין הגבלת הרשאות אמיתית מצד השרת מעבר להתחברות עצמה. כניסת המנהל מוגנת כעת באמצעות
          Firebase Authentication אמיתי (אימייל+סיסמה), אך כניסת העובדים עדיין מבוססת קוד PIN בממשק בלבד.
          חשוב לדעת: מצב הבדיקה של Firestore פג אוטומטית אחרי כ-30 יום, ואז הכתיבה לנתונים תיפסק עד שיוגדרו
          כללי אבטחה (Security Rules) קבועים. מומלץ לשתף את קובץ האתר רק עם אנשי הצוות ולא לפרסם אותו publicly.
        </p>
      </div>
    `
  };

  content.innerHTML = `
    <div class="tabs" style="margin-bottom:18px;">
      ${ADMIN_SETTINGS_TABS.map(t => `<div class="tab${t.key === activeTab ? ' active' : ''}" data-settings-tab="${t.key}">${t.label}</div>`).join('')}
    </div>
    ${sectionsHtml[activeTab]()}
  `;
  content.querySelectorAll('[data-settings-tab]').forEach(t => {
    t.onclick = () => {
      state._adminSettingsTab = t.dataset.settingsTab;
      state._emailjsDraft = null;
      state._emailEditMode = false;
      state._autosendEditMode = false;
      renderAdminSettings();
    };
  });
  const startEmailEdit = document.getElementById('startEmailEdit');
  if(startEmailEdit) startEmailEdit.onclick = () => { state._emailEditMode = true; renderAdminSettings(); };
  const cancelEmailEdit = document.getElementById('cancelEmailEdit');
  if(cancelEmailEdit) cancelEmailEdit.onclick = () => { state._emailEditMode = false; renderAdminSettings(); };
  const startAutosendEdit = document.getElementById('startAutosendEdit');
  if(startAutosendEdit) startAutosendEdit.onclick = () => { state._autosendEditMode = true; renderAdminSettings(); };
  const cancelAutosendEdit = document.getElementById('cancelAutosendEdit');
  if(cancelAutosendEdit) cancelAutosendEdit.onclick = () => { state._autosendEditMode = false; state._emailjsDraft = null; renderAdminSettings(); };
  let removeAnnouncementFlag = false;
  const removeAnnouncementBtn = document.getElementById('removeAnnouncementImg');
  if(removeAnnouncementBtn){
    removeAnnouncementBtn.onclick = () => {
      removeAnnouncementFlag = true;
      removeAnnouncementBtn.textContent = 'התמונה תוסר בשמירה ✓';
      removeAnnouncementBtn.disabled = true;
    };
  }
  const announcementForm = document.getElementById('announcementForm');
  if(announcementForm) announcementForm.onsubmit = async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('announcementErr');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const caption = document.getElementById('announcementCaption').value.trim();
    const imageFile = document.getElementById('announcementImage').files[0];
    errEl.style.color = '';
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'שומר...';
    let image = announcement.image || null;
    if(removeAnnouncementFlag) image = null;
    if(imageFile){
      try{ image = await resizeImageFile(imageFile, 640, 0.75); }
      catch(err){ errEl.textContent = 'שגיאה בקריאת התמונה'; submitBtn.disabled=false; submitBtn.textContent='שמירת הודעה'; return; }
    }
    const ok = await saveAnnouncement(image, caption);
    submitBtn.disabled = false;
    submitBtn.textContent = 'שמירת הודעה';
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
    errEl.style.color = '#2F5233';
    errEl.textContent = 'ההודעה נשמרה בהצלחה';
    renderAdminSettings();
  };

  const managerEmailForm = document.getElementById('managerEmailForm');
  if(managerEmailForm) managerEmailForm.onsubmit = async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('managerEmailErr');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const val = document.getElementById('managerEmailInput').value.trim();
    errEl.style.color = '';
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'שומר...';
    const ok = await saveManagerEmail(val);
    submitBtn.disabled = false;
    submitBtn.textContent = 'שמירה';
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
    state._emailEditMode = false;
    renderAdminSettings();
  };

  // Keeps the in-memory draft (state._emailjsDraft) in sync with whatever the admin has typed so far,
  // so adding/removing a sender row (which re-renders this whole tab) never loses unsaved edits.
  function syncEmailjsDraftFromInputs(){
    const pk = document.getElementById('emailjsPublicKey');
    const tid = document.getElementById('emailjsTemplateId');
    if(pk) draft.publicKey = pk.value.trim();
    if(tid) draft.templateId = tid.value.trim();
    draft.senders.forEach(s => {
      const labelEl = document.querySelector(`[data-sender-label="${s.id}"]`);
      const svcEl = document.querySelector(`[data-sender-service="${s.id}"]`);
      if(labelEl) s.label = labelEl.value.trim();
      if(svcEl) s.serviceId = svcEl.value.trim();
    });
  }
  const addSenderBtn = document.getElementById('addSenderBtn');
  if(addSenderBtn) addSenderBtn.onclick = () => {
    syncEmailjsDraftFromInputs();
    draft.senders.push({ id: uid(), label: '', serviceId: '' });
    renderAdminSettings();
  };
  document.querySelectorAll('[data-remove-sender]').forEach(btn => {
    btn.onclick = () => {
      syncEmailjsDraftFromInputs();
      draft.senders = draft.senders.filter(s => s.id !== btn.dataset.removeSender);
      renderAdminSettings();
    };
  });
  const emailjsConfigForm = document.getElementById('emailjsConfigForm');
  if(emailjsConfigForm) emailjsConfigForm.onsubmit = async (e) => {
    e.preventDefault();
    syncEmailjsDraftFromInputs();
    const errEl = document.getElementById('emailjsErr');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const invalidRow = draft.senders.some(s => !s.label || !s.serviceId);
    if(invalidRow){ errEl.textContent = 'יש למלא שם ו-Service ID לכל חשבון שולח, או להסיר את השורות הריקות'; return; }
    errEl.style.color = '';
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'שומר...';
    const ok = await saveEmailjsConfig({ publicKey: draft.publicKey, templateId: draft.templateId, senders: draft.senders });
    submitBtn.disabled = false;
    submitBtn.textContent = 'שמירה';
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
    state._emailjsDraft = null;
    state._autosendEditMode = false;
    renderAdminSettings();
  };

  const changePassForm = document.getElementById('changePassForm');
  if(changePassForm) changePassForm.onsubmit = async (e) => {
    e.preventDefault();
    const cur = document.getElementById('curPass').value;
    const np = document.getElementById('newPass').value;
    const errEl = document.getElementById('passErr');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    errEl.style.color = '';
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'שומר...';
    try{
      const user = auth.currentUser;
      const credential = EmailAuthProvider.credential(user.email, cur);
      await reauthenticateWithCredential(user, credential);
      await updatePassword(user, np);
      errEl.style.color = '#2F5233';
      errEl.textContent = 'הסיסמה עודכנה בהצלחה';
      e.target.reset();
    }catch(err){
      console.error('change password error', err);
      const code = err && err.code;
      if(code === 'auth/invalid-credential' || code === 'auth/wrong-password'){
        errEl.textContent = 'הסיסמה הנוכחית שגויה';
      }else{
        errEl.textContent = 'שגיאה: ' + (code || (err && err.message) || 'לא ידועה');
      }
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'עדכון סיסמה';
  };
}

// ---------- EMPLOYEE DASHBOARD ----------
async function renderEmployeeDashboard(emp, editingId, useCache){
  stopLiveTimer();
  stopLiveMoneyTimer();
  stopClockFieldTimers();
  stopBreakWatchdog();
  state.currentEmployee = emp;
  const empSettings = await getEmpSettings(emp.id);
  applyEmployeeTheme(empSettings);
  setHeader('שלום, ' + emp.name, '<button class="btn ghost small" id="settingsBtn">⚙️ הגדרות</button> <button class="btn ghost small" id="logoutBtn">יציאה</button>');
  const month = state._empMonth || currentMonthStr();

  const passedFresh = useCache && typeof useCache === 'object' ? useCache : null;
  const cacheValid = !passedFresh && useCache && state._dashCache && state._dashCache.empId === emp.id;
  let hoursData, cachedAnnouncement;
  if(passedFresh){
    hoursData = passedFresh;
    cachedAnnouncement = (state._dashCache && state._dashCache.empId === emp.id) ? state._dashCache.announcement : null;
  }else if(cacheValid){
    hoursData = state._dashCache.hoursData;
    cachedAnnouncement = state._dashCache.announcement;
  }else{
    app.innerHTML = `<div class="empty-state">טוען נתונים...</div>`;
    hoursData = await loadHours(emp.id);
    if(hoursData === null){
      // Critical: never fall through to render/save with an empty object here — that's exactly
      // what silently erased a real employee's hours before this guard existed.
      app.innerHTML = `
        <div class="card" style="text-align:center;">
          <h3 style="color:var(--danger); margin-top:0;">שגיאה בטעינת הנתונים</h3>
          <p class="hint">לא הצלחנו לטעון את נתוני השעות שלך מהשרת (בעיית תקשורת זמנית). כדי להימנע מאובדן מידע, לא ממשיכים עד שהטעינה תצליח.</p>
          <button type="button" class="btn brass" id="retryLoadBtn">ניסיון נוסף</button>
        </div>
      `;
      document.getElementById('retryLoadBtn').onclick = () => renderEmployeeDashboard(emp, editingId, false);
      return;
    }
  }
  const entries = (hoursData[month] || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  const totalHours = entries.reduce((s,e) => s + (computeEntryHours(e) || 0), 0);
  const pay = calcPay(emp, totalHours);
  const editingEntry = editingId ? entries.find(e => e.id === editingId) : null;
  const editKey = editingEntry ? editingEntry.id : 'new';
  if(state._editBreaksKey !== editKey){
    state._editBreaksKey = editKey;
    state._editBreaks = editingEntry ? (editingEntry.breaks || []).map(b => ({...b})) : [];
    state._formDraft = null;
  }
  const editBreaks = state._editBreaks || [];
  const editingOpenEntry = !!(editingEntry && !editingEntry.end);
  const formDraft = state._formDraft;
  const draftDate = formDraft ? formDraft.date : (editingEntry ? editingEntry.date : todayStr());
  const draftStart = formDraft ? formDraft.start : (editingEntry ? (hhmm(editingEntry.start) || '') : '');
  const draftEnd = formDraft ? formDraft.end : (editingEntry ? (hhmm(editingEntry.end) || '') : '');
  let announcement;
  if(editingEntry){
    announcement = { image: null, caption: '' };
  }else if(cachedAnnouncement){
    announcement = cachedAnnouncement;
  }else{
    announcement = await loadAnnouncement();
  }
  state._dashCache = { empId: emp.id, hoursData, announcement: editingEntry ? cachedAnnouncement : announcement };

  const todayMonth = currentMonthStr();
  const todayEntries = hoursData[todayMonth] || [];
  let openEntry = findOpenEntryToday(todayEntries);
  let onBreak = !!(openEntry && openEntry.breaks && openEntry.breaks.length && !openEntry.breaks[openEntry.breaks.length - 1].end);
  let lastBreak = onBreak ? openEntry.breaks[openEntry.breaks.length - 1] : null;

  // Auto-close the work day if the employee went on break / paused the day and never came back before 20:00.
  // The day is ended at the moment the break started, and the break itself is dropped from the record entirely.
  let autoCloseNotice = null;
  if(openEntry && onBreak && lastBreak && !editingEntry && new Date().getHours() >= 20){
    autoCloseNotice = `יום העבודה נסגר אוטומטית בשעה ${hhmm(lastBreak.start)}, מכיוון שלא חזרת עד השעה 20:00. ההפסקה לא תופיע ברישום.`;
    openEntry.end = lastBreak.start;
    openEntry.breaks = [];
    await saveHours(emp.id, hoursData);
    openEntry = null;
    onBreak = false;
    lastBreak = null;
  }

  app.innerHTML = `
    ${editingEntry ? '' : `
    <div class="avatar-row" style="margin-bottom:16px;">
      ${avatarHtml(emp)}
      <div class="name" style="font-size:18px;">${escapeHtml(emp.name)}</div>
    </div>
    ${autoCloseNotice ? `
    <div class="card" style="border-color:var(--danger); background:#FBEFED;">
      <p style="margin:0; color:var(--danger); font-size:14px;">⚠️ ${escapeHtml(autoCloseNotice)}</p>
    </div>
    ` : ''}
    ${(announcement.image || announcement.caption) ? `
    <div class="card" style="border-color:var(--brass);">
      ${announcement.image ? `<img src="${announcement.image}" style="max-width:100%; border-radius:6px; margin-bottom:${announcement.caption ? '12px' : '0'}; display:block;" />` : ''}
      ${announcement.caption ? `<p style="margin:0; font-size:15px; white-space:pre-wrap;">${escapeHtml(announcement.caption)}</p>` : ''}

    ` : ''}
    <div class="top-actions">

      <span class="subtitle">${monthLabel(month)} · ${emp.payType === 'hourly' ? 'שכר שעתי · ' + fmtMoney(emp.rate) + ' לשעה' : 'שכר חודשי קבוע'}</span>
    </div>
    <div class="readout">
      <div class="digit-block"><div class="num mono">${fmtHours(totalHours)}</div><div class="lbl">סה"כ שעות החודש</div></div>
      <div class="digit-block"><div class="num mono">${fmtMoney(pay)}</div><div class="lbl">סה"כ לתשלום</div></div>
    </div>
    <div class="actions" style="justify-content:flex-start; margin-top:-8px; margin-bottom:18px; gap:8px;">
      <button type="button" class="btn ghost small" id="emailHoursBtn">📧 שליחת דוח שעות</button>
      <button type="button" class="btn ghost small" id="myRequestsBtn" style="position:relative;">📨 בקשה למנהל<span id="myRequestsBadge" style="display:none; position:absolute; top:-6px; left:-6px; background:var(--danger); color:#fff; border-radius:50%; width:9px; height:9px;"></span></button>
    </div>

    <div class="card">
      <h3>כרטיס נוכחות היום</h3>
      ${!openEntry ? `
        <p class="hint" style="margin-top:-6px; margin-bottom:16px; font-size:13px;">לחצו כשאתם מגיעים לעבודה — את שעת הסיום תעדכנו בנפרד בסוף היום.</p>
        <form id="clockInForm" novalidate>
          <div class="emp-row-form">
            <div class="field">
              <label>שעת הגעה</label>
              <input type="text" inputmode="numeric" pattern="^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$" id="clockInTime" value="${nowTimeStr()}" required style="direction:ltr; text-align:right;" dir="ltr" />
            </div>
          </div>
          <div class="error-msg" id="clockInErr"></div>
          <div class="actions" style="justify-content:flex-start;">
            <button type="submit" class="btn brass">🟢 התחלת יום עבודה</button>
          </div>
        </form>
      ` : `
        <p class="hint" style="margin-top:-6px; font-size:14px;">
          ${onBreak
            ? (lastBreak.type === 'pause'
                ? `⏸️ יום העבודה מושהה מאז <b class="mono">${hhmm(lastBreak.start)}</b>`
                : `⏸️ בהפסקה מאז <b class="mono">${hhmm(lastBreak.start)}</b>`)
            : `🟢 בעבודה מאז <b class="mono">${hhmm(openEntry.start)}</b>`}
        </p>
        <div class="timer-row">
          <span class="hourglass-spin">⏳</span>
          <div>
            <div id="liveTimer" class="mono" style="font-size:32px; color:var(--brass-dark);">00:00:00</div>
            <div style="color:var(--muted); font-size:12px;">${onBreak ? (lastBreak.type === 'pause' ? 'זמן השהיה רץ' : 'זמן הפסקה רץ') : 'זמן עבודה רץ'}</div>
          </div>
          ${emp.payType !== 'fixed' ? `
            <div style="margin-inline-start:auto; display:flex; align-items:center; gap:16px;">
              <div style="text-align:left;">
                <div id="liveMoney" class="mono" style="font-size:32px; color:var(--brass-dark);">₪0.00</div>
                <div style="color:var(--muted); font-size:12px;">הרווחת עד כה</div>
              </div>
              <span class="coin-spin">🪙</span>
            </div>
          ` : ''}
        </div>
        ${(openEntry.breaks && openEntry.breaks.length) ? `
          <div class="table-scroll" style="margin:12px 0;">
            <table>
              <thead><tr><th>הפסקה</th><th>משך</th></tr></thead>
              <tbody>
                ${openEntry.breaks.map(b => `<tr><td class="mono">${hhmm(b.start)} – ${b.end ? hhmm(b.end) : 'מתמשכת'}</td><td class="mono">${b.end ? fmtHours(computeHoursFromRange(b.start,b.end)) + ' שעות' : '—'}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        ` : ''}
        <div class="actions" style="justify-content:flex-start; margin-top:10px;">
          ${onBreak
            ? (lastBreak.type === 'pause'
                ? '<button type="button" class="btn brass" id="endBreakBtn">🔁 המשך יום עבודה</button>'
                : '<button type="button" class="btn brass" id="endBreakBtn">▶️ סיום הפסקה</button>')
            : '<button type="button" class="btn ghost" id="startBreakBtn">☕ התחלת הפסקה</button>'
          }
        </div>
        ${!onBreak ? `
          <form id="clockOutForm" novalidate style="margin-top:18px; border-top:1px solid var(--line); padding-top:16px;">
            <div class="emp-row-form">
              <div class="field">
                <label>שעת סיום</label>
                <input type="text" inputmode="numeric" pattern="^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$" id="clockOutTime" value="${nowTimeStr()}" required style="direction:ltr; text-align:right;" dir="ltr" />
              </div>
            </div>
            <div class="error-msg" id="clockOutErr"></div>
            <div class="actions" style="justify-content:flex-start; gap:10px;">
              <button type="submit" class="btn brass">🔴 סיום יום עבודה</button>
              <button type="button" class="btn ghost" id="pauseDayBtn">⏸️ סיום יום עבודה בינתיים</button>
            </div>
          </form>
        ` : ''}
      `}
    </div>

    <div class="card">
      <div class="collapsible-header" id="excelToggleHeader">
        <h3 style="margin:0;">ייבוא שעות מקובץ אקסל</h3>
        <span class="chevron">${state._excelOpen ? '▲' : '▼'}</span>
      </div>
      ${state._excelOpen ? `
      <div style="margin-top:14px;">
        <p class="hint" style="margin-top:0; margin-bottom:14px; font-size:13px;">
          העלו קובץ אקסל (.xlsx) עם שלוש עמודות: <b>תאריך</b>, <b>משעה</b>, <b>עד שעה</b> (מומלץ עם שורת כותרות ראשונה).
          המערכת תקרא את הקובץ ותוסיף את כל השעות בבת אחת, במקום מילוי ידני שורה-שורה.
        </p>
        <input type="file" id="excelFileInput" accept=".xlsx,.xls" />
        <div class="error-msg" id="excelErr"></div>
        <div id="excelPreviewArea"></div>
      </div>
      ` : ''}
    </div>
    `}

    <div class="card">
      <div class="collapsible-header" id="manualToggleHeader" style="${editingEntry ? 'cursor:default;' : ''}">
        <h3 style="margin:0;">${editingEntry ? 'עריכת רישום שעות' : 'הוספה ידנית / תיקון רישום'}</h3>
        ${editingEntry ? '' : `<span class="chevron">${state._manualOpen ? '▲' : '▼'}</span>`}
      </div>
      ${(editingEntry || state._manualOpen) ? `
      <div style="margin-top:14px;">
        <p class="hint" style="margin-top:0; margin-bottom:16px; font-size:13px;">${editingOpenEntry ? 'ניתן לתקן את שעת ההתחלה. השאירו את "עד שעה" ריק אם עדיין נמצאים באמצע יום העבודה.' : 'לתיקון רישום ישן או הוספת יום שלם בבת אחת — הזינו תאריך, שעת התחלה ושעת סיום.'}</p>
        <form id="addHoursForm">
          <div class="emp-row-form">
            <div class="field"><label>תאריך</label><input type="date" id="hoursDate" value="${draftDate}" required /></div>
          </div>
          <div class="emp-row-form" style="margin-top:14px;">
            <div class="field"><label>משעה</label><input type="time" id="hoursStart" value="${draftStart}" required /></div>
            <div class="field"><label>עד שעה${editingOpenEntry ? ' (אופציונלי)' : ''}</label><input type="time" id="hoursEnd" value="${draftEnd}" ${editingOpenEntry ? '' : 'required'} /></div>
          </div>
          <div class="mono" id="computedHoursPreview" style="margin-top:12px; font-size:15px; color:var(--brass-dark);"></div>

          <div style="margin-top:20px; border-top:1px solid var(--line); padding-top:16px;">
            <label style="margin-top:0;">הפסקות ביום זה</label>
            ${editBreaks.length ? `
            <div class="table-scroll">
              <table>
                <thead><tr><th>משעה</th><th>עד שעה</th><th>סה"כ</th><th></th></tr></thead>
                <tbody>
                  ${editBreaks.map(b => `
                    <tr>
                      <td class="mono">${hhmm(b.start) || '—'}</td>
                      <td class="mono">${b.end ? (hhmm(b.end) || '—') : 'מתמשכת'}</td>
                      <td class="mono">${b.end ? fmtHours(computeHoursFromRange(b.start, b.end)) + ' שעות' : '—'}</td>
                      <td><button type="button" class="btn danger" data-del-break="${b.id}">מחיקה</button></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
            ` : '<p class="hint" style="margin-top:6px;">אין הפסקות רשומות ליום זה.</p>'}
            <div class="emp-row-form" style="margin-top:12px;">
              <div class="field"><label>תחילת הפסקה</label><input type="time" id="breakStart" /></div>
              <div class="field"><label>סוף הפסקה</label><input type="time" id="breakEnd" /></div>
              <div class="field" style="flex:0;"><button type="button" class="btn ghost small" id="addBreakBtn" style="margin-top:0;">הוספת הפסקה</button></div>
            </div>
            <div class="error-msg" id="addBreakErr"></div>
          </div>

          <div class="error-msg" id="addHoursErr"></div>
          <div class="actions" style="justify-content:flex-start;">
            <button type="submit" class="btn brass">${editingEntry ? 'עדכון שינויים' : 'הוספה'}</button>
            ${editingEntry ? '<button type="button" class="btn ghost" id="cancelEditHours">ביטול</button>' : ''}
          </div>
        </form>
      </div>
      ` : ''}
    </div>
    ${editingEntry ? '' : `
    <div class="card">
      <h3>רישומי החודש</h3>
      <div id="entriesList">
        ${entries.length === 0 ? '<div class="empty-state">אין עדיין רישומי שעות לחודש זה.</div>' : `
        <div class="table-scroll">
          <table>
            <thead><tr><th>תאריך</th><th>טווח שעות</th><th>הפסקות</th><th>סה"כ שעות</th>${emp.payType !== 'fixed' ? '<th>סה"כ להרוויח</th>' : ''}<th></th></tr></thead>
            <tbody>
              ${entries.map(e => {
                const h = computeEntryHours(e);
                const breaksCount = (e.breaks || []).filter(b => b.end).length;
                return `
                <tr>
                  <td>${e.date}</td>
                  <td class="mono">${e.start ? (hhmm(e.start) + ' – ' + (e.end ? hhmm(e.end) : '...')) : '—'}</td>
                  <td class="mono">${breaksCount > 0 ? breaksCount + ' הפסקות' : '—'}</td>
                  <td class="mono">${h !== null ? fmtHours(h) : '<span class="pill hourly">בעבודה</span>'}</td>
                  ${emp.payType !== 'fixed' ? `<td class="mono">${h !== null ? fmtMoney(h * emp.rate) : '—'}</td>` : ''}
                  <td>
                    <div class="row-actions">
                      ${h !== null ? `<button class="btn ghost small" data-view-entry="${e.id}">הצגה</button>` : ''}
                      <button class="btn ghost small" data-edit-entry="${e.id}">עריכה</button>
                      <button class="btn danger" data-del-entry="${e.id}">מחיקה</button>
                    </div>
                  </td>
                </tr>
              `;}).join('')}
            </tbody>
          </table>
        </div>
        `}
      </div>
    </div>
    `}
  `;

  document.getElementById('logoutBtn').onclick = () => { stopLiveTimer(); stopLiveMoneyTimer(); stopClockFieldTimers(); stopBreakWatchdog(); state.currentEmployee = null; clearSession(); renderLanding(); };
  document.getElementById('settingsBtn').onclick = () => renderEmployeeSettings(emp);

  const emailHoursBtn = document.getElementById('emailHoursBtn');
  if(emailHoursBtn){
    emailHoursBtn.onclick = async () => {
      const originalLabel = emailHoursBtn.textContent;
      emailHoursBtn.disabled = true;
      emailHoursBtn.textContent = 'מכין...';
      const [managerEmail, emailjsConfig] = await Promise.all([loadManagerEmail(), loadEmailjsConfig()]);
      emailHoursBtn.disabled = false;
      emailHoursBtn.textContent = originalLabel;
      if(!managerEmail){
        alert('לא הוגדרה כתובת אימייל לקבלת דוחות שעות. יש לבקש מהמנהל להגדיר אותה במסך "הגדרות" שלו.');
        return;
      }
      await showSendHoursModal({ emp, month, entries, totalHours, pay, managerEmail, emailjsConfig });
    };
  }
  const myRequestsBtn = document.getElementById('myRequestsBtn');
  if(myRequestsBtn){
    myRequestsBtn.onclick = () => renderEmployeeRequests(emp);
    loadRequests().then(list => {
      if(!list) return;
      const hasUnseen = list.some(r => r.empId === emp.id && r.status !== 'pending' && r.seenByEmployee === false);
      const badge = document.getElementById('myRequestsBadge');
      if(badge && hasUnseen) badge.style.display = 'block';
    });
  }
  const empMonthPicker = document.getElementById('empMonthPicker');
  if(empMonthPicker){
    empMonthPicker.onchange = (e) => {
      state._empMonth = e.target.value;
      renderEmployeeDashboard(emp, null, true);
    };
  }

  if(!editingEntry && openEntry){
    startLiveTimer(onBreak ? lastBreak.start : openEntry.start);
    startLiveMoneyTimer(emp, openEntry, onBreak, lastBreak);
    if(onBreak) startBreakWatchdog(emp);
  }

  // ---- clock-in ----
  const clockInForm = document.getElementById('clockInForm');
  bindLiveTimeField('clockInTime');
  if(clockInForm){
    clockInForm.onsubmit = async (e) => {
      e.preventDefault();
      const startTime = sanitizeTimeInput(document.getElementById('clockInTime').value);
      const errEl = document.getElementById('clockInErr');
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if(!startTime){ errEl.textContent = 'פורמט השעה לא תקין — השתמשו בכפתור "עכשיו" או הזינו בפורמט שעה:דקה'; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = 'שומר...';
      const fresh = await loadHours(emp.id);
      if(fresh === null){ errEl.textContent = 'שגיאה בטעינת הנתונים מהשרת — לא בוצע שינוי. נסה שוב.'; submitBtn.disabled=false; submitBtn.textContent='🟢 התחלת יום עבודה'; return; }
      const tm = currentMonthStr();
      if(!fresh[tm]) fresh[tm] = [];
      if(findOpenEntryToday(fresh[tm])){ errEl.textContent = 'כבר קיים יום עבודה פתוח להיום'; submitBtn.disabled=false; submitBtn.textContent='🟢 התחלת יום עבודה'; return; }
      fresh[tm].push({ id: uid(), date: todayStr(), start: startTime, end: null, breaks: [] });
      const ok = await saveHours(emp.id, fresh);
      if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; submitBtn.disabled=false; submitBtn.textContent='🟢 התחלת יום עבודה'; return; }
      if(!(empSettings.muteOpeningAnnouncement ?? false)){
        playSuccessChime();
        speakHebrew(`${emp.name}, בוקר טוב, שיהיה בעזרת השם יום מוצלח`);
      }
      showToast('יום העבודה התחיל בהצלחה');
      if(month !== tm) state._empMonth = tm;
      renderEmployeeDashboard(emp, null, fresh);
    };
  }

  // ---- start break ----
  const startBreakBtn = document.getElementById('startBreakBtn');
  if(startBreakBtn){
    startBreakBtn.onclick = async () => {
      startBreakBtn.disabled = true;
      startBreakBtn.textContent = 'שומר...';
      const fresh = await loadHours(emp.id);
      if(fresh === null){ alert('שגיאה בטעינת הנתונים מהשרת — לא בוצע שינוי. נסה שוב.'); startBreakBtn.disabled=false; startBreakBtn.textContent='☕ התחלת הפסקה'; return; }
      const tm = currentMonthStr();
      const list = fresh[tm] || [];
      const entry = list.find(x => x.id === openEntry.id);
      if(entry){
        if(!entry.breaks) entry.breaks = [];
        entry.breaks.push({ id: uid(), start: nowTimeStr(), end: null });
      }
      const ok = await saveHours(emp.id, fresh);
      if(ok !== true){ alert('שגיאה בשמירה: ' + ok); startBreakBtn.disabled=false; startBreakBtn.textContent='☕ התחלת הפסקה'; return; }
      renderEmployeeDashboard(emp, null, fresh);
    };
  }

  // ---- end break / resume paused day ----
  const endBreakBtn = document.getElementById('endBreakBtn');
  if(endBreakBtn){
    const isPause = onBreak && lastBreak && lastBreak.type === 'pause';
    const restoreLabel = isPause ? '🔁 המשך יום עבודה' : '▶️ סיום הפסקה';
    endBreakBtn.onclick = async () => {
      endBreakBtn.disabled = true;
      endBreakBtn.textContent = 'שומר...';
      const fresh = await loadHours(emp.id);
      if(fresh === null){ alert('שגיאה בטעינת הנתונים מהשרת — לא בוצע שינוי. נסה שוב.'); endBreakBtn.disabled=false; endBreakBtn.textContent=restoreLabel; return; }
      const tm = currentMonthStr();
      const list = fresh[tm] || [];
      const entry = list.find(x => x.id === openEntry.id);
      if(entry && entry.breaks && entry.breaks.length){
        entry.breaks[entry.breaks.length - 1].end = nowTimeStr();
      }
      const ok = await saveHours(emp.id, fresh);
      if(ok !== true){ alert('שגיאה בשמירה: ' + ok); endBreakBtn.disabled=false; endBreakBtn.textContent=restoreLabel; return; }
      renderEmployeeDashboard(emp, null, fresh);
    };
  }

  // ---- pause the work day for now (functions just like a break, but flagged so the button reads "resume") ----
  const pauseDayBtn = document.getElementById('pauseDayBtn');
  if(pauseDayBtn){
    pauseDayBtn.onclick = async () => {
      pauseDayBtn.disabled = true;
      pauseDayBtn.textContent = 'שומר...';
      const fresh = await loadHours(emp.id);
      if(fresh === null){ alert('שגיאה בטעינת הנתונים מהשרת — לא בוצע שינוי. נסה שוב.'); pauseDayBtn.disabled=false; pauseDayBtn.textContent='⏸️ סיום יום עבודה בינתיים'; return; }
      const tm = currentMonthStr();
      const list = fresh[tm] || [];
      const entry = list.find(x => x.id === openEntry.id);
      if(entry){
        if(!entry.breaks) entry.breaks = [];
        entry.breaks.push({ id: uid(), start: nowTimeStr(), end: null, type: 'pause' });
      }
      const ok = await saveHours(emp.id, fresh);
      if(ok !== true){ alert('שגיאה בשמירה: ' + ok); pauseDayBtn.disabled=false; pauseDayBtn.textContent='⏸️ סיום יום עבודה בינתיים'; return; }
      renderEmployeeDashboard(emp, null, fresh);
    };
  }

  // ---- clock-out ----
  const clockOutForm = document.getElementById('clockOutForm');
  bindLiveTimeField('clockOutTime');
  if(clockOutForm){
    clockOutForm.onsubmit = async (e) => {
      e.preventDefault();
      const endTime = sanitizeTimeInput(document.getElementById('clockOutTime').value);
      const errEl = document.getElementById('clockOutErr');
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if(!endTime){ errEl.textContent = 'פורמט השעה לא תקין — השתמשו בכפתור "עכשיו" או הזינו בפורמט שעה:דקה'; return; }
      submitBtn.disabled = true;
      submitBtn.textContent = 'שומר...';
      const fresh = await loadHours(emp.id);
      if(fresh === null){ errEl.textContent = 'שגיאה בטעינת הנתונים מהשרת — לא בוצע שינוי. נסה שוב.'; submitBtn.disabled=false; submitBtn.textContent='🔴 סיום יום עבודה'; return; }
      const tm = currentMonthStr();
      const list = fresh[tm] || [];
      const entry = list.find(x => x.id === openEntry.id);
      if(!entry){ errEl.textContent = 'הרישום לא נמצא, נסו לרענן'; submitBtn.disabled=false; submitBtn.textContent='🔴 סיום יום עבודה'; return; }
      const h = computeHoursFromRange(entry.start, endTime);
      if(h === null || h <= 0){ errEl.textContent = 'שעת הסיום חייבת להיות אחרי שעת ההתחלה'; submitBtn.disabled=false; submitBtn.textContent='🔴 סיום יום עבודה'; return; }
      // auto-close a dangling open break at clock-out time, just in case
      if(entry.breaks && entry.breaks.length && !entry.breaks[entry.breaks.length-1].end){
        entry.breaks[entry.breaks.length-1].end = endTime;
      }
      entry.end = endTime;
      const ok = await saveHours(emp.id, fresh);
      if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; submitBtn.disabled=false; submitBtn.textContent='🔴 סיום יום עבודה'; return; }
      if(!(empSettings.muteClosingAnnouncement ?? false)){
        playSuccessChime();
        speakHebrew(`${emp.name}, מעריכים אוֹתְךָ על העבודה, ערב טוב`);
      }
      showToast('יום העבודה הסתיים בהצלחה');
      showSaluteSplash();
      renderEmployeeDashboard(emp, null, fresh);
    };
  }

  // ---- excel import ----
  const excelFileInput = document.getElementById('excelFileInput');
  const excelErr = document.getElementById('excelErr');
  const excelPreviewArea = document.getElementById('excelPreviewArea');
  if(excelFileInput){
    excelFileInput.onchange = async () => {
      const file = excelFileInput.files[0];
      excelErr.textContent = '';
      excelPreviewArea.innerHTML = '';
      if(!file) return;
      excelPreviewArea.innerHTML = '<p class="hint">קורא את הקובץ...</p>';
      let parsed;
      try{
        parsed = await parseExcelFile(file);
      }catch(err){
        console.error('excel parse error', err);
        excelPreviewArea.innerHTML = '';
        excelErr.textContent = 'לא ניתן לקרוא את הקובץ — ודאו שזהו קובץ אקסל תקין (.xlsx)';
        return;
      }
      if(parsed.error){
        excelPreviewArea.innerHTML = '';
        excelErr.textContent = parsed.error;
        return;
      }
      const validRows = parsed.rows.filter(r => !r.error);
      const invalidRows = parsed.rows.filter(r => r.error);
      if(parsed.rows.length === 0){
        excelPreviewArea.innerHTML = '<p class="hint">לא נמצאו שורות נתונים בקובץ.</p>';
        return;
      }
      excelPreviewArea.innerHTML = `
        <p class="hint" style="margin-top:14px;">
          נמצאו <b style="color:#2F5233;">${validRows.length} רישומים תקינים</b>
          ${invalidRows.length ? ` ו-<b style="color:var(--danger);">${invalidRows.length} שורות עם שגיאה</b>` : ''}.
        </p>
        <div class="table-scroll" style="max-height:260px; overflow-y:auto;">
          <table>
            <thead><tr><th>שורה</th><th>תאריך</th><th>משעה</th><th>עד שעה</th><th>סה"כ שעות</th></tr></thead>
            <tbody>
              ${parsed.rows.map(r => `
                <tr style="${r.error ? 'color:var(--danger);' : ''}">
                  <td>${r.rowNum}</td>
                  <td class="mono">${r.date || '—'}</td>
                  <td class="mono">${r.start || '—'}</td>
                  <td class="mono">${r.end || '—'}</td>
                  <td class="mono">${r.error ? r.error : fmtHours(r.hours)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        <div class="actions" style="justify-content:flex-start; margin-top:14px;">
          <button type="button" class="btn brass" id="confirmExcelImport" ${validRows.length === 0 ? 'disabled' : ''}>ייבוא ${validRows.length} רישומים</button>
        </div>
      `;
      const confirmBtn = document.getElementById('confirmExcelImport');
      if(confirmBtn){
        confirmBtn.onclick = async () => {
          confirmBtn.disabled = true;
          confirmBtn.textContent = 'מייבא...';
          const fresh = await loadHours(emp.id);
          if(fresh === null){
            confirmBtn.disabled = false;
            confirmBtn.textContent = 'ייבוא ' + validRows.length + ' רישומים';
            excelErr.textContent = 'שגיאה בטעינת הנתונים מהשרת — לא בוצע ייבוא. נסה שוב.';
            return;
          }
          for(const r of validRows){
            const m = r.date.slice(0,7);
            if(!fresh[m]) fresh[m] = [];
            fresh[m].push({ id: uid(), date: r.date, start: r.start, end: r.end, breaks: [] });
          }
          const ok = await saveHours(emp.id, fresh);
          if(ok !== true){
            confirmBtn.disabled = false;
            confirmBtn.textContent = 'ייבוא ' + validRows.length + ' רישומים';
            excelErr.textContent = 'שגיאה בשמירה: ' + ok;
            return;
          }
          const lastMonth = validRows[validRows.length - 1].date.slice(0,7);
          state._empMonth = lastMonth;
          renderEmployeeDashboard(emp, null, fresh);
        };
      }
    };
  }


  const excelToggleHeader = document.getElementById('excelToggleHeader');
  if(excelToggleHeader){
    excelToggleHeader.onclick = () => { state._excelOpen = !state._excelOpen; renderEmployeeDashboard(emp, null, true); };
  }
  const manualToggleHeader = document.getElementById('manualToggleHeader');
  if(manualToggleHeader && !editingEntry){
    manualToggleHeader.onclick = () => {
      state._manualOpen = !state._manualOpen;
      if(state._manualOpen){ state._editBreaks = []; state._editBreaksKey = 'new'; state._formDraft = null; }
      renderEmployeeDashboard(emp, null, true);
    };
  }

  const dateInput = document.getElementById('hoursDate');
  const startInput = document.getElementById('hoursStart');
  const endInput = document.getElementById('hoursEnd');
  if(dateInput && startInput && endInput){
    const preview = document.getElementById('computedHoursPreview');
    function updatePreview(){
      const h = computeHoursFromRange(startInput.value, endInput.value);
      preview.textContent = h !== null ? ('סה"כ: ' + fmtHours(h) + ' שעות') : '';
    }
    function saveDraft(){
      state._formDraft = { date: dateInput.value, start: startInput.value, end: endInput.value };
    }
    startInput.oninput = () => { updatePreview(); saveDraft(); };
    endInput.oninput = () => { updatePreview(); saveDraft(); };
    dateInput.oninput = saveDraft;
    updatePreview();
    dateInput.onchange = () => { saveDraft(); startInput.focus(); if(startInput.showPicker){ try{ startInput.showPicker(); }catch(e){} } };

    const cancelBtn = document.getElementById('cancelEditHours');
    if(cancelBtn) cancelBtn.onclick = () => {
      state._editBreaks = []; state._editBreaksKey = 'new'; state._formDraft = null;
      renderEmployeeDashboard(emp, null, true);
    };

    const breakStartInput = document.getElementById('breakStart');
    const breakEndInput = document.getElementById('breakEnd');
    const addBreakBtn = document.getElementById('addBreakBtn');
    const breakErrEl = document.getElementById('addBreakErr');
    if(addBreakBtn){
      addBreakBtn.onclick = () => {
        saveDraft();
        const bStart = breakStartInput.value;
        const bEnd = breakEndInput.value;
        breakErrEl.textContent = '';
        const bHours = computeHoursFromRange(bStart, bEnd);
        if(!bStart || !bEnd || bHours === null || bHours <= 0){ breakErrEl.textContent = 'יש להזין שעת התחלה ושעת סיום תקינות להפסקה'; return; }
        if(!state._editBreaks) state._editBreaks = [];
        state._editBreaks.push({ id: uid(), start: bStart, end: bEnd });
        renderEmployeeDashboard(emp, editingEntry ? editingEntry.id : null, true);
      };
    }
    document.querySelectorAll('[data-del-break]').forEach(btn => {
      btn.onclick = () => {
        saveDraft();
        state._editBreaks = (state._editBreaks || []).filter(b => b.id !== btn.dataset.delBreak);
        renderEmployeeDashboard(emp, editingEntry ? editingEntry.id : null, true);
      };
    });

    document.getElementById('addHoursForm').onsubmit = async (e) => {
      e.preventDefault();
      const date = document.getElementById('hoursDate').value;
      const start = startInput.value;
      const end = endInput.value;
      const errEl = document.getElementById('addHoursErr');
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const hoursVal = computeHoursFromRange(start, end);
      if(!date || !start){ errEl.textContent = 'יש להזין תאריך ושעת התחלה תקינים'; return; }
      if(end){
        if(hoursVal === null || hoursVal <= 0){ errEl.textContent = 'שעת הסיום שהוזנה אינה תקינה'; return; }
        if(hoursVal > 24){ errEl.textContent = 'טווח השעות ארוך מ-24 שעות, בדקו את השעות שהוזנו'; return; }
      } else if(!editingOpenEntry){
        errEl.textContent = 'יש להזין תאריך, שעת התחלה ושעת סיום תקינים';
        return;
      }
      const entryMonth = date.slice(0,7);
      const breaksToSave = (state._editBreaks || []).map(b => ({...b}));
      errEl.style.color = '';
      errEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'שומר...';
      const fresh = await loadHours(emp.id);
      if(fresh === null){
        submitBtn.disabled = false;
        submitBtn.textContent = editingEntry ? 'עדכון שינויים' : 'הוספה';
        errEl.textContent = 'שגיאה בטעינת הנתונים מהשרת — לא בוצע שינוי. נסה שוב.';
        return;
      }

      if(editingEntry){
        // remove the old entry from whichever month it was in (it may change if the date changed)
        const oldMonth = editingEntry.date.slice(0,7);
        if(fresh[oldMonth]) fresh[oldMonth] = fresh[oldMonth].filter(x => x.id !== editingEntry.id);
        if(!fresh[entryMonth]) fresh[entryMonth] = [];
        fresh[entryMonth].push({ id: editingEntry.id, date, start, end: end || null, breaks: breaksToSave });
      } else {
        if(!fresh[entryMonth]) fresh[entryMonth] = [];
        fresh[entryMonth].push({ id: uid(), date, start, end, breaks: breaksToSave });
      }

      const ok = await saveHours(emp.id, fresh);
      submitBtn.disabled = false;
      submitBtn.textContent = editingEntry ? 'עדכון שינויים' : 'הוספה';
      if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
      if(entryMonth !== month){ state._empMonth = entryMonth; }
      state._editBreaks = []; state._editBreaksKey = 'new'; state._formDraft = null;
      renderEmployeeDashboard(emp, null, fresh);
    };
  }
  document.querySelectorAll('[data-view-entry]').forEach(btn => {
    btn.onclick = () => {
      const entry = entries.find(e => e.id === btn.dataset.viewEntry);
      if(entry) showDaySummaryModal(entry, emp);
    };
  });
  document.querySelectorAll('[data-edit-entry]').forEach(btn => {
    btn.onclick = () => renderEmployeeDashboard(emp, btn.dataset.editEntry, true);
  });
  document.querySelectorAll('[data-del-entry]').forEach(btn => {
    btn.onclick = async () => {
      const confirmed = await showConfirmModal('האם אתה בטוח שברצונך למחוק?');
      if(!confirmed) return;
      const fresh = await loadHours(emp.id);
      if(fresh === null){ alert('שגיאה בטעינת הנתונים מהשרת — המחיקה בוטלה. נסה שוב.'); return; }
      fresh[month] = (fresh[month] || []).filter(e => e.id !== btn.dataset.delEntry);
      const ok = await saveHours(emp.id, fresh);
      if(ok !== true){ alert('שגיאה בשמירה: ' + ok); return; }
      renderEmployeeDashboard(emp, null, fresh);
    };
  });
}

// The main "הגדרות" screen: just a menu of categories. Add a category above and give some
// defs that category's key to make it appear here automatically.

  stopLiveTimer();
  stopLiveMoneyTimer();
  stopClockFieldTimers();
  stopBreakWatchdog();
  setHeader('הגדרות', '<button class="btn ghost small" id="settingsBackBtn">חזרה</button>');

  applyEmployeeTheme(settings);

  app.innerHTML = `
    <div class="avatar-row" style="margin-bottom:16px;">
      ${avatarHtml(emp)}

      <h3>הגדרות</h3>

          <span>
            <span style="display:block; font-weight:600;">${cat.icon} ${escapeHtml(cat.label)}</span>
            <span class="hint" style="display:block; margin-top:2px; font-size:13px;">${escapeHtml(cat.hint)}</span>
          </span>
          <span style="font-size:18px;">‹</span>
        </button>
      `).join('')}

  `;

  document.getElementById('settingsBackBtn').onclick = () => renderEmployeeDashboard(emp, null, true);
  document.querySelectorAll('[data-open-category]').forEach(btn => {
    btn.onclick = () => renderEmployeeSettingsCategory(emp, btn.dataset.openCategory);
  });
}

async function renderEmployeeSettingsCategory(emp, categoryKey){
  stopLiveTimer();
  stopLiveMoneyTimer();
  stopClockFieldTimers();
  stopBreakWatchdog();
  const category = SETTINGS_CATEGORIES.find(c => c.key === categoryKey);
  const defs = EMPLOYEE_SETTINGS_DEFS.filter(d => d.category === categoryKey);
  setHeader(category ? (category.icon + ' ' + category.label) : 'הגדרות', '<button class="btn ghost small" id="settingsBackBtn">חזרה</button>');
  const settings = await getEmpSettings(emp.id);
  applyEmployeeTheme(settings);

  function renderSettingField(def, isFirst){
    const currentVal = settings[def.key] ?? def.default;
    const marginTop = isFirst ? '0' : '18px';
    if(def.type === 'color'){
      return `
        <div style="margin-top:${marginTop};">
          <span style="display:block; font-weight:600;">${escapeHtml(def.label)}</span>
          ${def.hint ? `<span class="hint" style="display:block; margin-top:2px; margin-bottom:8px; font-size:13px;">${escapeHtml(def.hint)}</span>` : ''}
          <div style="display:flex; align-items:center; gap:12px; margin-top:8px;">
            <input type="color" id="setting_${def.key}" data-setting-key="${def.key}" value="${currentVal}" style="width:52px; height:40px; padding:2px; border:1.5px solid var(--line); border-radius:6px; cursor:pointer; background:var(--white);" />
            <button type="button" class="btn ghost small" id="reset_${def.key}">איפוס לצבע ברירת מחדל</button>
          </div>
        </div>
      `;
    }
    if(def.type === 'auto-color'){
      const isAuto = !settings[def.key];
      const previewColor = settings[def.key] || getContrastTextColor(settings.bgColor || DEFAULT_BG_COLOR);
      return `
        <div style="margin-top:${marginTop};">
          <span style="display:block; font-weight:600;">${escapeHtml(def.label)}</span>
          ${def.hint ? `<span class="hint" style="display:block; margin-top:2px; margin-bottom:8px; font-size:13px;">${escapeHtml(def.hint)}</span>` : ''}
          <div style="display:flex; align-items:center; gap:14px; margin-top:8px; flex-wrap:wrap;">
            <label style="display:flex; align-items:center; gap:6px; font-size:14px; cursor:pointer;">
              <input type="checkbox" id="auto_${def.key}" ${isAuto ? 'checked' : ''} style="width:16px; height:16px;" />
              התאמה אוטומטית לפי צבע הרקע
            </label>
            <input type="color" id="setting_${def.key}" data-setting-key="${def.key}" value="${previewColor}" ${isAuto ? 'disabled' : ''} style="width:52px; height:40px; padding:2px; border:1.5px solid var(--line); border-radius:6px; cursor:pointer; background:var(--white);" />
          </div>
        </div>
      `;
    }
    // default: checkbox
    return `
      <label style="display:flex; align-items:flex-start; gap:10px; margin-top:${marginTop}; cursor:pointer;">
        <input type="checkbox" id="setting_${def.key}" data-setting-key="${def.key}" ${currentVal ? 'checked' : ''} style="margin-top:3px; width:18px; height:18px; flex-shrink:0;" />
        <span>
          <span style="display:block; font-weight:600;">${escapeHtml(def.label)}</span>
          ${def.hint ? `<span class="hint" style="display:block; margin-top:2px; font-size:13px;">${escapeHtml(def.hint)}</span>` : ''}
        </span>
      </label>
    `;
  }

  app.innerHTML = `
    <div class="avatar-row" style="margin-bottom:16px;">
      ${avatarHtml(emp)}
      <div class="name" style="font-size:18px;">${escapeHtml(emp.name)}</div>
    </div>
    <div class="card">
      <h3>${category ? category.icon + ' ' + escapeHtml(category.label) : 'הגדרות'}</h3>
      ${defs.map((def, i) => renderSettingField(def, i === 0)).join('')}
      <div class="error-msg" id="settingsErr" style="margin-top:16px;"></div>
      <p class="hint" id="settingsSavedMsg" style="margin-top:12px; font-size:13px; display:none; color:var(--brass-dark);">✓ נשמר</p>
    </div>
  `;

  document.getElementById('settingsBackBtn').onclick = () => renderEmployeeSettings(emp);

  async function persistSetting(key, value){
    const errEl = document.getElementById('settingsErr');
    const savedMsg = document.getElementById('settingsSavedMsg');
    savedMsg.style.display = 'none';
    errEl.textContent = '';
    const updated = { ...settings, [key]: value };
    const ok = await saveSettings(emp.id, updated);
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return false; }
    state._settingsCache = { empId: emp.id, settings: updated };
    settings[key] = value;
    savedMsg.style.display = 'block';
    setTimeout(() => { const m = document.getElementById('settingsSavedMsg'); if(m) m.style.display = 'none'; }, 2000);
    return true;
  }

  function syncAutoTextPreview(liveBg){
    const textDef = defs.find(d => d.type === 'auto-color');
    if(!textDef) return;
    const autoCheckbox = document.getElementById('auto_' + textDef.key);
    const textField = document.getElementById('setting_' + textDef.key);
    if(autoCheckbox && autoCheckbox.checked && textField){
      textField.value = getContrastTextColor(liveBg || settings.bgColor || DEFAULT_BG_COLOR);
    }
  }

  defs.forEach(def => {
    const field = document.getElementById('setting_' + def.key);
    if(!field) return;

    if(def.type === 'color'){
      field.oninput = () => {
        applyEmployeeTheme({ ...settings, [def.key]: field.value });
        if(def.key === 'bgColor') syncAutoTextPreview(field.value);
      };
      field.onchange = async () => {
        field.disabled = true;
        const ok = await persistSetting(def.key, field.value);
        field.disabled = false;
        if(!ok){ field.value = settings[def.key] ?? def.default; applyEmployeeTheme(settings); return; }
        if(def.key === 'bgColor') syncAutoTextPreview();
      };
      const resetBtn = document.getElementById('reset_' + def.key);
      if(resetBtn){
        resetBtn.onclick = async () => {
          field.value = def.default;
          applyEmployeeTheme({ ...settings, [def.key]: def.default });
          if(def.key === 'bgColor') syncAutoTextPreview(def.default);
          resetBtn.disabled = true;
          await persistSetting(def.key, def.default);
          resetBtn.disabled = false;
        };
      }
    } else if(def.type === 'auto-color'){
      const autoCheckbox = document.getElementById('auto_' + def.key);
      field.oninput = () => {
        if(autoCheckbox.checked) return;
        applyEmployeeTheme({ ...settings, [def.key]: field.value });
      };
      field.onchange = async () => {
        if(autoCheckbox.checked) return;
        field.disabled = true;
        const ok = await persistSetting(def.key, field.value);
        field.disabled = false;
        if(!ok){ field.value = settings[def.key] || getContrastTextColor(settings.bgColor || DEFAULT_BG_COLOR); applyEmployeeTheme(settings); }
      };
      autoCheckbox.onchange = async () => {
        autoCheckbox.disabled = true;
        field.disabled = true;
        if(autoCheckbox.checked){
          const ok = await persistSetting(def.key, null);
          autoCheckbox.disabled = false;
          if(!ok){ autoCheckbox.checked = false; field.disabled = false; return; }
          field.value = getContrastTextColor(settings.bgColor || DEFAULT_BG_COLOR);
          applyEmployeeTheme(settings);
        } else {
          const ok = await persistSetting(def.key, field.value);
          autoCheckbox.disabled = false;
          field.disabled = false;
          if(!ok){ autoCheckbox.checked = true; field.disabled = true; return; }
          applyEmployeeTheme(settings);
        }
      };
    } else {
      field.onchange = async () => {
        field.disabled = true;
        const ok = await persistSetting(def.key, field.checked);
        field.disabled = false;
        if(!ok) field.checked = !field.checked;
      };
    }
  });
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed', err));
  });
}
</script>
</body>
</html>
