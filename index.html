// Breaks an amount (in ₪) down into real Israeli bill/coin denominations.
// Works in whole agorot internally to avoid floating point rounding issues.
function billBreakdown(amountShekels){
  let cents = Math.round(amountShekels * 100);
  const denoms = [
    { cents: 20000, value:'200', bill: true,  color: '#8B3F6B', colorLight: '#B25E8C' },
    { cents: 10000, value:'100', bill: true,  color: '#C97A2B', colorLight: '#E4A05A' },
    { cents: 5000,  value:'50',  bill: true,  color: '#4C8C6B', colorLight: '#74B790' },
    { cents: 2000,  value:'20',  bill: true,  color: '#3B6EA5', colorLight: '#5F92C9' },
    { cents: 1000,  value:'10',  bill: false, gold: true },
    { cents: 500,   value:'5',   bill: false, gold: false },
    { cents: 200,   value:'2',   bill: false, gold: false },
    { cents: 100,   value:'1',   bill: false, gold: true },
    { cents: 50,    value:'½',   bill: false, gold: false },
    { cents: 10,    value:'0.1', bill: false, gold: true },
  ];
  const result = [];
  for(const d of denoms){
    const count = Math.floor(cents / d.cents);
    if(count > 0){
      result.push({ ...d, count });
      cents -= count * d.cents;
    }
  }
  return result;
}
// Draws a stylized (not photographic) bill/coin — real colors and layout cues, no copyrighted artwork
function billSvg(value, color, colorLight){
  const uid = 'bg' + value;
  return `<svg viewBox="0 0 160 84" width="140" height="74" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${uid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${colorLight}"/>
        <stop offset="100%" stop-color="${color}"/>
      </linearGradient>
    </defs>
    <rect x="1" y="1" width="158" height="82" rx="9" fill="url(#${uid})" stroke="rgba(255,255,255,.55)" stroke-width="1"/>
    <rect x="6" y="6" width="148" height="72" rx="6" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="38" cy="42" r="19" fill="rgba(255,255,255,.16)"/>
    <circle cx="38" cy="34" r="8" fill="rgba(255,255,255,.32)"/>
    <path d="M25 55 q13 -13 26 0 z" fill="rgba(255,255,255,.32)"/>
    <text x="150" y="19" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700" fill="#fff">${value}</text>
    <text x="10" y="78" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700" fill="#fff">${value}</text>
    <text x="98" y="49" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="700" fill="#fff">₪${value}</text>
    <text x="98" y="64" text-anchor="middle" font-family="Heebo, sans-serif" font-size="8" fill="rgba(255,255,255,.85)">בנק ישראל</text>
  </svg>`;
}
function coinSvg(label, gold){
  const base = gold ? '#D8B24A' : '#C7CDD2';
  const dark = gold ? '#8a6d1d' : '#7d868c';
  const uid = 'coin' + label.replace(/[^a-zA-Z0-9]/g,'');
  return `<svg viewBox="0 0 80 80" width="54" height="54" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="${uid}" cx="35%" cy="32%" r="75%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity=".6"/>
        <stop offset="55%" stop-color="${base}"/>
        <stop offset="100%" stop-color="${dark}"/>
      </radialGradient>
    </defs>
    <circle cx="40" cy="40" r="37" fill="url(#${uid})" stroke="${dark}" stroke-width="2"/>
    <circle cx="40" cy="40" r="29" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="40" y="47" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="700" fill="${dark}">${label}</text>
  </svg>`;
}
function billsHtml(amountShekels){
  const parts = billBreakdown(amountShekels);
  if(parts.length === 0) return `<p class="hint">₪0</p>`;
  return `<div class="bills-wrap">` + parts.map(p => {
    const shape = p.bill ? billSvg(p.value, p.color, p.colorLight) : coinSvg(p.value, p.gold);
    return `<div class="bill-group">${shape}${p.count > 1 ? `<div class="bill-count">×${p.count}</div>` : ''}</div>`;
  }).join('') + `</div>`;
}
function showWelcomeSplash(emp, onDone){
  try{
    const overlay = document.createElement('div');
    overlay.className = 'welcome-overlay';
    const text = 'וזכרת כי הוא הנותן לך כח לעשות חיל';
    // הפסוק נכנס מצד ימין ועולה לאורך קשת (חצי עיגול) בחלק העליון של המסך, מעל התמונה
    overlay.innerHTML = `
      <img src="welcome.png" alt="" class="welcome-bg" />
      <svg class="welcome-arc" viewBox="0 0 400 170" aria-label="${escapeHtml(text)}">
        <defs><path id="welcomeArcPath" d="M 18 160 A 182 150 0 0 1 382 160" /></defs>
        <text class="welcome-arc-text" text-anchor="middle">
          <textPath href="#welcomeArcPath" startOffset="50%">${escapeHtml(text)}
            <animate attributeName="startOffset" from="115%" to="50%" begin="1.4s" dur="2.4s" fill="freeze" calcMode="spline" keySplines="0.22 0.61 0.36 1" keyTimes="0;1" />
          </textPath>
        </text>
      </svg>
      <button type="button" class="welcome-skip" id="welcomeSkip">דילוג</button>
    `;
    document.body.appendChild(overlay);
    // מיקום הקשת בתוך גבולות התמונה המוצגת (התמונה מותאמת למסך בלי חיתוך, ולכן יש לה שוליים משתנים)
    const img = overlay.querySelector('.welcome-bg'), arc = overlay.querySelector('.welcome-arc');
    const placeArc = () => {
      if(!img.naturalWidth || !arc) return;
      const W = overlay.clientWidth, H = overlay.clientHeight, r = img.naturalWidth / img.naturalHeight;
      const w = Math.min(W, H * r), h = w / r, left = (W - w) / 2, top = (H - h) / 2;
      arc.style.left = (left + w * 0.04) + 'px';
      arc.style.top = Math.max(top + h * 0.025, 12) + 'px';
      arc.style.width = (w * 0.92) + 'px';
      arc.style.transform = 'none';
      arc.style.visibility = 'visible';
    };
    if(img.complete) placeArc(); else img.addEventListener('load', placeArc);
    window.addEventListener('resize', placeArc);
    let finished = false;
    const timer = setTimeout(finish, 6000);
    function finish(){
      if(finished) return;
      finished = true;
      clearTimeout(timer);
      window.removeEventListener('resize', placeArc);
      overlay.remove();
      onDone();
    }
    overlay.querySelector('#welcomeSkip').onclick = finish;
  }catch(e){ onDone(); }
}

function resizeImageFile(file, maxSize, quality){
  maxSize = maxSize || 160;
  quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSize / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('לא ניתן לקרוא את קובץ התמונה'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('לא ניתן לקרוא את קובץ התמונה'));
    reader.readAsDataURL(file);
  });
}

// ריבועי הסיכום בראש פאנל הניהול – נטענים ברקע, ונשמרים לדקה כדי לא לטעון שוב בכל מעבר לשונית
async function fillAdminKpis(){
  const set = (id, value, sub) => {
    const el = document.getElementById('kpi_' + id); if(!el) return;
    el.classList.remove('loading');
    el.querySelector('.k-value').textContent = value;
    el.querySelector('.k-sub').textContent = sub || '';
  };
  let d = state._kpi && (Date.now() - state._kpi.at < 60000) ? state._kpi.data : null;
  if(!d){
    const month = currentMonthStr(), today = todayStr();
    const emps = activeEmployees();
    const [rows, reqs] = await Promise.all([
      Promise.all(emps.map(async emp => {
        const entries = ((await loadHours(emp.id)) || {})[month] || [];
        const hours = entries.reduce((s, e) => s + (computeEntryHours(e) || 0), 0);
        return { emp, hours, pay: calcPay(emp, hours), working: entries.some(e => e.date === today && !e.end) };
      })),
      loadRequests()
    ]);
    d = {
      month,
      hours: rows.reduce((s, r) => s + r.hours, 0),
      pay: rows.reduce((s, r) => s + (Number(r.pay) || 0), 0),
      working: rows.filter(r => r.working).map(r => r.emp.name),
      emps: emps.length,
      pending: reqs ? reqs.filter(r => r.status === 'pending').length : null
    };
    state._kpi = { at: Date.now(), data: d };
  }
  set('hours', fmtHours(Math.round(d.hours * 100) / 100), monthLabel(d.month));
  set('pay', fmtMoney(Math.round(d.pay)), 'לפני מסים');
  set('now', `${d.working.length} / ${d.emps}`, d.working.length ? d.working.join(', ') : 'אף אחד כרגע');
  set('req', d.pending === null ? '—' : String(d.pending), d.pending ? 'ממתינות לטיפול' : 'אין בקשות ממתינות');
  const badge = document.querySelector('[data-badge="requests"]');
  if(badge) badge.textContent = d.pending ? String(d.pending) : '';
}


// ---------- מכסות ימי חופשה ומחלה (המכסה השנתית נשמרת ברשומת העובד: vacationDays, sickDays) ----------
// ספירה: ימים מסומנים בשנה הנבחרת, בלי שבתות
function dayOffUsage(daysOff, year){
  const inYear = (daysOff || []).filter(d => d.date.slice(0, 4) === String(year) && new Date(d.date + 'T12:00:00').getDay() !== 6);
  return { vacation: inYear.filter(d => d.type === 'vacation').length, sick: inYear.filter(d => d.type === 'sick').length, list: inYear };
}
function quotaNum(v){ const n = Number(v); return (v === null || v === undefined || v === '' || isNaN(n)) ? null : n; }
function timeOffBalanceHtml(emp, daysOff){
  const vq = quotaNum(emp.vacationDays), sq = quotaNum(emp.sickDays);
  if(vq === null && sq === null) return '';
  const year = ilNow().getFullYear();
  const u = dayOffUsage(daysOff, year);
  const part = (icon, label, used, quota) => quota === null ? '' : `
    <div style="flex:1 1 140px; padding:10px 12px; background:var(--paper-alt); border-radius:10px;">
      <div class="hint" style="font-size:13px;">${icon} ${label} ${year}</div>
      <div style="font-size:18px; font-weight:700; margin-top:2px;">נשארו ${fmtNum(Math.max(0, quota - used))}</div>
      <div class="hint" style="font-size:12.5px;">נוצלו ${used} מתוך ${fmtNum(quota)}</div>
    </div>`;
  return `<div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;">${part('🏖️', 'ימי חופשה', u.vacation, vq)}${part('🤒', 'ימי מחלה', u.sick, sq)}</div>`;
}

    ${!emps.length ? '<div class="card"><div class="empty-state">אין עדיין עובדים פעילים במערכת.</div></div>' : `
    <div class="card">
      <h3 style="margin-top:0;">ימי חופשה ומחלה</h3>
      <p class="hint" style="font-size:13px; margin-top:-4px;">המכסה היא מספר הימים בשנה. שבתות לא נספרות. השאירו ריק אם אין מכסה.</p>
      <div class="table-scroll">
        <table>
          <thead><tr><th>עובד</th><th>מכסת חופשה</th><th>מכסת מחלה</th><th>חופשה: נוצלו</th><th>מחלה: נוצלו</th></tr></thead>
          <tbody>

              <tr>
                <td>${escapeHtml(r.emp.name)}</td>
                <td><input type="number" min="0" step="0.5" style="width:80px;" data-quota-vac="${r.emp.id}" value="${quotaNum(r.emp.vacationDays) ?? ''}" /></td>
                <td><input type="number" min="0" step="0.5" style="width:80px;" data-quota-sick="${r.emp.id}" value="${quotaNum(r.emp.sickDays) ?? ''}" /></td>
                <td>${cell(r.u.vacation, quotaNum(r.emp.vacationDays))}</td>
                <td>${cell(r.u.sick, quotaNum(r.emp.sickDays))}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="actions" style="margin-top:10px;"><button type="button" class="btn brass" id="saveQuotasBtn">שמירת מכסות</button></div>
      <div class="error-msg" id="quotaErr"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">סימון ימי חופשה או מחלה לעובד</h3>
      <div class="emp-row-form" style="align-items:flex-end; flex-wrap:wrap; gap:10px;">
        <div class="field" style="margin-top:0;"><label>עובד</label><select id="toEmp">${emps.map(e => `<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('')}</select></div>
        <div class="field" style="margin-top:0;"><label>מתאריך</label><input type="date" id="toFrom" value="${todayStr()}" /></div>
        <div class="field" style="margin-top:0;"><label>עד תאריך (לא חובה)</label><input type="date" id="toTo" /></div>
        <div class="field" style="margin-top:0;"><label>סוג</label><select id="toType">${Object.entries(DAY_OFF_TYPES).map(([k, t]) => `<option value="${k}">${t.icon} ${t.label}</option>`).join('')}</select></div>
        <div class="field" style="flex:0 0 auto; margin-top:0;"><button type="button" class="btn brass" id="toAddBtn">הוספה</button></div>
      </div>

    </div>
    ${rows.map(r => `
      <div class="card">
        <details>
          <summary style="cursor:pointer; font-weight:700;">${escapeHtml(r.emp.name)} · ${r.u.list.length} ימים מסומנים ב-${year}</summary>
          ${r.u.list.length ? `<div style="display:flex; flex-direction:column; gap:6px; margin-top:10px;">
            ${r.u.list.slice().sort((a, b) => a.date.localeCompare(b.date)).map(d => `
              <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 12px; background:var(--paper-alt); border-radius:8px;">
                <span>${DAY_OFF_TYPES[d.type].icon} <b>${DAY_OFF_TYPES[d.type].label}</b> · ${d.date} <span class="hint">(${hebrewDateStr(d.date)})</span></span>
                <button type="button" class="btn ghost small" data-to-remove="${r.emp.id}|${d.date}">הסרה</button>
              </div>`).join('')}
          </div>` : '<div class="hint" style="margin-top:8px;">אין ימים מסומנים בשנה הזו.</div>'}
        </details>

  document.getElementById('toNext').onclick = () => { state._toYear = year + 1; renderAdminTimeOff(); };

  document.getElementById('saveQuotasBtn').onclick = async (e) => {
    const btn = e.target, errEl = document.getElementById('quotaErr');
    errEl.textContent = '';
    const read = sel => { const v = document.querySelector(sel).value.trim(); return v === '' ? null : Number(v); };
    const fresh = await loadEmployees();
    if(fresh === null){ errEl.textContent = 'שגיאה בטעינת העובדים מהשרת. נסו שוב.'; return; }
    const updated = fresh.map(x => {
      if(!document.querySelector(`[data-quota-vac="${x.id}"]`)) return x;
      return { ...x, vacationDays: read(`[data-quota-vac="${x.id}"]`), sickDays: read(`[data-quota-sick="${x.id}"]`) };
    });
    if(updated.some(x => (x.vacationDays !== null && x.vacationDays !== undefined && (isNaN(x.vacationDays) || x.vacationDays < 0)) || (x.sickDays !== null && x.sickDays !== undefined && (isNaN(x.sickDays) || x.sickDays < 0)))){
      errEl.textContent = 'יש להזין מספר חיובי או להשאיר ריק.'; return;

    btn.disabled = true; btn.textContent = 'שומר...';
    const ok = await saveEmployees(updated);
    btn.disabled = false; btn.textContent = 'שמירת מכסות';
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
    state.employees = updated;
    showToast('המכסות נשמרו');

    const settings = await loadSettings(empId) || {};

  document.getElementById('toAddBtn').onclick = async () => {
    const errEl = document.getElementById('toErr');
    const empId = document.getElementById('toEmp').value;
    const from = document.getElementById('toFrom').value;

    if(to < from){ errEl.textContent = 'תאריך הסיום לפני תאריך ההתחלה.'; return; }
    const dates = [];
    const [fy, fm, fd] = from.split('-').map(Number);
    for(let dt = new Date(fy, fm - 1, fd, 12); ; dt.setDate(dt.getDate() + 1)){
      const ds = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
      if(ds > to) break;
      if(dt.getDay() !== 6) dates.push(ds); // בלי שבתות
      if(dates.length > 62){ errEl.textContent = 'אפשר לסמן עד חודשיים בבת אחת.'; return; }
    }
    if(!dates.length){ errEl.textContent = 'בטווח שנבחר אין ימי חול.'; return; }
    const ok = await saveOff(empId, list => list.filter(d => !dates.includes(d.date)).concat(dates.map(date => ({ date, type }))));
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
    showToast('נשמר');
    renderAdminTimeOff();
  };
  document.querySelectorAll('[data-to-remove]').forEach(btn => {
    btn.onclick = async () => {
      const [empId, date] = btn.dataset.toRemove.split('|');
      const ok = await saveOff(empId, list => list.filter(d => d.date !== date));
      if(ok !== true){ showToast('שגיאה בשמירה'); return; }
      renderAdminTimeOff();
    };
  });
}

// ---------- מנהל: דשבורד שבועי – שעות לפי ימים ועובדים ----------
const DASH_COLORS = ['#1F4E79', '#2E8B8B', '#B7862F', '#5B4B8A', '#A4505A', '#4F7A4A', '#5B7186', '#8C6D46', '#3E7CB1', '#7A7A7A'];
function weekStart(offset){
  const d = ilNow(); d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay() + (offset || 0) * 7); // יום ראשון
  return d;
}
function ymdLocal(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

// כרטיס בלוח הבקרה: אילו חודשים נעולים לעריכה (נועלים ופותחים בסיכום החודשי)
async function renderDashLocks(){
  const box = document.getElementById('dashLocks'); if(!box) return;
  const list = (await loadLocks(true)).slice().sort().reverse();
  box.innerHTML = `<h3 style="margin-top:0;">חודשים נעולים לעריכה</h3>
    ${list.length ? `<div style="display:flex; flex-direction:column; gap:6px;">
      ${list.map(m => `<div style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 12px; background:var(--paper-alt); border-radius:8px;">

    </div>` : '<div class="hint">אין חודשים נעולים.</div>'}`;
  box.querySelectorAll('[data-unlock]').forEach(btn => btn.onclick = async () => {

            <div class="actions" style="justify-content:flex-start; margin-top:6px;">
              <button type="button" class="btn ghost small" data-delete-req="${r.id}">מחיקה</button>

        </div>
      `).join('')}

  async function respond(id, status){
    const noteInput = document.querySelector(`[data-note="${id}"]`);
    const note = noteInput ? noteInput.value.trim() : '';

    };
  });
}

// ---------- מחשבון נטו (הערכה) ----------
// נתוני 2026 לשכיר. לעדכן בכל ינואר לפי "לוח עזר לחישוב מס הכנסה ממשכורת" של רשות המסים
// ולפי חוזר המוסד לביטוח לאומי "שינוי בתשלום דמי ביטוח לאומי ודמי ביטוח בריאות" לאותה שנה.
const PAYROLL_PARAMS = {
  year: 2026,
  taxBrackets: [            // מדרגות מס הכנסה חודשיות (אחרי ריווח המדרגות, בתוקף מ-1.1.2026)
    { upTo: 7010, rate: 0.10 },
    { upTo: 10060, rate: 0.14 },
    { upTo: 19000, rate: 0.20 },
    { upTo: 25100, rate: 0.31 },
    { upTo: 46690, rate: 0.35 },
    { upTo: Infinity, rate: 0.47 }
  ],
  surtaxFrom: 60130, surtaxRate: 0.03,   // מס נוסף על הכנסה חודשית גבוהה
  creditPointValue: 242,                 // שווי נקודת זיכוי לחודש
  niReducedUpTo: 7703,                   // בסיס לשיעור המופחת בביטוח לאומי ובריאות
  niMax: 51910,                          // הכנסה מרבית לדמי ביטוח
  niReduced: 0.0104, niFull: 0.07,       // ביטוח לאומי - חלק העובד
  healthReduced: 0.0323, healthFull: 0.0517  // דמי ביטוח בריאות
};
function calcNetSalary(gross, creditPoints, pensionPct){
  const P = PAYROLL_PARAMS;
  let taxBefore = 0, prev = 0;
  for(const b of P.taxBrackets){
    if(gross <= prev) break;
    taxBefore += (Math.min(gross, b.upTo) - prev) * b.rate;
    prev = b.upTo;
  }
  if(gross > P.surtaxFrom) taxBefore += (gross - P.surtaxFrom) * P.surtaxRate;
  const credits = Math.max(0, creditPoints) * P.creditPointValue;
  const incomeTax = Math.max(0, taxBefore - credits);
  const niBase = Math.min(gross, P.niMax);
  const low = Math.min(niBase, P.niReducedUpTo), high = Math.max(0, niBase - P.niReducedUpTo);
  const ni = low * P.niReduced + high * P.niFull;
  const health = low * P.healthReduced + high * P.healthFull;
  const pension = gross * (Math.max(0, pensionPct) / 100);
  const r = (v) => Math.round(v * 100) / 100;
  const net = gross - incomeTax - ni - health - pension;
  return { gross: r(gross), taxBefore: r(taxBefore), credits: r(Math.min(credits, taxBefore)), incomeTax: r(incomeTax), ni: r(ni), health: r(health), pension: r(pension), net: r(net) };
}
// נקודות זיכוי לפי מין העובד וגילאי הילדים (טבלת רשות המסים 2026; הגיל = שנת המס פחות שנת הלידה)
function childCreditPoints(age, isWoman){
  if(age === 0) return 2.5;
  if(age >= 1 && age <= 2) return 4.5;
  if(age === 3) return 3.5;
  if(age >= 4 && age <= 5) return 2.5;
  if(age >= 6 && age <= 17) return isWoman ? 2 : 1;
  if(age === 18) return isWoman ? 0.5 : 0;
  return 0;
}
function computeCreditPoints(gender, childYears, extra, taxYear){
  const isWoman = gender === 'f';
  const base = 2.25 + (isWoman ? 0.5 : 0);
  const kids = (childYears || []).map(y => {
    const age = taxYear - Number(y);
    return { year: Number(y), age, points: Number(y) > 0 && age >= 0 ? childCreditPoints(age, isWoman) : 0 };
  });
  const kidsTotal = kids.reduce((sum, k) => sum + k.points, 0);
  return { base, kids, kidsTotal, extra: Math.max(0, Number(extra) || 0), total: base + kidsTotal + Math.max(0, Number(extra) || 0) };
}

  if(!emp) return;
  const draw = () => {
    const g = Number(document.getElementById('netGross').value) || 0;
    const pp = Number(document.getElementById('netPension').value) || 0;
    const cp = computeCreditPoints(document.getElementById('netGender').value, state._netKids.years, document.getElementById('netExtra').value, taxYear);
    // רשימת הילדים + סיכום הנקודות
    const kidsList = document.getElementById('netKidsList');
    if(kidsList.children.length !== cp.kids.length){ // בונים מחדש רק כשנוסף או הוסר ילד, כדי לא לאבד את הסמן בזמן הקלדה
      kidsList.innerHTML = cp.kids.map((k, i) => `
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <span style="min-width:56px;">ילד/ה ${i + 1}</span>
          <input type="number" data-kid-idx="${i}" value="${k.year || ''}" placeholder="שנת לידה" min="1990" max="${taxYear}" dir="ltr" style="max-width:120px;" />
          <span class="hint" data-kid-info="${i}"></span>
          <button type="button" class="btn ghost small" data-kid-remove="${i}">הסרה</button>
        </div>`).join('');
      kidsList.querySelectorAll('[data-kid-idx]').forEach(inp => inp.oninput = () => { state._netKids.years[Number(inp.dataset.kidIdx)] = Number(inp.value) || ''; draw(); });
      kidsList.querySelectorAll('[data-kid-remove]').forEach(btn => btn.onclick = () => { state._netKids.years.splice(Number(btn.dataset.kidRemove), 1); kidsList.innerHTML = ''; draw(); });
    }
    cp.kids.forEach((k, i) => {
      const info = kidsList.querySelector(`[data-kid-info="${i}"]`);
      if(info) info.textContent = !k.year ? '' : (k.age < 0 ? 'שנה עתידית' : `גיל ${k.age} · ${k.points} נקודות`);
    });
    document.getElementById('netKidsCount').textContent = cp.kids.length;
    document.getElementById('netCreditSummary').innerHTML = `<b>סה"כ נקודות זיכוי: ${cp.total}</b> <span class="hint">(בסיס ${cp.base}${cp.kidsTotal ? ` + ילדים ${cp.kidsTotal}` : ''}${cp.extra ? ` + נוספות ${cp.extra}` : ''})</span>`;
    const r = calcNetSalary(g, cp.total, pp);
    const row = (label, val, opts = {}) => `<tr${opts.total ? ' class="total-row"' : ''}><td>${label}</td><td class="mono" style="text-align:left;"><span dir="ltr">${opts.minus && val > 0 ? '−' : ''}${fmtMoney(val)}</span></td></tr>`;
    document.getElementById('netResult').innerHTML = `
      <div class="table-scroll"><table>
        <tbody>
          ${row('שכר ברוטו', r.gross)}
          ${row('מס הכנסה לפני זיכויים', r.taxBefore)}
          ${row(`זיכוי (${cp.total} נקודות × ${fmtMoney(PAYROLL_PARAMS.creditPointValue)})`, r.credits)}
          ${row('מס הכנסה לתשלום', r.incomeTax, { minus: true })}
          ${row('ביטוח לאומי', r.ni, { minus: true })}
          ${row('מס בריאות', r.health, { minus: true })}
          ${row(`פנסיה – חלק העובד (${pp}%)`, r.pension, { minus: true })}
          ${row('נטו משוער לתשלום', r.net, { total: true })}
        </tbody>
      </table></div>
      <p class="hint" style="font-size:12.5px; margin-top:10px;">
        ⚠️ זו הערכה בלבד, לפי נתוני ${PAYROLL_PARAMS.year} לשכיר במשרה אחת. החישוב לא כולל תיאום מס, זיכויים נוספים (כמו תואר אקדמי או יישוב מוטב),
        הטבת מס על ההפקדה לפנסיה, קרן השתלמות או ניכויים אחרים. התלוש הרשמי צריך להיות מופק על ידי רואה חשבון או תוכנת שכר מוסמכת.
      </p>`;
  };
  ['netGross', 'netExtra', 'netPension'].forEach(id => document.getElementById(id).oninput = draw);
  document.getElementById('netGender').onchange = draw;
  document.getElementById('netAddKid').onclick = () => { state._netKids.years.push(''); document.getElementById('netKidsList').innerHTML = ''; draw(); const ins = document.querySelectorAll('[data-kid-idx]'); if(ins.length) ins[ins.length - 1].focus(); };
  document.getElementById('netGross').addEventListener('input', () => { state._netGrossOverride = Number(document.getElementById('netGross').value) || 0; });
  document.getElementById('netEmp').onchange = (e) => { state._netEmpId = e.target.value; state._netGrossOverride = null; state._netKids = null; renderAdminNetCalc(); };
  document.getElementById('netMonth').onchange = (e) => { state._netMonth = e.target.value; state._netGrossOverride = null; renderAdminNetCalc(); };
  document.getElementById('netShowToEmployees').onchange = async (e) => {
    const updated = { ...(state._appSettings || {}), showNetToEmployees: e.target.checked };
    const ok = await saveAppSettings(updated);
    if(ok !== true){ document.getElementById('netErr').textContent = 'שגיאה בשמירה: ' + ok; e.target.checked = !e.target.checked; return; }
    state._appSettings = updated;
    showToast(e.target.checked ? 'הנטו המשוער יוצג לעובדים' : 'הנטו המשוער הוסתר מהעובדים');
  };
  document.getElementById('netSaveParams').onclick = async () => {
    const errEl = document.getElementById('netErr');
    const pp = Number(document.getElementById('netPension').value);
    const extra = Number(document.getElementById('netExtra').value) || 0;
    const g2 = document.getElementById('netGender').value;
    const years = state._netKids.years.map(Number).filter(y => y > 1900);
    if(!(pp >= 0) || !(extra >= 0)){ errEl.textContent = 'ערכים לא תקינים.'; return; }
    const c = computeCreditPoints(g2, years, extra, taxYear).total;
    const list = await loadEmployees();
    if(list === null){ errEl.textContent = 'לא הצלחנו להתחבר לשרת.'; return; }
    const updated = list.map(x => x.id === emp.id ? { ...x, creditPoints: c, pensionPct: pp, gender: g2, childYears: years, extraPoints: extra } : x);
    const ok = await saveEmployees(updated);
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
    state.employees = updated;
    showToast('נשמר לעובד ' + emp.name);
  };
  draw();
}

// ---------- מנהל: מי בעבודה עכשיו ----------
async function renderAdminNow(){
  const content = document.getElementById('tabContent');
  content.innerHTML = `<div class="empty-state">טוען נתונים...</div>`;
  const t = todayStr();
  const month = t.slice(0, 7);
  const rows = await Promise.all(activeEmployees().map(async emp => {
    const [hoursData, settings] = await Promise.all([loadHours(emp.id), loadSettings(emp.id)]);
    const today = ((hoursData || {})[month] || []).filter(e => e.date === t);
    const off = getDaysOff(settings).find(d => d.date === t);
    const open = today.find(e => !e.end);
    const hours = today.reduce((sum, e) => sum + entryHoursSoFar(e), 0);
    let status, detail;
    if(open){
      const lastBreak = (open.breaks || []).slice(-1)[0];
      if(lastBreak && !lastBreak.end){ status = 'break'; detail = 'בהפסקה מ-' + hhmm(lastBreak.start); }
      else { status = 'working'; detail = 'נכנס/ה ב-' + hhmm(open.start); }
    } else if(today.length){
      const last = today.slice().sort((a, b) => String(a.end).localeCompare(String(b.end))).slice(-1)[0];
      status = 'done'; detail = 'סיים/ה ב-' + hhmm(last.end);
    } else if(off){
      status = off.type; detail = DAY_OFF_TYPES[off.type].label;
    } else {
      status = 'absent'; detail = 'עדיין לא נכנס/ה';
    }
    return { emp, status, detail, hours };
  }));
  const ST = {
    working: { label: 'בעבודה', color: '#10B981', order: 0 },
    break:   { label: 'בהפסקה', color: '#F59E0B', order: 1 },
    done:    { label: 'סיימו', pill: 'סיים/ה', color: '#60A5FA', order: 2 },
    absent:  { label: 'לא הגיעו', pill: 'לא הגיע/ה', color: '#9CA3AF', order: 3 },
    vacation:{ label: 'בחופשה', color: '#14B8A6', order: 4 },
    sick:    { label: 'במחלה', color: '#EC4899', order: 5 }
  };
  rows.sort((a, b) => ST[a.status].order - ST[b.status].order || a.emp.name.localeCompare(b.emp.name, 'he'));
  const counts = Object.keys(ST).map(k => ({ k, n: rows.filter(r => r.status === k).length })).filter(x => x.n > 0);
  const timeNow = hhmm(nowTimeStr());
  content.innerHTML = `
    <div class="top-actions" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <span class="subtitle">היום, ${t.split('-').reverse().join('/')} (${hebrewDateStr(t)}) · מעודכן ל-${timeNow}</span>
      <button type="button" class="btn ghost small" id="nowRefreshBtn">🔄 רענון</button>
    </div>
    ${activeEmployees().length === 0 ? '<div class="card"><div class="empty-state">אין עדיין עובדים פעילים במערכת.</div></div>' : `
    <div class="card" style="display:flex; gap:16px; flex-wrap:wrap; font-size:15px;">
      ${counts.map(c => `<span style="display:inline-flex; align-items:center; gap:6px;"><span style="width:12px; height:12px; border-radius:50%; background:${ST[c.k].color}; display:inline-block;"></span><b>${ST[c.k].label}:</b> ${c.n}</span>`).join('')}
    </div>
    <div class="card">
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${rows.map(r => `
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; background:var(--paper-alt); border-radius:10px; border-inline-start:5px solid ${ST[r.status].color};">
            <div style="display:flex; align-items:center; gap:10px;">
              ${avatarHtml(r.emp)}
              <div>
                <div style="font-weight:600;">${escapeHtml(r.emp.name)}</div>
                <div class="hint" style="font-size:13px;">${escapeHtml(r.detail)}</div>
              </div>
            </div>
            <div style="text-align:left;">
              <span class="pill" style="background:${ST[r.status].color}; color:#fff;">${ST[r.status].pill || ST[r.status].label}</span>
              ${r.hours > 0 ? `<div class="hint mono" style="font-size:12.5px; margin-top:4px;">${fmtHours(Math.round(r.hours * 100) / 100)} שעות היום</div>` : ''}
            </div>
          </div>`).join('')}
      </div>
    </div>`}
  `;
  const btn = document.getElementById('nowRefreshBtn');
  if(btn) btn.onclick = () => renderAdminNow();
}


// ---------- תלוש חודשי לעובד (דף להדפסה / שמירה כ-PDF) ----------
// סיכום פנימי של שעות ושכר – לא תלוש שכר רשמי. הנטו משוער לפי פרטי המחשבון.
async function openPayslip(emp, month){
  const win = window.open('', '_blank');
  if(!win){ showToast('הדפדפן חסם את החלון. אפשרו חלונות קופצים לאתר.'); return; }
  win.document.write('<p style="font-family:sans-serif;direction:rtl">טוען...</p>');
  const [hoursData, settings] = await Promise.all([loadHours(emp.id), loadSettings(emp.id)]);
  const entries = ((hoursData || {})[month] || []).slice().sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  const closed = entries.filter(e => e.end);
  const hours = closed.reduce((s, e) => s + (computeEntryHours(e) || 0), 0);
  const days = new Set(closed.map(e => e.date)).size;
  const gross = calcPay(emp, hours);
  const net = employeeNetEstimate(emp, gross, Number(month.slice(0, 4)));
  const off = getDaysOff(settings).filter(d => d.date.slice(0, 7) === month);
  const r2 = n => Math.round(n * 100) / 100;
  const rows = closed.map(e => {
    const br = (e.breaks || []).filter(b => b.end).reduce((s, b) => s + (computeHoursFromRange(b.start, b.end) || 0), 0);
    return `<tr><td>${e.date.split('-').reverse().join('/')}</td><td>${hebrewDateStr(e.date)}</td><td>${hhmm(e.start)}</td><td>${hhmm(e.end)}</td><td>${br ? fmtHours(r2(br)) : '—'}</td><td>${fmtHours(r2(computeEntryHours(e) || 0))}</td></tr>`;
  }).join('');
  const line = (k, v, b) => `<tr${b ? ' class="b"' : ''}><td>${k}</td><td>${v}</td></tr>`;
  const html = `<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>תלוש ${escapeHtml(emp.name)} – ${monthLabel(month)}</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;color:#12293F;margin:32px auto;padding:0 24px;max-width:820px}
    h1{font-size:22px;margin:0 0 4px} .sub{color:#5B7186;font-size:13px;margin-bottom:22px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}
    table{width:100%;border-collapse:collapse;font-size:13.5px} td,th{padding:7px 8px;border-bottom:1px solid #DCE3EA;text-align:right}
    th{color:#5B7186;font-weight:600;font-size:12.5px;border-bottom:1.5px solid #12293F}
    .box{border:1px solid #DCE3EA;border-radius:8px;padding:12px 14px} .box h3{margin:0 0 8px;font-size:14px}
    tr.b td{font-weight:700;border-top:1.5px solid #12293F} .note{color:#5B7186;font-size:12px;margin-top:18px}
    .actions{margin-bottom:18px} button{padding:8px 16px;font-size:14px;cursor:pointer}
    @media print{.actions{display:none} body{margin:12mm}}
  </style></head><body>
  <div class="actions"><button onclick="print()">הדפסה / שמירה כ-PDF</button></div>
  <h1>סיכום חודשי – ${escapeHtml(emp.name)}</h1>
  <div class="sub">${monthLabel(month)} · הופק ב-${new Date().toLocaleDateString('he-IL')}</div>
  <div class="grid">
    <div class="box"><h3>שעות</h3><table>
      ${line('ימי עבודה', days)}${line('סה"כ שעות', fmtHours(r2(hours)))}
      ${line('ימי חופשה', off.filter(d => d.type === 'vacation').length)}${line('ימי מחלה', off.filter(d => d.type === 'sick').length)}
    </table></div>
    <div class="box"><h3>שכר (משוער)</h3><table>
      ${line('סוג שכר', emp.payType === 'fixed' ? 'חודשי קבוע' : 'שעתי · ' + fmtMoney(Number(emp.rate) || 0) + ' לשעה')}
      ${line('ברוטו', fmtMoney(r2(gross)), true)}
      ${line('מס הכנסה', fmtMoney(net.incomeTax))}${line('ביטוח לאומי', fmtMoney(net.ni))}${line('ביטוח בריאות', fmtMoney(net.health))}${line('פנסיה (' + net.pensionPct + '%)', fmtMoney(net.pension))}
      ${line('נטו משוער', fmtMoney(net.net), true)}
    </table></div>
  </div>
  <table><thead><tr><th>תאריך</th><th>תאריך עברי</th><th>כניסה</th><th>יציאה</th><th>הפסקות (שעות)</th><th>שעות</th></tr></thead>
  <tbody>${rows || '<tr><td colspan="6">אין רישומים בחודש הזה.</td></tr>'}</tbody></table>
  <div class="note">זהו סיכום פנימי של שעות ושכר ואינו תלוש שכר רשמי. הנטו מחושב בהערכה, לפי הפרטים שהוזנו במחשבון הנטו${net.configured ? '' : ' (לעובד הזה עוד לא הוזנו פרטים, ולכן החישוב לפי ברירת מחדל)'}.</div>
  </body></html>`;
  win.document.open(); win.document.write(html); win.document.close();
}

                <td class="mono">${fmtHours(r.totalHours)}</td>
                ${canDo('pay') ? `<td class="mono">${fmtMoney(r.pay)}</td>` : ''}

              ${canDo('pay') ? `<td class="mono" id="grandPayCell">${fmtMoney(0)}</td>` : ''}
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">שעות עבודה לפי עובד</h3>
      <div style="position:relative; height:260px;"><canvas id="hoursChart"></canvas></div>
    </div>
    ${canDo('pay') ? `<div class="card">
      <h3 style="margin-top:0;">עלות שכר לפי עובד</h3>
      <div style="position:relative; height:260px;"><canvas id="payChart"></canvas></div>
    </div>` : ''}
    `}
  `;
  document.getElementById('monthPicker').onchange = (e) => {
    state._adminMonth = e.target.value;
    renderAdminSummary();
  };
  const lockBtn = document.getElementById('monthLockBtn');
  if(lockBtn) loadLocks(true).then(list => {
    const isL = list.includes(month);
    lockBtn.textContent = isL ? '🔒 החודש נעול · פתיחה' : '🔓 נעילת החודש';
    lockBtn.onclick = async () => {
      const msg = isL ? `לפתוח את ${monthLabel(month)}? העובדים יוכלו שוב לשנות בו שעות.` : `לנעול את ${monthLabel(month)}? העובדים לא יוכלו לשנות בו שעות. אתה תוכל לשנות ולפתוח אותו בכל רגע.`;
      if(!(await showConfirmModal(msg, { yes: isL ? 'פתיחה' : 'נעילה', danger: false }))) return;
      const ok = await setMonthLocked(month, !isL);
      if(ok !== true){ showToast('שגיאה בשמירה: ' + ok); return; }
      showToast(isL ? 'החודש נפתח' : 'החודש ננעל');
      renderAdminSummary();
    };
  });
  const exportBtn = document.getElementById('payrollExportBtn');
  if(exportBtn) exportBtn.onclick = async () => {
    exportBtn.disabled = true; exportBtn.textContent = 'מכין דוח...';
    try{ await exportPayrollReport(month); }
    catch(e){ console.error(e); showToast('לא הצלחנו להכין את הדוח'); }
    exportBtn.disabled = false; exportBtn.textContent = '📥 דוח שכר לאקסל';
  };
  document.querySelectorAll('[data-payslip]').forEach(btn => {
    btn.onclick = async () => {
      const emp = activeEmployees().find(e => e.id === btn.dataset.payslip);
      if(!emp) return;
      btn.disabled = true;
      try{ await openPayslip(emp, month); }catch(e){ console.error(e); showToast('לא הצלחנו להכין את התלוש'); }
      btn.disabled = false;
    };
  });
  document.getElementById('grandHoursCell').textContent = fmtHours(grandHours);
  const gpc = document.getElementById('grandPayCell'); if(gpc) gpc.textContent = fmtMoney(grandPay);

  if(rows.length && window.Chart){
    renderAdminCharts(rows);
  }
}

// דוח שכר חודשי לאקסל: גיליון "סיכום" (שורה לכל עובד) וגיליון "פירוט" (שורה לכל יום עבודה)
async function exportPayrollReport(month){
  if(typeof XLSX === 'undefined'){ showToast('ספריית האקסל לא נטענה. נסו לרענן את הדף.'); return; }
  const summary = [], detail = [];
  let sumHours = 0, sumPay = 0;
  for(const emp of activeEmployees()){
    const [hoursData, settings] = await Promise.all([loadHours(emp.id), loadSettings(emp.id)]);
    const entries = (((hoursData || {})[month]) || []).slice().sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
    const totalHours = entries.reduce((sum, e) => sum + (computeEntryHours(e) || 0), 0);
    const pay = totalHours > 0 || emp.payType === 'fixed' ? calcPay(emp, totalHours) : 0;
    const workDays = new Set(entries.map(e => e.date)).size;
    const off = getDaysOff(settings).filter(d => d.date.slice(0, 7) === month);
    const r2 = (v) => Math.round(v * 100) / 100;
    sumHours += totalHours; sumPay += pay;
    summary.push({
      'שם העובד': emp.name,
      'סוג שכר': emp.payType === 'fixed' ? 'חודשי קבוע' : 'שעתי',
      'תעריף (₪)': emp.rate || 0,
      'ימי עבודה': workDays,
      'סה"כ שעות': r2(totalHours),
      'סה"כ לתשלום (₪)': r2(pay),
      'ימי חופשה': off.filter(d => d.type === 'vacation').length,
      'ימי מחלה': off.filter(d => d.type === 'sick').length
    });
    entries.forEach(e => {
      const h = computeEntryHours(e);
      const breakMin = Math.round((e.breaks || []).filter(b => b.end).reduce((sum, b) => sum + (computeHoursFromRange(b.start, b.end) || 0), 0) * 60);
      detail.push({
        'שם העובד': emp.name,
        'תאריך': e.date.split('-').reverse().join('/'),
        'תאריך עברי': hebrewDateStr(e.date),
        'משעה': hhmm(e.start) || '',
        'עד שעה': e.end ? hhmm(e.end) : 'פתוח',
        'הפסקות (דקות)': breakMin,
        'שעות': h !== null ? r2(h) : '',
        'סכום (₪)': h !== null && emp.payType !== 'fixed' ? r2(h * emp.rate) : ''
      });
    });
  }
  summary.push({ 'שם העובד': 'סה"כ', 'סוג שכר': '', 'תעריף (₪)': '', 'ימי עבודה': '', 'סה"כ שעות': Math.round(sumHours * 100) / 100, 'סה"כ לתשלום (₪)': Math.round(sumPay * 100) / 100, 'ימי חופשה': '', 'ימי מחלה': '' });
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(summary);
  ws1['!cols'] = [{ wch: 18 }, { wch: 12 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 16 }, { wch: 10 }, { wch: 10 }];
  const ws2 = XLSX.utils.json_to_sheet(detail.length ? detail : [{ 'שם העובד': 'אין רישומים בחודש זה' }]);
  ws2['!cols'] = [{ wch: 18 }, { wch: 12 }, { wch: 14 }, { wch: 8 }, { wch: 8 }, { wch: 14 }, { wch: 8 }, { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, ws1, 'סיכום');
  XLSX.utils.book_append_sheet(wb, ws2, 'פירוט');
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.writeFile(wb, `דוח שכר ${monthLabel(month)}.xlsx`);
  showToast('הדוח הורד');
}

// ---------- מנהל: בדיקת תקינות של העובדים והרישומים ----------
async function renderAdminHealthCheck(){
  const content = document.getElementById('tabContent');
  content.innerHTML = `<div class="empty-state">בודק את כל הרישומים...</div>`;
  const today = todayStr();
  const employees = activeEmployees();
  const issues = []; // { level: 'error'|'warn', who, text }
  const add = (level, who, text) => issues.push({ level, who, text });
  const fmtD = (d) => d.split('-').reverse().join('/');
  const phoneOk = (p) => /^0(5\d{8}|[2-489]\d{7}|7\d{8})$/.test(String(p).replace(/\D/g, ''));
  const seenPhones = {};
  for(const emp of employees){
    const ph = String(emp.phone || '').replace(/\D/g, '');
    if(!ph) add('warn', emp.name, 'אין מספר טלפון – העובד לא יוכל לדווח בצלצול ולא יקבל תזכורות.');
    else if(!phoneOk(ph)) add('error', emp.name, `מספר הטלפון ${emp.phone} נראה שגוי (${ph.length} ספרות).`);
    else if(seenPhones[ph]) add('error', emp.name, `מספר הטלפון ${emp.phone} רשום גם אצל ${seenPhones[ph]} – הצלצול יירשם רק לאחד מהם.`);
    if(ph) seenPhones[ph] = seenPhones[ph] || emp.name;
    if(!emp.email) add('warn', emp.name, 'אין כתובת מייל – העובד לא יקבל מייל כשנשאר לו יום פתוח.');
    if(emp.payType !== 'fixed' && !(Number(emp.rate) > 0)) add('error', emp.name, 'לא הוגדר תעריף לשעה – השכר יחושב כ-0.');
  }
  const all = await Promise.all(employees.map(async emp => ({ emp, hoursData: (await loadHours(emp.id)) || {} })));
  for(const { emp, hoursData } of all){
    Object.keys(hoursData).sort().forEach(month => {
      const list = Array.isArray(hoursData[month]) ? hoursData[month] : [];
      list.forEach(e => {
        const d = fmtD(e.date || '');
        if(!e.end && e.date < today) add('error', emp.name, `יום ${d} עדיין פתוח (נכנס/ה ב-${hhmm(e.start)}, אין שעת יציאה).`);
        if(e.end){
          const h = computeEntryHours(e);
          if(h !== null && h > 14) add('warn', emp.name, `ביום ${d} נרשמו ${fmtHours(Math.round(h * 100) / 100)} שעות – כדאי לבדוק שזה נכון.`);
          if(h !== null && h <= 0) add('error', emp.name, `ביום ${d} סה"כ השעות יוצא 0 או פחות – כנראה ההפסקות ארוכות מיום העבודה.`);
        }
        (e.breaks || []).forEach(b => {
          if(!b.end && e.end) add('error', emp.name, `ביום ${d} יש הפסקה מ-${hhmm(b.start)} בלי שעת סיום, למרות שהיום נסגר.`);
          if(b.end){
            const bh = computeHoursFromRange(hhmm(b.start), hhmm(b.end));
            if(bh === null || bh <= 0 || bh >= 12) add('error', emp.name, `ביום ${d} ההפסקה ${hhmm(b.start)}–${hhmm(b.end)} אינה תקינה.`);
          }
          if(b.start && e.start && hhmm(b.start) < hhmm(e.start)) add('warn', emp.name, `ביום ${d} ההפסקה מתחילה (${hhmm(b.start)}) לפני תחילת היום (${hhmm(e.start)}).`);
        });
      });
      const byDate = {};
      list.forEach(e => { byDate[e.date] = (byDate[e.date] || 0) + 1; });
      Object.entries(byDate).filter(([, n]) => n > 1).forEach(([date, n]) => add('warn', emp.name, `ביום ${fmtD(date)} יש ${n} רישומים נפרדים (מלפני האיחוד לשורה אחת ליום). בסיכומים הם נספרים כיום אחד.`));
    });
  }
  const errors = issues.filter(i => i.level === 'error'), warns = issues.filter(i => i.level === 'warn');
  const block = (title, color, list) => !list.length ? '' : `
    <div class="card">
      <h3 style="margin-top:0; color:${color};">${title} (${list.length})</h3>
      <div style="display:flex; flex-direction:column; gap:6px;">
        ${list.map(i => `<div style="padding:9px 12px; background:var(--paper-alt); border-radius:8px; border-inline-start:4px solid ${color}; font-size:14px;"><b>${escapeHtml(i.who)}:</b> ${escapeHtml(i.text)}</div>`).join('')}
      </div>
    </div>`;
  content.innerHTML = `
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">
      <button class="btn ghost small" id="healthBack">→ חזרה לניהול עובדים</button>
      <button class="btn ghost small" id="healthRerun">🔄 בדיקה מחדש</button>
      <span class="subtitle">נבדקו ${employees.length} עובדים פעילים</span>
    </div>
    ${!issues.length ? '<div class="card"><div class="empty-state">✅ הכול תקין! לא נמצאו בעיות.</div></div>' : ''}
    ${block('❌ בעיות שצריך לתקן', '#DC2626', errors)}
    ${block('⚠️ כדאי לבדוק', '#D97706', warns)}
  `;
  document.getElementById('healthBack').onclick = renderAdminEmployees;
  document.getElementById('healthRerun').onclick = renderAdminHealthCheck;
}

// ---------- אשפה: עובד שנמחק נשמר 30 יום ב-meta/trash ואפשר לשחזר אותו (אחר כך השרת מוחק לצמיתות) ----------
async function loadTrash(){
  try{
    const snap = await withTimeout(getDoc(doc(db, 'meta', 'trash')), 30000, 'loadTrash');
    return snap.exists() ? (snap.data().list || []) : [];
  }catch(e){ console.error('loadTrash error', e); return null; }
}
async function moveEmployeeToTrash(id){
  const list = await loadEmployees();
  if(list === null) return 'לא הצלחנו להתחבר לשרת';
  const rec = list.find(x => x.id === id);
  if(!rec) return 'העובד לא נמצא';
  const trash = await loadTrash();
  if(trash === null) return 'לא הצלחנו להתחבר לשרת';
  const ok1 = await saveDoc(() => setDoc(doc(db, 'meta', 'trash'), { list: [{ ...rec, deletedAt: new Date().toISOString() }, ...trash.filter(x => x.id !== id)] }), 'saveTrash');
  if(ok1 !== true) return ok1;
  const updated = list.filter(x => x.id !== id);
  const ok2 = await saveEmployees(updated);
  if(ok2 === true) state.employees = updated;
  return ok2;
}
async function restoreEmployeeFromTrash(id){
  const trash = await loadTrash(), list = await loadEmployees();
  if(trash === null || list === null) return 'לא הצלחנו להתחבר לשרת';
  const rec = trash.find(x => x.id === id);
  if(!rec) return 'העובד לא נמצא באשפה';
  const { deletedAt, ...emp } = rec;
  const updated = list.some(x => x.id === id) ? list : [...list, emp];
  const ok1 = await saveEmployees(updated);
  if(ok1 !== true) return ok1;
  state.employees = updated;
  return await saveDoc(() => setDoc(doc(db, 'meta', 'trash'), { list: trash.filter(x => x.id !== id) }), 'saveTrash');
}
async function renderTrashCard(){
  const box = document.getElementById('trashCard');
  if(!box) return;
  const trash = await loadTrash();
  if(trash === null){ box.innerHTML = '<div class="card"><div class="empty-state">שגיאה בטעינת האשפה. נסו לרענן.</div></div>'; return; }
  if(!trash.length){ box.innerHTML = '<div class="card"><div class="empty-state">האשפה ריקה</div></div>'; return; }
  const daysLeft = d => Math.max(0, 30 - Math.floor((Date.now() - Date.parse(d)) / 86400000));
  box.innerHTML = `
    <div class="card">
      <h3>עובדים שנמחקו (${trash.length})</h3>
      <div class="hint" style="font-size:13px; margin:-6px 0 8px;">עובד שנמחק נשמר כאן 30 יום ואפשר לשחזר אותו. אחר כך הוא נמחק לצמיתות.</div>
      ${trash.map(emp => `
        <div class="list-item" style="opacity:.75;">
          <div class="avatar-row">
            ${avatarHtml(emp, 'small')}
            <div>
              <div class="name">${escapeHtml(emp.name || '')}</div>
              <div class="meta">נמחק ב-${new Date(emp.deletedAt).toLocaleDateString('he-IL')} · יימחק לצמיתות בעוד ${daysLeft(emp.deletedAt)} ימים</div>
            </div>
          </div>
          <div class="row-actions"><button class="btn brass small" data-restore="${escapeHtml(emp.id)}">שחזור</button></div>
        </div>`).join('')}
    </div>`;
  box.querySelectorAll('[data-restore]').forEach(btn => btn.onclick = async () => {
    btn.disabled = true;
    const ok = await restoreEmployeeFromTrash(btn.dataset.restore);
    if(ok !== true){ showToast('שגיאה בשחזור: ' + ok); btn.disabled = false; return; }
    showToast('העובד שוחזר');
    renderAdminEmployees();
  });
}

          ${avatarHtml(emp, 'small')}

            <div class="name">${escapeHtml(emp.name)}</div>

      </div>`).join('')}` : '');

    const list = await loadEmployees();
    if(list === null){ showToast('לא הצלחנו להתחבר לשרת'); return; }
    const updated = list.map(x => x.id === id ? (frozenVal ? { ...x, frozen: true, frozenAt: todayStr() } : (({ frozen, frozenAt, ...rest }) => rest)(x)) : x);

      ...emp,
      name: document.getElementById('editName').value.trim(),
      username,

      phone: document.getElementById('editPhone').value.trim(),
      email: document.getElementById('editEmail').value.trim(),
      address: document.getElementById('editAddress').value.trim(),

      rate: Number(document.getElementById('editRate').value),
      emailjsServiceId: document.getElementById('editEmailjsServiceId').value.trim() || null,
    };

    const ok = await saveEmployees(updatedList);
    submitBtn.disabled = false;
    submitBtn.textContent = 'שמירת שינויים';
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
    state.employees = updatedList;
    showToast('הפרטים נשמרו');
    renderAdminDashboard('employees');
  };
}

        <div class="hint" style="font-size:12.5px;">אם כבר קיים חשבון עם האימייל הזה, הוא יקבל הרשאת מנהל עם הסיסמה הקיימת שלו. המנהל יוכל לשנות סיסמה דרך "שכחת סיסמה?".</div>

async function saveAdminEmails(emails, perms){
  const clean = {}; Object.entries(perms || {}).forEach(([k, v]) => { if(emails.includes(k)) clean[k] = v; });
  return await saveDoc(() => setDoc(doc(db, 'meta', 'admins'), { emails, perms: clean }), 'saveAdmins');
}
function bindAdmins(a){
  if(!a || a.error) return;
  document.querySelectorAll('[data-rm-admin]').forEach(btn => btn.onclick = async () => {
    const em = btn.dataset.rmAdmin;
    if(!(await showConfirmModal(`להסיר את ${em} מהמנהלים? הוא לא יוכל עוד להיכנס לפאנל הניהול.`, { yes: 'הסרה' }))) return;
    const ok = await saveAdminEmails(a.emails.filter(x => x !== em), a.perms);
    if(ok !== true){ showToast('שגיאה בשמירה: ' + ok); return; }
    showToast('המנהל הוסר'); renderAdminSettings();
  });
  document.querySelectorAll('[data-perm-email]').forEach(cb => cb.onchange = async () => {
    const em = cb.dataset.permEmail;
    const perms = { ...(a.perms || {}) };
    const set = new Set(perms[em] || []); cb.checked ? set.add(cb.dataset.perm) : set.delete(cb.dataset.perm);
    perms[em] = [...set];
    cb.disabled = true;
    const ok = await saveAdminEmails(a.emails, perms);
    cb.disabled = false;
    if(ok !== true){ cb.checked = !cb.checked; showToast('שגיאה בשמירה: ' + ok); return; }
    a.perms = perms; showToast('ההרשאות עודכנו');
  });
  const f = document.getElementById('addAdminForm');
  f.onsubmit = async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('adminAddErr'), btn = f.querySelector('button[type=submit]');
    const email = document.getElementById('newAdminEmail').value.trim().toLowerCase(), password = document.getElementById('newAdminPass').value;
    errEl.textContent = '';
    if(a.emails.includes(email) || email === OWNER_ADMIN){ errEl.textContent = 'האימייל הזה כבר מנהל.'; return; }
    btn.disabled = true; btn.textContent = 'מוסיף...';
    try{
      // יצירת חשבון בלי להתנתק מהחשבון הנוכחי
      const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + firebaseConfig.apiKey, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password, returnSecureToken: false }) });
      const j = await r.json();
      if(!r.ok && !(j.error && j.error.message === 'EMAIL_EXISTS')) throw new Error((j.error && j.error.message) || 'שגיאה');
    }catch(err){ btn.disabled = false; btn.textContent = 'הוספה'; errEl.textContent = 'לא הצלחנו ליצור חשבון: ' + err.message; return; }
    const ok = await saveAdminEmails([...a.emails, email], a.perms);
    btn.disabled = false; btn.textContent = 'הוספה';
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
    showToast('המנהל נוסף'); renderAdminSettings();
  };
}

// לחיצה על "הגדרות" בתפריט פותחת לידו תפריט צף עם כל חלקי ההגדרות
function toggleSettingsFlyout(btn){
  const old = document.getElementById('setFlyout');
  if(old){ old.remove(); return; }
  const cur = state._adminSettingsTab || 'email';
  const onSettings = btn.classList.contains('active');
  const m = document.createElement('div');
  m.id = 'setFlyout'; m.className = 'set-menu';
  m.innerHTML = ADMIN_SETTINGS_TABS.map(t => `<div class="set-menu-item${onSettings && t.key === cur ? ' active' : ''}" data-fly="${t.key}">${t.label}</div>`).join('');
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect();
  m.style.position = 'fixed';
  if(window.innerWidth <= 860){
    m.style.top = (r.bottom + 6) + 'px';
    m.style.left = Math.max(8, Math.min(r.left, window.innerWidth - m.offsetWidth - 8)) + 'px';
  } else {
    m.style.top = Math.max(8, Math.min(r.top - 6, window.innerHeight - m.offsetHeight - 8)) + 'px';
    m.style.left = Math.max(8, r.left - m.offsetWidth - 10) + 'px';
  }
  const done = () => { m.remove(); document.removeEventListener('click', close); window.removeEventListener('scroll', done, true); };
  const close = ev => { if(!m.contains(ev.target)) done(); };
  m.querySelectorAll('[data-fly]').forEach(it => it.onclick = () => {
    done();
    state._adminSettingsTab = it.dataset.fly;
    state._emailjsDraft = null; state._emailEditMode = false; state._whatsappEditMode = false; state._autosendEditMode = false;
    renderAdminDashboard('settings');
  });
  setTimeout(() => { document.addEventListener('click', close); window.addEventListener('scroll', done, true); }, 0);
}

// לשונית "מידע": כל כרטיס מוצג מקופל, רק עם הכותרת, ונפתח בנגיעה
function makeInfoAccordion(root){
  root.querySelectorAll(':scope > .card').forEach(card => {
    const h = card.querySelector('h3');
    if(!h) return;
    const det = document.createElement('details');
    det.className = 'info-acc';
    const sum = document.createElement('summary');
    sum.textContent = h.textContent;
    h.remove();
    const body = document.createElement('div');
    body.className = 'info-acc-body';
    while(card.firstChild) body.appendChild(card.firstChild);
    det.appendChild(sum); det.appendChild(body);
    card.appendChild(det);
    card.style.padding = '0';
  });
}

      state._adminSettingsTab = t.dataset.settingsTab;
      state._emailjsDraft = null;
      state._emailEditMode = false;
      state._whatsappEditMode = false;
      state._autosendEditMode = false;
      renderAdminSettings();
    };
  });
  const startEmailEdit = document.getElementById('startEmailEdit');
  if(startEmailEdit) startEmailEdit.onclick = () => { state._emailEditMode = true; renderAdminSettings(); };
  const revokeTrustedDeviceBtn = document.getElementById('revokeTrustedDeviceBtn');
  if(revokeTrustedDeviceBtn) revokeTrustedDeviceBtn.onclick = async () => {
    const confirmed = await showConfirmModal('לנתק את המכשיר הזה? כניסה הבאה, גם עם אינטרנט, תדרוש הזנת סיסמה מחדש.', { yes: 'ניתוק' });
    if(!confirmed) return;
    try{ localStorage.removeItem('trustedAdminDevice'); }catch(e){}
    showToast('המכשיר נותק בהצלחה');
  };
  const cancelEmailEdit = document.getElementById('cancelEmailEdit');
  if(cancelEmailEdit) cancelEmailEdit.onclick = () => { state._emailEditMode = false; renderAdminSettings(); };
  const startWhatsappEdit = document.getElementById('startWhatsappEdit');
  if(startWhatsappEdit) startWhatsappEdit.onclick = () => { state._whatsappEditMode = true; renderAdminSettings(); };
  const cancelWhatsappEdit = document.getElementById('cancelWhatsappEdit');
  if(cancelWhatsappEdit) cancelWhatsappEdit.onclick = () => { state._whatsappEditMode = false; renderAdminSettings(); };
  const startAutosendEdit = document.getElementById('startAutosendEdit');
  if(startAutosendEdit) startAutosendEdit.onclick = () => { state._autosendEditMode = true; renderAdminSettings(); };
  const cancelAutosendEdit = document.getElementById('cancelAutosendEdit');
  if(cancelAutosendEdit) cancelAutosendEdit.onclick = () => { state._autosendEditMode = false; state._emailjsDraft = null; renderAdminSettings(); };
  let removeAnnouncementFlag = false;
  const removeAnnouncementBtn = document.getElementById('removeAnnouncementImg');
  if(removeAnnouncementBtn){
    removeAnnouncementBtn.onclick = () => {
      removeAnnouncementFlag = true;
      removeAnnouncementBtn.textContent = 'התמונה תוסר בשמירה ✓';
      removeAnnouncementBtn.disabled = true;
    };
  }
  const announcementForm = document.getElementById('announcementForm');
  if(announcementForm) announcementForm.onsubmit = async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('announcementErr');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const caption = document.getElementById('announcementCaption').value.trim();
    const imageFile = document.getElementById('announcementImage').files[0];
    errEl.style.color = '';
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'שומר...';
    let image = announcement.image || null;
    if(removeAnnouncementFlag) image = null;
    if(imageFile){
      try{ image = await resizeImageFile(imageFile, 640, 0.75); }
      catch(err){ errEl.textContent = 'שגיאה בקריאת התמונה'; submitBtn.disabled=false; submitBtn.textContent='שמירת הודעה'; return; }
    }
    const ok = await saveAnnouncement(image, caption);
    submitBtn.disabled = false;
    submitBtn.textContent = 'שמירת הודעה';
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
    errEl.style.color = '#2F5233';
    errEl.textContent = 'ההודעה נשמרה בהצלחה';
    renderAdminSettings();
  };

  const managerEmailForm = document.getElementById('managerEmailForm');
  if(managerEmailForm) managerEmailForm.onsubmit = async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('managerEmailErr');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const val = document.getElementById('managerEmailInput').value.trim();
    errEl.style.color = '';
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'שומר...';
    const ok = await saveManagerEmail(val);
    submitBtn.disabled = false;
    submitBtn.textContent = 'שמירה';
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
    state._emailEditMode = false;
    showToast('הכתובת נשמרה');
    renderAdminSettings();
  };
  const managerWhatsappForm = document.getElementById('managerWhatsappForm');
  if(managerWhatsappForm) managerWhatsappForm.onsubmit = async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('managerWhatsappErr');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const val = document.getElementById('managerWhatsappInput').value.trim();
    errEl.style.color = '';
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'שומר...';
    const ok = await saveManagerWhatsapp(val);
    submitBtn.disabled = false;
    submitBtn.textContent = 'שמירה';
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
    state._whatsappEditMode = false;
    showToast('המספר נשמר');
    renderAdminSettings();
  };

  // Keeps the in-memory draft (state._emailjsDraft) in sync with whatever the admin has typed so far,
  // so adding/removing a sender row (which re-renders this whole tab) never loses unsaved edits.
  function syncEmailjsDraftFromInputs(){
    const pk = document.getElementById('emailjsPublicKey');
    const tid = document.getElementById('emailjsTemplateId');
    if(pk) draft.publicKey = pk.value.trim();
    if(tid) draft.templateId = tid.value.trim();
    draft.senders.forEach(s => {
      const labelEl = document.querySelector(`[data-sender-label="${s.id}"]`);
      const svcEl = document.querySelector(`[data-sender-service="${s.id}"]`);
      if(labelEl) s.label = labelEl.value.trim();
      if(svcEl) s.serviceId = svcEl.value.trim();
    });
  }
  const addSenderBtn = document.getElementById('addSenderBtn');
  if(addSenderBtn) addSenderBtn.onclick = () => {
    syncEmailjsDraftFromInputs();
    draft.senders.push({ id: uid(), label: '', serviceId: '' });
    renderAdminSettings();
  };
  document.querySelectorAll('[data-remove-sender]').forEach(btn => {
    btn.onclick = () => {
      syncEmailjsDraftFromInputs();
      draft.senders = draft.senders.filter(s => s.id !== btn.dataset.removeSender);
      renderAdminSettings();
    };
  });
  const emailjsConfigForm = document.getElementById('emailjsConfigForm');
  if(emailjsConfigForm) emailjsConfigForm.onsubmit = async (e) => {
    e.preventDefault();
    syncEmailjsDraftFromInputs();
    const errEl = document.getElementById('emailjsErr');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const invalidRow = draft.senders.some(s => !s.label || !s.serviceId);
    if(invalidRow){ errEl.textContent = 'יש למלא שם ו-Service ID לכל חשבון שולח, או להסיר את השורות הריקות'; return; }
    errEl.style.color = '';
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'שומר...';
    const ok = await saveEmailjsConfig({ publicKey: draft.publicKey, templateId: draft.templateId, senders: draft.senders });
    submitBtn.disabled = false;
    submitBtn.textContent = 'שמירה';
    if(ok !== true){ errEl.textContent = 'שגיאה בשמירה: ' + ok; return; }
    state._emailjsDraft = null;
    state._autosendEditMode = false;
    showToast('הגדרות השליחה נשמרו');
    renderAdminSettings();
  };

  const changePassForm = document.getElementById('changePassForm');
  if(changePassForm) changePassForm.onsubmit = async (e) => {
    e.preventDefault();
    const cur = document.getElementById('curPass').value;
    const np = document.getElementById('newPass').value;
    const errEl = document.getElementById('passErr');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    errEl.style.color = '';
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'שומר...';
    try{
      const user = auth.currentUser;
      const credential = EmailAuthProvider.credential(user.email, cur);
      await reauthenticateWithCredential(user, credential);
      await updatePassword(user, np);
      errEl.style.color = '#2F5233';
      errEl.textContent = 'הסיסמה עודכנה בהצלחה';
      e.target.reset();
    }catch(err){
      console.error('change password error', err);
      const code = err && err.code;
      if(code === 'auth/invalid-credential' || code === 'auth/wrong-password'){
        errEl.textContent = 'הסיסמה הנוכחית שגויה';
      }else{
        errEl.textContent = 'שגיאה: ' + (code || (err && err.message) || 'לא ידועה');
      }
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'עדכון סיסמה';
  };
}

// ---------- EMPLOYEE DASHBOARD ----------
async function renderEmployeeDashboard(emp, editingId, useCache){
  if(emp && emp.chatOnly){ state.currentEmployee = emp; startChatNotifier('emp'); return renderChatHome('emp'); }
  if(shabbatGuard()) return;
  stopLiveTimer();
  stopLiveMoneyTimer();
  stopClockFieldTimers();
  stopBreakWatchdog();
  state.currentEmployee = emp;
  const empSettings = await getEmpSettings(emp.id);
  applyEmployeeTheme(empSettings);
  setHeader('שלום, ' + emp.name, (empSettings.hideMirror ? '' : '<span class="mirror-grp" style="display:inline-flex; gap:2px;"><button class="btn ghost small" id="mirrorBtn" title="מראה">🪞 מראה</button><button class="btn ghost small" id="hideMirrorBtn" title="הסתרת המראה" style="padding-inline:8px;">✕</button></span> ') + '<button class="btn ghost small" id="chatBtn">💬 צ׳אט<span id="chatBadge" class="tasks-badge"></span></button> <button class="btn ghost small" id="tasksBtn">✔ משימות<span id="tasksBadge" class="tasks-badge"></span></button> <button class="btn ghost small" id="settingsBtn">⚙️ הגדרות</button> <button class="logout-link" id="logoutBtn" title="התנתקות"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><polyline points="8 7 3 12 8 17"/><line x1="3" y1="12" x2="15" y2="12"/></svg>התנתקות</button>');
  setTimeout(() => maybeBirthdayGreeting(emp), 600);
  const month = state._empMonth || currentMonthStr();

  const passedFresh = useCache && typeof useCache === 'object' ? useCache : null;
  const cacheValid = !passedFresh && useCache && state._dashCache && state._dashCache.empId === emp.id;
  let hoursData, cachedAnnouncement;
  if(passedFresh){
    hoursData = passedFresh;
    cachedAnnouncement = (state._dashCache && state._dashCache.empId === emp.id) ? state._dashCache.announcement : null;
  }else if(cacheValid){
    hoursData = state._dashCache.hoursData;
    cachedAnnouncement = state._dashCache.announcement;
  }else{
    app.innerHTML = `<div class="empty-state">טוען נתונים...</div>`;
    hoursData = await loadHours(emp.id);
    if(hoursData === null){
      // Critical: never fall through to render/save with an empty object here — that's exactly
      // what silently erased a real employee's hours before this guard existed.
      app.innerHTML = `
        <div class="card" style="text-align:center;">
          <h3 style="color:var(--danger); margin-top:0;">שגיאה בטעינת הנתונים</h3>
          <p class="hint">לא הצלחנו לטעון את נתוני השעות שלך מהשרת (בעיית תקשורת זמנית). כדי להימנע מאובדן מידע, לא ממשיכים עד שהטעינה תצליח.</p>
          <p class="hint mono" style="font-size:11.5px; opacity:.6; direction:ltr;">${escapeHtml(String(state._lastLoadErr || ''))} · ${auth === authEmp ? 'E' : 'A'}${auth.currentUser ? (auth.currentUser.email ? ':admin' : ':emp') : ':none'}</p>
          <button type="button" class="btn brass" id="retryLoadBtn">ניסיון נוסף</button>
          <button type="button" class="btn ghost" id="reloginBtn">כניסה מחדש עם הקוד</button>
        </div>
      `;
      document.getElementById('retryLoadBtn').onclick = () => renderEmployeeDashboard(emp, editingId, false);
      document.getElementById('reloginBtn').onclick = () => { state.currentEmployee = null; clearSession(); signOut(auth).catch(() => {}); renderEmployeeLogin(); };
      // החיבור שייך לעובד אחר (למשל נכנס עובד אחר בכרטיסייה אחרת) – מבקשים להיכנס מחדש
      if(state._lastLoadErr === 'permission-denied' && auth.currentUser && auth.currentUser.uid !== emp.id){ clearSession(); signOut(auth).catch(() => {}); showToast('בכרטיסייה הזו צריך להיכנס מחדש עם הקוד'); renderEmployeeLogin(); }
      return;
    }
  }
  const entries = (hoursData[month] || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  const totalHours = entries.reduce((s,e) => s + (computeEntryHours(e) || 0), 0);
  const pay = calcPay(emp, totalHours);
  const editingEntry = editingId ? entries.find(e => e.id === editingId) : null;
  const editKey = editingEntry ? editingEntry.id : 'new';
  if(state._editBreaksKey !== editKey){
    state._editBreaksKey = editKey;
    state._editBreaks = editingEntry ? (editingEntry.breaks || []).map(b => ({ ...b, id: b.id || uid() })) : []; // להפסקות ישנות אין מזהה - נותנים להן כדי שאפשר יהיה לערוך ולמחוק
    state._formDraft = null;
  }
  const editBreaks = state._editBreaks || [];
  if(state._editingBreakId === '__open__'){ const ob = editBreaks.find(b => !b.end); state._editingBreakId = ob ? ob.id : null; }
  const editingOpenEntry = !!(editingEntry && !editingEntry.end);
  const formDraft = state._formDraft;
  const draftDate = formDraft ? formDraft.date : (editingEntry ? editingEntry.date : todayStr());
  const draftStart = formDraft ? formDraft.start : (editingEntry ? (hhmm(editingEntry.start) || '') : '');
  const draftEnd = formDraft ? formDraft.end : (editingEntry ? (hhmm(editingEntry.end) || '') : '');
  let announcement;
  if(editingEntry){
    announcement = { image: null, caption: '' };
  }else if(cachedAnnouncement){
    announcement = cachedAnnouncement;
  }else{
    announcement = await loadAnnouncement();
  }
  state._dashCache = { empId: emp.id, hoursData, announcement: editingEntry ? cachedAnnouncement : announcement };

  const todayMonth = currentMonthStr();
  const todayEntries = hoursData[todayMonth] || [];
  let openEntry = findOpenEntryToday(todayEntries);
  // יום עבודה פתוח מיום קודם (לא נסגר): מודיעים לעובד פעם אחת ביום
  const staleOpen = [];
  Object.values(hoursData).forEach(list => (list || []).forEach(e => { if(!e.end && e.date < todayStr()) staleOpen.push(e); }));
  staleOpen.sort((a, b) => a.date.localeCompare(b.date));
  let onBreak = !!(openEntry && openEntry.breaks && openEntry.breaks.length && !openEntry.breaks[openEntry.breaks.length - 1].end);
  let lastBreak = onBreak ? openEntry.breaks[openEntry.breaks.length - 1] : null;

  // Auto-close the work day if the employee went on break / paused the day and never came back before 20:00.
  // The day is ended at the moment the break started, and the break itself is dropped from the record entirely.
  let autoCloseNotice = null;
  // רק הפסקה שהתחילה לפני 20:00 (הפסקה שהתחילה אחרי 20:00 לא נסגרת אוטומטית)
  if(openEntry && onBreak && lastBreak && !editingEntry && ilNow().getHours() >= 20 && hhmm(lastBreak.start) < '20:00'){
    autoCloseNotice = `יום העבודה נסגר אוטומטית בשעה ${hhmm(lastBreak.start)}, מכיוון שלא חזרת מההפסקה עד השעה 20:00. אם חזרת לעבוד, אפשר לתקן את שעת הסיום ברישומי החודש.`;
    openEntry.end = lastBreak.start;
    openEntry.breaks = openEntry.breaks.slice(0, -1); // מוחקים רק את ההפסקה הפתוחה; הפסקות קודמות נשמרות
    await saveHours(emp.id, hoursData);
    openEntry = null;
    onBreak = false;
    lastBreak = null;
  }

  const entriesTableHtml = `
      <div id="entriesList">
        ${entries.length === 0 ? '<div class="empty-state">אין עדיין רישומי שעות לחודש זה.</div>' : `
        <div class="table-scroll">
          <table>
            <thead><tr><th>תאריך</th><th>טווח שעות</th><th>הפסקות</th><th>סה"כ שעות</th>${emp.payType !== 'fixed' ? '<th>סה"כ להרוויח</th>' : ''}<th></th></tr></thead>
            <tbody>
              ${entries.map((e, i) => {
                const h = computeEntryHours(e);
                const breaksCount = (e.breaks || []).filter(b => b.end).length;
                const delay = Math.min(i, 15) * 35;
                return `
                <tr class="stagger-item" style="animation-delay:${delay}ms;">
                  <td>${e.date}<div class="hint" style="font-size:12px; margin-top:2px;">${hebrewDateStr(e.date)}</div></td>
                  <td class="mono">${e.start ? (hhmm(e.start) + ' – ' + (e.end ? hhmm(e.end) : '...')) : '—'}</td>
                  <td class="mono">${breaksCount > 0 ? breaksCount + ' הפסקות' : '—'}</td>
                  <td class="mono">${h !== null ? fmtHours(h) : '<span class="pill hourly">בעבודה</span>'}</td>
                  ${emp.payType !== 'fixed' ? `<td class="mono">${h !== null ? fmtMoney(h * emp.rate) : '—'}</td>` : ''}
                  <td>
                    <div class="row-actions">
                      ${h !== null ? `<button class="btn ghost small" data-view-entry="${e.id}">הצגה</button>` : ''}
                      <button class="btn ghost small" data-edit-entry="${e.id}">עריכה</button>
                      <button class="btn danger" data-del-entry="${e.id}">מחיקה</button>
                    </div>
                  </td>
                </tr>
              `;}).join('')}
            </tbody>
          </table>
        </div>
        `}
      </div>
  `;

  // ---- דף נפרד: רישומי החודש + גרף שעות לכל יום ----
  if(state._entriesPage && !editingEntry){
    const [yy, mm] = month.split('-').map(Number);
    const daysInMonth = new Date(yy, mm, 0).getDate();
    const showPay = emp.payType !== 'fixed';
    const dailyType = getChartType('daily');
    // השוואה לחודש הקודם
    const prevDt = new Date(yy, mm - 2, 1);
    const prevKey = prevDt.getFullYear() + '-' + String(prevDt.getMonth() + 1).padStart(2, '0');
    const prevHours = (hoursData[prevKey] || []).reduce((sum, e) => { const h = computeEntryHours(e); return sum + (h !== null ? h : 0); }, 0);
    const diffH = Math.round((totalHours - prevHours) * 100) / 100;
    const prevPay = prevHours > 0 ? calcPay(emp, prevHours) : 0;
    const diffPay = Math.round((pay - prevPay) * 100) / 100;
    const sign = (v) => v > 0 ? '+' : (v < 0 ? '−' : '');
    const compareColor = diffH > 0 ? 'var(--brass-dark, #2E7D5B)' : (diffH < 0 ? 'var(--danger, #B3261E)' : 'inherit');
    const compareHtml = `
      <div class="card" style="padding:12px 18px; margin-bottom:14px; font-size:14.5px;">
        ${prevHours === 0 && totalHours === 0 ? `אין נתונים להשוואה לחודש ${monthLabel(prevKey)}.` :
          diffH === 0 ? `החודש עבדת בדיוק כמו ב${monthLabel(prevKey)}: ${fmtHours(totalHours)} שעות.` : `
          <b>לעומת ${monthLabel(prevKey)}:</b>
          <span style="color:${compareColor}; font-weight:600;" dir="ltr">${sign(diffH)}${fmtHours(Math.abs(diffH))}</span> שעות
          ${showPay ? ` · <span style="color:${compareColor}; font-weight:600;" dir="ltr">${sign(diffPay)}${fmtMoney(Math.abs(diffPay))}</span>` : ''}
          <span class="hint">(${monthLabel(prevKey)}: ${fmtHours(prevHours)} שעות)</span>
        `}
      </div>`;
    // סיכום החודש: ימי עבודה (כל תאריך נספר פעם אחת) וממוצע ליום
    const hoursByDate = {};
    entries.forEach(e => { const h = computeEntryHours(e); if(h) hoursByDate[e.date] = (hoursByDate[e.date] || 0) + h; });
    const workDays = Object.keys(hoursByDate).length;
    const r2 = (v) => Math.round(v * 100) / 100;
    const summaryHtml = workDays === 0 ? '' : `
      <div class="card" style="padding:14px 18px; margin-bottom:14px;">
        <div style="font-size:15px; font-weight:600; margin-bottom:10px;">📊 סיכום ${monthLabel(month)}</div>
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:10px; text-align:center;">
          <div style="background:var(--paper-alt); border-radius:10px; padding:10px 6px;"><div class="mono" style="font-size:22px; font-weight:700;">${workDays}</div><div class="hint" style="font-size:12.5px;">ימי עבודה</div></div>
          <div style="background:var(--paper-alt); border-radius:10px; padding:10px 6px;"><div class="mono" style="font-size:22px; font-weight:700;">${fmtHours(r2(totalHours))}</div><div class="hint" style="font-size:12.5px;">סה"כ שעות</div></div>
          <div style="background:var(--paper-alt); border-radius:10px; padding:10px 6px;"><div class="mono" style="font-size:22px; font-weight:700;">${fmtHours(r2(totalHours / workDays))}</div><div class="hint" style="font-size:12.5px;">ממוצע שעות ליום</div></div>
          ${showPay ? `
          <div style="background:var(--paper-alt); border-radius:10px; padding:10px 6px;"><div class="mono" style="font-size:22px; font-weight:700;">${fmtMoney(r2(pay))}</div><div class="hint" style="font-size:12.5px;">סה"כ לתשלום</div></div>
          <div style="background:var(--paper-alt); border-radius:10px; padding:10px 6px;"><div class="mono" style="font-size:22px; font-weight:700;">${fmtMoney(r2(pay / workDays))}</div><div class="hint" style="font-size:12.5px;">ממוצע ליום</div></div>` : ''}
        </div>
      </div>`;
    // נטו משוער (רק אם המנהל אישר להציג לעובדים)
    if(!state._appSettings) state._appSettings = await loadAppSettings();
    const showNet = state._appSettings.showNetToEmployees !== false && totalHours > 0;
    const netEst = showNet ? employeeNetEstimate(emp, pay, yy) : null;
    const netHtml = !netEst ? '' : `
      <div class="card" style="padding:14px 18px; margin-bottom:14px;">
        <div style="display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;">
          <span style="font-size:15px;">💵 <b>נטו משוער ל${monthLabel(month)}:</b></span>

            <div class="emp-row-form" style="margin-top:12px;">
